# Central record of runnable examples. One [[examples]] block per implementation.
#
# - `id` is referenced by a note's `code:` frontmatter field.
# - `module` is executed as `python -m <module> <args>`. Every .py file in its package is shown in the Code tab.
# - Each [[examples.runs]] is executed by `uv run mlc runs`. Outputs are cached by a hash of the example's sources,
#   mlc.core, uv.lock and the arguments, and written to site/public/generated/runs/<id>/<run>/.

[[examples]]
id = "linear-regression"
title = "Linear regression in NumPy"
module = "mlc.examples.linear_regression"

[[examples.runs]]
name = "normal-equation"
title = "Closed-form solution"
description = "Solves the least-squares problem exactly."
args = ["--method", "normal"]

[[examples.runs]]
name = "gradient-descent"
title = "Gradient descent"
description = "Reaches the same solution iteratively. The loss curve shows convergence."
args = ["--method", "gd", "--lr", "0.05", "--epochs", "200"]

[[examples.runs]]
name = "high-noise"
title = "High noise"
description = "Quadruples the noise. The fit stays unbiased but R² falls."
args = ["--method", "normal", "--noise", "2.0"]

[[examples]]
id = "logistic-regression"
title = "Logistic regression in NumPy"
module = "mlc.examples.logistic_regression"

[[examples.runs]]
name = "separable"
title = "Well-separated classes"
args = ["--separation", "4.0"]

[[examples.runs]]
name = "overlapping"
title = "Overlapping classes"
description = "Class means are close. Accuracy is capped by the overlap, not by the model."
args = ["--separation", "1.0"]

[[examples.runs]]
name = "l2"
title = "L2 regularisation"
description = "A strong penalty shrinks the weights and softens the decision surface."
args = ["--separation", "4.0", "--l2", "0.5"]

[[examples]]
id = "k-means"
title = "k-means (Lloyd's algorithm) in NumPy"
module = "mlc.examples.kmeans"

[[examples.runs]]
name = "kmeans-plusplus"
title = "k-means++ initialisation"
args = ["fit", "-k", "3", "--init", "kmeans++"]

[[examples.runs]]
name = "random-init"
title = "Random initialisation"
description = "Same data and k. Random starts can need more iterations or land in a worse optimum."
args = ["fit", "-k", "3", "--init", "random", "--seed", "3"]

[[examples.runs]]
name = "elbow"
title = "Choosing k"
args = ["elbow", "--k-max", "8"]

[[examples]]
id = "gradient-descent"
title = "Gradient descent and momentum in NumPy"
module = "mlc.examples.gradient_descent"

[[examples.runs]]
name = "step-sizes"
title = "Step size against the stability limit"
description = "Four step sizes on linear regression, from 10% to 102% of 2/λ_max. The last one diverges."
args = ["step-sizes"]

[[examples.runs]]
name = "momentum"
title = "Momentum on a narrow valley"
description = "Plain gradient descent and heavy-ball momentum (β = 0.9) with the same step size and start."
args = ["momentum"]

[[examples.runs]]
name = "momentum-high-beta"
title = "Too much momentum"
description = "β = 0.99 overshoots the valley floor repeatedly. The loss rises and falls instead of decreasing."
args = ["momentum", "--beta", "0.99"]

[[examples]]
id = "gaussian-mixture-model"
title = "Gaussian mixture model (diagonal covariance) by EM in NumPy"
module = "mlc.examples.gmm"

[[examples.runs]]
name = "fit"
title = "EM with k-means++ initialisation"
args = ["fit", "-k", "3", "--init", "kmeans++"]

[[examples.runs]]
name = "compare"
title = "Gaussian mixture against k-means"
description = "Same data, same k. k-means cuts the elongated clusters with straight boundaries; the mixture follows their shapes."
args = ["compare"]

[[examples.runs]]
name = "select"
title = "Choosing k with AIC and BIC"
description = "The log-likelihood keeps rising with k. AIC and BIC add a penalty per parameter; BIC's grows with log n."
args = ["select", "--k-max", "8"]

[[examples]]
id = "welch-t-test"
title = "Pooled and Welch t-tests in NumPy and SciPy"
module = "mlc.examples.welch"

[[examples.runs]]
name = "compare"
title = "Same data, two tests"
description = "Equal true means: a large low-variance group against a small high-variance group. The pooled test rejects (p ≈ 0.03); Welch does not (p ≈ 0.21). About 1 draw in 20 disagrees like this at this setting."
args = ["compare", "--seed", "17"]

[[examples.runs]]
name = "sweep"
title = "Type I error across variance ratios"
description = "With equal means, Welch stays near α everywhere. The pooled test drifts badly when the smaller group has the larger variance."
args = ["sweep"]

[[examples]]
id = "singular-value-decomposition"
title = "Truncated SVD and the Eckart–Young theorem in NumPy"
module = "mlc.examples.svd"

[[examples.runs]]
name = "low-rank"
title = "Low-rank approximation of a test image"
description = "For every rank k, the spectral error equals σ_{k+1} and the Frobenius error equals the root sum of the discarded σᵢ², as Eckart–Young predicts."
args = []

[[examples]]
id = "linear-models"
title = "Linear models in scikit-learn on the diabetes data"
module = "mlc.examples.linear_models"

[[examples.runs]]
name = "ols"
title = "Ordinary least squares"
description = "The unpenalised fit. s1 and s2, which are correlated at 0.9, get large coefficients of opposite sign."
args = ["--model", "ols"]

[[examples.runs]]
name = "ridge"
title = "Ridge"
description = "An L2 penalty shrinks every coefficient and tames the s1/s2 pair, but zeroes none."
args = ["--model", "ridge", "--alpha", "100"]

[[examples.runs]]
name = "lasso"
title = "Lasso"
description = "An L1 penalty sets some coefficients exactly to zero."
args = ["--model", "lasso", "--alpha", "1.0"]

[[examples.runs]]
name = "elastic-net"
title = "Elastic net"
description = "Half L1, half L2: fewer zeros than the lasso, and correlated features share weight."
args = ["--model", "elastic-net", "--alpha", "1.0", "--l1-ratio", "0.5"]

[[examples.runs]]
name = "lars"
title = "Least-angle regression"
description = "The whole LARS path and the order in which features enter."
args = ["--model", "lars"]

[[examples.runs]]
name = "sgd-lasso"
title = "SGD with an L1 penalty"
description = "SGDRegressor approaches the exact lasso solution; the objective gap shrinks slowly with the epochs."
args = ["--model", "sgd", "--penalty", "l1", "--alpha", "1.0", "--epochs", "60"]

[project]
name = "mlc"
version = "0.1.0"
description = "Runnable examples and figure data for the ML concepts site."
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.66.0",
    "numpy>=2.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "skia-pathops>=0.9.2",
]

[project.scripts]
mlc = "mlc.build.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mlc"
module-root = "python"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Maths notation in docstrings and comments is intentional.
allowed-confusables = ["σ", "−", "–", "×", "ν", "ρ", "α", "γ"]

[tool.pyright]
include = ["python"]
typeCheckingMode = "standard"
strict = ["python/mlc/core", "python/mlc/build", "python/tests"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["python/tests"]

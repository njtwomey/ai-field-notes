[project]
name = "mlc"
version = "0.1.0"
description = "Runnable examples and figure data for the ML concepts site."
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.66.0",
    "numpy>=2.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "skia-pathops>=0.9.2",
    "torch>=2.14.0",
]

[project.scripts]
mlc = "mlc.build.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.4",
    "ruff>=0.12",
]
fixtures = [
    "astropy>=8.0.1",
    "datasketch>=2.0.0",
    "mpmath>=1.3.0",
    "networkx>=3.7",
    "nltk>=3.10.3",
    "pot>=0.9.7.post1",
    "python-crfsuite>=0.9.12",
    "pywavelets>=1.10.0",
    "regex>=2026.9.29",
    "statsmodels>=0.15.0",
    "tiktoken>=0.14.0",
    # aifn/text pipeline truncation/overflow matches 0.21 semantics (0.22+ changed stride windows); see refinement.md.
    "tokenizers>=0.21.4,<0.22",
    "torchdiffeq>=0.2.5",
]

[tool.uv]
# The fixture generators' reference libraries are part of a normal sync, so `uv run` regenerates every fixture.
default-groups = ["dev", "fixtures"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mlc"
module-root = "python"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Maths notation in docstrings and comments is intentional.
allowed-confusables = ["σ", "−", "–", "×", "ν", "ρ", "α", "γ"]

[tool.pyright]
include = ["python", "aifn-js/core/test/fixtures", "aifn-js/applications/test/fixtures"]
typeCheckingMode = "standard"
strict = ["python/mlc/core", "python/mlc/build", "python/tests"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["python/tests"]

# PyTorch from its CPU-only index on Linux, so CI does not download CUDA libraries; macOS wheels are CPU-only already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Home-page groups of the top-level topics in taxonomy.yaml. Every top-level topic belongs to exactly one group, and
# the groups list the topics in taxonomy order, so the home page and the browse rail read in the same sequence.

- title: Mathematical foundations
  topics: [maths, probability, probability-distributions, statistics, probabilistic-inference]

- title: Signals and systems
  topics: [signal-processing, control-theory]

- title: Core machine learning
  topics:
    - learning-foundations
    - losses
    - metrics
    - supervised-learning
    - semi-supervised-learning
    - weak-supervision
    - unsupervised-learning
    - online-learning
    - transfer-learning

- title: Deep learning and sequential decisions
  topics: [deep-learning, reinforcement-learning]

- title: Data and applications
  topics: [time-series, anomaly-detection, recommendation-and-retrieval, natural-language-processing, computer-vision]

- title: Decisions and experiments
  topics: [decision-making, online-experimentation]

- title: Trustworthy and practical machine learning
  topics: [trustworthy-machine-learning, engineering, case-studies]

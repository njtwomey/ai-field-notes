- id: part-1-mathematical-foundations
  index: mathematical-foundations
  num: 1
  roman: Part I
  title: Mathematical foundations
  icon: sigma
  description: 'Linear algebra, calculus, differential equations and numerical methods; probability,
    distributions and stochastic processes; statistical estimation and testing; and convex,
    stochastic and constrained optimisation.'
  children:
    - id: mathematics
      index: mathematics
      icon: sigma
      title: Mathematics
      description: Vectors and matrices, derivatives and integrals, automatic differentiation,
        differential equations, splines, floating point and numerical methods, and the geometry of
        curved spaces.
      children:
        - id: trigonometry
          index: trigonometry
          title: Trigonometry
          description: Angles, the circular functions and their inverses, the identities that relate them,
            polar coordinates, Euler's formula and the hyperbolic functions.
        - id: linear-algebra
          index: linear-algebra
          title: Linear algebra
          description: Vectors, norms and matrix products; rank, determinants and inverses; the LU, QR, eigen-,
            Cholesky and singular value decompositions; the pseudoinverse, condition numbers and the
            kernel trick.
        - id: calculus
          index: calculus
          title: Calculus
          children:
            - id: univariate
              index: functions-of-one-variable
              title: Functions of one variable
              description: The derivative and its rules, derivatives of the trigonometric functions, the
                exponential and logarithm, the mean value theorem and Taylor series.
            - id: multivariate
              index: functions-of-several-variables
              title: Functions of several variables
              description: Partial derivatives, the gradient, the Jacobian, the multivariable chain rule and
                the Hessian.
            - id: integration
              index: integration
              title: Integration
              description: The fundamental theorem of calculus, substitution and integration by parts, multiple
                integrals, the Gaussian integral and gamma function, and the Laplace approximation.
            - id: matrix-calculus
              title: Matrix calculus
              description: Derivatives of scalar, vector and matrix expressions with respect to vectors and
                matrices, the standard identities, and the softmax and log-sum-exp functions.
            - id: automatic-differentiation
              index: automatic-differentiation
              title: Automatic differentiation
              description: 'Exact derivatives of programs: dual numbers and forward mode, reverse mode and
                backpropagation, JVPs and VJPs, tapes and source transformation, computation graphs
                and gradient checkpointing.'
          description: Derivatives of one and several variables, gradients, Jacobians and Hessians, Taylor
            series, techniques of integration, matrix calculus and automatic differentiation.
        - id: calculus-of-variations
          index: calculus-of-variations
          title: Calculus of variations
          description: 'Optimising over functions: functionals and functional derivatives, the Euler–Lagrange
            equation, the brachistochrone, constrained problems, and maximum-entropy distributions
            as their solutions.'
        - id: differential-equations
          index: differential-equations
          title: Differential equations
          description: 'Ordinary differential equations, linear systems and the matrix exponential, stability,
            bifurcations and chaos, numerical solvers, neural ODEs, and the heat, transport and
            continuity equations.'
        - id: splines-and-interpolation
          index: true
          title: Splines and interpolation
          description: Polynomial interpolation and Runge's phenomenon, cubic splines, Hermite and
            shape-preserving interpolation, Bézier curves, B-splines and NURBS, and smoothing
            splines for regression.
        - id: numerical-methods
          index: numerical-methods
          title: Numerical methods
          description: Floating point, conditioning, root finding, quadrature and numerical linear algebra.
        - id: geometry
          index: true
          title: Geometry
          description: Metric spaces and geodesics, Riemannian manifolds with their tangent spaces and
            exponential map, and hyperbolic geometry, in which trees embed with low distortion.
        - id: graphs-and-combinatorics
          title: Graphs and combinatorics
          description: Graph representations, traversal, shortest paths, spanning trees and DAGs.
    - id: probability
      index: probability
      icon: dices
      title: Probability
      description: Probability spaces, conditioning and Bayes' theorem, random variables and expectation,
        the named distributions, limit theorems and concentration, sampling methods, stochastic
        processes and Itô calculus.
      children:
        - id: theory
          index: probability-theory
          title: Probability theory
          description: Probability spaces, conditioning, independence and Bayes' theorem, random variables,
            expectation and variance, moment-generating functions, the Markov and Chebyshev
            inequalities, and the exponential family.
        - id: named-distributions
          index: named-distributions
          title: Named distributions
          description: Bernoulli, binomial, Poisson and other discrete distributions; Gaussian, gamma, beta,
            Student t and other continuous ones; and the multivariate normal, Dirichlet and Wishart.
          children:
            - id: discrete
              index: discrete-distributions
              title: Discrete distributions
              description: Bernoulli, binomial, geometric, negative binomial, hypergeometric, Poisson,
                categorical and multinomial distributions.
            - id: continuous
              index: continuous-distributions
              title: Continuous distributions
              description: Gaussian, log-normal, exponential, Laplace, gamma, inverse-gamma, beta, chi-squared,
                Student t, F and Cauchy distributions.
            - id: multivariate
              index: multivariate-distributions
              title: Multivariate distributions
              description: The multivariate normal distribution, the Dirichlet distribution over probability
                vectors and the Wishart distribution over covariance matrices.
        - id: limit-theorems
          index: limit-theorems
          title: Limit theorems
          description: 'Modes of convergence, the law of large numbers and the central limit theorem, and
            concentration inequalities: Chernoff, Hoeffding, Bernstein, McDiarmid and sub-Gaussian
            tails.'
        - id: sampling
          index: sampling-and-simulation
          title: Sampling and simulation
          description: Inverse-transform, rejection and Box–Muller sampling, the Gumbel-max trick, Monte Carlo
            integration and importance sampling, and the score-function and reparameterisation
            gradient estimators.
        - id: stochastic-processes
          index: stochastic-processes
          title: Stochastic processes
          description: Markov chains, random walks, martingales, Poisson processes, Brownian motion and
            determinantal point processes.
        - id: stochastic-calculus
          index: stochastic-calculus
          title: Stochastic calculus
          description: "Itô integrals and Itô's lemma, stochastic differential equations and Euler–Maruyama,
            the Ornstein–Uhlenbeck process, Fokker–Planck, Girsanov, reverse-time SDEs and Tweedie's
            formula, as used by diffusion models."
        - id: examples
          index: classic-probability-problems
          title: Classic probability problems
          description: The birthday problem, base rates in diagnosis, Monty Hall, Simpson's paradox, gambler's
            ruin, the coupon collector and the occasionally dishonest casino, each solved and
            simulated.
    - id: statistics
      index: statistics
      icon: chart-spline
      title: Statistics
      description: Estimators and confidence intervals, hypothesis tests and p-values, Bayesian inference,
        the bootstrap, regression diagnostics, survival analysis and the design of experiments.
      children:
        - id: estimation
          index: estimation
          title: Estimation
          description: Standard errors, confidence intervals, effect sizes, sufficient statistics and the
            expectation–maximisation algorithm.
        - id: hypothesis-testing
          index: hypothesis-testing
          title: Hypothesis testing
          description: Null and alternative hypotheses, p-values and significance levels, Type I and Type II
            errors, one- and two-sided tests, the Neyman–Pearson lemma, sample-size planning and
            multiple testing.
        - id: tests
          index: statistical-tests
          title: Statistical tests
          description: The binomial test, the z-test and the one-sample, paired, pooled and Welch t-tests,
            each with its assumptions and decision rule, and two-sample tests of whole
            distributions.
          children:
            - id: two-sample-distribution-tests
              index: two-sample-testing
              title: Two-sample tests of distributions
              description: 'Testing whether two samples share a distribution: the Kolmogorov–Smirnov test, maximum
                mean discrepancy and the kernel test, energy distance, and classifier two-sample
                tests.'
        - id: bayesian-statistics
          index: bayesian-statistics
          title: Bayesian statistics
          description: Posterior inference with conjugate and other priors, credible intervals and HPD
            regions, hierarchical models, and model comparison by Bayes factors.
        - id: resampling
          index: resampling
          title: Resampling
          description: The bootstrap, the jackknife and permutation tests.
        - id: regression-analysis
          index: regression-analysis
          title: Regression analysis
          description: Inference for least-squares coefficients, residual diagnostics, leverage and influence,
            and multicollinearity.
        - id: survival-analysis
          index: survival-analysis
          title: Survival analysis
          description: 'Time-to-event data under censoring: survival and hazard functions, the Kaplan–Meier
            and Nelson–Aalen estimators, the log-rank test, parametric models and Cox proportional
            hazards.'
        - id: experimental-design
          index: experimental-design
          title: Experimental design
          description: Randomised controlled experiments, blocking and stratification, factorial designs, and
            causal inference when only observational data exist.
    - id: optimisation
      index: optimisation
      icon: target
      title: Optimisation
      description: Convex analysis, gradient, Newton and quasi-Newton methods, stochastic gradients,
        constrained optimisation with KKT conditions, optimal transport and derivative-free search.
      children:
        - id: convex-analysis
          index: convex-analysis
          title: Convex analysis
          description: Convex sets and functions, subgradients of non-smooth functions, and convex conjugates.
        - id: first-order-methods
          index: first-order-methods
          title: First-order methods
          description: Gradient descent and its convergence rates, Nesterov acceleration, coordinate descent,
            proximal gradient methods and mirror descent.
        - id: second-order-methods
          index: second-order-methods
          title: Second-order methods
          description: Newton's method, line search, quasi-Newton methods such as BFGS, trust regions, and
            Gauss–Newton and Levenberg–Marquardt for least squares.
        - id: constrained-optimisation
          index: constrained-optimisation
          title: Constrained optimisation
          description: Lagrange multipliers, Lagrangian duality, KKT conditions, linear and quadratic
            programming, and penalty and barrier methods.
        - id: optimal-transport
          index: true
          title: Optimal transport
          description: Monge and Kantorovich problems, earth mover's and Wasserstein distances, Kantorovich
            duality, barycentres, entropic regularisation and Sinkhorn's algorithm, and sliced and
            unbalanced transport.
        - id: stochastic-optimisation
          index: stochastic-optimisation
          title: Stochastic optimisation
          description: Convergence of stochastic gradient descent, batch size and gradient noise, and
            variance-reduced methods such as SVRG, SAG and SAGA.
        - id: derivative-free-optimisation
          index: derivative-free-optimisation
          title: Derivative-free optimisation
          description: 'Optimising without gradients: the Nelder–Mead simplex method, simulated annealing, and
            evolution strategies such as CMA-ES.'
        - id: non-convex-and-global-optimisation
          title: Non-convex and global optimisation
          description: Non-convex landscapes, saddle points, simulated annealing and global search.
- id: part-2-signals-systems-and-information
  index: signals-systems-and-information
  num: 2
  roman: Part II
  title: Signals, systems and information
  icon: audio-waveform
  description: Entropy, divergences and channel capacity; sampling, Fourier analysis, filters,
    wavelets and spectral estimation; and feedback control from PID to optimal and model predictive
    control.
  children:
    - id: information-theory
      index: information-theory
      icon: network
      title: Information theory
      description: Entropy, cross-entropy, Kullback–Leibler and f-divergences, mutual information,
        differential entropy, and the source coding, channel capacity and rate-distortion theorems.
      children:
        - id: core-information-measures
          title: Core information measures
          description: Entropy, joint and conditional entropy, relative entropy and mutual information.
        - id: channel-capacity-and-coding
          title: Channel capacity and coding
          description: Channel models, channel capacity, source coding and rate-distortion theory.
    - id: signal-processing
      index: signal-processing
      icon: audio-waveform
      title: Signal processing
      description: Sampling and linear time-invariant systems, Fourier analysis and the FFT, filter
        design, multirate processing, time-frequency and wavelet transforms, sparse coding, spectral
        estimation and audio features.
      children:
        - id: signals-and-systems
          index: signals-and-systems
          title: Signals and systems
          description: Sampling, quantisation, linear time-invariant systems, convolution and the z-transform.
        - id: fourier-analysis
          index: fourier-analysis
          title: Fourier analysis
          description: Fourier series and transforms, the DFT and FFT, windowing and leakage.
        - id: filters
          index: digital-filters
          title: Digital filters
          description: FIR and IIR filters, their design, frequency response and phase.
        - id: multirate
          index: multirate-processing-and-filter-banks
          title: Multirate processing and filter banks
          description: Decimation, interpolation, polyphase structures and perfect-reconstruction filter banks.
        - id: time-frequency
          index: time-frequency-analysis
          title: Time-frequency analysis
          description: The time-frequency uncertainty principle, the short-time Fourier and constant-Q
            transforms, the Wigner–Ville distribution, reassignment, and empirical and variational
            mode decomposition.
        - id: wavelets
          index: wavelets
          title: Wavelets
          description: Continuous and discrete wavelet transforms, multiresolution analysis and denoising.
        - id: sparse-representations
          title: Sparse representations
          description: Sparse approximation over overcomplete dictionaries, greedy pursuits, basis pursuit,
            compressed sensing and dictionary learning.
          index: sparse-approximation
        - id: spectral-estimation
          index: spectral-estimation
          title: Spectral estimation
          description: Autocorrelation and the Wiener–Khinchin theorem, the periodogram, Welch, multitaper and
            Lomb–Scargle estimates, parametric and subspace methods, and coherence between signals.
        - id: adaptive-and-statistical
          index: adaptive-and-statistical-signal-processing
          title: Adaptive and statistical signal processing
          description: Matched and Wiener filters, linear prediction, the LMS and RLS adaptive filters, and
            the cepstrum.
        - id: audio
          index: audio-signal-processing
          title: Audio signal processing
          description: Mel and gammatone filter banks, mel spectrograms and MFCCs, chroma and spectral
            features, pitch estimation and beat tracking, denoising, source separation and
            perceptual coding.
    - id: control-theory
      index: control-theory
      icon: sliders
      title: Control theory
      description: State-space and transfer-function models, stability criteria, PID and frequency-domain
        design, pole placement and observers, LQR and LQG, model predictive control, system
        identification and robust control.
      children:
        - id: system-modelling
          index: system-modelling
          title: System modelling
          description: State-space models, transfer functions, block diagrams and linearisation.
        - id: stability
          index: stability-analysis
          title: Stability analysis
          description: Lyapunov stability, the Routh–Hurwitz criterion, root locus and the Nyquist criterion.
        - id: classical-control
          index: classical-control
          title: Classical control
          description: PID control, Bode plots, gain and phase margins, and lead-lag compensation.
        - id: state-space-control
          index: state-space-control
          title: State-space control
          description: Controllability, observability, pole placement and state observers.
        - id: optimal-control
          index: optimal-control
          title: Optimal control
          description: LQR, LQG, dynamic programming, the Hamilton–Jacobi–Bellman equation and Pontryagin's
            maximum principle.
        - id: model-predictive-control
          index: true
          title: Model predictive control
          description: Receding-horizon optimisation of a constrained control problem, and the terminal costs
            and constraints that give stability and recursive feasibility.
        - id: system-identification
          title: System identification
          description: Estimating dynamical models from data, from ARX models to subspace methods.
        - id: robust-and-nonlinear-control
          index: robust-and-nonlinear-control
          title: Robust and nonlinear control
          description: H-infinity control, feedback linearisation, sliding-mode and adaptive control.
- id: part-3-data
  index: data
  num: 3
  roman: Part III
  icon: library
  title: Data
  description: Measurement and sampling, exploration, cleaning, encoding and leak-free splitting,
    feature engineering and selection, preparation by modality and domain, labelling and
    augmentation, standard datasets and environments.
  children:
    - id: data-foundations
      index: data-foundations
      icon: book-open
      title: Data foundations
      description: Measurement scales and data types, the shapes a learning problem's data take, how data
        were sampled, and how they are documented, licensed and stored.
      children:
        - id: types-and-scales
          index: measurement-scales
          title: Data types and measurement scales
          description: Nominal, ordinal, interval and ratio scales; counts, proportions, durations, sets and
            other typed values, and the operations each permits.
        - id: data-setups
          index: data-setups
          title: Data setups
          description: Independent rows, groups, panels, sequences, bags, pairs, streams and censored records,
            and what each implies for modelling and for splitting.
        - id: sampling-and-bias
          index: data-generating-process
          title: Sampling and selection bias
          description: How the data-generating process and the sampling of examples shape what a model can
            learn, and the biases that follow from selection, survivorship and missing populations.
        - id: measurement-and-recording
          index: measurement-and-recording
          title: Measurement and recording
          description: Measurement error and proxies, censoring and coarsening, and what instrumentation and
            logging do to recorded values.
        - id: data-collection
          index: data-collection
          title: Data collection
          description: Acquiring data, observational versus experimental and logged data, selective labels,
            feedback loops, and how much data is needed.
        - id: provenance-and-documentation
          index: dataset-documentation
          title: Provenance, documentation and licensing
          description: Datasheets, data cards, consent, licences, versioning and withdrawn or deprecated
            datasets.
    - id: exploration-and-discovery
      index: exploration-and-discovery
      icon: radar
      title: Exploration and discovery
      description: Profiling a dataset, seeing its distributions, and searching it for dependencies,
        patterns, subgroups, causal structure and related data.
      children:
        - id: routine-checks
          index: routine-data-checks
          title: Routine data checks
          description: Reading examples, exploring the target, profiling over time, slices, baseline probes
            and exploration hygiene.
        - id: profiling
          index: data-profiling
          title: Profiling and summary statistics
          description: Per-column summaries, distinct counts, missingness maps and quality profiles of a new
            dataset.
        - id: visual-exploration
          index: visual-exploration
          title: Visual exploration
          description: Histograms, density and pair plots, embeddings for overview, and plots that expose
            structure or errors.
        - id: dependence-discovery
          index: dependence-measures
          title: Dependence discovery
          description: Finding related variables with correlation, mutual information, distance correlation
            and kernel dependence measures.
        - id: pattern-mining
          index: pattern-mining
          title: Pattern mining
          description: Frequent itemsets, association rules, sequential patterns and subgroup discovery.
        - id: causal-discovery
          index: causal-discovery
          title: Causal discovery
          description: Recovering causal graphs from observational data with constraint-based, score-based and
            functional methods.
        - id: dataset-discovery
          index: dataset-search
          title: Dataset search and data discovery
          description: Finding datasets, and finding joinable or unionable tables in a data lake or catalogue.
    - id: data-preparation
      index: data-preparation
      icon: tags
      title: Data preparation
      description: Cleaning, scaling, transforming and encoding raw records into model inputs, fitting
        preprocessing inside the pipeline, and splitting data so that no test information leaks into
        training.
      children:
        - id: data-quality
          index: data-quality-and-cleaning
          title: Data quality and cleaning
          description: Missing values, errors, outliers, duplicates and the checks that catch them before
            training.
          children:
            - id: missing-data
              index: missing-data-and-imputation
              title: Missing data and imputation
              description: Missingness mechanisms and imputation, from simple fills to multiple imputation.
            - id: errors-and-outliers
              index: outliers-and-gross-errors
              title: Errors and outliers
              description: Detecting and treating gross errors, impossible values and outliers in columns.
            - id: parsing-and-standardisation
              index: parsing-and-type-inference
              title: Parsing and standardisation
              description: Reading raw files into typed columns, and making equal values look equal.
            - id: deduplication-and-record-linkage
              index: deduplication-and-record-linkage
              title: Deduplication and record linkage
              description: Exact and near-duplicate detection, entity resolution and probabilistic record linkage.
            - id: validation-and-contracts
              index: data-validation
              title: Validation and data contracts
              description: Schemas, expectations, unit and consistency checks, and checks between training and
                serving data.
        - id: scaling-and-transforms
          index: scaling-and-transforms
          title: Scaling and transforms
          description: Putting numeric values on comparable scales and stabilising their variance, per
            feature, per sample or per group, fitted on training data only.
          children:
            - id: scaling-and-normalisation
              index: scaling-and-normalisation
              title: Scaling and normalisation
              description: Standardisation, min-max, max-abs, robust, quantile and rank scaling, and per-sample
                and per-group normalisation.
            - id: power-transforms
              index: power-transforms
              title: Power and variance-stabilising transforms
              description: Logarithms, Box–Cox, Yeo–Johnson, Anscombe and logit transforms, transforms for
                compositional and bounded data, and the bias of transforming predictions back.
            - id: whitening-and-decorrelation
              index: whitening-and-decorrelation
              title: Whitening and decorrelation
              description: Centring, decorrelating and sphering several features at once.
        - id: encoding
          index: encoding-features-and-targets
          title: Encoding features and targets
          description: Numeric representations of categories, numbers, cyclical and temporal values,
            positions, sets and missing values, and of classification and regression targets.
          children:
            - id: categorical-encoding
              index: true
              title: Categorical encoding
              description: One-hot, dummy, ordinal, binary, count, target, hashing and embedding encodings, and
                high-cardinality and unseen levels.
            - id: numeric-encoding
              index: numeric-encoding
              title: Numeric encoding
              description: Binning and discretisation, piecewise-linear and periodic encodings, and learned
                numeric embeddings.
            - id: cyclical-and-temporal-encoding
              index: cyclical-encoding
              title: Cyclical and temporal encoding
              description: Sine-cosine encodings of hours, days and angles, timestamps, durations and calendar
                values.
            - id: positional-encoding
              index: positional-and-coordinate-encoding
              title: Positional and coordinate encoding
              description: Positions in sequences, images and graphs, Fourier features, and encodings of latitude,
                longitude and geographic cells.
            - id: set-and-multi-valued-encoding
              index: multi-valued-field-encoding
              title: Sets, lists and multi-valued fields
              description: Multi-hot vectors, bags, pooled embeddings and variable-length fields.
            - id: missing-value-encoding
              index: encoding-missingness
              title: Encoding missingness
              description: Indicator columns, sentinel values and learned missing tokens.
            - id: target-encoding
              index: encoding-targets
              title: Encoding targets
              description: Class indices and one-hot targets, label smoothing, ordinal, hierarchical, multi-label
                and transformed regression targets.
        - id: resampling-and-weighting
          index: resampling-and-weighting
          title: Resampling and weighting
          description: Sample weights, imbalanced regression and long-tailed recognition.
        - id: pipelines
          index: preprocessing-pipelines
          title: Pipelines and fitted preprocessing
          description: Preprocessing fitted inside the model pipeline, and the preprocessing that trees,
            linear models and neural networks each need.
        - id: splitting-and-leakage
          index: splitting-and-leakage
          title: Splitting and leakage
          description: Dividing data so that the test score estimates the score in use, and the leaks that
            make it optimistic.
          children:
            - id: split-strategies
              index: train-validation-and-test-splits
              title: Train, validation and test splits
              description: Train, validation and test sets; random, stratified, grouped, temporal and spatial
                splits.
            - id: leakage-types
              index: data-leakage
              title: Data leakage
              description: Target leakage, preprocessing fitted on test data, temporal look-ahead, duplicates
                across splits, group overlap and benchmark contamination.
            - id: leakage-detection
              index: detecting-leakage
              title: Detecting leakage
              description: Adversarial validation, suspicious feature importances, duplicate search and audits of
                pipelines.
            - id: test-sets
              index: test-sets
              title: Test sets
              description: Test-set design, reuse and out-of-distribution test sets.
    - id: features
      index: feature-engineering-and-selection
      icon: workflow
      title: Feature engineering and selection
      description: Feature construction, temporal and relational aggregates, automated feature synthesis
        and feature stores, and feature selection by filter, wrapper and embedded methods.
      children:
        - id: feature-engineering
          index: feature-engineering
          title: Feature engineering
          description: Interactions, ratios, aggregates, time and cyclical features, relational features,
            automated feature discovery and feature stores.
          children:
            - id: feature-construction
              index: feature-construction
              title: Feature construction
              description: Interactions, ratios, polynomial terms and group aggregates built from existing
                columns.
            - id: temporal-features
              index: date-and-time-features
              title: Date, time and cyclical features
              description: Calendar and holiday features, elapsed times, and sine-cosine encodings of cyclical
                values.
            - id: relational-features
              index: relational-feature-aggregation
              title: Relational and aggregate features
              description: Features aggregated across related tables and over time windows of events.
            - id: automated-feature-discovery
              index: automated-feature-engineering
              title: Automated feature discovery
              description: Deep feature synthesis, search over feature transformations, and learned features
                versus engineered ones.
            - id: descriptors-embeddings-and-reductions
              index: descriptors-embeddings-and-reductions
              title: Descriptors, embeddings and reductions
              description: Hand-built descriptors, pretrained embeddings as features, and dimensionality reduction
                before a model.
            - id: feature-stores
              index: feature-stores
              title: Feature stores and point-in-time correctness
              description: Serving the same features in training and production, with joins that respect event
                time.
        - id: feature-selection
          index: true
          title: Feature selection
          description: Filter, wrapper and embedded selection, and the stability of the selected set.
          children:
            - id: filter-methods
              index: filter-feature-selection
              title: Filter methods
              description: Ranking features by univariate scores, mutual information, relevance and redundancy.
            - id: wrapper-methods
              index: wrapper-feature-selection
              title: Wrapper methods
              description: Forward, backward and recursive selection around a model.
            - id: embedded-methods
              index: embedded-feature-selection
              title: Embedded methods
              description: Selection inside training by sparsity penalties and model-based importances.
            - id: importance-measures
              index: feature-importance-measures
              title: Importance measures
              description: Impurity, permutation, drop-column and conditional importance.
            - id: selection-stability-and-inference
              index: stability-of-feature-selection
              title: Stability and inference
              description: Stability selection, knockoffs and inference after selection.
    - id: shift-and-drift
      index: shift-and-drift-in-data
      icon: trending-down
      title: Shift and drift in data
      description: Covariate, label and concept shift between training data and the data met in use,
        subpopulation shift and shortcuts, and how the training window and data freshness are
        chosen.
    - id: data-by-modality
      index: data-by-modality
      icon: layers
      title: Data by modality
      description: How tables, time series, audio, images, video, text, graphs, maps, 3D scenes and paired
        modalities are represented, prepared, featurised and augmented.
      children:
        - id: tabular-and-relational-data
          index: tabular-and-relational-data
          title: Tabular and relational data
          description: Mixed-type tables, multi-table schemas, panel data and numeric embeddings for tabular
            models.
          children:
            - id: table-structure
              index: table-structure
              title: Table structure
              description: Tidy and reshaped tables, semi-structured records and free-text columns.
            - id: relational-data
              index: multi-table-data
              title: Relational and multi-table data
              description: Entities spread across several tables linked by keys, and learning from them by
                joins and aggregations or by models that read the table graph directly.
            - id: panel-and-longitudinal-data
              index: panel-data
              title: Panel and longitudinal data
              description: Repeated measurements of the same units over time, the correlation between them and
                its effect on features and splits, and time-to-event tables with censoring and
                competing risks.
            - id: tabular-representations
              index: tabular-data
              title: Representations for tabular models
              description: Mixed-type columns without spatial order, their preprocessing for tree models and
                tokenisation for neural networks, and augmentation by scaled noise, mixup and
                feature swapping.
        - id: time-series-and-sequence-data
          index: time-series-and-sequence-data
          title: Time-series and sequence data
          description: Sensor streams, series and event logs from raw samples to model inputs.
          children:
            - id: sampling-and-alignment
              index: time-series-sampling-and-alignment
              title: Sampling, alignment and resampling
              description: Timestamps, irregular sampling, gaps, resampling and synchronising several sensors.
            - id: windowing-and-segmentation
              index: time-series-windowing
              title: Windowing and segmentation
              description: Sliding windows, overlap, label assignment per window, event-based segments and
                sessions.
            - id: series-normalisation
              index: series-normalisation
              title: Normalisation and transforms
              description: Per-series and per-window scaling, instance normalisation, detrending and
                variance-stabilising transforms.
            - id: series-features
              index: time-series-feature-extraction
              title: Feature extraction
              description: Lags, rolling statistics, spectral and shape features, feature libraries and random
                convolutional kernels.
            - id: forecasting-setups
              index: forecasting-setups
              title: Forecasting setups
              description: Look-back and horizon, recursive, direct and multi-output strategies, global and local
                models, and static, known and observed covariates.
            - id: series-augmentation
              index: time-series-augmentation
              title: Augmentation
              description: Jitter, scaling, magnitude and time warping, window slicing and mixing of series.
            - id: event-sequences
              index: event-sequences
              title: Event sequences and logs
              description: Irregular event streams, clickstreams and logs as model inputs.
            - id: wearable-and-sensor-data
              index: wearable-sensor-data
              title: Wearable, sensor and physiological data
              description: Accelerometers, gyroscopes and ambient sensors, physiological recordings such as ECG
                and EEG, calibration, orientation and fusion, and the activity-recognition pipeline.
        - id: audio-data
          index: audio-and-speech-data
          title: Audio and speech data
          description: Digital audio, its preprocessing and augmentation, transcripts aligned to sound, and
            symbolic music data.
          children:
            - id: digital-audio
              index: digital-audio
              title: Digital audio
              description: Sample rates, bit depths, channels, codecs and resampling.
            - id: audio-preprocessing
              index: audio-preprocessing
              title: Preprocessing
              description: Loudness normalisation, pre-emphasis, voice activity detection, trimming and
                segmentation.
            - id: audio-augmentation
              index: audio-augmentation
              title: Augmentation
              description: Noise mixing at a set signal-to-noise ratio, room impulse responses, speed and pitch
                perturbation, and spectrogram masking.
            - id: transcripts-and-alignment
              index: speech-transcripts-and-alignment
              title: Transcripts and alignment
              description: Text normalisation for speech, forced alignment and diarisation labels.
        - id: image-data
          index: image-data
          title: Image data
          description: Digital images, their preprocessing, augmentation and annotation formats, and
            specialised imaging.
          children:
            - id: digital-images
              index: digital-images
              title: Digital images
              description: Colour spaces, bit depth, formats, orientation metadata and colour management.
            - id: image-preprocessing
              index: image-preprocessing
              title: Preprocessing
              description: Resizing, interpolation, cropping, aspect ratio, per-channel normalisation and tiling.
            - id: image-augmentation
              index: image-augmentation
              title: Augmentation
              description: Geometric and photometric transforms, erasing, mixing, learned policies and test-time
                augmentation.
            - id: image-annotations
              index: image-annotation-formats
              title: Annotations
              description: Boxes, masks, polygons and keypoints, and the formats that store them.
            - id: image-quality-and-bias
              index: image-quality-screening
              title: Quality and bias
              description: Screening images for defects, and the capture signatures and shortcuts that image
                datasets carry.
            - id: specialised-imaging
              index: specialised-imaging-data
              title: Specialised imaging
              description: Medical volumes, multispectral and hyperspectral images, whole-slide images and depth
                maps.
        - id: video-data
          index: video-data
          title: Video data
          description: Frames, codecs, clip sampling, motion representations and augmentation that is
            consistent in time.
          children:
            - id: digital-video
              index: digital-video
              title: Digital video
              description: Frame rates, codecs, keyframes and the cost of decoding.
            - id: clip-sampling
              index: clip-sampling
              title: Clip and frame sampling
              description: Uniform, dense and segment-based sampling, and temporal stride.
            - id: motion-representations
              index: motion-representations
              title: Motion representations
              description: Optical flow, frame differences and motion vectors.
            - id: video-augmentation
              index: video-augmentation
              title: Augmentation
              description: Spatial transforms applied consistently across frames, and temporal jitter.
        - id: text-data
          index: text-data-and-corpora
          title: Text data and corpora
          description: Cleaning text, building and filtering corpora, deduplicating and decontaminating them,
            and instruction and preference data.
          children:
            - id: text-cleaning
              index: text-cleaning
              title: Cleaning and normalisation
              description: Encodings and Unicode normalisation, markup and boilerplate removal, and language
                identification.
            - id: corpus-construction
              index: corpus-construction
              title: Corpus construction
              description: Crawling, quality filtering, near-duplicate removal, personal-data scrubbing and data
                mixtures.
            - id: contamination
              index: benchmark-contamination
              title: Benchmark contamination
              description: Detecting and removing evaluation data from training corpora.
            - id: instruction-and-preference-data
              index: instruction-and-preference-data
              title: Instruction and preference data
              description: Formats, collection and synthesis of instruction, conversation and preference data.
            - id: text-annotation
              index: span-annotation-and-token-alignment
              title: Annotation
              description: Span labels and their alignment to tokens.
            - id: text-augmentation
              index: text-augmentation
              title: Augmentation
              description: Back-translation, paraphrase, token edits and other label-preserving changes to text.
        - id: document-data
          index: document-data
          title: Document data
          description: Parsing PDFs and web pages, OCR and layout, and log parsing.
        - id: graph-data
          index: graph-and-network-data
          title: Graph and network data
          description: Building graphs from data, node and edge features, and splits and sampling for graphs.
          children:
            - id: graph-construction
              index: graph-construction
              title: Graph construction
              description: Nearest-neighbour and similarity graphs, and graphs from relations and interactions.
            - id: graph-features
              index: graph-features
              title: Node, edge and graph features
              description: Degrees, centralities, structural and positional encodings.
            - id: graph-splits-and-sampling
              index: graph-splits-and-sampling
              title: Splits and sampling
              description: Transductive and inductive splits, link-prediction splits, negative and neighbour
                sampling.
        - id: chemistry-and-biology-data
          index: chemistry-and-biology-data
          title: Chemistry and biology data
          description: Molecular representations, biological sequences, omics tables and splits by scaffold or
            similarity.
        - id: geospatial-data
          index: geospatial-data
          title: Geospatial data
          description: Coordinates, projections, vector and raster data, spatial indexes, spatial
            autocorrelation and remote-sensing imagery.
          children:
            - id: coordinates-and-projections
              index: coordinate-reference-systems
              title: Coordinates and projections
              description: Coordinate reference systems, latitude and longitude on a reference ellipsoid, and
                map projections with the distortions of distance, area and angle they introduce.
            - id: vector-and-raster-data
              index: vector-and-raster-data
              title: Vector and raster data
              description: Points, lines and polygons versus gridded rasters, spatial joins and zonal
                statistics, and the modifiable areal unit problem and ecological fallacy of
                aggregation to areas.
            - id: spatial-indexing-and-features
              index: spatial-features
              title: Spatial indexing and features
              description: Hierarchical grids such as H3 and S2, distance and neighbourhood features, spatial
                lags, and spatial autocorrelation with the blocked cross-validation it requires.
            - id: remote-sensing-imagery
              index: remote-sensing-imagery
              title: Remote-sensing imagery
              description: 'Multispectral satellite imagery: radiometric and atmospheric correction, cloud
                masking, band indices such as NDVI, and temporal composites.'
        - id: three-dimensional-data
          index: three-dimensional-data
          title: Three-dimensional data
          description: Point clouds, meshes, voxels and depth, with their sampling, normalisation and
            augmentation.
        - id: multimodal-data
          index: multimodal-and-paired-data
          title: Multimodal and paired data
          description: Pairing, aligning and synchronising modalities, missing modalities, and filtering
            paired data.
          children:
            - id: temporal-synchronisation
              index: temporal-synchronisation
              title: Temporal synchronisation
              description: Aligning streams with different clocks, rates and latencies, such as audio with video
                or sensors with labels.
            - id: cross-modal-pairing
              index: cross-modal-pairing
              title: Cross-modal pairing and alignment
              description: Image-text, audio-text and video-text pairs, grounding regions or segments to words,
                and weak pairing.
            - id: missing-modalities
              index: missing-modalities
              title: Missing and unequal modalities
              description: Examples with a modality absent, modalities of different quality, and imbalance between
                modalities.
            - id: paired-data-curation
              index: paired-data-curation
              title: Curating paired data
              description: Filtering pairs by similarity scores, balancing concepts and removing near-duplicates.
            - id: fusion-layouts
              index: multimodal-data-layouts
              title: Data layouts for fusion
              description: How inputs are arranged for early, intermediate and late fusion.
    - id: data-by-domain
      index: data-by-domain
      icon: microscope
      title: Data by domain
      description: Clinical, financial, user-interaction, scientific, survey, fraud, advertising, retail,
        industrial, search, user-generated and driving data, with the records, conventions and
        pitfalls of each.
    - id: data-centric-learning
      index: data-centric-learning
      icon: sparkles
      title: Data-centric learning
      description: Improving a model by improving its data, through labelling, augmentation, synthesis,
        selection and valuation.
      children:
        - id: labelling-and-annotation
          index: labelling-and-annotation
          title: Labelling and annotation
          description: Annotation design and guidelines, agreement between annotators, adjudication and
            labelling strategies.
        - id: augmentation-and-synthetic-data
          index: augmentation-and-synthetic-data
          title: Augmentation and synthetic data
          description: Label-preserving augmentation, mixing, learned augmentation policies, synthetic data,
            simulation and domain randomisation.
          children:
            - id: augmentation-principles
              index: augmentation-principles
              title: Augmentation principles
              description: Label-preserving transformations as built-in invariances and regularisers,
                consistency training, and the design of augmented views and pretext tasks for
                self-supervised learning.
            - id: synthetic-data
              index: synthetic-data
              title: Synthetic data
              description: Generating training data with generative models, tabular synthesisers and programs,
                the risk of model collapse, and evaluation by fidelity, diversity, downstream
                utility and memorisation.
            - id: simulation-and-domain-randomisation
              index: simulation-and-domain-randomisation
              title: Simulation and domain randomisation
              description: Training in simulators, the reality gap, and randomising textures, lighting and
                physics so that models transfer to the real world.
        - id: data-selection-and-valuation
          index: data-selection-and-valuation
          title: Data selection and valuation
          description: Data valuation and influence, pruning, coresets, dataset distillation, curricula and
            data mixtures.
          children:
            - id: data-valuation
              index: data-valuation
              title: Data valuation and influence
              description: Leave-one-out retraining, Data Shapley and influence functions, which score how much
                each training example helps or harms a model.
            - id: subset-selection
              index: coresets-and-data-pruning
              title: Coresets, pruning and distillation
              description: Coresets, data pruning by difficulty or redundancy, and dataset distillation into a
                few synthetic examples.
            - id: curricula-and-mixtures
              index: curricula-and-data-mixtures
              title: Curricula and data mixtures
              description: Ordering training examples from easy to hard, and setting the proportions of domains
                in a data mixture, guided by scaling laws.
        - id: error-analysis-and-data-debugging
          index: error-analysis-and-data-debugging
          title: Error analysis and data debugging
          description: Reading and counting errors, training-dynamics diagnostics, hard-example mining and
            targeted collection.
    - id: privacy-bias-and-security
      index: privacy-bias-and-security
      icon: shield
      title: Privacy, bias and security
      description: Personal data and identifiability, dataset bias and proxies, and attacks through the
        training data.
      children:
        - id: privacy
          index: data-privacy
          title: Data privacy
          description: Direct and quasi-identifiers, PII detection and redaction, k-anonymity and disclosure
            control, memorisation and extraction of training records, and erasure requests.
        - id: bias
          index: dataset-bias
          title: Dataset bias
          description: Historical, representation, measurement and aggregation biases in datasets, protected
            attributes and their proxies, and the uneven effects of content filtering.
        - id: security
          index: data-poisoning-and-backdoors
          title: Security
          description: Data poisoning and backdoor triggers planted through training data, and provenance
            checks as a defence.
    - id: data-operations
      index: data-operations
      icon: cpu
      title: Data operations
      description: Formats, loading, versioning, schema change, batch and stream processing, data tests,
        monitoring and training-serving consistency.
      children:
        - id: formats-and-storage
          index: data-formats-and-pipelines
          title: Data formats, storage and pipelines
          description: Row and column formats, array stores, sharded record formats, and the loaders and
            pipelines that stream data at scale.
        - id: versioning-and-change
          index: versioning-and-change
          title: Versioning and change
          description: Dataset versions and lineage, schema evolution, and batch versus stream computation.
        - id: testing-and-monitoring
          index: data-tests
          title: Testing and monitoring
          description: Tests for data pipelines and monitoring of data in production.
        - id: training-and-serving
          index: training-serving-skew
          title: Training and serving
          description: Keeping the features seen in training and in production the same, and fresh.
    - id: datasets
      index: standard-datasets
      icon: library
      title: Standard datasets
      description: Standard datasets for tabular, vision, audio, language, time-series, health, graph,
        recommendation and scientific tasks, with their sizes, licences, sources and known defects.
      children:
        - id: classic-and-toy-datasets
          index: classic-statistical-datasets
          title: Classic and toy datasets
          description: Iris, Anscombe's quartet, Old Faithful and other classic statistical datasets, and
            synthetic generators such as two moons, Gaussian blobs and the Swiss roll.
        - id: data-problem-datasets
          index: datasets-for-data-problems
          title: Datasets for data problems
          description: Benchmarks for shift, label noise and anomalies, and a record of known defects in
            standard datasets.
        - id: tabular-and-social-datasets
          index: tabular-and-social-datasets
          title: Tabular and social datasets
          description: UCI and OpenML tabular benchmarks, fairness datasets such as Adult and COMPAS, causal
            and uplift datasets, finance and economics data, and survival datasets.
        - id: vision-datasets
          index: vision-and-multimodal-datasets
          title: Vision and multimodal datasets
          description: Image classification, detection and segmentation, face and pose, video, 3D and driving,
            image-text and robot-learning datasets, from MNIST and ImageNet to COCO and LAION.
        - id: audio-and-speech-datasets
          index: speech-datasets
          title: Audio and speech datasets
          description: Speech corpora such as LibriSpeech, Common Voice and VoxCeleb, and sound and music
            datasets such as AudioSet, ESC-50 and MUSDB18.
        - id: language-and-code-datasets
          index: language-and-code-datasets
          title: Language and code datasets
          description: NLP benchmarks such as GLUE and SQuAD, pretraining corpora, language-model evaluations
            such as MMLU, and code, document-understanding, instruction, dialogue and multilingual
            datasets.
        - id: time-series-and-sensor-datasets
          index: time-series-and-sensor-datasets
          title: Time-series and sensor datasets
          description: The UCR and UEA classification archives, forecasting collections from the M competitions
            to Monash, anomaly benchmarks, and activity-recognition and wearable datasets.
        - id: health-and-life-science-datasets
          index: health-and-life-science-datasets
          title: Health and life-science datasets
          description: ECG and EEG collections such as PhysioNet, medical imaging datasets, clinical records
            such as MIMIC, and protein structure and genomics resources.
        - id: graph-and-knowledge-datasets
          index: graph-benchmark-datasets
          title: Graph and knowledge datasets
          description: Graph benchmarks such as Cora and OGB for node, link and graph prediction, and knowledge
            graphs drawn from Freebase, WordNet, YAGO and Wikidata.
        - id: recommendation-and-retrieval-datasets
          index: recommender-datasets
          title: Recommendation and retrieval datasets
          description: Rating, implicit-feedback, click and session logs for recommenders, such as MovieLens,
            and query collections with relevance judgements for retrieval, such as MS MARCO and
            BEIR.
        - id: earth-and-physical-science-datasets
          index: earth-and-physical-science-datasets
          title: Earth and physical-science datasets
          description: Remote-sensing imagery, weather and climate reanalyses such as ERA5, molecular and
            materials datasets such as QM9, physics and astronomy data, and mobility trajectories.
    - id: environments
      index: reinforcement-learning-environments
      icon: gamepad
      title: Reinforcement learning environments
      description: Simulated environments and logged trajectories for reinforcement learning, control and
        sequential decision making.
- id: part-4-principles-of-learning
  index: principles-of-learning
  num: 4
  roman: Part IV
  title: Principles of learning
  icon: graduation-cap
  description: Generalisation bounds and PAC learning, cross-validation and regularisation, evaluation
    metrics, decision theory and calibration, loss functions, and exact and approximate
    probabilistic inference.
  children:
    - id: learning-theory
      index: statistical-learning-theory
      icon: graduation-cap
      title: Statistical learning theory
      description: 'When a model fitted to a sample generalises: PAC learning, VC dimension and Rademacher
        complexity, margin, stability and PAC-Bayes bounds, rates of convergence, and double
        descent.'
      children:
        - id: foundations
          index: foundations-of-learning-theory
          title: Foundations of learning theory
          description: 'The learning problem: risk, the generalisation gap, error decompositions, inductive
            bias and consistency.'
        - id: pac-learning
          index: probably-approximately-correct-learning
          title: PAC learning
          description: 'Probably approximately correct learning, finite classes, test-set and Occam bounds,
            sample-complexity lower bounds and computational limits.'
        - id: uniform-convergence-and-capacity
          index: uniform-convergence-and-capacity
          title: Uniform convergence and capacity
          description: 'Uniform laws of large numbers over infinite classes: symmetrisation, the growth
            function, VC dimension, Rademacher complexity, covering numbers and chaining.'
        - id: margins-and-norms
          index: margins-and-norms
          title: Margins and norms
          description: 'Scale-sensitive bounds: margin bounds for linear and kernel classifiers, the margin
            theory of boosting, and norm-based bounds for neural networks.'
        - id: algorithm-dependent-bounds
          index: algorithm-dependent-bounds
          title: Algorithm-dependent bounds
          description: 'Bounds from the learning algorithm rather than the class: stability, PAC-Bayes, sample
            compression, mutual information and adaptive data analysis.'
        - id: rates-and-consistency
          index: rates-and-consistency
          title: Rates and consistency
          description: 'How fast excess risk falls: surrogate-loss calibration, nearest-neighbour consistency,
            fast rates under low noise, localisation and minimax lower bounds.'
        - id: complexity-regularisation
          index: complexity-regularisation
          title: Complexity regularisation
          description: 'Choosing model complexity with guarantees: structural risk minimisation, oracle
            inequalities and minimum description length.'
        - id: bias-variance-and-interpolation
          index: bias-variance-and-interpolation
          title: Bias–variance and interpolation
          description: 'The bias–variance trade-off and what happens beyond it: double descent, benign
            overfitting, implicit regularisation, the neural tangent kernel, flat minima and the
            limits of uniform convergence.'
    - id: model-selection
      index: model-selection
      icon: sliders
      title: Model selection
      description: 'Estimating test error, choosing among models and assessing the choice: cross-validation
        and its variants, nested validation and selection bias, information criteria, Bayesian model selection,
        regularisation, hyperparameter optimisation and comparing algorithms.'
      children:
        - id: foundations
          index: foundations-of-model-selection
          title: Foundations of model selection
          description: 'Why training error cannot choose a model: overfitting and underfitting, the optimism of the training error, selection against assessment, validation curves, and how large models are selected today.'
        - id: cross-validation
          index: cross-validation
          title: Cross-validation
          description: 'Estimating prediction error by refitting on parts of the data: hold-out, k-fold, leave-one-out, GCV, repeated, stratified, grouped and blocked splits, bootstrap estimators, and the bias and variance of the estimates.'
        - id: selection-bias-and-nested-cross-validation
          index: selection-bias-and-nested-cross-validation
          title: Selection bias and nested cross-validation
          description: 'Why the best validation score is optimistic, and the remedies: nested cross-validation, the one-standard-error rule and the reusable holdout.'
        - id: information-criteria
          index: information-criteria
          title: Information criteria
          description: "Correcting the training fit analytically: AIC, BIC, Mallows' Cp, covariance penalties and SURE, and which criterion is consistent and which efficient."
        - id: bayesian-model-selection
          index: bayesian-model-selection
          title: Bayesian model selection
          description: 'Choosing and combining models by their evidence or by their posterior predictive accuracy: the marginal likelihood, empirical Bayes, WAIC, DIC, PSIS-LOO and Bayesian model averaging.'
        - id: regularisation
          index: regularisation
          title: Regularisation
          description: 'Penalties, constraints and procedures that trade bias for variance: shrinkage, Tikhonov and sparsity penalties, subset selection, regularisation paths, choosing the strength, early stopping and noise injection.'
        - id: hyperparameter-optimisation
          index: hyperparameter-search
          title: Hyperparameter optimisation
          description: 'Searching for hyperparameters by validation score: search spaces, grid, random and quasi-random search, Bayesian optimisation, multi-fidelity methods, gradient-based and population-based search, AutoML and architecture search.'
          children:
            - id: bayesian-optimisation
              index: bayesian-optimisation
              title: Bayesian optimisation
              description: 'Optimising an expensive black-box objective with a probabilistic surrogate: Gaussian-process and tree surrogates, acquisition functions, batch, high-dimensional, constrained and multi-objective variants.'
            - id: multi-fidelity-hyperparameter-optimisation
              index: multi-fidelity-hyperparameter-optimisation
              title: Multi-fidelity hyperparameter optimisation
              description: 'Spending little on poor configurations: cheap low-fidelity evaluations, successive halving, Hyperband, ASHA, BOHB, learning-curve extrapolation and multi-fidelity Bayesian optimisation.'
        - id: comparing-learning-algorithms
          index: comparing-learning-algorithms
          title: Comparing learning algorithms
          description: "Statistical tests for whether one model or algorithm beats another: McNemar's test, corrected resampled t-tests, 5×2 cross-validation, Friedman and Nemenyi across data sets, Bayesian comparison, and fair tuning budgets."
    - id: evaluation-metrics
      index: evaluation-metrics
      icon: ruler
      title: Evaluation metrics
      description: Metrics for classification, ranking, regression, forecasting, clustering, detection,
        image quality, generative models, text and speech, with ROC curves, calibration and fairness
        measures.
      children:
        - id: metric-foundations
          index: choosing-a-metric
          title: Foundations of evaluation metrics
          description: Choosing a metric for a task and the decision it supports, and confidence intervals for
            metric estimates.
        - id: classification-metrics
          index: classification-metrics
          title: Classification metrics
          description: Confusion matrices, accuracy, precision, recall, F-scores, specificity, MCC, Cohen's
            kappa and ordinal metrics.
        - id: classification-curves
          index: receiver-operating-characteristic-and-precision-recall-curves
          title: ROC and precision-recall curves
          description: Threshold-free evaluation, AUROC, average precision, and operating points at fixed
            recall.
        - id: probabilistic-metrics
          title: Probabilistic metrics
          description: Log loss, Brier score and calibration errors as evaluation metrics.
        - id: fairness-metrics
          title: Fairness metrics
          description: Group fairness criteria such as demographic parity, equalised odds and equal opportunity.
        - id: regression-metrics
          index: regression-metrics
          title: Regression metrics
          description: MSE, MAE, R², explained variance, log-cosh, Tweedie deviance and their failure modes.
        - id: correlation-and-agreement
          index: correlation-and-agreement
          title: Correlation and agreement
          description: Pearson, Spearman and Kendall correlation, concordance, Cramér's V, Theil's U and
            Fleiss' kappa.
        - id: distances-and-similarities
          index: distances-and-similarities
          title: Distances and similarities
          description: Pairwise distances, cosine similarity, the Mahalanobis distance and Procrustes alignment.
        - id: forecasting-metrics
          index: forecasting-metrics
          title: Forecasting metrics
          description: MAPE, sMAPE, WMAPE, MASE, CRPS and interval coverage.
        - id: ranking-metrics
          index: ranking-and-retrieval-metrics
          title: Ranking and retrieval metrics
          description: Precision and recall at k, MAP, MRR, NDCG, hit rate and R-precision.
        - id: clustering-metrics
          index: clustering-metrics
          title: Clustering metrics
          description: Rand and adjusted Rand indices, mutual-information scores, V-measure, silhouette and
            internal indices.
        - id: detection-and-segmentation-metrics
          index: detection-and-segmentation-metrics
          title: Detection and segmentation metrics
          description: IoU and its variants, mean average precision, Dice, Hausdorff distance and panoptic
            quality.
        - id: image-quality-metrics
          index: image-quality-metrics
          title: Image quality metrics
          description: PSNR, SSIM, VIF, LPIPS and other full-reference and no-reference measures.
        - id: generative-metrics
          index: generative-model-metrics
          title: Generative model metrics
          description: Inception score, FID, KID, precision and recall for generative models, and CLIP score.
        - id: text-metrics
          index: text-metrics
          title: Text metrics
          description: BLEU, chrF, ROUGE, TER, word and character error rates, BERTScore and perplexity.
        - id: audio-metrics
          index: audio-and-speech-metrics
          title: Audio and speech metrics
          description: SNR, SI-SDR, permutation-invariant training, PESQ, STOI and learned quality predictors.
    - id: decision-theory-and-calibration
      index: decision-theory-and-calibration
      icon: gauge
      title: Decision theory and calibration
      description: The Bayes decision rule and reject option, cost-sensitive learning, ROC analysis and
        cost curves, proper scoring rules, calibration maps and their evaluation, and conformal
        prediction.
      children:
        - id: decision-theory
          title: Decision theory
          description: Expected loss and utility, the Bayes decision rule, cost matrices and optimal thresholds.
        - id: cost-sensitive-learning
          index: true
          title: Cost-sensitive learning
          description: Unequal misclassification costs, class imbalance, reweighting and threshold moving.
        - id: roc-analysis
          index: receiver-operating-characteristic-analysis
          title: ROC analysis
          description: ROC space and its geometry, iso-cost lines, convex hulls and precision-recall-gain
            curves.
        - id: proper-scoring-rules
          index: proper-scoring-rule
          title: Proper scoring rules
          description: Log score, Brier score, CRPS, what makes a score proper, and their decompositions into
            calibration and refinement.
        - id: classifier-calibration
          index: true
          title: Classifier calibration
          description: Calibration maps from Platt scaling and isotonic regression to beta, Dirichlet and
            temperature scaling.
        - id: calibration-evaluation
          title: Evaluating calibration
          description: Reliability diagrams, calibration errors, and the calibration-refinement decomposition
            of proper scores.
        - id: regression-calibration
          title: Calibration for regression
          description: Calibrated predictive distributions and quantiles, and distribution calibration.
        - id: uncertainty-quantification
          index: uncertainty-quantification
          title: Uncertainty quantification
          description: Conformal prediction, selective prediction with a reject option, and aleatoric and
            epistemic uncertainty.
    - id: loss-functions
      index: loss-functions
      icon: trending-down
      title: Loss functions
      description: Squared, absolute, Huber and quantile losses, cross-entropy, hinge and focal losses,
        sampled and hierarchical softmax, pointwise, pairwise and listwise ranking losses, and
        triplet and contrastive losses.
      children:
        - id: regression-losses
          index: true
          title: Regression losses
          description: Squared, absolute, Huber, quantile and other losses for real-valued targets.
        - id: classification-losses
          title: Classification losses
          description: Cross-entropy, hinge, exponential and focal losses, and surrogate losses in general.
        - id: approximate-softmax
          index: approximate-softmax
          title: Approximate softmax
          description: 'Training a softmax over a large vocabulary or catalogue without computing its
            normaliser: sampled softmax and negative sampling, hierarchical softmax, and
            self-normalisation.'
        - id: ranking-losses
          index: true
          title: Ranking losses
          description: Pointwise, pairwise and listwise losses for ordering items.
        - id: representation-losses
          index: contrastive-and-metric-learning-losses
          title: Contrastive and metric-learning losses
          description: Contrastive, triplet and InfoNCE losses for learning embeddings.
    - id: probabilistic-inference
      index: probabilistic-inference
      icon: git-fork
      title: Probabilistic inference
      description: Graphical models, exact inference by variable elimination and belief propagation, MCMC,
        variational inference, expectation propagation, probabilistic programming, and skill-rating
        models.
      children:
        - id: graphical-models
          index: graphical-models
          title: Graphical models
          description: Bayesian networks, Markov random fields, factor graphs and conditional independence.
        - id: exact-inference
          index: exact-inference
          title: Exact inference
          description: Variable elimination, belief propagation and the junction tree algorithm.
        - id: monte-carlo
          index: markov-chain-monte-carlo-methods
          title: Markov chain Monte Carlo methods
          description: Markov chain Monte Carlo by Metropolis–Hastings, Gibbs sampling, Hamiltonian Monte
            Carlo and Langevin dynamics, and diagnostics for convergence.
        - id: variational-inference
          index: true
          title: Variational inference
          description: Approximating posteriors by optimisation, from mean field to stochastic and amortised
            inference.
        - id: approximate-inference
          index: message-passing-approximations
          title: Message-passing approximations
          description: Expectation propagation and loopy belief propagation, which approximate a posterior by passing local messages, with worked examples of each.
          children:
            - id: expectation-propagation-examples
              index: expectation-propagation-examples
              title: Expectation propagation examples
              description: 'Expectation propagation worked through assumed density filtering, the clutter problem,
                probit regression, truncated Gaussians and Gaussian process classification, with its
                failure modes and fixes.'
        - id: probabilistic-programming
          index: true
          title: Probabilistic programming
          description: Writing a model as a program that draws random variables and conditions on data, with
            Stan, PyMC, Pyro or Turing deriving the density and running MCMC or variational
            inference.
        - id: skill-rating
          index: skill-rating
          title: Skill rating
          description: Paired-comparison models such as Bradley–Terry and Plackett–Luce, Elo, Glicko and
            TrueSkill ratings, and item response theory for ability and item difficulty, applied
            also to machine-learning benchmarks.
        - id: model-based-machine-learning
          index: true
          title: Model-based machine learning
          description: 'Probabilistic models built for one problem and solved by message passing, after Winn
            and Bishop and Infer.NET: assessing skills, classifying email, recommending,
            crowdsourcing and predicting clicks.'
- id: part-5-learning-paradigms
  index: learning-paradigms
  num: 5
  roman: Part V
  title: Learning paradigms
  icon: brain
  description: Supervised, semi-supervised and weakly supervised learning, clustering and
    dimensionality reduction, representation learning, anomaly detection, online and transfer
    learning, and reinforcement learning.
  children:
    - id: supervised-learning
      index: supervised-learning
      icon: target
      title: Supervised learning
      description: Linear and nonlinear regression, classifiers, generalised linear and additive models,
        nearest neighbours, kernel methods and Gaussian processes, trees and ensembles, and
        structured and ordinal prediction.
      children:
        - id: regression
          index: regression
          title: Regression
          children:
            - id: linear
              index: linear-models
              title: Linear models
              description: Least squares and its regularised variants, fitted exactly or by stochastic gradient
                descent.
            - id: nonlinear-regression
              index: nonlinear-regression
              title: Nonlinear regression
              description: Basis expansions, splines, isotonic regression and local regression.
          description: Least squares, ridge, lasso and elastic net, Bayesian linear regression, and nonlinear
            fits by basis expansions, splines, local regression and isotonic regression.
        - id: classification
          index: classification
          title: Classification
          description: Logistic regression, learning when one class is rare, and multiclass prediction by
            direct models or by reduction to binary problems.
          children:
            - id: imbalanced-classes
              index: class-imbalance
              title: Class imbalance
              description: 'Learning when one class is rare: resampling, class weights, threshold moving, prior
                shift and calibration.'
            - id: multiclass
              index: multiclass-classification
              title: Multiclass classification
              description: 'Direct multiclass models against reductions to binary problems: one-versus-rest,
                one-versus-one, error-correcting output codes, nested dichotomies and multiclass
                support vector machines.'
        - id: generalised-linear-models
          index: generalised-linear-model
          title: Generalised linear model
          description: 'Exponential-family responses with link functions, spanning regression and
            classification: linear, logistic, Poisson and gamma regression.'
        - id: generative-classifiers
          index: generative-classifiers
          title: Generative classifiers
          description: Naive Bayes, tree-augmented and averaged one-dependence Bayes, and linear and quadratic
            discriminant analysis.
        - id: nearest-neighbours
          index: nearest-neighbours
          title: Nearest neighbours
          description: k-nearest neighbours for classification and regression, and fast neighbour search.
          children:
            - id: space-partitioning
              index: space-partitioning-trees
              title: Space-partitioning trees
              description: Exact search structures that split space or a metric recursively and prune by bounds,
                such as k-d trees, ball trees and vantage-point trees.
            - id: approximate-nearest-neighbours
              index: approximate-nearest-neighbour-search
              title: Approximate nearest-neighbour search
              description: Hashing, quantisation, inverted-file, graph and tree indexes for vector search, the
                FAISS family, and how they are benchmarked.
        - id: kernel-methods
          index: kernel-methods-and-support-vector-machines
          title: Kernel methods and support vector machines
          description: Support vector machines and their solution by SMO, kernels and reproducing kernel
            Hilbert spaces, the representer theorem, kernel ridge regression and choosing a kernel
            width.
        - id: gaussian-processes
          index: gaussian-processes
          title: Gaussian processes
          description: Gaussian process regression and classification, covariance functions and hyperparameter
            learning, automatic relevance determination, the relevance vector machine, and sparse
            and deep approximations.
          children:
            - id: hierarchical-gaussian-processes
              index: hierarchical-gaussian-process
              title: Hierarchical Gaussian process
              description: Shared and per-replicate functions in a hierarchy of Gaussian processes, and their use
                for scoring whole time series as anomalous, with periodic variable-star light curves
                as the application.
            - id: gp-latent-variable-models
              index: gaussian-process-latent-variable-model-family
              title: GP-LVM family
              description: GPLVMs, Bayesian and back-constrained variants, shared and dynamical models, and
                generative manifolds such as the manifold of fonts.
        - id: trees-and-ensembles
          index: trees-and-ensembles
          title: Trees and ensembles
          description: Decision trees and pruning, bagging, random forests and extra trees, AdaBoost and
            gradient boosting with XGBoost, LightGBM and CatBoost, stacking, and SHAP values for
            trees.
        - id: generalised-additive-models
          index: generalised-additive-model
          title: Generalised additive model
          description: Sums of smooth functions of each input through a link function, for any
            exponential-family response; splines, backfitting and penalised smoothing.
        - id: structured-prediction
          index: true
          title: Structured prediction
          description: Predicting sequences and other structured outputs, from HMMs to CRFs and structural SVMs.
        - id: ordinal-regression
          index: true
          title: Ordinal regression
          description: 'Predicting ordered categories with unknown spacing: cumulative link and proportional
            odds models, threshold losses, binary decompositions, Gaussian-process, deep and
            structured ordinal models.'
    - id: semi-supervised-learning
      icon: blend
      title: Semi-supervised learning
      description: Learning from a few labelled examples and many unlabelled ones, by self-training and
        graph propagation.
    - id: weak-supervision
      index: true
      icon: tags
      title: Weak supervision
      description: 'Learning from coarse, aggregate or unreliable labels: multiple-instance learning,
        learning from label proportions, positive-unlabelled and partial labels, crowdsourced labels
        and programmatic labelling.'
      children:
        - id: multiple-instance-learning
          index: true
          title: Multiple-instance learning
          description: 'Labels on bags of instances rather than on instances: the standard and collective
            assumptions, max-margin and attention-based pooling, and MIL for interpretable time
            series classification.'
        - id: learning-from-label-proportions
          index: true
          title: Learning from label proportions
          description: 'Only the class proportions of each bag are known: identifiability, the mean map,
            inverse calibration, proportion losses and graph-based label propagation.'
        - id: positive-unlabelled-and-partial-labels
          index: positive-unlabelled-and-partial-labels
          title: Positive-unlabelled and partial labels
          description: 'Incomplete or ambiguous instance labels: positive and unlabelled data, unbiased and
            non-negative risk estimators, candidate label sets and complementary labels.'
        - id: crowdsourcing
          title: Crowdsourced labels
          description: 'Several noisy annotators per item: the Dawid–Skene model, EM for annotator confusion
            matrices, and learning a classifier jointly with annotator reliabilities.'
        - id: programmatic-weak-supervision
          index: programmatic-weak-supervision
          title: Programmatic weak supervision
          description: 'Labelling functions and label models: data programming, Snorkel, estimating source
            accuracies without labels, production systems and benchmarks.'
    - id: unsupervised-learning
      index: unsupervised-learning
      icon: shapes
      title: Unsupervised learning
      description: Clustering, linear and nonlinear dimensionality reduction, manifold learning, topic
        models, density and density-ratio estimation, and covariance estimation.
      children:
        - id: clustering
          index: clustering
          title: Clustering
          description: k-means, Gaussian mixtures, hierarchical clustering, DBSCAN and OPTICS, spectral
            clustering, and choosing the number of clusters.
        - id: dimensionality-reduction
          index: true
          title: Dimensionality reduction
          description: PCA, probabilistic PCA, factor analysis, ICA, NMF, CCA, kernel PCA and random
            projections.
        - id: manifold-learning
          index: manifold-learning
          title: Manifold learning
          description: Multidimensional scaling, Isomap, locally linear embedding, Laplacian eigenmaps and
            diffusion maps, self-organising maps, t-SNE and UMAP, and how embeddings are evaluated.
        - id: topic-models
          index: topic-models
          title: Topic models
          description: Latent Dirichlet allocation, its inference, the family of models that extend it, neural
            topic models, and topic models applied beyond text.
          children:
            - id: foundations
              index: foundations-of-topic-models
              title: Foundations of topic models
              description: LSA, pLSA, LDA, and inference by collapsed Gibbs sampling and variational Bayes.
            - id: extensions
              index: topic-model-family
              title: Extensions of latent Dirichlet allocation
              description: Topics through time, authors and metadata, correlated and supervised topics,
                nonparametric and hierarchical topic models.
            - id: neural-topic-models
              index: true
              title: Neural topic models
              description: Amortised variational inference for topic models, embedding-based and clustering-based
                topic models.
            - id: applications
              index: applications-of-topic-models
              title: Applications of topic models
              description: Topic models for sensor data and smart homes, images, genetics and recommendation.
        - id: density-estimation
          title: Density estimation
          description: Histograms, kernel density estimation and mixture models.
        - id: density-ratio-estimation
          index: true
          title: Density ratio estimation
          description: Estimating the ratio of two densities from a sample of each without estimating either
            density, by probabilistic classification, KLIEP and least-squares fitting.
        - id: covariance-estimation
          title: Covariance estimation
          description: Shrinkage, sparse inverse covariance and robust covariance estimates.
    - id: representation-learning
      index: representation-learning
      icon: fingerprint
      title: Representation learning
      description: 'Self-supervised learning of embeddings: word embeddings, contrastive and
        non-contrastive methods, CLIP, masked language and image modelling, fine-tuning, and
        embedding evaluation.'
    - id: anomaly-detection
      index: true
      icon: radar
      title: Anomaly detection
      description: Statistical outlier tests, distance and density scores, isolation forests, one-class
        SVMs and deep SVDD, reconstruction error, anomalies in time series, and how detectors are
        evaluated.
      children:
        - id: statistical-methods
          index: statistical-outlier-detection
          title: Statistical outlier detection
          description: Z-scores, robust statistics, Grubbs' test and extreme value theory.
        - id: density-and-distance-methods
          title: Density and distance methods
          description: Local outlier factor, k-nearest-neighbour distances and kernel density scores.
        - id: isolation-and-ensembles
          title: Isolation and ensemble methods
          description: Isolation forests and ensembles of detectors.
        - id: one-class-methods
          title: One-class methods
          description: One-class SVMs and support vector data description.
        - id: deep-one-class-methods
          index: deep-anomaly-detection
          title: Deep anomaly detection
          description: Deep SVDD and its relatives, and detectors built on self-supervised or pretrained
            features.
        - id: reconstruction-methods
          title: Reconstruction methods
          description: PCA residuals and autoencoder reconstruction error.
        - id: time-series-anomalies
          title: Anomalies in time series
          description: Point, contextual and collective anomalies in time series, and detection from forecast
            residuals.
        - id: evaluation
          title: Evaluating detectors
          description: Precision at low false-alarm rates, contamination and labelling problems.
    - id: online-learning
      index: true
      icon: repeat
      title: Online learning
      description: Regret and online convex optimisation, prediction with expert advice, incremental
        models under concept drift, selective sampling, and continual learning without catastrophic
        forgetting.
      children:
        - id: online-convex-optimisation
          index: true
          title: Online convex optimisation
          description: Regret, online gradient descent, follow-the-regularised-leader and online mirror descent.
        - id: prediction-with-expert-advice
          index: prediction-with-expert-advice
          title: Prediction with expert advice
          description: Weighted majority, Hedge and exponential weights, and lower bounds on regret.
        - id: streaming-and-incremental-learning
          index: streaming-and-incremental-learning
          title: Streaming and incremental learning
          description: Sequential estimation, online Bayesian updating, incremental models and learning under
            concept drift.
        - id: online-active-learning
          title: Online active learning
          description: Selective sampling and label-efficient learning from a stream.
        - id: continual-learning
          index: true
          title: Continual learning
          description: Catastrophic forgetting, regularisation and replay methods, and evaluation of lifelong
            learners.
    - id: transfer-and-meta-learning
      index: transfer-learning
      icon: arrow-right-left
      title: Transfer learning
      description: Negative transfer, domain adaptation under covariate and label shift, multi-task and
        meta-learning, few-shot learning, active and Bayesian transfer, and test-time adaptation.
      children:
        - id: foundations
          title: Foundations of transfer learning
          description: Domains and tasks, the taxonomy of transfer settings, negative transfer and when
            transfer helps.
        - id: domain-adaptation
          index: domain-adaptation
          title: Domain adaptation
          description: Generalisation bounds across domains, importance weighting, feature alignment and
            adversarial adaptation.
        - id: multi-task-and-meta-learning
          index: multi-task-and-meta-learning
          title: Multi-task and meta-learning
          description: Shared representations and priors across tasks, learning to learn, and few-shot learning.
        - id: active-transfer-learning
          index: active-and-bayesian-transfer-learning
          title: Active and Bayesian transfer learning
          description: Choosing which target examples to label when a source model already exists, and
            Bayesian priors from source domains.
        - id: online-transfer-learning
          index: true
          title: Online transfer learning
          description: Transfer when target data arrive as a stream, and test-time adaptation.
    - id: reinforcement-learning
      index: true
      icon: gamepad
      title: Reinforcement learning
      description: Markov decision processes and Bellman equations, value and policy iteration,
        temporal-difference learning and Q-learning, policy gradients and actor-critic methods, and
        model-based and offline learning.
      children:
        - id: markov-decision-processes
          index: markov-decision-processes-and-dynamic-programming
          title: Markov decision processes and dynamic programming
          description: MDPs, Bellman equations, value and policy iteration.
        - id: value-based-methods
          index: value-based-methods
          title: Value-based methods
          description: Temporal-difference learning, Q-learning and deep Q-networks.
        - id: policy-methods
          index: policy-methods
          title: Policy methods
          description: Policy gradients, actor-critic methods, trust-region methods and PPO, deterministic
            policy gradients, and reinforcement learning from human feedback.
        - id: model-based-and-offline
          index: model-based-and-offline-reinforcement-learning
          title: Model-based and offline reinforcement learning
          description: Planning with learned dynamics models, off-policy evaluation, and learning a policy
            from a fixed dataset.
    - id: logic-and-rule-learning
      icon: workflow
      title: Logic and rule learning
      description: Inductive logic programming, rule induction and symbolic learning methods.
      children:
        - id: inductive-logic-programming
          title: Inductive logic programming
          description: Learning logic programs from examples and background knowledge, as in FOIL, Progol and
            Aleph.
        - id: rule-induction
          title: Rule induction
          description: Learning if-then rule sets and decision lists by sequential covering, as in CN2 and
            RIPPER.
- id: part-6-neural-architectures
  index: neural-architectures
  num: 6
  roman: Part VI
  title: Neural architectures
  icon: network
  description: Multilayer perceptrons and their training, convolutional and graph networks, recurrent
    networks, transformers and state-space models, large language models, deep generative models and
    physics-informed networks.
  children:
    - id: feedforward-networks
      index: feedforward-networks
      icon: brain
      title: Feedforward networks
      description: Perceptrons and multilayer networks, and how deep networks are initialised, normalised,
        optimised and regularised.
      children:
        - id: foundations
          index: foundations-of-feedforward-networks
          title: Foundations of feedforward networks
          description: Perceptrons, multilayer networks, activations and universal approximation.
        - id: training
          index: training-deep-networks
          title: Training deep networks
          description: Initialisation, normalisation, optimisers, learning-rate schedules and regularisation.
        - id: energy-based-networks
          index: true
          title: 'Energy-based networks: from spins to Boltzmann machines'
          description: 'From the Ising model and spin glasses to Hopfield networks as associative memories,
            Boltzmann and restricted Boltzmann machines, deep belief nets, and modern Hopfield
            networks, whose update is attention.'
    - id: convolutional-networks
      index: convolutional-networks
      icon: grid
      title: Convolutional networks
      description: Convolutional layers, pooling and strides, residual connections, and the line of
        architectures from LeNet and AlexNet to VGG and ResNet.
    - id: graph-neural-networks
      index: graph-neural-networks
      icon: share
      title: Graph neural networks
      description: Message passing, graph convolution and graph attention.
    - id: sequence-models
      index: sequence-models
      icon: waves
      title: Sequence models
      description: 'Networks that read a sequence step by step and carry a hidden state: recurrent
        networks, LSTMs and GRUs, and encoder–decoder models with attention.'
      children:
        - id: recurrent-networks
          index: recurrent-networks
          title: Recurrent networks
          description: Recurrent networks and backpropagation through time, LSTMs and GRUs, and
            sequence-to-sequence models with Bahdanau attention.
    - id: transformers
      index: transformers
      icon: layers
      title: Transformers
      description: Scaled dot-product and multi-head attention, positional encodings from sinusoids to
        RoPE and ALiBi, encoder and decoder families, grouped-query and latent attention, block
        design and training stability.
      children:
        - id: vanilla-transformer
          index: transformer
          title: The original transformer
          description: Scaled dot-product and multi-head attention, masking, sinusoidal positions and the 2017
            encoder-decoder.
        - id: positional-encodings
          index: positional-encoding
          title: Positional encodings
          description: Absolute, relative, rotary and bias-based position schemes, and extending them to
            longer contexts.
        - id: architecture-families
          index: transformer-architecture-families
          title: Transformer architecture families
          description: Encoder-only, decoder-only, encoder-decoder and prefix models, and how modern decoder
            LLMs differ.
        - id: attention-variants
          index: attention-variants
          title: Attention variants
          description: KV caching, multi-query, grouped-query and multi-head latent attention, QK
            normalisation, logit soft-capping and attention sinks.
        - id: block-design
          index: modern-decoder-block
          title: Modern decoder block
          description: Pre- and post-norm, RMSNorm, gated feed-forward layers, parallel blocks, embeddings and
            initialisation.
        - id: training-and-analysis
          index: training-and-analysis-of-transformers
          title: Training and analysis of transformers
          description: Training stability at scale, hyperparameter transfer by maximal update
            parameterisation, and analysis of attention heads and the residual stream.
    - id: efficient-sequence-models
      index: efficient-and-state-space-sequence-models
      title: Efficient and state-space sequence models
      description: Sliding-window, sparse and linear attention, RWKV and retentive networks, parallel
        scans for linear recurrences, the S4 and Mamba state-space models, and hybrids of attention
        and recurrence.
    - id: large-language-models
      index: large-language-models
      icon: message-square
      title: Large language models
      description: Autoregressive transformer language models and their decoding, prompting, in-context
        learning, retrieval and tool use, fine-tuning, LoRA and preference optimisation, and
        decision models.
      children:
        - id: models-and-decoding
          index: language-models-and-decoding
          title: Language models and decoding
          description: Autoregressive transformer language models, greedy, beam and sampling decoders,
            speculative decoding, and language model evaluation.
        - id: working-with-llms
          index: working-with-large-language-models
          title: Working with large language models
          description: Prompting, in-context learning, chain-of-thought reasoning, retrieval, tool use and
            hallucination.
        - id: fine-tuning-and-alignment
          index: adapting-pretrained-language-models
          title: Adapting pretrained language models
          description: Adapting a pretrained language model to a new task or to human preferences, by
            supervised fine-tuning, parameter-efficient methods, preference optimisation and
            reinforcement learning.
        - id: decision-models
          index: true
          title: Decision models
          description: Language models that answer typed questions in one forward pass, with a probability for
            every allowed answer and no generated text.
          children:
            - id: decision-model-core-ideas
              index: how-decision-models-work
              title: How decision models work
              description: Scoring answers from next-token logits, batching several questions over a shared
                prefix, the input–output contract, training losses, rewards for calibrated
                decisions, and calibration.
            - id: decision-model-releases
              index: released-decision-models
              title: Released decision models
              description: Jev, Nimble and Tev1, what each publishes, and how they compare.
    - id: generative-models
      index: deep-generative-models
      icon: sparkles
      title: Deep generative models
      description: Autoencoders, VAEs, GANs, normalising flows, autoregressive and diffusion models.
      children:
        - id: autoencoders
          index: autoencoders-and-variational-autoencoders
          title: Autoencoders and VAEs
          description: Autoencoders and their regularised variants, variational autoencoders, VQ-VAE and RQ-VAE.
        - id: other-generative-models
          index: adversarial-flow-energy-based-and-autoregressive-models
          title: Adversarial, flow, energy-based and autoregressive models
          description: Autoregressive models, normalising flows, generative adversarial networks and the
            Wasserstein GAN, and energy-based models, including joint energy-based classifiers.
        - id: diffusion-models
          index: diffusion-models
          title: Diffusion models
          description: Denoising diffusion probabilistic models, score matching, DDIM and fast samplers,
            classifier and classifier-free guidance, and latent diffusion.
    - id: physics-informed-networks
      index: physics-informed-neural-networks
      icon: microscope
      title: Physics-informed neural networks
      description: Networks trained to fit data and satisfy a differential equation, with the equation's
        residual, computed by automatic differentiation, as a loss term; worked on a damped
        oscillator.
- id: part-7-application-domains
  index: application-domains
  num: 7
  roman: Part VII
  title: Application domains
  icon: layers
  description: Time-series forecasting and classification, A/B tests and bandits, recommender systems
    and retrieval, natural language processing, computer vision, multimodal learning, and ray
    casting for games.
  children:
    - id: time-series
      index: time-series
      icon: activity
      title: Time series
      description: Stationarity and autocorrelation, ARIMA and exponential smoothing, Kalman filters,
        GARCH, vector autoregression, change-point detection, the matrix profile, classification and
        neural forecasting.
      children:
        - id: foundations
          index: foundations-of-time-series
          title: Foundations of time series
          description: Stationarity, autocorrelation, differencing and decomposition into trend and seasonality.
        - id: arima-models
          index: autoregressive-and-moving-average-models
          title: ARMA and ARIMA models
          description: Autoregressive and moving-average models, ARIMA, seasonal ARIMA and exogenous regressors.
        - id: exponential-smoothing
          index: exponential-smoothing
          title: Exponential smoothing
          description: Simple exponential smoothing, Holt's linear trend and Holt–Winters methods, and the ETS
            state-space framework.
        - id: state-space-models
          index: state-space-models
          title: State-space models
          description: The Kalman filter and smoother, extended and unscented filters, and particle filters.
        - id: volatility-models
          index: volatility-models
          title: Volatility models
          description: ARCH, GARCH and stochastic volatility.
        - id: multivariate-time-series
          index: multivariate-time-series
          title: Multivariate time series
          description: Vector autoregression, Granger causality and cointegration.
        - id: forecasting
          index: forecasting-practice
          title: Forecasting practice
          description: Backtesting, prediction intervals, hierarchical and probabilistic forecasting.
        - id: change-points
          index: change-point-detection
          title: Change-point detection
          description: CUSUM, Bayesian online change-point detection and segmentation.
        - id: similarity-search
          index: matrix-profile-family
          title: Matrix profile family
          description: Distance profiles, the matrix profile, repeated patterns (motifs), anomalies (discords)
            and segmentation.
        - id: time-series-classification
          index: time-series-classification
          title: Time-series classification
          description: Dynamic time warping, symbolic aggregate approximation, shapelets, the shapelet
            transform and learned shapelets, and the benchmarks used to compare classifiers.
        - id: neural-forecasting
          index: neural-forecasting-models
          title: Neural forecasting models
          description: 'DeepAR and other probabilistic autoregressive RNNs, temporal convolutional networks,
            N-BEATS and N-HiTS, the Temporal Fusion Transformer, PatchTST, DLinear, and pretrained
            models such as Chronos and TimesFM.'
    - id: online-experimentation
      index: online-experimentation
      icon: flask
      title: Online experimentation
      description: Controlled experiments on live products, from A/B tests to bandits that adapt as data arrive.
      children:
        - id: foundations
          index: foundations-of-online-experimentation
          title: Foundations of online experimentation
          description: Randomisation and analysis units, the overall evaluation criterion and guardrail
            metrics, power and test duration, triggering and dilution, and interleaving.
        - id: ab-tests
          index: a-b-test-analysis
          title: A/B test analysis
          description: Conversion and heavy-tailed revenue metrics, ratio metrics and the delta method,
            confidence intervals for relative lift, and variance reduction by CUPED.
        - id: validity-threats
          index: validity-and-biased-samples
          title: Validity and biased samples
          description: Novelty and primacy effects, interference between units and cluster randomisation,
            switchback experiments, and reweighting of biased samples.
        - id: examples
          index: a-b-test-pitfalls
          title: A/B test pitfalls
          description: A/A tests, sample ratio mismatch, peeking and optional stopping, many metrics and many
            variants, and the winner's curse, each simulated.
        - id: sequential-testing
          index: sequential-testing-and-safe-peeking
          title: Sequential testing and safe peeking
          description: Group-sequential designs, alpha spending, mSPRT, always-valid p-values and e-values.
        - id: multi-armed-bandits
          index: multi-armed-bandit-algorithms
          title: Multi-armed bandit algorithms
          description: Regret, explore-then-commit, ε-greedy, UCB and KL-UCB, Thompson sampling, EXP3 for
            adversarial rewards, non-stationary bandits and best-arm identification.
        - id: contextual-bandits
          index: contextual-bandits-and-off-policy-learning
          title: Contextual bandits and off-policy learning
          description: LinUCB, linear Thompson sampling, off-policy evaluation and logging policies.
    - id: recommendation-and-retrieval
      index: recommendation-and-retrieval
      icon: library
      title: Recommendation and retrieval
      description: Collaborative filtering and matrix factorisation, feature-interaction and two-tower
        models, sequential and graph recommenders, ranking losses, unbiased learning from clicks,
        evaluation, and dense retrieval.
      children:
        - id: foundations
          index: foundations-of-recommender-systems
          title: Foundations of recommender systems
          description: The recommendation problem, explicit and implicit feedback, the Netflix Prize, and
            multi-stage pipelines of candidate retrieval and ranking.
        - id: collaborative-filtering
          index: collaborative-filtering
          title: Collaborative filtering
          description: Neighbourhood methods, matrix factorisation, alternating least squares, implicit
            feedback and BPR.
        - id: feature-interaction-models
          index: feature-interaction-models
          title: Feature-interaction models
          description: Factorisation machines, field-aware and field-weighted FMs, Wide & Deep, DeepFM, cross
            networks and DLRM.
        - id: deep-recommenders
          title: Deep recommender systems
          description: Neural collaborative filtering and two-tower retrieval models.
        - id: sequential-recommendation
          index: sequential-recommendation-models
          title: Sequential recommendation
          description: Recurrent and self-attentive next-item models such as GRU4Rec, SASRec and BERT4Rec.
        - id: graph-recommenders
          index: graph-based-recommendation
          title: Graph-based recommendation
          description: The user–item bipartite graph, message passing for collaborative filtering, LightGCN,
            untrained propagation, and graph learning for Uber Eats.
        - id: cold-start-and-context
          index: cold-start-content-and-context
          title: Cold start, content and context
          description: The cold-start problem, content-based and hybrid embeddings, multi-behaviour signals
            and context-aware models.
        - id: generative-recommendation
          title: Generative recommendation
          description: Large language models as recommenders and single-stage generation of item identifiers.
        - id: loss-families
          index: recommendation-loss-families
          title: Recommendation loss families
          description: 'Pointwise, pairwise and listwise ranking losses, lambda gradients, sampled softmax and
            negative sampling, contrastive retrieval losses, and the losses of sequential and
            generative recommenders.'
        - id: learning-to-rank
          index: learning-to-rank-from-clicks
          title: Learning to rank from clicks
          description: Click models, the examination hypothesis, unbiased learning to rank and field
            interactions in neural ranking.
        - id: debiasing
          index: bias-and-debiasing-in-recommendation
          title: Bias and debiasing in recommendation
          description: Biases in logged feedback, feedback loops, propensities, popularity bias, slate
            estimators and the causal toolkit for learning from biased data.
        - id: evaluation
          index: evaluation-and-beyond-accuracy-objectives
          title: Evaluation and beyond-accuracy objectives
          description: Offline metrics, diversity, novelty and fairness, diversified re-ranking, unbiased
            offline evaluation and LLM judges.
        - id: experimentation
          title: Online learning and experimentation for recommenders
          description: Reinforcement learning for recommendation and the biases that feedback loops introduce
            into experiments.
        - id: retrieval-models
          title: Retrieval models
          description: Boolean and vector-space models, TF-IDF, inverted indices and query processing.
        - id: probabilistic-retrieval
          title: Probabilistic retrieval
          description: The probability ranking principle, binary independence, BM25 and query-likelihood
            language models.
        - id: dense-retrieval
          title: Dense and neural retrieval
          description: Dual encoders, cross-encoder re-ranking, late interaction, hybrid retrieval and
            retrieval-augmented generation.
        - id: pinsage-family
          index: true
          title: The PinSage family
          description: "Pinterest's representation models: GraphSAGE and PinSage on the pin–board graph, Pixie
            random walks, PinnerSage and ItemSage embeddings, PinnerFormer and TransAct, and PinFM."
    - id: natural-language-processing
      index: natural-language-processing
      icon: languages
      title: Natural language processing
      description: Tokenisation and text representations from bags of words to sentence embeddings, n-gram
        and neural language models, classification, translation, summarisation, question answering
        and sequence labelling.
      children:
        - id: text-representation
          index: text-representation-pipeline
          title: Text representation
          description: Tokenisation and subwords such as BPE, normalisation, stemming and lemmatisation, bags
            of words and n-grams, TF-IDF, PMI and distributional semantics, and word, sentence and
            document embeddings.
        - id: language-models
          title: Language models
          description: N-gram language models, and neural language models that predict the next word from
            learned embeddings.
        - id: nlp-tasks
          index: natural-language-processing-tasks
          title: NLP tasks
          description: Text classification, natural language inference, machine translation, summarisation and
            question answering.
        - id: sequence-labelling
          index: sequence-labelling
          title: Sequence labelling in NLP
          description: 'One tag per token: part-of-speech tagging, chunking and named-entity recognition with
            BIO tags, solved by HMMs, CRFs and the BiLSTM-CRF tagger.'
    - id: computer-vision
      index: computer-vision
      icon: eye
      title: Computer vision
      description: Image filtering, edges, morphology and feature detectors, image classification,
        detection and segmentation, vision transformers, and camera geometry, stereo and structure
        from motion.
      children:
        - id: image-processing
          index: image-processing
          title: Image processing
          description: Image filtering, morphological operations, edge detection, the Hough transform, seam
            carving, image pyramids and scale space, and feature detectors and descriptors.
        - id: recognition
          index: visual-recognition
          title: Visual recognition
          description: Image classification, object detection, semantic, instance and panoptic segmentation,
            and the vision transformer.
        - id: geometry
          index: camera-geometry
          title: Camera geometry
          description: Camera models, homographies, stereo and structure from motion.
    - id: multimodal-learning
      icon: sparkles
      title: Multimodal learning
      description: Vision-language models, cross-modal retrieval, multimodal alignment and fusion.
      children:
        - id: vision-language-models
          title: Vision-language models
          description: 'Models that read images and text together: CLIP-style dual encoders, image captioning,
            visual question answering, and language models with visual inputs.'
        - id: cross-modal-retrieval
          title: Cross-modal retrieval
          description: Retrieving images, audio or video from text queries and the reverse, with joint
            embedding spaces trained contrastively.
    - id: games
      index: ray-casting
      icon: gamepad
      title: Games
      description: Rendering game worlds by ray casting, and networks that learn what a camera in the
        world sees.
- id: part-8-practice
  index: machine-learning-in-practice
  num: 8
  roman: Part VIII
  title: Machine learning in practice
  icon: shield
  description: Label noise, interpretability, fairness, robustness and privacy; parallel and
    mixed-precision training, quantisation and serving; monitoring; and case studies comparing
    published models.
  children:
    - id: trustworthy-machine-learning
      index: trustworthy-machine-learning
      icon: shield
      title: Trustworthy machine learning
      description: Learning with noisy labels, explaining predictions, fairness criteria and mitigation,
        adversarial and distribution-shift robustness, and differential privacy and federated
        learning.
      children:
        - id: label-noise
          index: label-noise
          title: Label noise
          description: Noise models, estimating noise rates, noise-robust learning and statistical tests for
            class-conditional noise.
        - id: interpretability
          index: true
          title: Interpretability
          description: Intrinsically interpretable models, feature attributions, concept-based and
            counterfactual explanations, and how explanations are evaluated.
        - id: fairness
          index: fairness
          title: Fairness
          description: Group and individual fairness criteria, their incompatibilities and bias mitigation.
        - id: robustness
          index: robustness
          title: Robustness
          description: Adversarial examples, certified robustness and robustness to distribution shift.
        - id: privacy
          index: privacy-in-machine-learning
          title: Privacy in machine learning
          description: Differential privacy, membership inference attacks, DP-SGD and federated learning.
    - id: engineering
      index: machine-learning-engineering
      icon: cpu
      title: Machine learning engineering
      description: Memory, mixed precision and parallelism in training, quantisation, pruning,
        distillation and FlashAttention at inference, and monitoring and staged deployment.
      children:
        - id: training-at-scale
          index: training-at-scale
          title: Training at scale
          description: The memory footprint of training, mixed precision, data and model parallelism, ZeRO
            sharding of optimiser state, and mixture-of-experts layers.
        - id: inference
          index: efficient-inference
          title: Efficient inference
          description: Quantisation, pruning and sparsity, knowledge distillation, FlashAttention, and batching
            for serving throughput.
        - id: deployment
          index: deployment-and-monitoring
          title: Deployment and monitoring
          description: Model monitoring, drift detection, and shadow deployments and canary releases.
    - id: case-studies
      index: case-studies
      icon: book-open
      title: Case studies
      description: BERT, GPT, Llama and DeepSeek compared, ResNet against the vision transformer, image
        generators on ImageNet, and benchmark studies of tabular learning and forecasting.
      children:
        - id: language-models
          index: language-model-case-studies
          title: Language model case studies
          description: Transformer language models compared on size, architecture, data and training.
        - id: vision-models
          title: Vision and image generation
          description: Image classifiers and image generators compared on the same benchmarks.
        - id: benchmark-studies
          title: Benchmark studies
          description: Gradient boosting against deep learning on tabular data, and the M4 and M5 forecasting
            competitions.

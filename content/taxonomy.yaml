# Category tree. A note's category is its folder path under content/notes/, a slash path through these ids, e.g.
# probability-distributions/discrete. `icon` (top level only) is one of categoryIcons in site/src/lib/content-schema.ts.
#
# Organising principle: top-level topics are subjects, ordered from mathematical prerequisites to applications.
# Subtopics split a subject into its natural chapters. Categories organise browsing only; cross-cutting links belong
# in note relations (requires, partOf, related) and tags. Categories may be empty: the tree is the plan of the
# encyclopedia, and notes fill it in over time.

- id: maths
  icon: sigma
  title: Mathematics
  description: The mathematical toolkit every model uses.
  children:
    - id: linear-algebra
      title: Linear algebra
    - id: calculus
      title: Calculus
      children:
        - id: univariate
          title: Functions of one variable
        - id: multivariate
          title: Functions of several variables
        - id: integration
          title: Integration
        - id: matrix-calculus
          title: Matrix calculus
        - id: automatic-differentiation
          title: Automatic differentiation
    - id: calculus-of-variations
      title: Calculus of variations
      description: Optimising over functions, and the variational methods of Bayesian inference built on it.
    - id: optimisation
      title: Optimisation
      children:
        - id: convex-analysis
          title: Convex analysis
          description: Convex sets and functions, duality and optimality conditions.
        - id: first-order-methods
          title: First-order methods
          description: Gradient descent, momentum, adaptive methods and proximal methods.
        - id: second-order-methods
          title: Second-order methods
          description: Newton's method, quasi-Newton methods and trust regions.
        - id: constrained-optimisation
          title: Constrained optimisation
          description: Lagrange multipliers, KKT conditions, linear and quadratic programming.
        - id: stochastic-optimisation
          title: Stochastic optimisation
          description: Stochastic gradients, variance reduction and learning-rate schedules.
        - id: derivative-free-optimisation
          title: Derivative-free optimisation
          description: Bayesian optimisation, evolutionary methods and grid and random search.
    - id: splines-and-interpolation
      title: Splines and interpolation
      description: >-
        Polynomial interpolation and its limits, piecewise polynomials, cubic splines, B-splines, Bézier curves and
        NURBS, Hermite and shape-preserving interpolation, and how splines become regression and smoothing tools.
    - id: numerical-methods
      title: Numerical methods
      description: Floating point, conditioning, root finding, quadrature and numerical linear algebra.

- id: probability
  icon: dices
  title: Probability
  description: Uncertainty, random variables and how to simulate them.
  children:
    - id: theory
      title: Probability theory
      description: Events, conditioning, random variables, expectation and inequalities.
    - id: information-theory
      title: Information theory
      description: Entropy, divergence and mutual information, and what they measure.
    - id: sampling
      title: Sampling and simulation
      description: Turning uniform random numbers into draws from a distribution.
    - id: stochastic-processes
      title: Stochastic processes
      description: Markov chains, random walks, Poisson processes, Gaussian processes and martingales.
    - id: limit-theorems
      title: Limit theorems
      description: Laws of large numbers, the central limit theorem and concentration inequalities.
    - id: examples
      title: Worked examples
      description: Classic problems that illustrate several ideas at once, each solved and simulated.

- id: probability-distributions
  icon: bell
  title: Probability distributions
  description: Named families of distributions, their properties and how they relate.
  children:
    - id: discrete
      title: Discrete
    - id: continuous
      title: Continuous
    - id: multivariate
      title: Multivariate

- id: statistics
  icon: chart-spline
  title: Statistics
  description: Learning about populations from samples, and deciding under uncertainty.
  children:
    - id: estimation
      title: Estimation
      description: Estimators, their properties and their uncertainty.
    - id: hypothesis-testing
      title: Hypothesis testing
      description: The concepts behind every test.
    - id: tests
      title: Statistical tests
      description: A catalogue of specific tests, each with assumptions and a decision rule.
    - id: bayesian-statistics
      title: Bayesian statistics
      description: Priors, conjugacy, posterior summaries, credible intervals and model comparison.
    - id: resampling
      title: Resampling
      description: The bootstrap, the jackknife and permutation tests.
    - id: regression-analysis
      title: Regression analysis
      description: Inference for regression coefficients, residual diagnostics, leverage and influence.
    - id: survival-analysis
      title: Survival analysis
      description: >-
        Time-to-event data and censoring: survival and hazard functions, Kaplan-Meier and Nelson-Aalen estimators, the
        log-rank test, Cox proportional hazards, parametric and accelerated failure time models, competing risks, and
        machine-learning extensions such as random survival forests, deep survival models and the concordance index.
    - id: experimental-design
      title: Experimental design
      description: Randomisation, blocking, factorial designs and causal inference from experiments.

- id: probabilistic-inference
  icon: git-fork
  title: Probabilistic inference
  description: Computing posteriors and marginals in probabilistic models, exactly or approximately.
  children:
    - id: graphical-models
      title: Graphical models
      description: Bayesian networks, Markov random fields, factor graphs and conditional independence.
    - id: exact-inference
      title: Exact inference
      description: Variable elimination, belief propagation and the junction tree algorithm.
    - id: monte-carlo
      title: Monte Carlo methods
      description: Importance sampling, Markov chain Monte Carlo, Hamiltonian Monte Carlo and sequential Monte Carlo.
    - id: variational-inference
      title: Variational inference
      description: Approximating posteriors by optimisation, from mean field to stochastic and amortised inference.
    - id: approximate-inference
      title: Other approximations
      description: Laplace approximations, expectation propagation and loopy belief propagation.
    - id: probabilistic-programming
      title: Probabilistic programming
      description: Languages and systems that automate inference.

- id: signal-processing
  icon: audio-waveform
  title: Signal processing
  description: Discrete-time signals and systems, spectra, filters and time-frequency analysis, and audio.
  children:
    - id: signals-and-systems
      title: Signals and systems
      description: Sampling, quantisation, linear time-invariant systems, convolution and the z-transform.
    - id: fourier-analysis
      title: Fourier analysis
      description: Fourier series and transforms, the DFT and FFT, windowing and leakage.
    - id: spectral-estimation
      title: Spectral estimation
      description: Periodograms, Welch and multitaper estimates, parametric spectra and correlation.
    - id: filters
      title: Filters
      description: FIR and IIR filters, their design, frequency response and phase.
    - id: multirate
      title: Multirate processing and filter banks
      description: Decimation, interpolation, polyphase structures and perfect-reconstruction filter banks.
    - id: time-frequency
      title: Time-frequency analysis
      description: The short-time Fourier transform, uncertainty, and quadratic and adaptive representations.
    - id: wavelets
      title: Wavelets
      description: Continuous and discrete wavelet transforms, multiresolution analysis and denoising.
    - id: adaptive-and-statistical
      title: Adaptive and statistical signal processing
      description: Wiener filtering, linear prediction, adaptive filters and matched filters.
    - id: audio
      title: Audio
      description: Perception, auditory scales and filter banks, spectral and cepstral features, pitch and rhythm.

- id: control-theory
  icon: sliders
  title: Control theory
  description: Modelling dynamical systems and designing feedback that makes them behave.
  children:
    - id: system-modelling
      title: System modelling
      description: State-space models, transfer functions, block diagrams and linearisation.
    - id: stability
      title: Stability
      description: Lyapunov stability, Routh-Hurwitz, root locus and the Nyquist criterion.
    - id: classical-control
      title: Classical control
      description: PID control, Bode plots, gain and phase margins, and lead-lag compensation.
    - id: state-space-control
      title: State-space control
      description: Controllability, observability, pole placement and state observers.
    - id: optimal-control
      title: Optimal control
      description: LQR, LQG, dynamic programming, the Hamilton-Jacobi-Bellman equation and Pontryagin's principle.
    - id: model-predictive-control
      title: Model predictive control
      description: Receding-horizon optimisation with constraints.
    - id: system-identification
      title: System identification
      description: Estimating dynamical models from data, from ARX models to subspace methods.
    - id: robust-and-nonlinear-control
      title: Robust and nonlinear control
      description: H-infinity control, feedback linearisation, sliding-mode and adaptive control.

- id: learning-foundations
  icon: graduation-cap
  title: Foundations of learning
  description: What learning from data means, how well it can work, and how models are selected.
  children:
    - id: learning-theory
      title: Learning theory
      description: Risk, generalisation bounds, VC dimension, PAC learning and the bias-variance trade-off.
    - id: regularisation
      title: Regularisation
      description: Penalties, priors, early stopping and other ways to control model complexity.
    - id: model-selection
      title: Model selection
      description: Cross-validation, information criteria and hyperparameter search.
    - id: data-preparation
      title: Data preparation
      description: Scaling, encoding, imputation, feature engineering and feature selection.

- id: losses
  icon: trending-down
  title: Loss functions
  description: The objectives models are trained to minimise, by task.
  children:
    - id: regression-losses
      title: Regression losses
      description: Squared, absolute, Huber, quantile and other losses for real-valued targets.
    - id: classification-losses
      title: Classification losses
      description: Cross-entropy, hinge, exponential and focal losses, and surrogate losses in general.
    - id: ranking-losses
      title: Ranking losses
      description: Pointwise, pairwise and listwise losses for ordering items.
    - id: representation-losses
      title: Contrastive and metric-learning losses
      description: Contrastive, triplet and InfoNCE losses for learning embeddings.

- id: metrics
  icon: ruler
  title: Evaluation metrics
  description: How models are measured, by task, and what each metric rewards.
  children:
    - id: metric-foundations
      title: Foundations
      description: Averaging over classes, streaming computation, confidence intervals, and choosing a metric.
    - id: classification-metrics
      title: Classification metrics
      description: Confusion matrices, accuracy, precision, recall, F-scores, specificity, MCC and Cohen's kappa.
    - id: classification-curves
      title: ROC and precision-recall curves
      description: Threshold-free evaluation, AUROC, average precision, and operating points at fixed recall.
    - id: probabilistic-metrics
      title: Probabilistic metrics
      description: Log loss, Brier score and calibration errors as evaluation metrics.
    - id: fairness-metrics
      title: Fairness metrics
      description: Group fairness criteria such as demographic parity, equalised odds and equal opportunity.
    - id: regression-metrics
      title: Regression metrics
      description: MSE, MAE, R², explained variance, log-cosh, Tweedie deviance and their failure modes.
    - id: correlation-and-agreement
      title: Correlation and agreement
      description: Pearson, Spearman and Kendall correlation, concordance, Cramér's V, Theil's U and Fleiss' kappa.
    - id: distances-and-similarities
      title: Distances and similarities
      description: Pairwise distances, cosine similarity and Procrustes alignment.
    - id: forecasting-metrics
      title: Forecasting metrics
      description: MAPE, sMAPE, WMAPE, MASE, CRPS and interval coverage.
    - id: ranking-metrics
      title: Ranking and retrieval metrics
      description: Precision and recall at k, MAP, MRR, NDCG, hit rate and R-precision.
    - id: clustering-metrics
      title: Clustering metrics
      description: Rand and adjusted Rand indices, mutual-information scores, V-measure, silhouette and internal indices.
    - id: detection-and-segmentation-metrics
      title: Detection and segmentation metrics
      description: IoU and its variants, mean average precision, Dice, Hausdorff distance and panoptic quality.
    - id: image-quality-metrics
      title: Image quality metrics
      description: PSNR, SSIM, VIF, LPIPS and other full-reference and no-reference measures.
    - id: generative-metrics
      title: Generative model metrics
      description: Inception score, FID, KID, precision and recall for generative models, and CLIP score.
    - id: text-metrics
      title: Text metrics
      description: BLEU, chrF, ROUGE, TER, word and character error rates, BERTScore and perplexity.
    - id: audio-metrics
      title: Audio and speech metrics
      description: SNR, SI-SDR, permutation-invariant training, PESQ, STOI and learned quality predictors.

- id: supervised-learning
  icon: target
  title: Supervised learning
  description: Learning a mapping from inputs to labelled outputs.
  children:
    - id: regression
      title: Regression
      children:
        - id: linear
          title: Linear models
          description: Least squares and its regularised variants, fitted exactly or by stochastic gradient descent.
        - id: nonlinear-regression
          title: Nonlinear regression
          description: Basis expansions, splines, isotonic regression and local regression.
    - id: classification
      title: Classification
      description: Linear classifiers and the general setting of predicting a discrete label.
      children:
        - id: imbalanced-classes
          title: Imbalanced classes
          description: >-
            Learning when one class is rare: resampling, class weights, threshold moving, prior shift and calibration.
    - id: generalised-linear-models
      title: Generalised linear models
      description: >-
        Exponential-family responses with link functions, spanning regression and classification: linear, logistic,
        Poisson and gamma regression.
    - id: generalised-additive-models
      title: Generalised additive models
      description: >-
        Sums of smooth functions of each input through a link function, for any exponential-family response; splines,
        backfitting and penalised smoothing.
    - id: generative-classifiers
      title: Generative classifiers
      description: Naive Bayes, tree-augmented and averaged one-dependence Bayes, and linear and quadratic discriminant analysis.
    - id: nearest-neighbours
      title: Nearest neighbours
      description: k-nearest neighbours for classification and regression, and fast neighbour search.
      children:
        - id: approximate-nearest-neighbours
          title: Approximate nearest-neighbour search
          description: >-
            Hashing, quantisation, inverted-file, graph and tree indexes for vector search, the FAISS family, and how
            they are benchmarked.
    - id: kernel-methods
      title: Kernel methods and support vector machines
      description: Support vector machines, kernel ridge regression and the kernels behind them.
    - id: gaussian-processes
      title: Gaussian processes
      description: >-
        Gaussian process regression and classification, kernels and hyperparameters, automatic relevance determination
        (ARD) and the relevance vector machine, and sparse approximations (inducing points, FITC, variational sparse
        GPs).
      children:
        - id: hierarchical-gaussian-processes
          title: Hierarchical Gaussian processes
          description: >-
            Shared and per-replicate functions in a hierarchy of Gaussian processes, and their use for scoring whole
            time series as anomalous, with periodic variable-star light curves as the application.
        - id: gp-latent-variable-models
          title: GP latent variable models
          description: >-
            GPLVMs, Bayesian and back-constrained variants, shared and dynamical models, and generative manifolds such
            as the manifold of fonts.
    - id: trees-and-ensembles
      title: Trees and ensembles
      description: Decision trees, bagging, random forests, boosting and stacking.
    - id: structured-prediction
      title: Structured prediction
      description: Predicting sequences and other structured outputs, from HMMs to CRFs and structural SVMs.

- id: semi-supervised-learning
  icon: blend
  title: Semi-supervised learning
  description: Learning from a few labelled examples and many unlabelled ones, by self-training and graph propagation.

- id: weak-supervision
  icon: tags
  title: Weak supervision
  description: >-
    Learning from coarse, aggregate or unreliable labels: multiple-instance learning, learning from label proportions,
    positive-unlabelled and partial labels, crowdsourced labels and programmatic labelling.
  children:
    - id: multiple-instance-learning
      title: Multiple-instance learning
      description: >-
        Labels on bags of instances rather than on instances: the standard and collective assumptions, max-margin and
        attention-based pooling, and MIL for interpretable time series classification.
    - id: learning-from-label-proportions
      title: Learning from label proportions
      description: >-
        Only the class proportions of each bag are known: identifiability, the mean map, inverse calibration,
        proportion losses and graph-based label propagation.
    - id: positive-unlabelled-and-partial-labels
      title: Positive-unlabelled and partial labels
      description: >-
        Incomplete or ambiguous instance labels: positive and unlabelled data, unbiased and non-negative risk
        estimators, candidate label sets and complementary labels.
    - id: crowdsourcing
      title: Crowdsourced labels
      description: >-
        Several noisy annotators per item: the Dawid–Skene model, EM for annotator confusion matrices, and learning a
        classifier jointly with annotator reliabilities.
    - id: programmatic-weak-supervision
      title: Programmatic weak supervision
      description: >-
        Labelling functions and label models: data programming, Snorkel, estimating source accuracies without labels,
        production systems and benchmarks.

- id: unsupervised-learning
  icon: shapes
  title: Unsupervised learning
  description: Finding structure in unlabelled data.
  children:
    - id: clustering
      title: Clustering
    - id: dimensionality-reduction
      title: Dimensionality reduction
      description: PCA, probabilistic PCA, factor analysis, ICA, NMF, CCA, kernel PCA and random projections.
    - id: manifold-learning
      title: Manifold learning
      description: >-
        MDS, Isomap, LLE, Laplacian eigenmaps, diffusion maps, LTSA and Hessian eigenmaps, self-organising maps, t-SNE,
        UMAP, PaCMAP, TriMap and LargeVis, parametric embeddings, and how embeddings are evaluated.
    - id: topic-models
      title: Topic models
      description: >-
        Latent Dirichlet allocation and its inference by collapsed Gibbs sampling and variational Bayes, probabilistic
        latent semantic analysis, correlated and dynamic topic models, and NMF as a topic model.
    - id: density-estimation
      title: Density estimation
      description: Histograms, kernel density estimation and mixture models.
    - id: covariance-estimation
      title: Covariance estimation
      description: Shrinkage, sparse inverse covariance and robust covariance estimates.

- id: online-learning
  icon: repeat
  title: Online learning
  description: Learning from a stream, one example at a time, with guarantees that hold against any sequence.
  children:
    - id: online-convex-optimisation
      title: Online convex optimisation
      description: Regret, online gradient descent, follow-the-regularised-leader and online mirror descent.
    - id: prediction-with-expert-advice
      title: Prediction with expert advice
      description: Weighted majority, Hedge and exponential weights, and lower bounds on regret.
    - id: streaming-and-incremental-learning
      title: Streaming and incremental learning
      description: Sequential estimation, online Bayesian updating, incremental models and learning under concept drift.
    - id: online-active-learning
      title: Online active learning
      description: Selective sampling and label-efficient learning from a stream.
    - id: continual-learning
      title: Continual learning
      description: Catastrophic forgetting, regularisation and replay methods, and evaluation of lifelong learners.

- id: transfer-learning
  icon: arrow-right-left
  title: Transfer learning
  description: Reusing what was learnt in one domain or task to learn faster or better in another.
  children:
    - id: foundations
      title: Foundations
      description: Domains and tasks, the taxonomy of transfer settings, negative transfer and when transfer helps.
    - id: domain-adaptation
      title: Domain adaptation
      description: >-
        Generalisation bounds across domains, importance weighting, feature alignment and adversarial adaptation.
    - id: multi-task-and-meta-learning
      title: Multi-task and meta-learning
      description: Shared representations and priors across tasks, learning to learn, and few-shot learning.
    - id: active-transfer-learning
      title: Active and Bayesian transfer learning
      description: Choosing which target examples to label when a source model already exists, and Bayesian priors from source domains.
    - id: online-transfer-learning
      title: Online transfer learning
      description: Transfer when target data arrive as a stream, and test-time adaptation.

- id: deep-learning
  icon: brain
  title: Deep learning
  description: Neural networks, how they are trained, and the architectures built from them.
  children:
    - id: foundations
      title: Foundations
      description: Perceptrons, multilayer networks, activations and universal approximation.
    - id: training
      title: Training
      description: Initialisation, normalisation, optimisers, learning-rate schedules and regularisation.
    - id: convolutional-networks
      title: Convolutional networks
      description: Convolution layers, pooling, residual networks and their descendants.
    - id: recurrent-networks
      title: Recurrent networks
      description: RNNs, LSTMs, GRUs and sequence-to-sequence models.
    - id: transformer
      title: Transformers
      description: The original transformer, the design choices that have replaced its parts, and the model families built from it.
      children:
        - id: vanilla-transformer
          title: The original transformer
          description: Scaled dot-product and multi-head attention, masking, sinusoidal positions and the 2017 encoder-decoder.
        - id: positional-encodings
          title: Positional encodings
          description: Absolute, relative, rotary and bias-based position schemes, and extending them to longer contexts.
        - id: attention-variants
          title: Attention variants
          description: Multi-query, grouped-query and latent attention, QK normalisation, soft-capping and attention sinks.
        - id: block-design
          title: Block design
          description: Pre- and post-norm, RMSNorm, gated feed-forward layers, parallel blocks, embeddings and initialisation.
        - id: architecture-families
          title: Architecture families
          description: Encoder-only, decoder-only, encoder-decoder and prefix models, and how modern decoder LLMs differ.
        - id: training-and-analysis
          title: Training and analysis
          description: Stability at scale, hyperparameter transfer, and mechanistic analysis of attention heads.
    - id: efficient-sequence-models
      title: Efficient and state-space sequence models
      description: Efficient attention, linear attention, long-context methods and structured state-space models (S4, Mamba).
    - id: graph-neural-networks
      title: Graph neural networks
      description: Message passing, graph convolution and graph attention.
    - id: generative-models
      title: Deep generative models
      description: Autoencoders, VAEs, GANs, normalising flows, autoregressive and diffusion models.
      children:
        - id: autoencoders
          title: Autoencoders and VAEs
          description: Autoencoders and their regularised variants, variational autoencoders, VQ-VAE.
        - id: diffusion-models
          title: Diffusion models
          description: Denoising diffusion, score matching, fast samplers and guidance.
        - id: other-generative-models
          title: GANs, flows and autoregressive models
          description: GANs, normalising flows, autoregressive models, and an overview comparing all families.
    - id: representation-learning
      title: Representation and self-supervised learning
      description: Embeddings, contrastive and masked pretraining, and transfer learning.

- id: reinforcement-learning
  icon: gamepad
  title: Reinforcement learning
  description: Learning to act from reward.
  children:
    - id: markov-decision-processes
      title: Markov decision processes
      description: MDPs, Bellman equations, value and policy iteration.
    - id: value-based-methods
      title: Value-based methods
      description: Temporal-difference learning, Q-learning and deep Q-networks.
    - id: policy-methods
      title: Policy methods
      description: Policy gradients, actor-critic methods and trust-region methods.
    - id: model-based-and-offline
      title: Model-based and offline RL
      description: Planning with learned models, and learning from fixed datasets.

- id: time-series
  icon: activity
  title: Time series
  description: Modelling, forecasting and classifying data ordered in time.
  children:
    - id: foundations
      title: Foundations
      description: Stationarity, autocorrelation, differencing and decomposition into trend and seasonality.
    - id: arima-models
      title: ARMA and ARIMA models
      description: Autoregressive and moving-average models, ARIMA, seasonal ARIMA and exogenous regressors.
    - id: exponential-smoothing
      title: Exponential smoothing
      description: Simple, Holt and Holt-Winters smoothing and the ETS framework.
    - id: state-space-models
      title: State-space models
      description: The Kalman filter and smoother, extended and unscented filters, and particle filters.
    - id: volatility-models
      title: Volatility models
      description: ARCH, GARCH and stochastic volatility.
    - id: multivariate-time-series
      title: Multivariate time series
      description: Vector autoregression, Granger causality and cointegration.
    - id: forecasting
      title: Forecasting practice
      description: Backtesting, prediction intervals, hierarchical and probabilistic forecasting.
    - id: change-points
      title: Change-point detection
      description: CUSUM, Bayesian online change-point detection and segmentation.
    - id: similarity-search
      title: Similarity search, motifs and discords
      description: Distance profiles, the matrix profile, repeated patterns (motifs), anomalies (discords) and segmentation.
    - id: time-series-classification
      title: Time-series classification
      description: Dynamic time warping, shapelets, feature-based and convolutional classifiers.
    - id: neural-forecasting
      title: Neural forecasting
      description: >-
        Probabilistic autoregressive RNNs (DeepAR and its relatives: DeepState, deep factor models, MQ-RNN), temporal
        convolutional networks, N-BEATS and N-HiTS, the Temporal Fusion Transformer and other transformer forecasters,
        and pretrained forecasting foundation models.

- id: anomaly-detection
  icon: radar
  title: Anomaly detection
  description: Finding observations that do not fit the pattern of the rest.
  children:
    - id: statistical-methods
      title: Statistical methods
      description: Z-scores, robust statistics, Grubbs' test and extreme value theory.
    - id: density-and-distance-methods
      title: Density and distance methods
      description: Local outlier factor, k-nearest-neighbour distances and kernel density scores.
    - id: isolation-and-ensembles
      title: Isolation and ensemble methods
      description: Isolation forests and ensembles of detectors.
    - id: one-class-methods
      title: One-class methods
      description: One-class SVMs and support vector data description.
    - id: reconstruction-methods
      title: Reconstruction methods
      description: PCA residuals and autoencoder reconstruction error.
    - id: time-series-anomalies
      title: Anomalies in time series
      description: Point, contextual and collective anomalies, and change-point detection.
    - id: evaluation
      title: Evaluating detectors
      description: Precision at low false-alarm rates, contamination and labelling problems.

- id: recommendation-and-retrieval
  icon: library
  title: Recommendation and retrieval
  description: Finding and ranking the items, documents and answers that match a user or a query.
  children:
    - id: foundations
      title: Foundations
      description: >-
        The recommendation problem, explicit and implicit feedback, the Netflix Prize, multi-stage pipelines and the
        state of empirical progress.
    - id: collaborative-filtering
      title: Collaborative filtering
      description: Neighbourhood methods, matrix factorisation, alternating least squares, implicit feedback and BPR.
    - id: feature-interaction-models
      title: Feature-interaction models
      description: Factorisation machines, field-aware and field-weighted FMs, Wide & Deep, DeepFM, cross networks and DLRM.
    - id: deep-recommenders
      title: Deep recommender systems
      description: Neural collaborative filtering and two-tower retrieval models.
    - id: sequential-recommendation
      title: Sequential and session-based recommendation
      description: Recurrent and self-attentive next-item models such as GRU4Rec, SASRec and BERT4Rec.
    - id: graph-recommenders
      title: Graph-based recommendation
      description: The user-item bipartite graph, message passing for collaborative filtering, LightGCN and PinSage.
    - id: cold-start-and-context
      title: Cold start, content and context
      description: >-
        The cold-start problem, content-based and hybrid embeddings, multi-behaviour signals and context-aware models.
    - id: generative-recommendation
      title: Generative recommendation
      description: Large language models as recommenders and single-stage generation of item identifiers.
    - id: learning-to-rank
      title: Learning to rank from clicks
      description: Click models, the examination hypothesis, unbiased learning to rank and field interactions in neural ranking.
    - id: debiasing
      title: Bias and debiasing
      description: >-
        Biases in logged feedback, feedback loops, propensities, popularity bias, slate estimators and the causal
        toolkit for learning from biased data.
    - id: evaluation
      title: Evaluation and beyond-accuracy objectives
      description: >-
        Offline metrics, diversity, novelty and fairness, diversified re-ranking, unbiased offline evaluation and LLM
        judges.
    - id: experimentation
      title: Online learning and experimentation for recommenders
      description: Reinforcement learning for recommendation and the biases that feedback loops introduce into experiments.
    - id: retrieval-models
      title: Retrieval models
      description: Boolean and vector-space models, TF-IDF, inverted indices and query processing.
    - id: probabilistic-retrieval
      title: Probabilistic retrieval
      description: The probability ranking principle, binary independence, BM25 and query-likelihood language models.
    - id: dense-retrieval
      title: Dense and neural retrieval
      description: Dual encoders, cross-encoder re-ranking, late interaction, hybrid retrieval and retrieval-augmented generation.
    - id: pinsage-family
      title: The PinSage family
      description: Pinterest's graph and sequence representation models, from PinSage to foundation models.

- id: natural-language-processing
  icon: languages
  title: Natural language processing

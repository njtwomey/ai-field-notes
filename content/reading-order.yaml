# Reading order of the notes: the previous / next arrows on a note follow it, and so does every list of notes.
# Categories are read in taxonomy.yaml order, so this file sets only the order inside each category: one list per
# category that holds notes, keyed by its taxonomy path. A category's index note is listed in the category it
# introduces, usually first. A note missing from this file is read at the end of its category, and make doctor warns
# about it.


2pl:
  short: 2PL
  long: Two-Parameter Logistic Model
  kind: acronym
  aliases:
    - 3pl
    - 4pl
    - two-parameter-logistic-model
  category: part-4-principles-of-learning/probabilistic-inference/skill-rating
  note: item-response-theory
  definition: The item response model $\sigma(a_i(\theta_p - b_i))$ with a
    discrimination $a_i$ and difficulty $b_i$ per item. The 3PL and 4PL models
    add a guessing floor and a ceiling.
aa-test:
  short: A/A test
  long: A/A Test
  kind: acronym
  aliases:
    - a-a-test
  category: part-7-application-domains/online-experimentation/examples
  note: a-a-test
  definition: An experiment in which both groups receive the same experience, run
    to check that the experimentation system produces the expected
    false-positive rate.
ab-test:
  short: A/B test
  long: A/B Test
  kind: acronym
  aliases:
    - online-controlled-experiment
    - split-test
    - a-b-test
  category: part-7-application-domains/online-experimentation/examples
  note: a-b-test
  definition: A randomised controlled experiment that assigns users at random to a
    control and one or more variants and compares a metric between them.
accuracy:
  long: Accuracy
  kind: concept
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  note: accuracy-and-balanced-accuracy
  definition: The fraction of predictions that are correct. Under class imbalance
    it is dominated by the majority class, which balanced accuracy corrects by
    averaging the per-class recalls.
acf:
  short: ACF
  long: Autocorrelation Function
  kind: acronym
  aliases:
    - autocorrelation-function
  category: part-7-application-domains/time-series/foundations
  note: autocorrelation-and-partial-autocorrelation
  definition: The correlation $\rho(h)$ between a stationary series and itself
    shifted by lag $h$.
activation-function:
  long: Activation Function
  kind: concept
  aliases:
    - nonlinearity
  category: part-6-neural-architectures/feedforward-networks/foundations
  note: activation-functions
  definition: The fixed nonlinearity $\phi$ applied to each pre-activation of a
    neural network. Its derivative scales every gradient passing back through
    it, so learning stalls where $\phi'$ is near zero (saturation).
active-learning:
  long: Active Learning
  kind: concept
  category: part-5-learning-paradigms/online-learning/online-active-learning
  see:
    - stream-based-active-learning
    - bayesian-active-learning
  definition: Learning in which the learner chooses which unlabelled examples to
    have labelled, aiming for accuracy with fewer labels.
actor-critic:
  long: Actor–Critic
  kind: concept
  category: part-5-learning-paradigms/reinforcement-learning/policy-methods
  note: actor-critic
  definition: "A policy-gradient method with two learned parts: the actor, a
    policy, and the critic, a value function whose estimates replace returns to
    reduce the gradient's variance."
adaboost:
  short: AdaBoost
  long: Adaptive Boosting
  kind: proper-name
  aliases:
    - adaptive-boosting
  category: part-5-learning-paradigms/supervised-learning/trees-and-ensembles
  note: adaboost
  definition: A boosting algorithm for classification that reweights training
    examples after each round toward those misclassified, and combines the weak
    classifiers by a weighted vote. It minimises exponential loss stage by
    stage.
adagrad:
  short: AdaGrad
  long: Adaptive Gradient
  kind: acronym
  aliases:
    - adaptive-gradient
  category: part-6-neural-architectures/feedforward-networks/training
  note: adagrad-and-rmsprop
  definition: An optimiser that divides each gradient coordinate by the root of
    the sum of all its past squared values. Rarely updated coordinates keep
    large steps; every step size shrinks over time.
adam:
  long: Adam
  kind: concept
  aliases:
    - adaptive-moment-estimation
  category: part-6-neural-architectures/feedforward-networks/training
  note: adam
  definition: An optimiser that keeps bias-corrected moving averages of the
    gradient and of its elementwise square, and steps each coordinate by the
    first divided by the root of the second. Each coordinate moves by about the
    learning rate whatever its gradient scale.
adamw:
  short: AdamW
  long: Adam with Decoupled Weight Decay
  kind: acronym
  aliases:
    - adam-with-decoupled-weight-decay
  category: part-6-neural-architectures/feedforward-networks/training
  note: decoupled-weight-decay
  definition: Adam with weight decay applied directly to the weights, $\thetavec
    \leftarrow \thetavec - \eta\lambda\thetavec$, instead of as an L2 penalty
    whose gradient Adam would rescale.
adjacent-category-model:
  long: Adjacent-Category Model
  kind: concept
  aliases:
    - adjacent-category-logit
    - adjacent-categories-model
  category: part-5-learning-paradigms/supervised-learning/ordinal-regression
  see:
    - continuation-ratio-and-adjacent-category-models
  definition: "An ordinal model that compares each pair of neighbouring classes
    with a logit, $\\log P(y = k + 1)/P(y = k) = \\wvec^\\top\\xvec -
    \\theta_k$: a multinomial logit whose class weight vectors are equally
    spaced along one direction."
admm:
  short: ADMM
  long: Alternating Direction Method of Multipliers
  kind: acronym
  aliases:
    - alternating-direction-method-of-multipliers
  category: part-1-mathematical-foundations/optimisation/constrained-optimisation
  note: penalty-and-barrier-methods
  definition: A method for convex problems of the form $\min f(\xvec) + g(\zvec)$
    subject to a linear coupling constraint. It alternates minimisation of the
    augmented Lagrangian over $\xvec$ and over $\zvec$, then takes a dual ascent
    step on the multipliers.
adversarial-example:
  long: Adversarial Example
  kind: concept
  category: part-8-practice/trustworthy-machine-learning/robustness
  note: adversarial-examples
  definition: An input changed by a small, often imperceptible, perturbation
    chosen to make a model predict wrongly.
aic:
  short: AIC
  long: Akaike Information Criterion
  kind: acronym
  aliases:
    - akaike-information-criterion
  category: part-4-principles-of-learning/model-selection
  note: information-criteria
  definition: The model-selection score $\AIC = -2\ell + 2k$ for a model with
    maximised log-likelihood $\ell$ and $k$ parameters. It estimates expected
    out-of-sample KL loss; lower is better.
aicc:
  short: AICc
  long: Corrected Akaike Information Criterion
  kind: acronym
  aliases:
    - corrected-akaike-information-criterion
  category: part-4-principles-of-learning/model-selection
  note: information-criteria
  definition: The Akaike information criterion with a small-sample correction,
    $\AIC + 2k(k + 1)/(n - k - 1)$ for $n$ observations and $k$ parameters.
aleatoric-uncertainty:
  long: Aleatoric Uncertainty
  kind: concept
  category: part-4-principles-of-learning/decision-theory-and-calibration/uncertainty-quantification
  note: aleatoric-and-epistemic-uncertainty
  definition: Uncertainty from noise inherent in the data, which more data from
    the same source cannot reduce.
aliasing:
  long: Aliasing
  kind: concept
  category: part-2-signals-systems-and-information/signal-processing/signals-and-systems
  note: aliasing
  definition: The folding of frequencies above the Nyquist frequency onto lower
    frequencies when a signal is sampled, which makes them indistinguishable
    after sampling.
alibi:
  short: ALiBi
  long: Attention with Linear Biases
  kind: acronym
  aliases:
    - attention-with-linear-biases
  category: part-6-neural-architectures/transformers/positional-encodings
  note: alibi
  definition: A positional scheme that subtracts a fixed head-specific slope times
    the distance $i - j$ from each attention score. It adds no parameters and
    lets models run on sequences longer than those seen in training.
all-threshold-loss:
  long: All-Threshold Loss
  kind: concept
  aliases:
    - immediate-threshold-loss
  category: part-5-learning-paradigms/supervised-learning/ordinal-regression
  see:
    - threshold-losses-for-ordinal-regression
  definition: An ordinal loss that applies a convex surrogate at every threshold
    on the wrong side of the score. With the hinge it bounds the absolute error;
    the immediate-threshold loss keeps only the two thresholds around the true
    class.
als:
  short: ALS
  long: Alternating Least Squares
  kind: acronym
  aliases:
    - alternating-least-squares
  category: part-7-application-domains/recommendation-and-retrieval/collaborative-filtering
  note: alternating-least-squares
  definition: Fitting a matrix factorisation by fixing the item factors and
    solving one ridge regression per user, then the reverse, until convergence.
amortised-inference:
  long: Amortised Inference
  kind: concept
  category: part-4-principles-of-learning/probabilistic-inference/variational-inference
  note: amortised-inference
  definition: Inference in which a network maps each observation to the parameters
    of its approximate posterior, $q_\phi(z \mid x)$, instead of optimising a
    separate approximation for every observation. The encoder of a variational
    autoencoder is an example.
ann-search:
  short: ANN
  long: Approximate Nearest-Neighbour Search
  kind: acronym
  sense: search
  aliases:
    - approximate-nearest-neighbour-search
  category: part-5-learning-paradigms/supervised-learning/nearest-neighbours/approximate-nearest-neighbours
  note: approximate-nearest-neighbour-search
  definition: Nearest-neighbour search that returns most of the true neighbours
    much faster than exact search, using graphs, partitions, hashing or
    compressed codes.
anomaly-detection:
  long: Anomaly Detection
  kind: concept
  aliases:
    - outlier-detection
    - novelty-detection
  category: part-5-learning-paradigms/anomaly-detection
  note: anomaly-detection
  definition: Finding observations that do not conform to the pattern of the rest
    of the data, usually by scoring each one and flagging those above a
    threshold.
anomaly-score:
  long: Anomaly Score
  kind: concept
  category: part-5-learning-paradigms/anomaly-detection
  note: anomaly-detection
  definition: A number assigned to each observation by an anomaly detector, higher
    for more unusual observations, which a threshold turns into a decision.
anova:
  short: ANOVA
  long: Analysis of Variance
  kind: acronym
  aliases:
    - analysis-of-variance
  category: part-1-mathematical-foundations/statistics/tests
  definition: A test of whether several group means are equal, by comparing the
    variance between groups with the variance within groups through an $F$
    statistic.
ap:
  short: AP
  long: Average Precision
  kind: acronym
  aliases:
    - average-precision
  category: part-4-principles-of-learning/evaluation-metrics/classification-curves
  note: precision-recall-curve-and-average-precision
  definition: The mean of the precision at the rank of each relevant item, a
    step-wise area under the precision–recall curve.
approxndcg:
  short: ApproxNDCG
  long: ApproxNDCG
  kind: proper-name
  category: part-7-application-domains/recommendation-and-retrieval/loss-families
  see:
    - listwise-ranking-losses
    - ranking-surrogates-and-metrics
  definition: A listwise loss that replaces each item's rank in NDCG by a smooth
    approximation, one plus a sum of sigmoids of score differences, and
    maximises the resulting differentiable NDCG.
ar:
  short: AR
  long: Autoregressive Model
  kind: acronym
  aliases:
    - autoregressive-process
    - autoregressive-model
  category: part-7-application-domains/time-series/arima-models
  note: autoregressive-model
  definition: A model that regresses a series on its own past, $x_t = c +
    \phi_1x_{t-1} + \dots + \phi_px_{t-p} + \varepsilon_t$. It is stationary
    when every root of $1 - \phi_1z - \dots - \phi_pz^p$ lies outside the unit
    circle.
arch:
  short: ARCH
  long: Autoregressive Conditional Heteroscedasticity
  kind: acronym
  aliases:
    - autoregressive-conditional-heteroscedasticity
  category: part-7-application-domains/time-series/volatility-models
  note: arch-model
  definition: A model in which the conditional variance of a return is a linear
    function of past squared returns, so large shocks raise the next variance
    and volatility clusters.
ard:
  short: ARD
  long: Automatic Relevance Determination
  kind: acronym
  aliases:
    - automatic-relevance-determination
  category: part-5-learning-paradigms/supervised-learning/gaussian-processes
  note: automatic-relevance-determination
  definition: Giving each input dimension, or weight, its own prior scale and
    fitting the scales by maximising the marginal likelihood. Irrelevant inputs
    get scales that shrink toward zero.
arima:
  short: ARIMA
  long: Autoregressive Integrated Moving Average Model
  kind: acronym
  aliases:
    - autoregressive-integrated-moving-average-model
  category: part-7-application-domains/time-series/arima-models
  note: autoregressive-integrated-moving-average-model
  definition: An autoregressive moving-average model for the $d$-th difference of
    a series. The unit roots give it a stochastic trend, so its forecast
    intervals widen without bound.
arma:
  short: ARMA
  long: Autoregressive Moving Average Model
  kind: acronym
  aliases:
    - autoregressive-moving-average-model
  category: part-7-application-domains/time-series/arima-models
  note: autoregressive-moving-average-model
  definition: A model that combines autoregressive and moving-average terms,
    $\phi(B)x_t = c + \theta(B)\varepsilon_t$ with the backshift operator $B$.
    Few parameters describe long autocorrelation.
associative-memory:
  long: Associative Memory
  kind: concept
  aliases:
    - content-addressable-memory
  category: part-6-neural-architectures/feedforward-networks/energy-based-networks
  see:
    - hopfield-network
    - modern-hopfield-network
  definition: "A memory addressed by content: given part of a stored item, or a
    corrupted copy, it returns the whole item. Hopfield networks store items as
    minima of an energy and retrieve them by descent."
assumed-density-filtering:
  short: ADF
  long: Assumed Density Filtering
  kind: acronym
  sense: approximate inference
  category: part-4-principles-of-learning/probabilistic-inference/approximate-inference/expectation-propagation-examples
  note: assumed-density-filtering
  definition: An approximate inference method that absorbs a posterior's factors
    one at a time, replacing each exact product by the Gaussian (or other
    exponential-family distribution) with the same moments. It never revisits a
    factor, so its result depends on their order.
attention:
  long: Scaled Dot-Product Attention
  kind: concept
  aliases:
    - self-attention
    - dot-product-attention
    - qkv-attention
    - scaled-dot-product-attention
  category: part-6-neural-architectures/transformers/vanilla-transformer
  note: scaled-dot-product-attention
  definition: "The operation
    $\\operatorname{softmax}(\\Qmat\\Kmat^\\top/\\sqrt{d_k})\\Vmat$: each query
    takes a weighted average of the values, with weights from its dot products
    with the keys. In self-attention queries, keys and values all come from the
    same sequence."
augmented-dickey-fuller:
  short: ADF
  long: Augmented Dickey–Fuller Test
  kind: acronym
  sense: unit-root test
  aliases:
    - adf-test
    - augmented-dickey-fuller-test
  category: part-7-application-domains/time-series/arima-models
  definition: A test for a unit root in a time series. It regresses the first
    difference on the lagged level and lagged differences, and rejects
    non-stationarity when the coefficient on the lagged level is significantly
    negative.
auprc:
  short: AUPRC
  long: Area Under the Precision–Recall Curve
  kind: acronym
  aliases:
    - area-under-the-precision-recall-curve
    - pr-auc
    - auc-pr
    - aucpr
    - area-under-the-pr-curve
  category: part-4-principles-of-learning/evaluation-metrics/classification-curves
  note: precision-recall-curve-and-average-precision
  definition: The area under the precision–recall curve. A random classifier
    scores the positive prevalence, so the baseline changes with class balance;
    average precision is its usual step-wise estimate.
auroc:
  short: AUROC
  long: Area Under the Receiver Operating Characteristic Curve
  kind: acronym
  aliases:
    - area-under-the-receiver-operating-characteristic-curve
    - auc
    - roc-auc
    - auc-roc
    - area-under-the-roc-curve
  category: part-4-principles-of-learning/evaluation-metrics/classification-curves
  note: receiver-operating-characteristic-curve-and-area
  definition: The area under the receiver operating characteristic curve, equal to
    the probability that a random positive scores above a random negative. It
    ignores the threshold and the class prevalence.
autodiff:
  short: AD
  long: Automatic Differentiation
  kind: concept
  aliases:
    - automatic-differentiation
    - ad
  category: part-1-mathematical-foundations/mathematics/calculus/automatic-differentiation
  note: history-of-automatic-differentiation
  definition: The exact computation of derivatives of a program by applying the
    chain rule to its elementary operations. Forward mode propagates tangents
    with the inputs; reverse mode, which backpropagation uses, propagates
    adjoints from the output.
autoencoder:
  long: Autoencoder
  kind: concept
  category: part-6-neural-architectures/generative-models/autoencoders
  note: autoencoder
  definition: "A network trained to reconstruct its input through a bottleneck: an
    encoder maps the input to a code and a decoder maps the code back."
autoregressive-generative-model:
  long: Autoregressive Generative Model
  kind: concept
  category: part-6-neural-architectures/generative-models/other-generative-models
  note: autoregressive-generative-models
  definition: A generative model that factorises a joint distribution by the chain
    rule, $p(\xvec) = \prod_i p(x_i \mid x_{<i})$, with each conditional given
    by a network.
b-spline:
  short: B-spline
  long: Basis Spline
  kind: concept
  aliases:
    - basis-spline
  category: part-1-mathematical-foundations/mathematics/splines-and-interpolation
  note: b-splines
  definition: A piecewise polynomial basis function of fixed degree that is
    non-zero over only a few adjacent knot intervals. Every spline of that
    degree and knot sequence is a unique linear combination of B-splines.
backpropagation:
  long: Backpropagation
  kind: concept
  category: part-1-mathematical-foundations/mathematics/calculus/automatic-differentiation
  note: backpropagation
  see:
    - multivariable-chain-rule
  definition: The computation of the gradient of a network's loss with respect to
    every parameter by applying the chain rule layer by layer from the output
    back to the input. It is reverse-mode automatic differentiation, costing a
    small multiple of one forward pass.
bag-of-words:
  long: Bag of Words
  kind: concept
  category: part-7-application-domains/natural-language-processing/text-representation
  note: bag-of-words
  definition: Representing a document by the counts of the words it contains,
    ignoring their order.
bagging:
  long: Bootstrap Aggregating
  kind: concept
  aliases:
    - bootstrap-aggregating
  category: part-5-learning-paradigms/supervised-learning/trees-and-ensembles
  note: bagging
  definition: Training copies of a model on bootstrap samples of the data and
    averaging their predictions, which reduces variance.
batch-normalisation:
  short: BatchNorm
  long: Batch Normalisation
  kind: concept
  aliases:
    - batch-norm
    - batchnorm
  category: part-6-neural-architectures/feedforward-networks/training
  note: batch-normalisation
  definition: A layer that standardises each feature over the mini-batch, then
    applies a learned scale and shift. At inference it uses running averages of
    the batch statistics.
bayes-decision-rule:
  long: Bayes Decision Rule
  kind: concept
  aliases:
    - bayes-classifier
    - bayes-optimal-classifier
  category: part-4-principles-of-learning/decision-theory-and-calibration/decision-theory
  note: bayes-decision-rule
  definition: The rule that takes, for each input, the action with the least
    posterior expected loss. Under 0–1 loss it predicts the most probable class,
    and its error is the Bayes error.
bayes-theorem:
  long: Bayes' Theorem
  kind: concept
  aliases:
    - bayes-rule
  category: part-1-mathematical-foundations/probability/theory
  note: bayes-theorem
  definition: The identity $p(\theta \mid x) = p(x \mid \theta)\,p(\theta)/p(x)$,
    which turns a prior and a likelihood into a posterior. The denominator
    $p(x)$ is the evidence.
bayesian-network:
  long: Bayesian Network
  kind: concept
  aliases:
    - directed-graphical-model
  category: part-4-principles-of-learning/probabilistic-inference/graphical-models
  note: bayesian-network
  definition: A directed acyclic graph whose nodes are random variables, with a
    joint distribution that factorises as $\prod_i p(x_i \mid
    \text{parents}(x_i))$.
bcc:
  short: BCC
  long: Bayesian Classifier Combination
  kind: acronym
  aliases:
    - bayesian-classifier-combination
  category: part-4-principles-of-learning/probabilistic-inference/model-based-machine-learning
  note: community-bayesian-classifier-combination
  definition: A Bayesian model that combines the labels of several classifiers or
    annotators by giving each its own confusion matrix and inferring the true
    labels.
bce:
  short: BCE
  long: Binary Cross-Entropy
  kind: acronym
  aliases:
    - binary-cross-entropy
  category:
    - part-4-principles-of-learning/loss-functions/classification-losses
    - part-7-application-domains/recommendation-and-retrieval/loss-families
  see:
    - pointwise-recommendation-losses
    - cross-entropy-and-perplexity
  definition: "The negative log-likelihood of a binary label $y$ under a predicted
    probability $p$: $-[y \\log p + (1 - y)\\log(1 - p)]$."
bch-code:
  short: BCH
  long: Bose–Chaudhuri–Hocquenghem Code
  kind: acronym
  category:
    - part-5-learning-paradigms/supervised-learning/classification/multiclass
    - part-2-signals-systems-and-information/information-theory
  see:
    - error-correcting-output-codes
  definition: A family of cyclic error-correcting codes over a finite field whose
    minimum distance can be designed in advance; binary BCH codes are one source
    of codewords for error-correcting output codes.
beam-search:
  long: Beam Search
  kind: concept
  category: part-6-neural-architectures/large-language-models/models-and-decoding
  see:
    - decoding-strategies
    - sequence-to-sequence
  definition: Approximate search for the most probable output sequence that keeps
    the $B$ highest-scoring partial sequences at each step and extends each by
    every token.
bellman-equation:
  long: Bellman Equation
  kind: concept
  category: part-5-learning-paradigms/reinforcement-learning/markov-decision-processes
  note: bellman-equations
  definition: "The recursion that a value function satisfies: the value of a state
    is the expected immediate reward plus the discounted value of the next
    state. The optimality form takes a maximum over actions."
bernoulli-distribution:
  long: Bernoulli Distribution
  kind: concept
  category: part-1-mathematical-foundations/probability/named-distributions/discrete
  note: bernoulli-distribution
  definition: The distribution of a single binary trial, $\Bern(p)$, which takes
    the value 1 with probability $p$ and 0 otherwise.
bert:
  short: BERT
  long: Bidirectional Encoder Representations from Transformers
  kind: proper-name
  aliases:
    - bidirectional-encoder-representations-from-transformers
  category: part-6-neural-architectures/transformers/architecture-families
  note: masked-language-modelling
  see:
    - encoder-only-transformers
    - bert-vs-gpt
  definition: A transformer encoder pretrained by masked language modelling on
    unlabelled text and fine-tuned per task (Devlin et al., 2018). Its
    representations of each token use context on both sides.
bert4rec:
  short: BERT4Rec
  long: BERT4Rec
  kind: proper-name
  category: part-7-application-domains/recommendation-and-retrieval/sequential-recommendation
  note: bert4rec
  definition: A sequential recommender that trains a bidirectional transformer to
    predict masked items in a user's sequence, and predicts the next item by
    appending a mask.
bertscore:
  short: BERTScore
  long: BERTScore
  kind: proper-name
  category: part-4-principles-of-learning/evaluation-metrics/text-metrics
  note: bertscore
  definition: A text-generation metric that matches each token of the candidate to
    its most similar token in the reference by cosine similarity of contextual
    embeddings, and averages into precision, recall and F1.
beta-distribution:
  long: Beta Distribution
  kind: concept
  category: part-1-mathematical-foundations/probability/named-distributions/continuous
  note: beta-distribution
  definition: The distribution $\Beta(\alpha, \beta)$ on $[0, 1]$ with density
    proportional to $x^{\alpha - 1}(1 - x)^{\beta - 1}$. It is the conjugate
    prior for a Bernoulli or binomial probability.
bfgs:
  short: BFGS
  long: Broyden–Fletcher–Goldfarb–Shanno
  kind: acronym
  aliases:
    - broyden-fletcher-goldfarb-shanno
  category: part-1-mathematical-foundations/optimisation/second-order-methods
  note: quasi-newton-methods
  definition: A quasi-Newton method that updates an approximation of the Hessian
    by a rank-two correction satisfying the secant condition $\Bmat_{k+1}\svec_k
    = \yvec_k$. The approximation stays positive definite when the curvature
    condition $\svec_k^\top\yvec_k > 0$ holds.
bh:
  short: BH
  long: Benjamini–Hochberg Procedure
  kind: acronym
  aliases:
    - benjamini-hochberg-procedure
  category: part-1-mathematical-foundations/statistics/hypothesis-testing
  see:
    - multiple-testing
  definition: A multiple-testing procedure that sorts $m$ p-values, finds the
    largest $k$ with $p_{(k)} \le k\alpha/m$, and rejects the $k$ smallest. It
    controls the false discovery rate at $\alpha$ for independent tests.
bias:
  long: Bias of an Estimator
  kind: concept
  aliases:
    - bias-of-an-estimator
  category: part-4-principles-of-learning/learning-theory
  see:
    - bias-variance-decomposition
  definition: The difference $\expect[\hat\theta] - \theta$ between an estimator's
    expected value and the true value. An estimator with zero bias is unbiased.
bias-variance:
  long: Bias–Variance Decomposition
  kind: concept
  aliases:
    - bias-variance-decomposition
    - bias-variance-trade-off
  category: part-4-principles-of-learning/learning-theory
  note: bias-variance-decomposition
  definition: The decomposition of expected squared error into squared bias,
    variance and irreducible noise. More flexible models usually lower the bias
    and raise the variance.
bibo-stability:
  short: BIBO
  long: Bounded-Input Bounded-Output Stability
  kind: acronym
  aliases:
    - bounded-input-bounded-output-stability
    - bibo
  category: part-2-signals-systems-and-information/signal-processing/signals-and-systems
  see:
    - linear-time-invariant-systems
    - poles-and-zeros
  definition: A system is BIBO stable when every bounded input gives a bounded
    output. A linear time-invariant system is BIBO stable exactly when its
    impulse response is absolutely summable.
bic:
  short: BIC
  long: Bayesian Information Criterion
  kind: acronym
  aliases:
    - bayesian-information-criterion
  category: part-4-principles-of-learning/model-selection
  note: information-criteria
  definition: The model-selection score $\BIC = -2\ell + k\ln n$ for a model with
    maximised log-likelihood $\ell$, $k$ parameters and $n$ observations. It
    approximates $-2$ times the log marginal likelihood; lower is better.
bilstm-crf:
  short: BiLSTM-CRF
  long: Bidirectional Long Short-Term Memory with a Conditional Random Field
  kind: acronym
  aliases:
    - bidirectional-long-short-term-memory-with-a-conditional-random-field
  category: part-7-application-domains/natural-language-processing/sequence-labelling
  note: bidirectional-lstm-conditional-random-field
  definition: A sequence labeller that feeds bidirectional recurrent features of
    each token into a linear-chain conditional random field over the labels.
binomial-distribution:
  long: Binomial Distribution
  kind: concept
  category: part-1-mathematical-foundations/probability/named-distributions/discrete
  note: binomial-distribution
  definition: The distribution $\Binom(n, p)$ of the number of successes in $n$
    independent Bernoulli trials with success probability $p$. Its mean is $np$
    and its variance $np(1 - p)$.
bleu:
  short: BLEU
  long: Bilingual Evaluation Understudy
  kind: proper-name
  aliases:
    - bilingual-evaluation-understudy
  category: part-4-principles-of-learning/evaluation-metrics/text-metrics
  note: bleu
  definition: "A corpus-level machine-translation metric: the geometric mean of
    clipped $n$-gram precisions for $n = 1$ to $4$ against reference
    translations, times a brevity penalty."
bm25:
  short: BM25
  long: Okapi BM25
  kind: proper-name
  aliases:
    - okapi-bm25
  category: part-7-application-domains/natural-language-processing/text-representation
  note: term-frequency-inverse-document-frequency
  definition: A retrieval score that combines inverse document frequency with a
    saturating, length-normalised term frequency, $\mathrm{tf}(k_1 +
    1)/(\mathrm{tf} + k_1(1 - b + b\,\ell/\bar\ell))$.
bocpd:
  short: BOCPD
  long: Bayesian Online Change-Point Detection
  kind: acronym
  aliases:
    - bayesian-online-change-point-detection
  category: part-7-application-domains/time-series/change-points
  note: bayesian-online-changepoint-detection
  definition: Online change detection that keeps the posterior over the run length
    since the last change point, updated recursively as each observation
    arrives.
boltzmann-distribution:
  long: Boltzmann Distribution
  kind: concept
  aliases:
    - gibbs-distribution
  category: part-6-neural-architectures/feedforward-networks/energy-based-networks
  see:
    - ising-model
    - simulated-annealing
    - boltzmann-machine
  definition: The distribution $p(\svec) = e^{-E(\svec)/T}/Z$ over the states of a
    system with energy $E$ at temperature $T$, which favours low energy more
    strongly as $T$ falls. It maximises entropy at a fixed mean energy.
boltzmann-machine:
  long: Boltzmann Machine
  kind: concept
  category: part-6-neural-architectures/feedforward-networks/energy-based-networks
  note: boltzmann-machine
  definition: A network of stochastic binary units with symmetric weights that
    defines $p(\svec) \propto e^{-E(\svec)}$ over visible and hidden units,
    trained by matching the pairwise statistics of the model to those of the
    data.
boosting:
  long: Gradient Boosting
  kind: concept
  aliases:
    - gradient-boosted-trees
    - gbm
    - gradient-boosting
  category: part-5-learning-paradigms/supervised-learning/trees-and-ensembles
  note: gradient-boosting
  definition: Building an additive ensemble one weak model at a time, each fitted
    to the negative gradient of the loss at the current ensemble's predictions
    and added with a small learning rate.
bootstrap:
  long: Bootstrap
  kind: concept
  category: part-1-mathematical-foundations/statistics/resampling
  note: bootstrap
  definition: A resampling method that estimates the sampling distribution of a
    statistic by recomputing it on many samples drawn with replacement from the
    data.
box-jenkins:
  long: Box–Jenkins Method
  kind: concept
  aliases:
    - box-jenkins-method
  category: part-7-application-domains/time-series/arima-models
  note: box-jenkins-method
  definition: "Building an ARIMA model by repeating three stages: identify the
    orders from transformations, unit-root tests and the ACF and PACF; estimate
    the parameters; check that the residuals are white noise."
bp:
  short: BP
  long: Belief Propagation
  kind: acronym
  aliases:
    - belief-propagation
  category: part-4-principles-of-learning/probabilistic-inference/exact-inference
  note: belief-propagation
  definition: An algorithm that computes marginals of a graphical model by passing
    messages along its edges, each a sum over the sender's other incoming
    messages. It is exact on trees; on graphs with cycles it is loopy belief
    propagation.
bpe:
  short: BPE
  long: Byte-Pair Encoding
  kind: acronym
  aliases:
    - byte-pair-encoding
  category: part-7-application-domains/natural-language-processing/text-representation
  note: byte-pair-encoding
  definition: A subword tokeniser learned by starting from single characters or
    bytes and repeatedly merging the most frequent adjacent pair. Encoding
    replays the ordered merges.
bpr:
  short: BPR
  long: Bayesian Personalised Ranking
  kind: acronym
  aliases:
    - bayesian-personalised-ranking
  category: part-7-application-domains/recommendation-and-retrieval/collaborative-filtering
  note: bayesian-personalised-ranking
  definition: "Learning from implicit feedback by maximising $\\sum
    \\ln\\sigma(\\hat x_{ui} - \\hat x_{uj})$ over triples in which user $u$
    interacted with item $i$ and not with $j$: a smooth surrogate for per-user
    AUC."
bptt:
  short: BPTT
  long: Backpropagation Through Time
  kind: acronym
  aliases:
    - backpropagation-through-time
  category: part-6-neural-architectures/sequence-models/recurrent-networks
  note: backpropagation-through-time
  definition: Training a recurrent network by unrolling it over the sequence and
    backpropagating through the unrolled graph. Truncated BPTT backpropagates
    over a fixed window only.
brant-test:
  long: Brant Test
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/ordinal-regression
  see:
    - proportional-odds-assumption
  definition: A Wald test of the proportional odds assumption that fits a separate
    binary logit to each cumulative split and tests whether their slopes are
    equal, with a $\chi^2$ reference distribution on $D(K - 2)$ degrees of
    freedom.
brier-score:
  long: Brier Score
  kind: concept
  category: part-4-principles-of-learning/evaluation-metrics/probabilistic-metrics
  note: log-loss-and-brier-score
  definition: The mean squared difference between predicted probabilities and the
    0–1 outcomes. It is a proper scoring rule, bounded where log loss is not.
brownian-motion:
  long: Brownian Motion
  kind: concept
  aliases:
    - wiener-process
  category: part-1-mathematical-foundations/probability/stochastic-processes
  note: brownian-motion
  definition: The continuous-time process $W_t$ with $W_0 = 0$, independent
    Gaussian increments $W_t - W_s \sim \Gauss(0, t - s)$ and continuous paths.
    Its paths are nowhere differentiable.
bsc:
  short: BSC
  long: Binary Symmetric Channel
  kind: acronym
  category: part-2-signals-systems-and-information/information-theory
  see:
    - error-correcting-output-codes
  definition: A channel that transmits bits and flips each one independently with
    probability $p$; its capacity is $1 - H_2(p)$ bits per use, where $H_2$ is
    the binary entropy.
byol:
  short: BYOL
  long: Bootstrap Your Own Latent
  kind: proper-name
  aliases:
    - bootstrap-your-own-latent
  category: part-5-learning-paradigms/representation-learning
  note: non-contrastive-learning
  definition: "Self-supervised learning without negatives: an online network
    predicts a momentum target network's embedding of another view of the same
    image."
calibration:
  long: Calibration
  kind: concept
  category: part-4-principles-of-learning/decision-theory-and-calibration/classifier-calibration
  note: classifier-calibration
  definition: "Agreement between predicted probabilities and observed frequencies:
    among cases given probability $p$, a fraction $p$ are positive."
canary-release:
  long: Canary Release
  kind: concept
  aliases:
    - shadow-deployment
  category: part-8-practice/engineering/deployment
  note: shadow-deployment-and-canary-releases
  definition: Deploying a new model to a small fraction of traffic first, and
    widening it only if its metrics hold.
categorical-distribution:
  long: Categorical Distribution
  kind: concept
  category: part-1-mathematical-foundations/probability/named-distributions/discrete
  note: categorical-distribution
  definition: The distribution $\Cat(\thetavec)$ of a single draw from $K$
    outcomes with probabilities $\theta_1, \dots, \theta_K$ summing to 1.
causal-mask:
  long: Causal Mask
  kind: concept
  aliases:
    - look-ahead-mask
  category: part-6-neural-architectures/transformers/vanilla-transformer
  note: causal-masking
  definition: A mask that sets every attention score from a query to a later key
    to $-\infty$ before the softmax, so position $t$ sees only positions up to
    $t$. A decoder can then be trained on all next-token predictions in one
    pass.
cavi:
  short: CAVI
  long: Coordinate Ascent Variational Inference
  kind: acronym
  aliases:
    - coordinate-ascent-variational-inference
  category: part-1-mathematical-foundations/mathematics/calculus-of-variations
  note: mean-field-variational-inference
  definition: Mean-field variational inference by updating one factor at a time to
    its optimum given the others, $\log q_j^* = \expect_{-j}[\log p(x, z)] +
    \text{const}$. Each update increases the evidence lower bound.
cca:
  short: CCA
  long: Canonical Correlation Analysis
  kind: acronym
  aliases:
    - canonical-correlation-analysis
  category: part-5-learning-paradigms/unsupervised-learning/dimensionality-reduction
  note: canonical-correlation-analysis
  definition: Finding pairs of directions, one in each of two sets of variables,
    whose projections are maximally correlated.
cdf:
  short: CDF
  long: Cumulative Distribution Function
  kind: acronym
  aliases:
    - cumulative-distribution-function
  category: part-1-mathematical-foundations/probability/theory
  note: random-variable
  definition: The function $F(x) = \pr(X \le x)$ of a real random variable $X$. It
    is non-decreasing and right-continuous, rising from 0 to 1.
cg:
  short: CG
  long: Conjugate Gradient
  kind: acronym
  aliases:
    - conjugate-gradient
  category: part-1-mathematical-foundations/mathematics/numerical-methods
  note: iterative-linear-solvers
  definition: An iterative method for solving $\Amat\xvec = \bvec$ with $\Amat$
    symmetric positive definite. Each step moves along a direction conjugate to
    all earlier ones, so in exact arithmetic it converges in at most $n$ steps.
chain-rule:
  long: Chain Rule
  kind: concept
  category: part-1-mathematical-foundations/mathematics/calculus/multivariate
  note: multivariable-chain-rule
  definition: "The rule that the derivative of a composition is the product of
    derivatives: for $h = f \\circ g$, the Jacobian is $J_h =
    J_f(g(\\xvec))\\,J_g(\\xvec)$. Backpropagation applies it to a network one
    layer at a time."
change-point-detection:
  long: Change-Point Detection
  kind: concept
  category: part-7-application-domains/time-series/change-points
  note: change-point-detection
  definition: Finding the times at which the distribution of a sequence changes,
    offline by segmentation or online as data arrive.
cholesky:
  long: Cholesky Decomposition
  kind: concept
  aliases:
    - cholesky-decomposition
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: cholesky-decomposition
  definition: The factorisation $\Amat = \Lmat\Lmat^\top$ of a symmetric positive
    definite matrix with $\Lmat$ lower triangular. It solves linear systems and
    samples multivariate Gaussians at about half the cost of an LU
    factorisation.
cifar-10:
  short: CIFAR-10
  long: CIFAR-10
  kind: proper-name
  aliases:
    - cifar-100
  category: part-7-application-domains/computer-vision/recognition
  definition: A dataset of 60,000 colour $32 \times 32$ images in 10 classes,
    50,000 for training and 10,000 for testing. CIFAR-100 has 60,000 images of
    the same size in 100 classes.
class-imbalance:
  long: Class Imbalance
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/classification/imbalanced-classes
  note: class-imbalance
  definition: A classification problem in which one class is much rarer than the
    others, so accuracy is dominated by the majority and decision thresholds,
    weights or resampling need adjusting.
classifier-free-guidance:
  long: Classifier-Free Guidance
  kind: concept
  aliases:
    - cfg
  category: part-6-neural-architectures/generative-models/diffusion-models
  note: diffusion-guidance
  definition: Steering a conditional diffusion model by extrapolating from its
    unconditional prediction toward its conditional one by a guidance scale,
    trading diversity for fidelity to the condition.
click-through-rate:
  short: CTR
  long: Click-Through Rate
  kind: acronym
  sense: engagement metric
  category: part-7-application-domains/recommendation-and-retrieval/evaluation
  see:
    - recommendation-metrics
    - conversion-rate-metrics
  definition: The fraction of impressions of an item, ad or link that are clicked.
clip:
  short: CLIP
  long: Contrastive Language–Image Pretraining
  kind: proper-name
  aliases:
    - contrastive-language-image-pretraining
  category: part-5-learning-paradigms/representation-learning
  note: clip
  definition: An image encoder and a text encoder trained so that matching
    image–caption pairs have high cosine similarity, with a contrastive loss
    over each batch. New classes are recognised zero-shot by embedding a caption
    for each.
clm:
  short: CLM
  long: Cumulative Link Model
  kind: acronym
  aliases:
    - cumulative-link-model
    - ordered-probit
    - cumulative-probit-model
  category: part-5-learning-paradigms/supervised-learning/ordinal-regression
  note: cumulative-link-model
  definition: "An ordinal model $P(y \\le k \\mid \\xvec) = F(\\theta_k -
    \\wvec^\\top\\xvec)$ with ordered thresholds $\\theta_k$ and a cdf $F$: a
    latent score $\\wvec^\\top\\xvec + \\epsilon$ cut into intervals."
clt:
  short: CLT
  long: Central Limit Theorem
  kind: acronym
  aliases:
    - central-limit-theorem
  category: part-1-mathematical-foundations/probability/limit-theorems
  note: central-limit-theorem
  definition: "The theorem that the standardised mean of $n$ i.i.d. variables with
    finite variance $\\sigma^2$ converges in distribution to a standard
    Gaussian: $\\sqrt{n}(\\bar X_n - \\mu)/\\sigma \\to \\Gauss(0, 1)$."
cnn:
  short: CNN
  long: Convolutional Neural Network
  kind: acronym
  aliases:
    - convolutional-neural-network
  category: part-6-neural-architectures/convolutional-networks
  see:
    - convolutional-layer
    - classic-convolutional-network-architectures
  definition: A neural network built mainly from convolutional layers, which apply
    the same small filters at every position of an image or sequence. Weight
    sharing makes it translation-equivariant and parameter-efficient.
coco:
  short: COCO
  long: Common Objects in Context
  kind: proper-name
  aliases:
    - common-objects-in-context
  category: part-7-application-domains/computer-vision/recognition
  see:
    - object-detection
    - mean-average-precision-for-detection
  definition: An image dataset with object boxes, instance masks and captions for
    80 object categories, the standard object detection and segmentation
    benchmark.
cointegration:
  long: Cointegration
  kind: concept
  category: part-7-application-domains/time-series/multivariate-time-series
  note: cointegration
  definition: Non-stationary series are cointegrated when some linear combination
    of them is stationary, so they share a common stochastic trend.
cold-start:
  long: Cold-Start Problem
  kind: concept
  aliases:
    - cold-start-problem
  category: part-7-application-domains/recommendation-and-retrieval/cold-start-and-context
  note: cold-start-problem
  definition: The difficulty of recommending to new users or new items that have
    no interaction history, which collaborative filtering needs.
collaborative-filtering:
  long: Collaborative Filtering
  kind: concept
  category: part-7-application-domains/recommendation-and-retrieval/collaborative-filtering
  see:
    - neighbourhood-collaborative-filtering
    - matrix-factorisation-for-recommendation
  definition: "Recommending from the interaction patterns of many users alone:
    users who agreed in the past are assumed to agree again."
collaborative-topic-regression:
  short: CTR
  long: Collaborative Topic Regression
  kind: acronym
  sense: topic model
  category: part-5-learning-paradigms/unsupervised-learning/topic-models/applications
  note: collaborative-topic-regression
  definition: "A recommender that joins latent Dirichlet allocation to matrix
    factorisation: an item's latent vector is its topic proportions plus an
    offset, so new items can be recommended from their text."
completing-the-square:
  long: Completing the Square
  kind: concept
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: completing-the-square
  definition: Rewriting a quadratic $ax^2 + bx + c$ as $a(x + b/2a)^2 + c -
    b^2/4a$, or its multivariate form, which is how Gaussian posteriors and
    integrals are read off.
concept-drift:
  long: Concept Drift
  kind: concept
  category: part-5-learning-paradigms/online-learning/streaming-and-incremental-learning
  note: concept-drift-adaptation
  definition: A change over time in the relation $p(y \mid \xvec)$ that a model
    has learned, which makes it stale.
condition-number:
  long: Condition Number
  kind: concept
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: condition-number
  definition: The ratio $\kappa(\Amat) = \sigma_{\max}/\sigma_{\min}$ of the
    largest to the smallest singular value of a matrix. It bounds how much a
    relative error in the data can be amplified in the solution of $\Amat\xvec =
    \bvec$.
conditional-probability:
  long: Conditional Probability
  kind: concept
  category: part-1-mathematical-foundations/probability/theory
  note: conditional-probability
  definition: The probability of an event $A$ given that an event $B$ occurred,
    $\pr(A \mid B) = \pr(A \cap B)/\pr(B)$ for $\pr(B) > 0$.
confidence-interval:
  short: CI
  long: Confidence Interval
  kind: concept
  aliases:
    - ci
  category: part-1-mathematical-foundations/statistics/estimation
  note: confidence-intervals
  definition: An interval computed from data by a procedure that covers the true
    parameter with a stated probability, such as 95%, over repeated samples. The
    probability describes the procedure, not one computed interval.
conformal-prediction:
  long: Conformal Prediction
  kind: concept
  category: part-4-principles-of-learning/decision-theory-and-calibration/uncertainty-quantification
  note: conformal-prediction
  definition: A method that turns any model's scores into prediction sets that
    contain the true label with probability at least $1 - \alpha$, assuming only
    that calibration and test data are exchangeable.
confusion-matrix:
  long: Confusion Matrix
  kind: concept
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  note: confusion-matrix
  definition: A table that counts predictions against true classes. For two
    classes it holds the true positives, false negatives, false positives and
    true negatives, from which every threshold metric is computed.
conjugate-prior:
  long: Conjugate Prior
  kind: concept
  category: part-1-mathematical-foundations/statistics/bayesian-statistics
  note: conjugate-priors
  definition: A prior whose posterior, for a given likelihood, lies in the same
    family as the prior. The Beta prior is conjugate to the Bernoulli
    likelihood, and the Gaussian prior on a mean to a Gaussian likelihood.
consistent-rank-logits:
  short: CORAL
  long: Consistent Rank Logits
  kind: acronym
  sense: ordinal regression
  category: part-5-learning-paradigms/supervised-learning/ordinal-regression
  see:
    - deep-ordinal-regression
    - binary-decomposition-for-ordinal-regression
  definition: An ordinal output layer of $K - 1$ sigmoid units
    $\sigma(\wvec^\top\hvec + \beta_k)$ that share one weight vector, trained on
    the targets $\indicator[y > k]$. Ordered biases make the estimates of $P(y >
    k)$ monotone in $k$.
contextual-bandit:
  long: Contextual Bandit
  kind: concept
  category: part-7-application-domains/online-experimentation/contextual-bandits
  note: contextual-bandit
  definition: A bandit in which a context is observed before each choice and the
    expected reward of each arm depends on it.
contextualised-topic-model:
  short: CTM
  long: Contextualised Topic Model
  kind: acronym
  sense: neural topic model
  category: part-5-learning-paradigms/unsupervised-learning/topic-models/neural-topic-models
  note: contextualised-topic-models
  definition: A neural topic model whose encoder reads a pretrained sentence
    embedding of the document, alone or with its bag of words.
continual-learning:
  long: Continual Learning
  kind: concept
  aliases:
    - lifelong-learning
    - catastrophic-forgetting
  category: part-5-learning-paradigms/online-learning/continual-learning
  note: continual-learning
  definition: Learning a sequence of tasks without revisiting earlier data, while
    avoiding catastrophic forgetting of the earlier tasks.
continuation-ratio-model:
  long: Continuation-Ratio Model
  kind: concept
  aliases:
    - sequential-model
    - stopping-ratio-model
  category: part-5-learning-paradigms/supervised-learning/ordinal-regression
  see:
    - continuation-ratio-and-adjacent-category-models
  definition: An ordinal model of stopping decisions, $P(y = k \mid y \ge k,
    \xvec) = \sigma(\theta_k - \wvec^\top\xvec)$. Its likelihood splits into $K
    - 1$ binary logistic regressions on nested subsets of the data.
contrastive-divergence:
  short: CD
  long: Contrastive Divergence
  kind: acronym
  sense: training energy-based models
  aliases:
    - cd-k
    - cd-1
  category: part-6-neural-architectures/feedforward-networks/energy-based-networks
  see:
    - restricted-boltzmann-machine
    - energy-based-models
  definition: A training rule for energy-based models that estimates the negative
    phase of the likelihood gradient from Markov chains started at the training
    data and run for only $k$ steps. It is biased but cheap.
contrastive-learning:
  long: Contrastive Learning
  kind: concept
  category: part-5-learning-paradigms/representation-learning
  note: contrastive-learning
  definition: Training an encoder to pick the matching view of an input out of a
    set of candidates, pulling positive pairs together and pushing negatives
    apart in embedding space.
controllability:
  long: Controllability
  kind: concept
  aliases:
    - observability
  category: part-2-signals-systems-and-information/control-theory/state-space-control
  note: controllability-and-observability
  definition: A linear system is controllable when inputs can drive its state from
    any value to any other in finite time, and observable when its state can be
    recovered from its outputs.
convex-function:
  long: Convex Function
  kind: concept
  category: part-1-mathematical-foundations/optimisation/convex-analysis
  note: convex-sets-and-functions
  definition: A function $f$ with $f(\theta\xvec + (1 - \theta)\yvec) \le \theta
    f(\xvec) + (1 - \theta)f(\yvec)$ for all $\xvec, \yvec$ and $\theta \in [0,
    1]$. Every local minimum of a convex function is a global minimum.
convolution:
  long: Convolution
  kind: concept
  category: part-2-signals-systems-and-information/signal-processing/signals-and-systems
  note: convolution
  definition: The operation $(f * g)(t) = \int f(\tau)\,g(t - \tau)\,d\tau$, or
    $\sum_k f[k]\,g[n - k]$ for sequences, which slides one function reversed
    across another and integrates the product. The output of a linear
    time-invariant system is the convolution of its input with its impulse
    response.
convolutional-layer:
  long: Convolutional Layer
  kind: concept
  aliases:
    - feature-map
  category: part-6-neural-architectures/convolutional-networks
  note: convolutional-layer
  definition: A layer that computes each output from a small window of the input
    with one set of weights shared across positions. With kernel $k$, padding
    $p$ and stride $s$, an input of width $n$ gives an output of width $\lfloor
    (n + 2p - k)/s \rfloor + 1$.
corn:
  short: CORN
  long: Conditional Ordinal Regression for Neural Networks
  kind: acronym
  category: part-5-learning-paradigms/supervised-learning/ordinal-regression
  see:
    - deep-ordinal-regression
  definition: An ordinal output layer whose units estimate $P(y > k \mid y > k -
    1)$, each trained on the examples above $k - 1$. Multiplying them gives $P(y
    > k)$, which is monotone in $k$ by construction.
correlated-topic-model:
  short: CTM
  long: Correlated Topic Model
  kind: acronym
  sense: topic model
  category: part-5-learning-paradigms/unsupervised-learning/topic-models/extensions
  note: correlated-topic-model
  definition: A topic model that replaces the Dirichlet prior on topic proportions
    with a logistic normal, so the presence of one topic can raise or lower
    another.
cosine-similarity:
  long: Cosine Similarity
  kind: concept
  category: part-4-principles-of-learning/evaluation-metrics/distances-and-similarities
  note: pairwise-distances-and-cosine-similarity
  definition: The cosine of the angle between two vectors,
    $\inner{\xvec}{\yvec}/(\norm{\xvec}\norm{\yvec})$, in $[-1, 1]$. It compares
    directions and ignores lengths.
cot:
  short: CoT
  long: Chain of Thought
  kind: acronym
  aliases:
    - chain-of-thought-prompting
    - chain-of-thought
  category: part-6-neural-architectures/large-language-models/working-with-llms
  note: chain-of-thought
  definition: Prompting a language model to write intermediate reasoning steps
    before its answer. Self-consistency samples several chains and returns the
    most common answer.
counterfactual-explanation:
  long: Counterfactual Explanation
  kind: concept
  category: part-8-practice/trustworthy-machine-learning/interpretability
  note: counterfactual-explanations
  definition: The smallest change to an input that would change a model's
    decision, such as "the loan would be approved with an income 5000 higher".
covariance:
  long: Covariance
  kind: concept
  category: part-1-mathematical-foundations/probability/theory
  note: variance-and-covariance
  definition: The expected product of deviations, $\cov(X, Y) = \expect[(X -
    \expect X)(Y - \expect Y)]$, which measures linear co-variation. Dividing it
    by both standard deviations gives the correlation coefficient in $[-1, 1]$.
covariance-matrix:
  long: Covariance Matrix
  longPlural: Covariance Matrices
  kind: concept
  category: part-1-mathematical-foundations/probability/theory
  note: variance-and-covariance
  definition: The matrix $\Sigmamat = \expect[(\xvec - \muvec)(\xvec -
    \muvec)^\top]$ of all pairwise covariances of a random vector. It is
    symmetric and positive semi-definite.
covariate-shift:
  long: Covariate Shift
  kind: concept
  category: part-5-learning-paradigms/transfer-and-meta-learning/domain-adaptation
  note: importance-weighting-for-covariate-shift
  definition: Dataset shift in which the input distribution $p(\xvec)$ changes
    while $p(y \mid \xvec)$ stays the same. Importance weighting by
    $p_{\text{test}}(\xvec)/p_{\text{train}}(\xvec)$ corrects it.
cpu:
  short: CPU
  long: Central Processing Unit
  kind: acronym
  aliases:
    - central-processing-unit
  category: part-8-practice/engineering
  definition: A general-purpose processor with a few fast cores, optimised for
    low-latency sequential code rather than bulk parallel arithmetic.
credible-interval:
  long: Credible Interval
  kind: concept
  category: part-1-mathematical-foundations/statistics/bayesian-statistics
  note: credible-intervals-and-highest-posterior-density
  definition: An interval that contains an unknown parameter with a stated
    posterior probability, such as 95%, in Bayesian inference.
crf:
  short: CRF
  long: Conditional Random Field
  kind: acronym
  aliases:
    - linear-chain-crf
    - conditional-random-field
  category: part-5-learning-paradigms/supervised-learning/structured-prediction
  note: conditional-random-field
  definition: A discriminative model of a label sequence given an observation
    sequence, $P(\yvec \mid \xvec) \propto \prod_n \exp\{\lambdavec^\top
    \fvec(y_{n-1}, y_n, \xvec, n)\}$, normalised globally. Training is a convex
    likelihood fit.
cross-entropy:
  long: Cross-Entropy
  kind: concept
  category: part-2-signals-systems-and-information/information-theory
  note: cross-entropy-and-perplexity
  definition: The expected code length $\entropy(p, q) = -\expect_p[\log q(X)]$
    when data from $p$ are coded with a model $q$. It equals $\entropy(p) +
    \KL(p \,\|\, q)$, so minimising it over $q$ minimises the KL divergence.
cross-validation:
  short: CV
  long: Cross-Validation
  kind: concept
  aliases:
    - cv
  category: part-4-principles-of-learning/model-selection
  note: cross-validation
  definition: Estimation of out-of-sample error by splitting the data into $k$
    folds, training on $k - 1$ and testing on the one left out, and averaging
    over the folds.
crps:
  short: CRPS
  long: Continuous Ranked Probability Score
  kind: acronym
  aliases:
    - continuous-ranked-probability-score
  category: part-4-principles-of-learning/evaluation-metrics/forecasting-metrics
  note: continuous-ranked-probability-score-and-interval-scores
  definition: The score $\int (F(z) - \indicator\set{y \le z})^2\,dz$ of a
    predictive distribution $F$ against an outcome $y$, in the units of the
    data. It reduces to absolute error for a point forecast.
cuped:
  short: CUPED
  long: Controlled Experiments Using Pre-Experiment Data
  kind: acronym
  aliases:
    - controlled-experiments-using-pre-experiment-data
  category: part-7-application-domains/online-experimentation/ab-tests
  note: controlled-experiments-using-pre-experiment-data
  definition: Variance reduction that subtracts $\theta(X - \bar X)$ from each
    unit's metric, where $X$ is a pre-experiment covariate and $\theta = \cov(X,
    Y)/\var(X)$. Variance falls by the factor $1 - \rho^2$.
curse-of-dimensionality:
  long: Curse of Dimensionality
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/nearest-neighbours
  note: curse-of-dimensionality-for-neighbours
  definition: "The collection of effects that make high-dimensional spaces hard to
    cover with data: volume grows exponentially with dimension, and distances
    between random points concentrate so that nearest and farthest neighbours
    become nearly equidistant."
cusum:
  short: CUSUM
  long: Cumulative Sum Control Chart
  kind: acronym
  aliases:
    - cumulative-sum-control-chart
  category: part-7-application-domains/time-series/change-points
  note: cumulative-sum-control-chart
  definition: Online change detection that accumulates log-likelihood ratios,
    resetting at zero, $S_n = \max(0, S_{n-1} + \ell_n)$, and alarms when $S_n$
    exceeds a threshold.
cvr:
  short: CVR
  long: Conversion Rate
  kind: acronym
  aliases:
    - conversion-rate
  category: part-7-application-domains/recommendation-and-retrieval/loss-families
  see:
    - pointwise-recommendation-losses
  definition: "The probability that a user converts, for example buys, after
    clicking an item: conversions divided by clicks."
dag:
  short: DAG
  long: Directed Acyclic Graph
  kind: acronym
  aliases:
    - directed-acyclic-graph
  category: part-4-principles-of-learning/probabilistic-inference/graphical-models
  definition: A graph with directed edges and no directed cycles. Bayesian
    networks, causal models and computation graphs are directed acyclic graphs.
damp:
  short: DAMP
  long: Discord-Aware Matrix Profile
  kind: acronym
  aliases:
    - discord-aware-matrix-profile
  category: part-7-application-domains/time-series/similarity-search
  note: discord-discovery-at-scale
  definition: An algorithm that finds time-series discords in very long or
    streaming data by computing only the left matrix profile values that could
    be discords, with early abandoning.
dann:
  short: DANN
  long: Domain-Adversarial Neural Network
  kind: acronym
  aliases:
    - domain-adversarial-neural-network
  category: part-5-learning-paradigms/transfer-and-meta-learning/domain-adaptation
  note: domain-adversarial-training
  definition: A network trained to predict labels on the source domain while a
    gradient-reversed domain classifier makes its features indistinguishable
    between source and target.
data-augmentation:
  long: Data Augmentation
  kind: concept
  category: part-6-neural-architectures/feedforward-networks/training
  note: data-augmentation
  definition: Enlarging a training set with transformed copies of its examples,
    such as crops, flips or noise, that leave the label unchanged. It encodes
    invariances the model should learn.
data-leakage:
  long: Data Leakage
  kind: concept
  category: part-3-data/data-preparation
  note: data-leakage
  definition: Information in the training data or the features that would not be
    available at prediction time, such as a target-derived feature or
    preprocessing fitted on the test set. It makes offline evaluation
    optimistic.
data-parallelism:
  long: Data Parallelism
  kind: concept
  category: part-8-practice/engineering/training-at-scale
  note: data-parallelism
  definition: Training with a copy of the model on each device, each processing a
    different slice of the batch, with gradients averaged across devices every
    step.
data-programming:
  short: DP
  long: Data Programming
  kind: acronym
  sense: weak supervision
  category: part-5-learning-paradigms/weak-supervision/programmatic-weak-supervision
  note: data-programming
  definition: Labelling training data with many noisy labelling functions whose
    accuracies a label model estimates from their agreements, without ground
    truth.
dataset-shift:
  long: Dataset Shift
  kind: concept
  aliases:
    - distribution-shift
  category: part-8-practice/engineering/deployment
  note: dataset-shift
  definition: A difference between the distribution of training data and the data
    a model meets in use.
dawid-skene:
  long: Dawid–Skene Model
  kind: concept
  aliases:
    - dawid-skene-model
  category: part-5-learning-paradigms/weak-supervision/crowdsourcing
  note: dawid-skene-model
  definition: A model of crowd labels in which each annotator has a confusion
    matrix and each item a latent true class, fitted by
    expectation–maximisation.
dbscan:
  short: DBSCAN
  long: Density-Based Spatial Clustering of Applications with Noise
  kind: acronym
  aliases:
    - density-based-spatial-clustering-of-applications-with-noise
  category: part-5-learning-paradigms/unsupervised-learning/clustering
  note: density-based-spatial-clustering
  definition: Clustering that grows clusters from core points with at least a
    minimum number of neighbours within radius $\varepsilon$, and labels points
    in sparse regions as noise.
dcg:
  short: DCG
  long: Discounted Cumulative Gain
  kind: acronym
  aliases:
    - discounted-cumulative-gain
  category: part-4-principles-of-learning/evaluation-metrics/ranking-metrics
  note: normalised-discounted-cumulative-gain
  definition: The sum over a ranked list of each item's gain divided by
    $\log_2(\text{rank} + 1)$, so relevant items near the top count most.
ddim:
  short: DDIM
  long: Denoising Diffusion Implicit Model
  kind: acronym
  aliases:
    - denoising-diffusion-implicit-model
  category: part-6-neural-architectures/generative-models/diffusion-models
  note: denoising-diffusion-implicit-models
  definition: A sampler for a trained diffusion model that uses a non-Markovian
    process with the same marginals, so it needs no retraining and generates in
    tens of steps; its deterministic form is an ODE solver.
ddpm:
  short: DDPM
  long: Denoising Diffusion Probabilistic Model
  kind: acronym
  aliases:
    - denoising-diffusion-probabilistic-model
  category: part-6-neural-architectures/generative-models/diffusion-models
  note: denoising-diffusion-probabilistic-models
  definition: A diffusion model that adds Gaussian noise over $T$ steps and trains
    a network to predict the noise in each noised sample, which reverses one
    step at a time.
decision-tree:
  long: Decision Tree
  kind: concept
  aliases:
    - cart
  category: part-5-learning-paradigms/supervised-learning/trees-and-ensembles
  note: decision-tree
  definition: A model that predicts by passing an input down a tree of threshold
    tests on single features to a leaf holding a constant prediction. Trees are
    grown greedily by choosing the split that most reduces impurity or error.
deep-belief-network:
  short: DBN
  long: Deep Belief Network
  kind: acronym
  aliases:
    - deep-belief-net
  category: part-6-neural-architectures/feedforward-networks/energy-based-networks
  note: deep-belief-network
  definition: A generative model built by training restricted Boltzmann machines
    one layer at a time, each on the hidden activities of the one below, with an
    undirected top layer over directed layers.
deep-svdd:
  short: Deep SVDD
  long: Deep Support Vector Data Description
  kind: acronym
  aliases:
    - deep-support-vector-data-description
  category: part-5-learning-paradigms/anomaly-detection/deep-one-class-methods
  note: deep-support-vector-data-description
  definition: An anomaly detector that trains a network to map normal data close
    to a fixed centre, so the distance to the centre is the anomaly score.
deepar:
  short: DeepAR
  long: DeepAR
  kind: proper-name
  category: part-7-application-domains/time-series/neural-forecasting
  note: deepar
  definition: A global probabilistic forecaster in which one LSTM, shared by all
    series, outputs the parameters of the next value's distribution; forecasts
    are sample paths.
deepfm:
  short: DeepFM
  long: DeepFM
  kind: proper-name
  category: part-7-application-domains/recommendation-and-retrieval/feature-interaction-models
  note: deepfm
  definition: A click-through-rate model that combines a factorisation machine and
    a deep network sharing the same feature embeddings, so feature interactions
    are learned without hand-built crosses.
delta-method:
  long: Delta Method
  kind: concept
  category: part-7-application-domains/online-experimentation/ab-tests
  note: ratio-metrics-and-delta-method
  definition: "An approximation of the variance of a smooth function of an
    estimator by a first-order Taylor expansion: $\\var(g(\\hat\\theta))
    \\approx g'(\\theta)^2\\var(\\hat\\theta)$."
dense-associative-memory:
  long: Dense Associative Memory
  kind: concept
  category: part-6-neural-architectures/feedforward-networks/energy-based-networks
  see:
    - modern-hopfield-network
  definition: A Hopfield-type memory with energy $-\sum_\mu
    F({\xivec^\mu}^\top\svec)$ for a separation function such as $F(x) = x^n$,
    $n > 2$, whose capacity grows as $N^{n-1}$ in the number of units $N$.
derivative:
  long: Derivative
  kind: concept
  category: part-1-mathematical-foundations/mathematics/calculus/univariate
  note: derivative
  definition: "The instantaneous rate of change of a function, $f'(x) = \\lim_{h
    \\to 0} (f(x + h) - f(x))/h$: the slope of the tangent line at $x$."
determinant:
  long: Determinant
  kind: concept
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: determinant
  definition: "The scalar $\\det\\Amat$ of a square matrix: the factor by which
    the linear map scales volume, negative when it reverses orientation. It is
    zero exactly when the matrix is singular."
dft:
  short: DFT
  long: Discrete Fourier Transform
  kind: acronym
  aliases:
    - discrete-fourier-transform
  category: part-2-signals-systems-and-information/signal-processing/fourier-analysis
  note: discrete-fourier-transform
  definition: The map $X[k] = \sum_{n=0}^{N-1} x[n]e^{-i2\pi kn/N}$ from $N$
    samples to $N$ frequency coefficients, treating the input as one period of a
    periodic sequence.
differential-privacy:
  short: DP
  long: Differential Privacy
  kind: acronym
  sense: privacy
  category: part-8-practice/trustworthy-machine-learning/privacy
  note: differential-privacy
  definition: A guarantee that a randomised algorithm's output distribution
    changes by at most a factor $e^\varepsilon$ (plus $\delta$) when any one
    individual's record is added or removed.
diffusion-model:
  long: Diffusion Model
  kind: concept
  category: part-6-neural-architectures/generative-models/diffusion-models
  see:
    - denoising-diffusion-probabilistic-models
    - score-based-generative-models
  definition: A generative model that gradually adds noise to data and learns to
    reverse the process, generating by denoising from pure noise step by step.
dimensionality-reduction:
  long: Dimensionality Reduction
  kind: concept
  category: part-5-learning-paradigms/unsupervised-learning/dimensionality-reduction
  note: dimensionality-reduction
  definition: Mapping high-dimensional data to fewer dimensions while keeping the
    structure that matters, such as variance, distances or neighbourhoods.
dirichlet-distribution:
  long: Dirichlet Distribution
  kind: concept
  category: part-1-mathematical-foundations/probability/named-distributions/multivariate
  note: dirichlet-distribution
  definition: The distribution $\Dir(\alphavec)$ over probability vectors on the
    simplex, with density proportional to $\prod_k \theta_k^{\alpha_k - 1}$. It
    generalises the Beta distribution and is the conjugate prior for categorical
    and multinomial probabilities.
diskann:
  short: DiskANN
  long: DiskANN
  kind: proper-name
  category: part-5-learning-paradigms/supervised-learning/nearest-neighbours/approximate-nearest-neighbours
  note: graph-based-approximate-nearest-neighbours
  definition: A graph-based approximate nearest-neighbour index designed to keep
    most of the graph and vectors on solid-state disk, with compressed vectors
    in memory to guide the search.
domain-adaptation:
  long: Domain Adaptation
  kind: concept
  category: part-5-learning-paradigms/transfer-and-meta-learning/domain-adaptation
  see:
    - domain-adaptation-theory
    - domain-adversarial-training
  definition: Transfer learning in which the task is the same but the input
    distribution differs between the labelled source domain and the target
    domain.
doubly-robust:
  short: DR
  long: Doubly Robust Estimator
  kind: acronym
  aliases:
    - doubly-robust-estimator
    - dr
  category: part-7-application-domains/online-experimentation/contextual-bandits
  note: off-policy-evaluation
  definition: An off-policy estimator that adds an inverse-propensity-weighted
    correction of a reward model's residuals to the model's prediction. It is
    unbiased if either the propensities or the reward model is correct.
dp-sgd:
  short: DP-SGD
  long: Differentially Private Stochastic Gradient Descent
  kind: acronym
  aliases:
    - differentially-private-stochastic-gradient-descent
  category: part-8-practice/trustworthy-machine-learning/privacy
  note: differentially-private-stochastic-gradient-descent
  definition: Stochastic gradient descent made differentially private by clipping
    each example's gradient to a fixed norm and adding Gaussian noise to their
    sum.
dpo:
  short: DPO
  long: Direct Preference Optimisation
  kind: acronym
  aliases:
    - direct-preference-optimisation
  category: part-6-neural-architectures/large-language-models/working-with-llms
  see:
    - instruction-tuning-and-alignment
  definition: Tuning a language model directly on preference pairs with a logistic
    loss on the difference of log-probability ratios to a reference model. It
    optimises the same objective as KL-regularised RLHF without a reward model
    or reinforcement learning.
dqn:
  short: DQN
  long: Deep Q-Network
  kind: acronym
  aliases:
    - deep-q-network
  category: part-5-learning-paradigms/reinforcement-learning/value-based-methods
  note: deep-q-network
  definition: Q-learning with a neural network for the action values, stabilised
    by experience replay and a periodically updated target network.
dropout:
  long: Dropout
  kind: concept
  category: part-6-neural-architectures/feedforward-networks/training
  note: dropout
  definition: A regulariser that zeroes each unit's output with probability $p$
    during training and scales the rest by $1/(1 - p)$. At test time the full
    network approximates the average of the $2^n$ weight-sharing subnetworks
    trained.
dtft:
  short: DTFT
  long: Discrete-Time Fourier Transform
  kind: acronym
  aliases:
    - discrete-time-fourier-transform
  category: part-2-signals-systems-and-information/signal-processing/fourier-analysis
  note: discrete-time-fourier-transform
  definition: The spectrum $X(e^{i\omega}) = \sum_n x[n]e^{-i\omega n}$ of a
    sequence, a $2\pi$-periodic function of continuous frequency. The DFT
    samples it.
dtm:
  short: DTM
  long: Dynamic Topic Model
  kind: acronym
  aliases:
    - dynamic-topic-model
  category: part-5-learning-paradigms/unsupervised-learning/topic-models/extensions
  note: dynamic-topic-model
  definition: A topic model for a corpus ordered in time whose topics drift from
    one time slice to the next through Gaussian random walks on their natural
    parameters.
dtw:
  short: DTW
  long: Dynamic Time Warping
  kind: acronym
  aliases:
    - dynamic-time-warping
  category: part-7-application-domains/time-series/time-series-classification
  note: dynamic-time-warping
  definition: A distance between two sequences that aligns them by the monotone
    warping path of least total cost, found by dynamic programming, so similar
    shapes at different speeds match.
duality:
  long: Lagrangian Duality
  kind: concept
  aliases:
    - lagrangian-duality
  category: part-1-mathematical-foundations/optimisation/convex-analysis
  note: lagrangian-duality
  definition: The pairing of an optimisation problem with a dual problem, obtained
    by maximising the Lagrangian's infimum over the multipliers. The dual
    optimum is a lower bound on the primal optimum (weak duality), and equals it
    for convex problems under Slater's condition (strong duality).
early-stopping:
  long: Early Stopping
  kind: concept
  category: part-6-neural-architectures/feedforward-networks/training
  note: early-stopping
  definition: Stopping training once a validation loss has not improved for a set
    number of evaluations and returning the best parameters. For gradient
    descent on a quadratic it acts like an L2 penalty.
earth-movers-distance:
  short: EMD
  long: Earth Mover's Distance
  kind: concept
  sense: optimal transport
  category: part-1-mathematical-foundations/mathematics/optimal-transport
  note: earth-movers-distance
  see:
    - wasserstein-distances
  definition: The least total work, mass times ground distance, needed to reshape
    one histogram into another. With equal total masses it is the 1-Wasserstein
    distance between the normalised histograms.
ece:
  short: ECE
  long: Expected Calibration Error
  kind: acronym
  aliases:
    - expected-calibration-error
  category: part-4-principles-of-learning/evaluation-metrics/probabilistic-metrics
  note: calibration-error
  definition: The average gap between confidence and accuracy, estimated by
    binning predictions by confidence and weighting each bin by its size. Its
    value depends on the binning.
ecoc:
  short: ECOC
  long: Error-Correcting Output Codes
  kind: acronym
  category: part-5-learning-paradigms/supervised-learning/classification/multiclass
  note: error-correcting-output-codes
  definition: "A reduction of a K-class problem to binary ones: each class gets a
    codeword, one classifier is trained per code bit, and a prediction is
    decoded to the class whose codeword is nearest."
effect-size:
  long: Effect Size
  kind: concept
  category: part-1-mathematical-foundations/statistics/estimation
  note: effect-size
  definition: A measure of the magnitude of an effect, such as a difference in
    means divided by a standard deviation (Cohen's $d$). Unlike a p-value, it
    does not grow with the sample size.
effective-degrees-of-freedom:
  long: Effective Degrees of Freedom
  kind: concept
  category: part-4-principles-of-learning/model-selection/regularisation
  note: effective-degrees-of-freedom
  definition: The trace of the influence matrix $\Amat$ of a linear smoother,
    $\hat\yvec = \Amat\yvec$, which measures its flexibility and equals the
    number of parameters for least squares.
eigendecomposition:
  long: Eigendecomposition
  kind: concept
  aliases:
    - eigenvalue
    - eigenvector
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: eigendecomposition
  definition: A factorisation $\Amat = \Qmat\Lambdamat\Qmat^{-1}$ of a square
    matrix into its eigenvectors $\Qmat$ and eigenvalues $\Lambdamat$, where
    each eigenvector $\vvec$ satisfies $\Amat\vvec = \lambda\vvec$. A symmetric
    matrix has real eigenvalues and orthonormal eigenvectors.
ekf:
  short: EKF
  long: Extended Kalman Filter
  kind: acronym
  aliases:
    - extended-kalman-filter
  category: part-7-application-domains/time-series/state-space-models
  note: extended-and-unscented-kalman-filters
  definition: A Kalman filter for nonlinear models that linearises the transition
    and observation functions around the current estimate at each step.
elastic-net:
  long: Elastic Net
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/regression/linear
  note: elastic-net
  definition: Least squares with a weighted sum of L1 and L2 penalties. It selects
    variables like the lasso while keeping groups of correlated variables
    together.
elbo:
  short: ELBO
  long: Evidence Lower Bound
  kind: acronym
  aliases:
    - evidence-lower-bound
  category: part-1-mathematical-foundations/mathematics/calculus-of-variations
  note: evidence-lower-bound
  definition: The lower bound $\expect_q[\log p(x, z) - \log q(z)]$ on the log
    evidence $\log p(x)$, for any distribution $q(z)$ over latent variables. The
    gap is $\KL(q(z) \,\|\, p(z \mid x))$, so maximising the bound over $q$
    approximates the posterior.
elu:
  short: ELU
  long: Exponential Linear Unit
  kind: acronym
  aliases:
    - exponential-linear-unit
  category: part-6-neural-architectures/feedforward-networks/foundations
  see:
    - activation-functions
  definition: The activation equal to $x$ for positive inputs and $\alpha(e^x -
    1)$ for negative ones, which is smooth and has negative outputs that push
    mean activations toward zero.
em-algorithm:
  short: EM
  long: Expectation–Maximisation
  kind: acronym
  sense: algorithm
  aliases:
    - expectation-maximisation
  category: part-1-mathematical-foundations/statistics/estimation
  note: expectation-maximisation
  definition: An algorithm that finds maximum-likelihood estimates when some
    variables are unobserved. It alternates an E step, which computes the
    posterior over the latent variables, and an M step, which maximises the
    expected complete-data log-likelihood; the likelihood never decreases.
embedding:
  long: Embedding
  kind: concept
  category: part-5-learning-paradigms/representation-learning
  see:
    - embeddings-and-output-heads
    - word-embeddings
  definition: A learned map from discrete items, such as tokens, users or
    products, or from raw inputs, to dense vectors in which similar items lie
    close together.
empirical-mode-decomposition:
  short: EMD
  long: Empirical Mode Decomposition
  kind: acronym
  sense: signal decomposition
  category: part-2-signals-systems-and-information/signal-processing/time-frequency
  note: empirical-mode-decomposition
  definition: "Splitting a signal into intrinsic mode functions by sifting:
    repeatedly subtracting the mean of spline envelopes through its maxima and
    minima."
energy-based-model:
  short: EBM
  long: Energy-Based Model
  kind: acronym
  sense: generative model
  category: part-6-neural-architectures/generative-models/other-generative-models
  note: energy-based-models
  definition: A model that defines a density $p(\xvec) \propto \exp(-E(\xvec))$
    through a learned energy function, whose normalising constant is
    intractable.
entropy:
  long: Entropy
  kind: concept
  category: part-2-signals-systems-and-information/information-theory
  note: entropy
  definition: The expected surprisal $\entropy(X) = -\sum_x p(x)\log p(x)$ of a
    discrete random variable, in bits for $\log_2$ and nats for $\ln$. It is the
    least average code length that describes $X$.
ep:
  short: EP
  long: Expectation Propagation
  kind: acronym
  aliases:
    - expectation-propagation
  category: part-4-principles-of-learning/probabilistic-inference/approximate-inference
  note: expectation-propagation
  definition: An approximate inference method that replaces each factor of a
    posterior with an exponential-family site. Each update removes one site,
    multiplies in the true factor and matches the moments of the result.
epistemic-uncertainty:
  long: Epistemic Uncertainty
  kind: concept
  category: part-4-principles-of-learning/decision-theory-and-calibration/uncertainty-quantification
  note: aleatoric-and-epistemic-uncertainty
  definition: Uncertainty from limited knowledge of the model or its parameters,
    which more data can reduce.
epsilon-greedy:
  long: ε-Greedy
  kind: concept
  aliases:
    - epsilon-greedy-policy
    - greedy
  category: part-7-application-domains/online-experimentation/multi-armed-bandits
  note: epsilon-greedy
  definition: A policy that takes the action with the highest estimated value,
    except with probability $\varepsilon$ a uniformly random action.
erm:
  short: ERM
  long: Empirical Risk Minimisation
  kind: acronym
  aliases:
    - empirical-risk-minimisation
  category: part-4-principles-of-learning/learning-theory
  note: empirical-risk-minimisation
  definition: Learning by choosing the hypothesis that minimises the average loss
    on the training sample, as an estimate of the expected loss on the data
    distribution.
err-metric:
  short: ERR
  long: Expected Reciprocal Rank
  kind: acronym
  aliases:
    - expected-reciprocal-rank
    - err
  category: part-7-application-domains/recommendation-and-retrieval/evaluation
  note: recommendation-metrics
  definition: "A ranking metric under a cascade model of users: the expected
    reciprocal of the rank at which a user stops, each item stopping the user
    with a probability set by its relevance."
esmm:
  short: ESMM
  long: Entire Space Multi-Task Model
  kind: acronym
  category: part-7-application-domains/recommendation-and-retrieval/loss-families
  see:
    - pointwise-recommendation-losses
  definition: A multi-task model that learns conversion rate over all impressions
    by predicting click-through rate and the probability of a click followed by
    a conversion, whose ratio is the conversion rate.
ess:
  short: ESS
  long: Effective Sample Size
  kind: acronym
  aliases:
    - effective-sample-size
  category: part-4-principles-of-learning/probabilistic-inference/monte-carlo
  see:
    - markov-chain-monte-carlo-diagnostics
    - particle-filter
  definition: The number of independent samples that would give an estimate the
    same variance as a set of correlated or weighted samples. For a Markov chain
    it is the chain length divided by the integrated autocorrelation time.
ets:
  short: ETS
  long: Error, Trend, Seasonal Model
  kind: acronym
  aliases:
    - error-trend-seasonal-model
  category: part-7-application-domains/time-series/exponential-smoothing
  note: error-trend-seasonal-models
  definition: The state-space form of exponential smoothing, labelled by its error
    (additive or multiplicative), trend and seasonal components. One noise term
    drives observation and states, which gives a likelihood.
evidence:
  long: Marginal Likelihood
  kind: concept
  aliases:
    - marginal-likelihood
  category: part-1-mathematical-foundations/probability/theory
  note: law-of-total-probability
  definition: The probability of the data with the parameters integrated out,
    $p(x) = \int p(x \mid \theta)\,p(\theta)\,d\theta$. It normalises the
    posterior and compares models in Bayesian model selection.
evt:
  short: EVT
  long: Extreme Value Theory
  kind: acronym
  aliases:
    - peaks-over-threshold
    - extreme-value-theory
  category: part-5-learning-paradigms/anomaly-detection/statistical-methods
  note: extreme-value-theory-for-anomalies
  definition: The theory of the distribution of extremes. Excesses over a high
    threshold approximately follow a generalised Pareto distribution, which sets
    anomaly thresholds for small false-alarm rates.
exact-match:
  short: EM
  long: Exact Match
  kind: acronym
  sense: question answering
  aliases:
    - em-exact-match
  category: part-4-principles-of-learning/evaluation-metrics/text-metrics
  note: squad-exact-match-and-f1
  definition: The fraction of questions whose normalised predicted answer equals a
    normalised gold answer, taking the best over the gold answers.
examination-hypothesis:
  long: Examination Hypothesis
  kind: concept
  aliases:
    - examination-model
  category: part-7-application-domains/recommendation-and-retrieval/learning-to-rank
  see:
    - click-models
    - unbiased-learning-to-rank
  definition: "The assumption that a result is clicked if and only if it is
    examined and relevant, with examination depending only on its rank: $P(C = 1
    \\mid d, k) = P(E = 1 \\mid k)\\,P(R = 1 \\mid d)$."
exp3:
  short: EXP3
  long: Exponential-Weight Algorithm for Exploration and Exploitation
  kind: proper-name
  aliases:
    - exponential-weight-algorithm-for-exploration-and-exploitation
  category: part-7-application-domains/online-experimentation/multi-armed-bandits
  note: exp3
  definition: A bandit algorithm for adversarial rewards that samples arms with
    probabilities proportional to exponentiated importance-weighted reward
    estimates.
expectation:
  long: Expectation
  kind: concept
  aliases:
    - expected-value
  category: part-1-mathematical-foundations/probability/theory
  note: expectation
  definition: "The probability-weighted average $\\expect[X] = \\sum_x x\\,p(x)$,
    or $\\int x\\,p(x)\\,dx$ for a density, of a random variable. It is linear:
    $\\expect[aX + bY] = a\\expect[X] + b\\expect[Y]$ for any $X$ and $Y$."
explainable-boosting-machine:
  short: EBM
  long: Explainable Boosting Machine
  kind: acronym
  sense: interpretable model
  category: part-5-learning-paradigms/supervised-learning/generalised-additive-models
  note: explainable-boosting-machines
  definition: A generalised additive model with a few pairwise interactions, each
    term learned by boosting shallow trees on one feature at a time.
exploration-exploitation:
  long: Exploration–Exploitation Trade-Off
  kind: concept
  aliases:
    - exploration-exploitation-trade-off
  category: part-7-application-domains/online-experimentation/multi-armed-bandits
  see:
    - multi-armed-bandit
    - exploration-in-reinforcement-learning
  definition: The tension between choosing actions known to be good (exploitation)
    and trying uncertain ones to learn more about them (exploration).
exponential-family:
  long: Exponential Family
  kind: concept
  category: part-1-mathematical-foundations/probability/theory
  note: exponential-family
  definition: A family of distributions of the form $p(x \mid \etavec) =
    h(x)\exp(\etavec^\top T(x) - A(\etavec))$ with natural parameters $\etavec$,
    sufficient statistics $T(x)$ and log-partition function $A$. The Gaussian,
    Bernoulli, Poisson, Gamma and Dirichlet are members.
f1:
  short: $F_1$
  long: F1 Score
  kind: concept
  aliases:
    - f1-score
    - f-1
    - f-score
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  note: precision-recall-and-f-score
  definition: The harmonic mean of precision and recall, $2PR/(P + R)$. The
    $F_\beta$ score weights recall $\beta$ times as much as precision.
factor-analysis:
  long: Factor Analysis
  kind: concept
  category: part-5-learning-paradigms/unsupervised-learning/dimensionality-reduction
  note: factor-analysis
  definition: A linear-Gaussian latent variable model $\xvec = \Wmat\zvec + \muvec
    + \epsilonvec$ with a diagonal noise covariance, so each observed variable
    has its own noise variance.
factor-graph:
  long: Factor Graph
  kind: concept
  category: part-4-principles-of-learning/probabilistic-inference/graphical-models
  note: factor-graph
  definition: A bipartite graph with one node per variable and one per factor of a
    joint distribution, with an edge wherever a factor depends on a variable.
    Message passing runs on it.
fairness-criteria:
  long: Group Fairness Criteria
  kind: concept
  aliases:
    - demographic-parity
    - equalised-odds
    - equal-opportunity
    - group-fairness-criteria
  category: part-8-practice/trustworthy-machine-learning/fairness
  note: fairness-criteria
  definition: "Statistical conditions on a classifier across groups: independence
    of prediction and group (demographic parity), equal error rates (equalised
    odds) or equal true-positive rates (equal opportunity)."
faiss:
  short: FAISS
  long: FAISS
  kind: proper-name
  category: part-5-learning-paradigms/supervised-learning/nearest-neighbours/approximate-nearest-neighbours
  note: faiss
  definition: Meta's library for vector search, clustering and compression, whose
    indexes chain a transform, a coarse quantiser, a vector encoding and
    optional re-ranking. It runs on CPUs and GPUs.
fcdd:
  short: FCDD
  long: Fully Convolutional Data Description
  kind: acronym
  aliases:
    - fully-convolutional-data-description
  category: part-5-learning-paradigms/anomaly-detection/deep-one-class-methods
  note: fully-convolutional-data-description
  definition: An anomaly detector that trains a fully convolutional network with a
    hypersphere-style loss, so its output map both scores an image and locates
    the anomaly.
fdr:
  short: FDR
  long: False Discovery Rate
  kind: acronym
  aliases:
    - false-discovery-rate
  category: part-1-mathematical-foundations/statistics/hypothesis-testing
  note: multiple-testing
  definition: The expected fraction of false rejections among all rejections in a
    family of tests. The Benjamini–Hochberg procedure controls it at a chosen
    level.
feature-attribution:
  long: Feature Attribution
  kind: concept
  aliases:
    - saliency
    - integrated-gradients
  category: part-8-practice/trustworthy-machine-learning/interpretability
  note: feature-attribution-methods
  definition: Assigning each input feature a share of a model's prediction, by
    gradients, perturbations or Shapley values.
federated-learning:
  long: Federated Learning
  kind: concept
  category: part-8-practice/trustworthy-machine-learning/privacy
  note: federated-learning
  definition: Training a shared model across many devices or sites that keep their
    data local and send only model updates to a server that averages them.
fft:
  short: FFT
  long: Fast Fourier Transform
  kind: acronym
  aliases:
    - fast-fourier-transform
  category: part-2-signals-systems-and-information/signal-processing/fourier-analysis
  note: fast-fourier-transform
  definition: An algorithm that computes the $N$-point discrete Fourier transform
    in $O(N\log N)$ operations instead of $O(N^2)$, by recursively splitting the
    sum into even and odd samples.
fhmm:
  short: FHMM
  long: Factorial Hidden Markov Model
  kind: acronym
  aliases:
    - factorial-hidden-markov-model
  category: part-5-learning-paradigms/supervised-learning/structured-prediction
  note: factorial-hidden-markov-model
  definition: A hidden Markov model whose state is several independent Markov
    chains that jointly generate each observation. Exact inference is
    exponential in the number of chains.
fid:
  short: FID
  long: Fréchet Inception Distance
  kind: acronym
  aliases:
    - fr-chet-inception-distance
  category: part-4-principles-of-learning/evaluation-metrics/generative-metrics
  note: frechet-inception-distance
  definition: A metric for image generators that fits Gaussians to network
    features of real and generated images and reports the Fréchet distance
    between them. Lower is better.
filter-tree:
  long: Filter Tree
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/classification/multiclass
  see:
    - nested-dichotomies-and-tree-reductions
  definition: A tree reduction of multiclass to binary classification in which
    each internal node decides between the winners of its two subtrees, trained
    on examples filtered by the nodes below; its regret is at most the depth
    times the average binary regret.
fine-tuning:
  long: Fine-Tuning
  kind: concept
  category: part-5-learning-paradigms/representation-learning
  note: transfer-learning-and-fine-tuning
  definition: Continuing to train a pretrained model on data for a new task,
    updating all its weights or a small added subset.
fir:
  short: FIR
  long: Finite Impulse Response Filter
  kind: acronym
  aliases:
    - finite-impulse-response-filter
  category: part-2-signals-systems-and-information/signal-processing/filters
  note: finite-impulse-response-filters
  definition: A filter whose output is a weighted sum of the current and $M$ past
    inputs. It is always stable and can have exactly linear phase.
fisher-consistency:
  long: Fisher Consistency
  kind: concept
  aliases:
    - classification-calibration
    - classification-calibrated-loss
  category:
    - part-4-principles-of-learning/loss-functions/classification-losses
    - part-5-learning-paradigms/supervised-learning/classification/multiclass
  see:
    - surrogate-losses
    - multiclass-support-vector-machines
  definition: The property of a surrogate loss that minimising its expected value
    over scores yields the Bayes classifier's decision, so that driving the
    surrogate risk to its minimum drives the classification risk to its minimum.
fisher-information:
  long: Fisher Information
  kind: concept
  category: part-1-mathematical-foundations/statistics/estimation
  definition: The variance of the score, $I(\theta) = \expect[(\partial_\theta
    \log p(X \mid \theta))^2]$, equal to the expected negative second derivative
    of the log-likelihood under regularity conditions. Its inverse bounds the
    variance of unbiased estimators (the Cramér–Rao bound).
flashattention:
  short: FlashAttention
  long: FlashAttention
  kind: proper-name
  category: part-8-practice/engineering/inference
  note: flash-attention
  definition: An exact attention algorithm that computes attention in tiles that
    fit in on-chip memory, with an online softmax, and never stores the full
    score matrix. It cuts memory traffic, not arithmetic.
floating-point:
  long: Floating-Point Arithmetic
  kind: concept
  aliases:
    - floating-point-arithmetic
  category: part-1-mathematical-foundations/mathematics/numerical-methods
  note: floating-point-arithmetic
  definition: Arithmetic on numbers stored as a sign, a fixed number of
    significant bits and an exponent, as in IEEE 754. Each operation rounds its
    result, with relative error at most the unit roundoff ($2^{-53}$ in double
    precision).
flop:
  short: FLOP
  long: Floating-Point Operation
  kind: acronym
  aliases:
    - floating-point-operation
    - flops
  category: part-8-practice/engineering
  definition: One arithmetic operation on floating-point numbers, such as an
    addition or a multiplication. Counts of FLOPs measure the compute cost of an
    algorithm; FLOP/s measures the speed of hardware.
fm:
  short: FM
  long: Factorisation Machine
  kind: acronym
  aliases:
    - factorisation-machine
  category: part-7-application-domains/recommendation-and-retrieval/feature-interaction-models
  note: factorisation-machines
  definition: A model that scores all pairwise feature interactions with inner
    products of per-feature embeddings,
    $\sum_{i<j}\inner{\vvec_i}{\vvec_j}x_ix_j$, computable in linear time.
fn:
  short: FN
  long: False Negative
  kind: acronym
  aliases:
    - false-negative
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  see:
    - confusion-matrix
    - type-i-and-type-ii-errors
  definition: A positive example that a classifier predicts as negative; a type II error.
forward-backward:
  long: Forward–Backward Algorithm
  kind: concept
  aliases:
    - forward-backward-algorithm
  category: part-5-learning-paradigms/supervised-learning/structured-prediction
  see:
    - hidden-markov-model
    - conditional-random-field
  definition: Dynamic programming that computes every posterior marginal of a
    chain model from forward and backward messages, in $O(NK^2)$ for length $N$
    and $K$ states.
fourier-transform:
  long: Fourier Transform
  kind: concept
  category: part-2-signals-systems-and-information/signal-processing/fourier-analysis
  note: fourier-transform
  definition: The map $X(f) = \int x(t)\,e^{-i2\pi ft}\,dt$ from a function of
    time to its spectrum, a function of frequency. It turns convolution into
    multiplication.
fp:
  short: FP
  long: False Positive
  kind: acronym
  aliases:
    - false-positive
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  see:
    - confusion-matrix
    - type-i-and-type-ii-errors
  definition: A negative example that a classifier predicts as positive; a type I error.
fpr:
  short: FPR
  long: False Positive Rate
  kind: acronym
  aliases:
    - false-positive-rate
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  note: sensitivity-specificity-and-predictive-values
  definition: The fraction of negatives predicted positive,
    $\mathrm{FP}/(\mathrm{FP} + \mathrm{TN})$. It equals one minus the
    specificity.
frequency-response:
  long: Frequency Response
  kind: concept
  category: part-2-signals-systems-and-information/signal-processing/filters
  note: frequency-response
  definition: "The gain and phase shift a linear time-invariant system applies to
    a sinusoid at each frequency: the Fourier transform of its impulse
    response."
ftrl:
  short: FTRL
  long: Follow the Regularised Leader
  kind: acronym
  aliases:
    - follow-the-regularised-leader
  category: part-5-learning-paradigms/online-learning/online-convex-optimisation
  note: follow-the-regularised-leader
  definition: Online learning that plays, each round, the minimiser of the sum of
    all past losses plus a regulariser.
fwer:
  short: FWER
  long: Family-Wise Error Rate
  kind: acronym
  aliases:
    - family-wise-error-rate
  category: part-1-mathematical-foundations/statistics/hypothesis-testing
  note: multiple-testing
  definition: The probability of at least one false rejection among a family of
    hypothesis tests. The Bonferroni correction controls it by testing each of
    $m$ hypotheses at level $\alpha/m$.
gae:
  short: GAE
  long: Generalised Advantage Estimation
  kind: acronym
  aliases:
    - generalised-advantage-estimation
  category: part-5-learning-paradigms/reinforcement-learning/policy-methods
  note: actor-critic
  definition: An estimator of the advantage as an exponentially weighted sum of
    temporal-difference errors, $\sum_l (\gamma\lambda)^l\delta_{t+l}$, where
    $\lambda$ trades bias against variance.
gam:
  short: GAM
  long: Generalised Additive Model
  kind: acronym
  aliases:
    - generalised-additive-model
  category: part-5-learning-paradigms/supervised-learning/generalised-additive-models
  note: generalised-additive-model
  definition: A generalised linear model whose linear predictor is a sum of smooth
    functions of the inputs, $g(\expect[y \mid \xvec]) = \beta_0 + \sum_j
    f_j(x_j)$, each a penalised spline.
gamma-distribution:
  long: Gamma Distribution
  kind: concept
  category: part-1-mathematical-foundations/probability/named-distributions/continuous
  note: gamma-distribution
  definition: The distribution on $(0, \infty)$ with density proportional to
    $x^{\alpha - 1}e^{-\beta x}$ for shape $\alpha$ and rate $\beta$. It is the
    conjugate prior for a Poisson rate or a Gaussian precision.
gan:
  short: GAN
  long: Generative Adversarial Network
  kind: acronym
  aliases:
    - generative-adversarial-network
  category: part-6-neural-architectures/generative-models/other-generative-models
  note: generative-adversarial-network
  definition: A generator that maps noise to samples, trained against a
    discriminator that tells real from generated data in a minimax game. At the
    optimal discriminator the objective is a Jensen–Shannon divergence.
garch:
  short: GARCH
  long: Generalised Autoregressive Conditional Heteroscedasticity
  kind: acronym
  aliases:
    - generalised-autoregressive-conditional-heteroscedasticity
  category: part-7-application-domains/time-series/volatility-models
  note: garch-model
  definition: A model of time-varying volatility in which the conditional variance
    depends on past squared shocks and past variances, $\sigma_t^2 = \omega +
    \alpha r_{t-1}^2 + \beta\sigma_{t-1}^2$ for GARCH(1,1).
gat:
  short: GAT
  long: Graph Attention Network
  kind: acronym
  aliases:
    - graph-attention-network
  category: part-6-neural-architectures/graph-neural-networks
  note: graph-attention-network
  definition: A graph neural network that averages each node's neighbours with
    learned attention weights, a softmax over the neighbourhood of scores
    computed from both endpoints.
gaussian-distribution:
  long: Gaussian Distribution
  kind: concept
  aliases:
    - normal-distribution
  category: part-1-mathematical-foundations/probability/named-distributions/continuous
  note: gaussian-distribution
  definition: The continuous distribution $\Gauss(\mu, \sigma^2)$ with density
    proportional to $\exp(-(x - \mu)^2/2\sigma^2)$. It is the maximum-entropy
    distribution for a given mean and variance and the limit in the central
    limit theorem.
gaussian-integral:
  long: Gaussian Integral
  kind: concept
  category: part-1-mathematical-foundations/mathematics/calculus/integration
  note: gaussian-integral
  definition: The integral $\int_{-\infty}^\infty e^{-x^2}\,dx = \sqrt\pi$, which
    fixes the normalising constant of the Gaussian distribution.
gcn:
  short: GCN
  long: Graph Convolutional Network
  kind: acronym
  aliases:
    - graph-convolutional-network
  category: part-6-neural-architectures/graph-neural-networks
  note: graph-convolutional-network
  definition: A graph neural network whose layer averages each node's features
    with its neighbours' by the degree-normalised adjacency with self-loops,
    $\Hmat' = \sigma(\hat\Amat\Hmat\Wmat)$.
gcv:
  short: GCV
  long: Generalised Cross-Validation
  kind: acronym
  aliases:
    - generalised-cross-validation
  category: part-5-learning-paradigms/supervised-learning/generalised-additive-models
  note: additive-model-smoothing-parameter-selection
  definition: A closed-form approximation of leave-one-out error for linear
    smoothers, $n\norm{\yvec - \hat\yvec}^2/(n - \trace\Amat)^2$ with influence
    matrix $\Amat$. It is used to choose smoothing parameters.
gelu:
  short: GELU
  long: Gaussian Error Linear Unit
  kind: acronym
  aliases:
    - gaussian-error-linear-unit
  category: part-6-neural-architectures/feedforward-networks/foundations
  see:
    - activation-functions
  definition: The activation $\phi(x) = x\,\Phi(x)$, where $\Phi$ is the standard
    Gaussian CDF. It is a smooth version of ReLU and the usual activation in
    transformers such as BERT and GPT-2.
generative-vs-discriminative:
  long: Generative and Discriminative Models
  kind: concept
  aliases:
    - discriminative-model
    - generative-classifier
    - generative-and-discriminative-models
  category: part-5-learning-paradigms/supervised-learning/generative-classifiers
  note: generative-vs-discriminative
  definition: Generative classifiers model the joint $p(\xvec, y)$ and classify by
    Bayes' theorem; discriminative ones model $p(y \mid \xvec)$ or the decision
    boundary directly.
gibbs-sampling:
  long: Gibbs Sampling
  kind: concept
  category: part-4-principles-of-learning/probabilistic-inference/monte-carlo
  note: gibbs-sampling
  definition: A Markov chain Monte Carlo method that updates one variable, or
    block, at a time by sampling from its conditional distribution given all the
    others.
glm:
  short: GLM
  long: Generalised Linear Model
  kind: acronym
  aliases:
    - generalised-linear-model
  category: part-5-learning-paradigms/supervised-learning/generalised-linear-models
  note: generalised-linear-model
  definition: A regression model that draws each response from an
    exponential-dispersion family and links its mean to a linear predictor,
    $g(\mu) = \xvec^\top\betavec$. Linear, logistic and Poisson regression are
    special cases.
gls:
  short: GLS
  long: Generalised Least Squares
  kind: acronym
  aliases:
    - generalised-least-squares
  category: part-1-mathematical-foundations/statistics/regression-analysis
  definition: Least squares for errors with a known covariance $\Sigmamat$,
    minimising $(\yvec - \Xmat\betavec)^\top\Sigmamat^{-1}(\yvec -
    \Xmat\betavec)$. It is ordinary least squares after whitening the errors.
glue:
  short: GLUE
  long: General Language Understanding Evaluation
  kind: proper-name
  aliases:
    - general-language-understanding-evaluation
  category: part-7-application-domains/natural-language-processing/nlp-tasks
  see:
    - language-model-evaluation
  definition: A benchmark of nine English sentence and sentence-pair
    classification tasks, reported as an average score, used to compare
    pretrained language models from 2018.
gmm:
  short: GMM
  long: Gaussian Mixture Model
  kind: acronym
  aliases:
    - gaussian-mixture-model
  category: part-5-learning-paradigms/unsupervised-learning/clustering
  note: gaussian-mixture-model
  definition: A density that is a weighted sum of $k$ Gaussians, each point drawn
    from one component chosen at random. Expectation–maximisation fits it.
gnn:
  short: GNN
  long: Graph Neural Network
  kind: acronym
  aliases:
    - mpnn
    - message-passing
    - graph-neural-network
  category: part-6-neural-architectures/graph-neural-networks
  note: message-passing-neural-network
  definition: A network that updates each node's vector from its own vector and an
    order-independent aggregate of messages from its neighbours. $K$ rounds let
    information travel $K$ hops, and the layers commute with any relabelling of
    the nodes.
gp:
  short: GP
  long: Gaussian Process
  kind: acronym
  aliases:
    - gaussian-process-regression
    - gpr
    - kriging
    - gaussian-process
  category: part-5-learning-paradigms/supervised-learning/gaussian-processes
  note: gaussian-process
  definition: A distribution over functions whose values at any finite set of
    inputs are jointly Gaussian, with covariance given by a kernel. Conditioning
    on noisy observations gives a closed-form posterior mean and variance.
gp-lvm:
  short: GP-LVM
  long: Gaussian Process Latent Variable Model
  kind: acronym
  aliases:
    - gaussian-process-latent-variable-model
  category: part-5-learning-paradigms/supervised-learning/gaussian-processes/gp-latent-variable-models
  note: gaussian-process-latent-variable-model
  definition: A model of each observation as a Gaussian-process function of an
    unobserved low-dimensional point, with the function integrated out and the
    points fitted by maximum likelihood. A linear kernel recovers probabilistic
    PCA.
gpt:
  short: GPT
  long: Generative Pre-trained Transformer
  kind: proper-name
  aliases:
    - generative-pre-trained-transformer
  category: part-6-neural-architectures/transformers/architecture-families
  see:
    - autoregressive-transformer-language-model
    - decoder-only-transformers
    - bert-vs-gpt
  definition: OpenAI's family of decoder-only transformer language models trained
    to predict the next token on large text corpora, from GPT (2018) through
    GPT-2, GPT-3 and later models.
gpt-2:
  short: GPT-2
  long: GPT-2
  kind: proper-name
  category: part-8-practice/case-studies/language-models
  see:
    - gpt-2-vs-deepseek-v3
    - autoregressive-transformer-language-model
  definition: OpenAI's 2019 decoder-only transformer language model, up to 1.5
    billion parameters, trained on web text to predict the next token.
gpt-3:
  short: GPT-3
  long: GPT-3
  kind: proper-name
  category: part-8-practice/case-studies/language-models
  see:
    - in-context-learning
    - autoregressive-transformer-language-model
  definition: OpenAI's 2020 decoder-only transformer language model with 175
    billion parameters, known for few-shot learning from examples in the prompt.
gpu:
  short: GPU
  long: Graphics Processing Unit
  kind: acronym
  aliases:
    - graphics-processing-unit
  category: part-8-practice/engineering
  definition: A processor with thousands of simple cores and high memory
    bandwidth, built for graphics and used to run the dense matrix arithmetic of
    neural networks in parallel.
gqa:
  short: GQA
  long: Grouped-Query Attention
  kind: acronym
  aliases:
    - grouped-query-attention
  category: part-6-neural-architectures/transformers/attention-variants
  note: multi-query-and-grouped-query-attention
  definition: Multi-head attention in which the query heads are split into $g$
    groups that each share one key head and one value head. It interpolates
    between multi-query ($g = 1$) and multi-head attention.
gradient:
  long: Gradient
  kind: concept
  category: part-1-mathematical-foundations/mathematics/calculus/multivariate
  note: gradient
  definition: The vector $\nabla f(\xvec)$ of partial derivatives of a scalar
    function $f$ of several variables. It points in the direction of steepest
    increase, and its length is the rate of increase in that direction.
gradient-descent:
  long: Gradient Descent
  kind: concept
  category: part-1-mathematical-foundations/optimisation/first-order-methods
  note: gradient-descent
  definition: An iterative minimiser that steps against the gradient, $\xvec_{k+1}
    = \xvec_k - \eta\nabla f(\xvec_k)$, with step size or learning rate $\eta$.
granger-causality:
  long: Granger Causality
  kind: concept
  category: part-7-application-domains/time-series/multivariate-time-series
  note: granger-causality
  definition: A series $x$ Granger-causes $y$ when past values of $x$ improve
    forecasts of $y$ beyond what past values of $y$ give. It is predictive, not
    causal, in the interventional sense.
graphsage:
  short: GraphSAGE
  long: Graph Sample and Aggregate
  kind: proper-name
  aliases:
    - graph-sample-and-aggregate
  category: part-7-application-domains/recommendation-and-retrieval/pinsage-family
  note: graphsage
  definition: An inductive graph neural network that builds each node's embedding
    from its own features and an aggregate of a fixed-size sample of its
    neighbours, so it embeds nodes unseen in training.
gru:
  short: GRU
  long: Gated Recurrent Unit
  kind: acronym
  aliases:
    - gated-recurrent-unit
  category: part-6-neural-architectures/sequence-models/recurrent-networks
  note: gated-recurrent-unit
  definition: A recurrent unit that updates its state as a gated interpolation
    between the old state and a candidate, with a reset gate controlling how
    much of the old state the candidate sees. It has two gates to the LSTM's
    three.
gru4rec:
  short: GRU4Rec
  long: GRU4Rec
  kind: proper-name
  category: part-7-application-domains/recommendation-and-retrieval/sequential-recommendation
  see:
    - sequential-recommendation-losses
    - sequential-recommendation-models
  definition: A session-based recommender that runs a gated recurrent unit over
    the items of a session to predict the next one, trained with ranking losses
    such as TOP1 and BPR over sampled negatives.
hallucination:
  long: Hallucination
  kind: concept
  category: part-6-neural-architectures/large-language-models/working-with-llms
  note: hallucination-and-faithfulness
  definition: Fluent generated text that is unsupported by its source or by fact.
    Intrinsic hallucinations contradict the source; extrinsic ones add content
    that cannot be verified from it.
hdp:
  short: HDP
  long: Hierarchical Dirichlet Process
  kind: acronym
  aliases:
    - hierarchical-dirichlet-process
  category: part-5-learning-paradigms/unsupervised-learning/topic-models/extensions
  note: hierarchical-dirichlet-process
  definition: A nonparametric prior in which groups draw distributions from a
    Dirichlet process whose base measure is itself drawn from a Dirichlet
    process, so groups share atoms. As a topic model it infers the number of
    topics.
hebbian-learning:
  long: Hebbian Learning
  kind: concept
  aliases:
    - hebb-rule
    - hebbs-rule
  category: part-6-neural-architectures/feedforward-networks/energy-based-networks
  see:
    - hopfield-network
  definition: The rule that a connection strengthens when the units on both sides
    are active together. For $\pm1$ patterns it gives the Hopfield weights
    $w_{ij} = \frac1N\sum_\mu \xi^\mu_i \xi^\mu_j$.
hedge:
  long: Hedge Algorithm
  kind: concept
  aliases:
    - exponential-weights
    - multiplicative-weights
    - hedge-algorithm
  category: part-5-learning-paradigms/online-learning/prediction-with-expert-advice
  note: hedge-and-exponential-weights
  definition: Prediction with expert advice that weights each expert by
    $\exp(-\eta L_i)$ of its cumulative loss. Its regret against the best expert
    is $O(\sqrt{T\log N})$.
hessian:
  long: Hessian
  kind: concept
  category: part-1-mathematical-foundations/mathematics/calculus/multivariate
  note: hessian
  definition: The matrix of second partial derivatives $H_{ij} = \partial^2 f /
    \partial x_i \partial x_j$ of a scalar function. It describes the local
    curvature of the function, and its eigenvalues classify a stationary point
    as a minimum, maximum or saddle.
hgp:
  short: HGP
  long: Hierarchical Gaussian Process
  kind: acronym
  aliases:
    - hierarchical-gaussian-process
  category: part-5-learning-paradigms/supervised-learning/gaussian-processes/hierarchical-gaussian-processes
  note: hierarchical-gaussian-process
  definition: A Gaussian process model in which each series is a shared
    group-level function plus its own deviation, both Gaussian processes, so
    related series borrow strength.
hierarchical-clustering:
  long: Hierarchical Clustering
  kind: concept
  aliases:
    - agglomerative-clustering
    - dendrogram
  category: part-5-learning-paradigms/unsupervised-learning/clustering
  note: hierarchical-clustering
  definition: Clustering that builds a tree of nested clusters, usually by
    repeatedly merging the two closest clusters under a linkage rule; cutting
    the tree gives a flat clustering.
hierarchical-model:
  long: Hierarchical Model
  kind: concept
  aliases:
    - multilevel-model
  category: part-1-mathematical-foundations/statistics/bayesian-statistics
  note: hierarchical-models
  definition: A model whose parameters are themselves drawn from a distribution
    with shared hyperparameters, such as per-group means drawn from a common
    prior. Groups with little data borrow strength from the others.
hilbert-transform:
  long: Hilbert Transform
  kind: concept
  aliases:
    - analytic-signal
  category: part-2-signals-systems-and-information/signal-processing/fourier-analysis
  note: hilbert-transform
  definition: The operator that shifts every frequency component of a signal by
    $-90°$. Adding $i$ times it to the signal gives the analytic signal, whose
    magnitude and phase are the envelope and instantaneous phase.
hinge-loss:
  long: Hinge Loss
  kind: concept
  category: part-4-principles-of-learning/loss-functions/classification-losses
  see:
    - surrogate-losses
    - support-vector-machine
  definition: The loss $\max(0, 1 - yf(\xvec))$ for labels $y \in \set{-1, +1}$
    and a real score $f(\xvec)$. It is zero for correct predictions beyond
    margin 1; the support vector machine minimises it.
hjb:
  short: HJB
  long: Hamilton–Jacobi–Bellman Equation
  kind: acronym
  aliases:
    - hamilton-jacobi-bellman-equation
  category: part-2-signals-systems-and-information/control-theory/optimal-control
  note: hamilton-jacobi-bellman-equation
  definition: The partial differential equation satisfied by the optimal value
    function of a continuous-time optimal control problem, the continuous-time
    form of the Bellman equation.
hmc:
  short: HMC
  long: Hamiltonian Monte Carlo
  kind: acronym
  aliases:
    - hamiltonian-monte-carlo
  category: part-4-principles-of-learning/probabilistic-inference/monte-carlo
  note: hamiltonian-monte-carlo
  definition: A Markov chain Monte Carlo method that adds a momentum variable and
    simulates Hamiltonian dynamics with the leapfrog integrator to propose
    distant moves with high acceptance probability. It uses the gradient of the
    log density.
hmm:
  short: HMM
  long: Hidden Markov Model
  kind: acronym
  aliases:
    - hidden-markov-model
  category: part-5-learning-paradigms/supervised-learning/structured-prediction
  note: hidden-markov-model
  definition: "A generative model of a sequence: a Markov chain of hidden states,
    each emitting an observation. Forward–backward gives every posterior
    marginal and Viterbi the most probable state sequence."
hnsw:
  short: HNSW
  long: Hierarchical Navigable Small World
  kind: acronym
  aliases:
    - hierarchical-navigable-small-world
  category: part-5-learning-paradigms/supervised-learning/nearest-neighbours/approximate-nearest-neighbours
  note: hnsw
  definition: An approximate nearest-neighbour index that stores vectors in a
    stack of proximity graphs with sparse upper layers. A query descends
    greedily from the top and finishes with a beam search on the bottom layer.
holt-winters:
  long: Holt–Winters Method
  kind: concept
  aliases:
    - holt-winters-method
  category: part-7-application-domains/time-series/exponential-smoothing
  note: holt-winters
  definition: Exponential smoothing with separate smoothed level, trend and
    seasonal components, additive or multiplicative.
homography:
  long: Homography
  kind: concept
  category: part-7-application-domains/computer-vision/geometry
  note: homography
  definition: An invertible projective map between two planes, a $3 \times 3$
    matrix up to scale, which relates two images of a planar scene or two images
    taken from the same centre.
hopfield-network:
  long: Hopfield Network
  kind: concept
  aliases:
    - hopfield-net
  category: part-6-neural-architectures/feedforward-networks/energy-based-networks
  note: hopfield-network
  definition: A recurrent network of binary units with symmetric Hebbian weights
    that stores patterns as minima of an energy and recalls one from a corrupted
    cue by updating units one at a time to the sign of their input.
hough-transform:
  long: Hough Transform
  kind: concept
  aliases:
    - hough-space
    - hough-lines
  category: part-7-application-domains/computer-vision/image-processing
  note: hough-transform
  definition: A voting method that finds straight lines among edge points. Each
    point votes for every line $x\cos\theta + y\sin\theta = \rho$ through it,
    and peaks in the $(\theta, \rho)$ accumulator are the detected lines.
hstu:
  short: HSTU
  long: Hierarchical Sequential Transduction Unit
  kind: acronym
  category: part-7-application-domains/recommendation-and-retrieval/generative-recommendation
  see:
    - generative-recommendation-losses
  definition: A sequential architecture for recommendation, a transformer variant
    with pointwise aggregated attention, used to train generative retrieval and
    ranking models on sequences of user actions.
hyperparameter:
  long: Hyperparameter
  kind: concept
  category: part-4-principles-of-learning/model-selection
  see:
    - hyperparameter-search
  definition: A setting of a learning algorithm that is fixed before training
    rather than learned by it, such as a learning rate, a regularisation
    strength or the number of trees.
ica:
  short: ICA
  long: Independent Component Analysis
  kind: acronym
  aliases:
    - independent-component-analysis
  category: part-5-learning-paradigms/unsupervised-learning/dimensionality-reduction
  note: independent-component-analysis
  definition: Recovering statistically independent non-Gaussian sources from
    linear mixtures of them, by finding an unmixing matrix that makes the
    outputs as non-Gaussian or as independent as possible.
icl:
  short: ICL
  long: In-Context Learning
  kind: acronym
  aliases:
    - few-shot-prompting
    - in-context-learning
  category: part-6-neural-architectures/large-language-models/working-with-llms
  note: in-context-learning
  definition: A language model performing a task from demonstrations in its
    prompt, without any change to its weights.
idf:
  short: IDF
  long: Inverse Document Frequency
  kind: acronym
  aliases:
    - inverse-document-frequency
  category: part-7-application-domains/natural-language-processing/text-representation
  note: term-frequency-inverse-document-frequency
  definition: "The term weight $\\log(N/\\mathrm{df}_t)$ for a term that occurs in
    $\\mathrm{df}_t$ of $N$ documents: high for rare terms, zero for a term in
    every document."
iid:
  short: i.i.d.
  long: Independent and Identically Distributed
  kind: acronym
  aliases:
    - independent-and-identically-distributed
    - i-i-d
  category: part-1-mathematical-foundations/probability/theory
  note: independence
  definition: Describes random variables that are mutually independent and share
    one distribution. Most estimators and learning guarantees assume i.i.d.
    samples.
iir:
  short: IIR
  long: Infinite Impulse Response Filter
  kind: acronym
  aliases:
    - infinite-impulse-response-filter
  category: part-2-signals-systems-and-information/signal-processing/filters
  note: infinite-impulse-response-filters
  definition: A filter that feeds past outputs back, so its impulse response never
    ends. Poles give sharp responses at low order, but stability needs every
    pole inside the unit circle.
image-classification:
  long: Image Classification
  kind: concept
  category: part-7-application-domains/computer-vision/recognition
  note: image-classification
  definition: Assigning one label from a fixed set to a whole image.
imagenet:
  short: ImageNet
  long: ImageNet
  kind: proper-name
  category: part-7-application-domains/computer-vision/recognition
  see:
    - image-classification
    - classic-convolutional-network-architectures
  definition: A dataset of labelled photographs; its 1000-class subset of about
    1.28 million training images, used in the ImageNet challenge from 2010 to
    2017, was the standard image classification benchmark.
imf:
  short: IMF
  long: Intrinsic Mode Function
  kind: acronym
  aliases:
    - intrinsic-mode-function
  category: part-2-signals-systems-and-information/signal-processing/time-frequency
  note: empirical-mode-decomposition
  definition: "A component produced by empirical mode decomposition: an
    oscillation with zero mean envelope whose numbers of extrema and zero
    crossings differ by at most one."
implicit-feedback:
  long: Implicit Feedback
  kind: concept
  aliases:
    - explicit-feedback
  category: part-7-application-domains/recommendation-and-retrieval/foundations
  note: explicit-and-implicit-feedback
  definition: Interactions such as clicks, plays or purchases that signal
    preference indirectly, as opposed to explicit ratings. Unobserved items are
    a mix of negatives and items never seen.
importance-sampling:
  long: Importance Sampling
  kind: concept
  category: part-4-principles-of-learning/probabilistic-inference/monte-carlo
  note: importance-sampling
  definition: Estimation of $\expect_p[f]$ from samples of a proposal $q$,
    weighting each sample by $p(x)/q(x)$. The estimate is unbiased when $q$
    covers the support of $p f$, but its variance explodes when the weights vary
    widely.
impulse-response:
  long: Impulse Response
  kind: concept
  category: part-2-signals-systems-and-information/signal-processing/signals-and-systems
  note: linear-time-invariant-systems
  definition: The output of a linear time-invariant system when its input is a
    unit impulse. It determines the system's response to every input by
    convolution.
independence:
  long: Independence
  kind: concept
  category: part-1-mathematical-foundations/probability/theory
  note: independence
  definition: Random variables $X$ and $Y$ are independent when their joint
    distribution factorises, $p(x, y) = p(x)\,p(y)$, so learning one says
    nothing about the other.
infonce:
  short: InfoNCE
  long: InfoNCE
  kind: proper-name
  aliases:
    - nt-xent
  category: part-5-learning-paradigms/representation-learning
  note: contrastive-learning
  definition: The contrastive loss $-\log\frac{\exp(s(\xvec,
    \yvec^+)/\tau)}{\sum_j \exp(s(\xvec, \yvec_j)/\tau)}$ over one positive and
    $N - 1$ negatives. It gives the bound $I \ge \log N - \mathcal{L}$ on the
    mutual information between views.
inner-product:
  long: Inner Product
  kind: concept
  aliases:
    - dot-product
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: dot-product
  definition: The dot product $\inner{\xvec}{\yvec} = \sum_i x_i y_i =
    \norm{\xvec}\norm{\yvec}\cos\theta$ of two vectors, where $\theta$ is the
    angle between them. It is zero exactly when the vectors are orthogonal.
interleaving:
  long: Interleaving
  kind: concept
  category: part-7-application-domains/online-experimentation/foundations
  note: interleaving
  definition: Comparing two rankers online by merging their result lists into one
    list shown to each user and crediting each ranker with the clicks on its
    results.
iou:
  short: IoU
  long: Intersection Over Union
  kind: acronym
  aliases:
    - intersection-over-union
    - jaccard-index
  category: part-4-principles-of-learning/evaluation-metrics/detection-and-segmentation-metrics
  note: intersection-over-union
  definition: The area of overlap of two regions divided by the area of their
    union, in $[0, 1]$. Object detectors count a predicted box as correct when
    its IoU with a true box exceeds a threshold such as 0.5.
ips:
  short: IPS
  long: Inverse Propensity Scoring
  kind: acronym
  aliases:
    - inverse-propensity-weighting
    - ipw
    - inverse-propensity-scoring
  category: part-7-application-domains/online-experimentation/contextual-bandits
  note: off-policy-evaluation
  definition: Correcting a biased sample by weighting each observation by the
    inverse of its probability of being observed or chosen, such as $\pi(a \mid
    x)/\pi_0(a \mid x)$ in off-policy evaluation. It is unbiased when
    propensities are known and positive.
irls:
  short: IRLS
  long: Iteratively Reweighted Least Squares
  kind: acronym
  aliases:
    - iteratively-reweighted-least-squares
  category: part-5-learning-paradigms/supervised-learning/generalised-linear-models
  note: iteratively-reweighted-least-squares
  definition: An algorithm that fits a generalised linear model by repeatedly
    solving a weighted least-squares problem on a linearised working response.
    Each step is a Fisher-scoring step.
irt:
  short: IRT
  long: Item Response Theory
  kind: acronym
  aliases:
    - item-response-theory
  category: part-4-principles-of-learning/probabilistic-inference/skill-rating
  note: item-response-theory
  definition: Models of the probability that a person answers a test item
    correctly as a function of the person's ability and the item's difficulty,
    discrimination and guessing parameters.
ising-model:
  long: Ising Model
  kind: concept
  category: part-6-neural-architectures/feedforward-networks/energy-based-networks
  note: ising-model
  definition: A model of binary spins $s_i = \pm1$ with pairwise couplings and
    fields, energy $E(\svec) = -\sum_{i<j} J_{ij}s_is_j - \sum_i h_is_i$ and
    Boltzmann distribution $e^{-E/T}/Z$. On the square lattice it has a phase
    transition.
isolation-forest:
  long: Isolation Forest
  kind: concept
  aliases:
    - iforest
  category: part-5-learning-paradigms/anomaly-detection/isolation-and-ensembles
  note: isolation-forest
  definition: An anomaly detector that isolates points with random axis-aligned
    splits. Anomalies are isolated in fewer splits, so a short average path
    length gives a high score.
isomap:
  short: Isomap
  long: Isomap
  kind: proper-name
  category: part-5-learning-paradigms/unsupervised-learning/manifold-learning
  note: isomap
  definition: Manifold learning that estimates geodesic distances by shortest
    paths in a nearest-neighbour graph and embeds them with classical
    multidimensional scaling.
ivf:
  short: IVF
  long: Inverted File Index
  kind: acronym
  aliases:
    - inverted-file-index
  category: part-5-learning-paradigms/supervised-learning/nearest-neighbours/approximate-nearest-neighbours
  note: inverted-file-index
  definition: An approximate nearest-neighbour index that partitions vectors by a
    coarse k-means quantiser and searches only the lists of the few centroids
    nearest the query.
jacobian:
  long: Jacobian
  kind: concept
  category: part-1-mathematical-foundations/mathematics/calculus/multivariate
  note: jacobian
  definition: The matrix of first partial derivatives $J_{ij} = \partial f_i /
    \partial x_j$ of a vector-valued function $\fvec$. It is the best linear
    approximation of $\fvec$ near a point.
jensens-inequality:
  long: Jensen's Inequality
  kind: concept
  category: part-1-mathematical-foundations/probability/theory
  note: expectation
  definition: For a convex function $f$, $f(\expect[X]) \le \expect[f(X)]$; the
    inequality reverses for a concave $f$. It underlies the evidence lower bound
    and the non-negativity of the KL divergence.
js:
  short: JS
  long: Jensen–Shannon Divergence
  kind: acronym
  aliases:
    - jensen-shannon-divergence
  category: part-2-signals-systems-and-information/information-theory
  note: f-divergences-and-jensen-shannon
  definition: The symmetrised divergence $\frac12\KL(p \,\|\, m) + \frac12\KL(q
    \,\|\, m)$ with $m = \frac12(p + q)$. It is bounded by $\log 2$, and its
    square root is a metric.
jvp:
  short: JVP
  long: Jacobian-Vector Product
  kind: acronym
  aliases:
    - jacobian-vector-product
  category: part-1-mathematical-foundations/mathematics/calculus/automatic-differentiation
  note: jacobian-vector-products-and-higher-order-derivatives
  definition: The product $\Jmat\vvec$ of a function's Jacobian with a vector,
    computed by one forward-mode pass without forming $\Jmat$.
k-means:
  short: k-means
  long: k-Means Clustering
  kind: concept
  aliases:
    - k-means-clustering
  category: part-5-learning-paradigms/unsupervised-learning/clustering
  note: k-means
  definition: Clustering that alternates assigning each point to its nearest of
    $k$ centroids and moving each centroid to the mean of its points. It
    decreases the within-cluster sum of squares to a local minimum.
kalman-filter:
  long: Kalman Filter
  kind: concept
  category: part-7-application-domains/time-series/state-space-models
  note: kalman-filter
  definition: The recursive algorithm that computes the Gaussian posterior of the
    state of a linear-Gaussian state-space model from the observations so far,
    alternating a predict step and an update step.
kalman-observer:
  long: State Observer
  kind: concept
  aliases:
    - luenberger-observer
    - state-observer
  category: part-2-signals-systems-and-information/control-theory/state-space-control
  note: state-observer
  definition: A dynamical system that estimates the state of a plant from its
    inputs and outputs, correcting a model prediction by a gain times the output
    error.
kalman-smoother:
  long: Kalman Smoother
  kind: concept
  aliases:
    - rauch-tung-striebel-smoother
  category: part-7-application-domains/time-series/state-space-models
  note: kalman-smoother
  definition: A backward pass after the Kalman filter that computes the posterior
    of each state given all the observations, before and after it.
kde:
  short: KDE
  long: Kernel Density Estimation
  kind: acronym
  aliases:
    - kernel-density-estimation
  category: part-5-learning-paradigms/unsupervised-learning/density-estimation
  note: kernel-density-estimation
  definition: Estimating a density as the average of kernels, such as Gaussians,
    of bandwidth $h$ centred on the data points. The bandwidth trades bias
    against variance.
kernel-pca:
  long: Kernel Principal Component Analysis
  kind: concept
  aliases:
    - kernel-principal-component-analysis
  category: part-5-learning-paradigms/unsupervised-learning/dimensionality-reduction
  note: kernel-principal-component-analysis
  definition: Principal component analysis in a kernel's feature space, computed
    from the eigenvectors of the centred Gram matrix.
kernel-trick:
  long: Kernel Trick
  kind: concept
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: kernel-trick
  definition: Replacing every inner product $\xvec^\top\xvec'$ in an algorithm by
    a kernel $k(\xvec, \xvec') = \inner{\phi(\xvec)}{\phi(\xvec')}$, which runs
    the algorithm in a feature space without computing $\phi$.
kid:
  short: KID
  long: Kernel Inception Distance
  kind: acronym
  aliases:
    - kernel-inception-distance
  category: part-4-principles-of-learning/evaluation-metrics/generative-metrics
  note: kernel-inception-distance
  definition: The squared maximum mean discrepancy between network features of
    real and generated images with a cubic polynomial kernel. Unlike FID it has
    an unbiased estimator.
kkt:
  short: KKT
  long: Karush–Kuhn–Tucker Conditions
  kind: acronym
  aliases:
    - karush-kuhn-tucker-conditions
  category: part-1-mathematical-foundations/optimisation/constrained-optimisation
  note: karush-kuhn-tucker-conditions
  definition: "The first-order optimality conditions for a problem with inequality
    constraints $f_i(\\xvec) \\le 0$: stationarity of the Lagrangian,
    feasibility, non-negative multipliers $\\lambda_i \\ge 0$ and complementary
    slackness $\\lambda_i f_i(\\xvec) = 0$. For convex problems that satisfy a
    constraint qualification they are necessary and sufficient."
kl:
  short: KL
  long: Kullback–Leibler Divergence
  kind: acronym
  aliases:
    - kullback-leibler-divergence
    - kl-divergence
  category: part-2-signals-systems-and-information/information-theory
  note: kullback-leibler-divergence
  definition: The divergence $\KL(p \,\|\, q) = \expect_p[\log p(X)/q(X)]$ of a
    distribution $q$ from a reference $p$. It is non-negative, zero only when $q
    = p$, and not symmetric.
kl-ucb:
  short: KL-UCB
  long: Kullback–Leibler Upper Confidence Bound
  kind: acronym
  aliases:
    - kullback-leibler-upper-confidence-bound
  category: part-7-application-domains/online-experimentation/multi-armed-bandits
  note: kullback-leibler-upper-confidence-bound
  definition: A bandit policy that plays the arm with the largest mean $q$ whose
    Bernoulli KL divergence from the arm's sample mean, times its pull count, is
    at most $\log t$. Its regret matches the lower bound for Bernoulli rewards.
knn:
  short: k-NN
  long: k-Nearest Neighbours
  kind: acronym
  aliases:
    - k-nearest-neighbors
    - knn-classifier
    - k-nearest-neighbours
    - k-nn
  category: part-5-learning-paradigms/supervised-learning/nearest-neighbours
  note: k-nearest-neighbours
  definition: "A method that predicts at $\\xvec$ from the $k$ training points
    closest to it: the majority class for classification, the mean target for
    regression."
knowledge-distillation:
  long: Knowledge Distillation
  kind: concept
  category: part-8-practice/engineering/inference
  note: knowledge-distillation
  definition: Training a small student model to match a large teacher's output
    distribution, softened by a temperature, as well as the labels.
kpss:
  short: KPSS
  long: Kwiatkowski–Phillips–Schmidt–Shin Test
  kind: acronym
  aliases:
    - kwiatkowski-phillips-schmidt-shin-test
  category: part-7-application-domains/time-series/foundations
  note: differencing-and-unit-roots
  definition: A test whose null hypothesis is that a series is stationary around a
    level or trend, the reverse of the augmented Dickey–Fuller test's null of a
    unit root.
kv-cache:
  short: KV cache
  long: Key-Value Cache
  kind: acronym
  aliases:
    - key-value-cache
  category: part-8-practice/engineering/inference
  note: key-value-cache
  definition: The stored attention keys and values of all earlier tokens during
    autoregressive decoding, so each new token computes only its own. It trades
    memory for time.
l-bfgs:
  short: L-BFGS
  long: Limited-Memory Broyden–Fletcher–Goldfarb–Shanno
  kind: acronym
  aliases:
    - limited-memory-broyden-fletcher-goldfarb-shanno
    - lbfgs
  category: part-1-mathematical-foundations/optimisation/second-order-methods
  note: quasi-newton-methods
  definition: A quasi-Newton method that stores only the last $m$ pairs of step
    and gradient differences and applies the BFGS inverse-Hessian approximation
    implicitly. Its memory is $O(md)$ instead of $O(d^2)$ in dimension $d$.
label-noise:
  long: Label Noise
  kind: concept
  aliases:
    - noisy-labels
  category: part-8-practice/trustworthy-machine-learning/label-noise
  note: learning-with-noisy-labels
  definition: Errors in training labels, uniform, class-dependent or
    instance-dependent, which bias models and evaluation unless modelled or
    cleaned.
label-propagation:
  long: Label Propagation
  kind: concept
  category: part-5-learning-paradigms/semi-supervised-learning
  note: label-propagation
  definition: Semi-supervised learning that spreads labels from labelled to
    unlabelled points over a similarity graph until each node's label
    distribution agrees with its neighbours'.
label-shift:
  long: Label Shift
  kind: concept
  aliases:
    - prior-shift
    - target-shift
  category: part-5-learning-paradigms/transfer-and-meta-learning/domain-adaptation
  note: label-shift-and-target-shift
  definition: Dataset shift in which the class proportions $p(y)$ change while
    $p(\xvec \mid y)$ stays the same.
labelling-function:
  short: LF
  long: Labelling Function
  kind: acronym
  aliases:
    - lf
  category: part-5-learning-paradigms/weak-supervision/programmatic-weak-supervision
  note: data-programming
  definition: A program, such as a keyword rule or a heuristic, that votes a label
    for an example or abstains, used as a noisy source of supervision.
lagrange-multipliers:
  long: Lagrange Multipliers
  kind: concept
  category: part-1-mathematical-foundations/optimisation/constrained-optimisation
  note: lagrange-multipliers
  definition: A method for optimising $f(\xvec)$ subject to equality constraints
    $g(\xvec) = 0$ by finding stationary points of the Lagrangian $f(\xvec) +
    \lambda g(\xvec)$. At a constrained optimum the gradient of $f$ is parallel
    to the gradient of the constraint.
lambdamart:
  short: LambdaMART
  long: LambdaMART
  kind: proper-name
  category: part-7-application-domains/recommendation-and-retrieval/loss-families
  note: lambda-gradients
  definition: "A learning-to-rank method that fits gradient-boosted trees to
    lambda gradients: pairwise gradients scaled by the change in NDCG from
    swapping the pair."
lambdarank:
  short: LambdaRank
  long: LambdaRank
  kind: proper-name
  category: part-7-application-domains/recommendation-and-retrieval/loss-families
  note: lambda-gradients
  definition: A learning-to-rank method that trains on RankNet's pair gradients,
    each multiplied by the absolute change in NDCG from swapping the two items,
    with no closed-form loss.
language-model:
  long: Language Model
  kind: concept
  category: part-7-application-domains/natural-language-processing/language-models
  see:
    - autoregressive-transformer-language-model
  definition: A probability distribution over sequences of tokens, usually
    factorised as $p(x_1, \dots, x_T) = \prod_t p(x_t \mid x_{<t})$.
laplace-approximation:
  long: Laplace Approximation
  kind: concept
  category: part-1-mathematical-foundations/mathematics/calculus/integration
  note: laplace-approximation
  definition: A Gaussian approximation of a distribution centred at its mode, with
    covariance equal to the inverse of the negative Hessian of the log density
    there.
lasso:
  long: Lasso
  kind: concept
  aliases:
    - least-absolute-shrinkage-and-selection-operator
    - l1-regularisation
  category: part-5-learning-paradigms/supervised-learning/regression/linear
  note: lasso
  definition: Least squares with an L1 penalty $\lambda\norm{\wvec}_1$ on the
    coefficients. The penalty sets some coefficients exactly to zero, so it
    selects variables.
latent-dirichlet-allocation:
  short: LDA
  long: Latent Dirichlet Allocation
  kind: acronym
  sense: topic model
  category: part-5-learning-paradigms/unsupervised-learning/topic-models/foundations
  note: latent-dirichlet-allocation
  definition: A topic model in which each document is a mixture of $K$ topics with
    Dirichlet-distributed proportions, and each word is drawn by choosing a
    topic and then a word from it.
layer-normalisation:
  short: LayerNorm
  long: Layer Normalisation
  kind: concept
  aliases:
    - layer-norm
    - layernorm
  category: part-6-neural-architectures/feedforward-networks/training
  note: layer-normalisation
  definition: A layer that standardises the $d$ features of one example, $(\xvec -
    \mu)/\sqrt{\sigma^2 + \epsilon}$ with statistics over features, then applies
    a learned per-feature scale and shift. It does not depend on the batch.
ldm:
  short: LDM
  long: Latent Diffusion Model
  kind: acronym
  aliases:
    - stable-diffusion
    - latent-diffusion-model
  category: part-6-neural-architectures/generative-models/diffusion-models
  note: latent-diffusion
  definition: A diffusion model run in the latent space of a pretrained
    autoencoder instead of pixel space, which makes high-resolution generation
    cheaper.
learning-rate:
  long: Learning Rate
  kind: concept
  aliases:
    - step-size
  category: part-1-mathematical-foundations/optimisation/first-order-methods
  see:
    - gradient-descent
  definition: The step size $\eta$ that scales each gradient step in
    gradient-based training. Too small a value makes progress slow; too large a
    value makes the iterates oscillate or diverge.
learning-rate-schedule:
  long: Learning-Rate Schedule
  kind: concept
  aliases:
    - warmup
    - cosine-decay
  category: part-6-neural-architectures/feedforward-networks/training
  note: learning-rate-schedules
  definition: A rule that changes the learning rate during training, typically a
    short linear warm-up followed by cosine or step decay.
lemmatisation:
  long: Lemmatisation
  kind: concept
  category: part-7-application-domains/natural-language-processing/text-representation
  note: lemmatisation
  definition: Reducing each word to its dictionary form, its lemma, using its part
    of speech and a vocabulary, such as "better" to "good".
lightgcn:
  short: LightGCN
  long: Light Graph Convolution Network
  kind: proper-name
  aliases:
    - light-graph-convolution-network
  category: part-7-application-domains/recommendation-and-retrieval/graph-recommenders
  note: lightgcn
  definition: A graph recommender that propagates user and item embeddings
    linearly over the interaction graph, with no weight matrices or
    nonlinearities, and averages the layers.
likelihood:
  long: Likelihood
  kind: concept
  category: part-1-mathematical-foundations/statistics/estimation
  definition: The probability or density of the observed data as a function of the
    parameters, $L(\theta) = p(x \mid \theta)$ with $x$ held fixed. It is not a
    distribution over $\theta$.
lime:
  short: LIME
  long: Local Interpretable Model-Agnostic Explanations
  kind: acronym
  aliases:
    - local-interpretable-model-agnostic-explanations
  category: part-8-practice/trustworthy-machine-learning/interpretability
  note: feature-attribution-methods
  definition: Explaining one prediction by fitting a sparse linear model to the
    black-box model's outputs on perturbed samples around the input, weighted by
    proximity.
line-search:
  long: Line Search
  kind: concept
  category: part-1-mathematical-foundations/optimisation/second-order-methods
  note: line-search
  definition: A procedure that chooses the step length along a descent direction
    at each iteration, for example by backtracking until the Armijo
    sufficient-decrease condition holds.
linear-attention:
  long: Linear Attention
  kind: concept
  category: part-6-neural-architectures/sequence-models/efficient-sequence-models
  note: linear-attention
  definition: Attention with the softmax similarity replaced by a kernel
    $\phi(\qvec)^\top\phi(\kvec)$, so matrix products reassociate and cost falls
    from quadratic to linear in sequence length. Causal linear attention is a
    recurrent network.
linear-discriminant-analysis:
  short: LDA
  long: Linear Discriminant Analysis
  kind: acronym
  sense: classifier
  aliases:
    - fishers-linear-discriminant
  category: part-5-learning-paradigms/supervised-learning/generative-classifiers
  note: linear-discriminant-analysis
  definition: A generative classifier that models each class as a Gaussian with a
    covariance shared by all classes, which makes the decision boundaries
    linear. Its projection onto the discriminant directions is also used for
    dimensionality reduction.
linear-gaussian-state-space-model:
  long: Linear-Gaussian State-Space Model
  kind: concept
  category: part-7-application-domains/time-series/state-space-models
  note: linear-gaussian-state-space-models
  definition: A model with an unobserved state that evolves by a transition
    equation and generates each observation by an observation equation. With
    linear maps and Gaussian noise, the Kalman filter gives exact inference.
linear-regression:
  long: Linear Regression
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/regression/linear
  note: linear-regression
  definition: A model of a continuous target as a weighted sum of input features
    plus a constant, $\hat y = \wvec^\top\xvec + b$, usually fitted by least
    squares.
link-function:
  long: Link Function
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/generalised-linear-models
  note: generalised-linear-model
  definition: The function $g$ in a generalised linear model that maps the mean
    response to the linear predictor, $g(\mu) = \xvec^\top\betavec$, such as the
    logit for binary outcomes and the log for counts.
linucb:
  short: LinUCB
  long: Linear Upper Confidence Bound
  kind: proper-name
  aliases:
    - linear-upper-confidence-bound
  category: part-7-application-domains/online-experimentation/contextual-bandits
  note: linucb
  definition: A contextual bandit algorithm that models each arm's reward as
    linear in the context and plays the arm with the highest upper confidence
    bound from ridge regression.
listmle:
  short: ListMLE
  long: ListMLE
  kind: proper-name
  category: part-7-application-domains/recommendation-and-retrieval/loss-families
  see:
    - listwise-ranking-losses
    - plackett-luce-model
  definition: "A listwise loss: the negative log-likelihood of the
    relevance-sorted permutation under the Plackett–Luce model whose weights are
    the exponentiated scores."
listnet:
  short: ListNet
  long: ListNet
  kind: proper-name
  category: part-7-application-domains/recommendation-and-retrieval/loss-families
  see:
    - listwise-ranking-losses
  definition: "A listwise loss: the cross-entropy between the softmax of the
    relevance labels and the softmax of the scores, the top-one probabilities of
    two Plackett–Luce distributions."
llama:
  short: LLaMA
  long: LLaMA
  kind: proper-name
  aliases:
    - llama-family
  category: part-8-practice/case-studies/language-models
  note: llama-family
  definition: Meta's family of openly released decoder-only language models, which
    use pre-normalisation with RMSNorm, SwiGLU feed-forward layers and rotary
    position embeddings.
lle:
  short: LLE
  long: Locally Linear Embedding
  kind: acronym
  aliases:
    - locally-linear-embedding
  category: part-5-learning-paradigms/unsupervised-learning/manifold-learning
  note: locally-linear-embedding
  definition: Manifold learning that writes each point as a weighted combination
    of its neighbours and finds low-dimensional coordinates that the same
    weights reconstruct best.
llm:
  short: LLM
  long: Large Language Model
  kind: acronym
  aliases:
    - large-language-model
  category: part-6-neural-architectures/large-language-models
  see:
    - autoregressive-transformer-language-model
  definition: A language model with billions of parameters, usually a decoder-only
    transformer trained to predict the next token on a large text corpus and
    then tuned to follow instructions.
llmaaj:
  short: LLM-as-a-judge
  long: Large Language Model as a Judge
  kind: acronym
  aliases:
    - laaj
    - llm-judge
    - llm-as-judge
    - large-language-model-as-a-judge
    - llm-as-a-judge
  category: part-7-application-domains/recommendation-and-retrieval/evaluation
  note: language-model-as-a-judge
  definition: Using a language model to rate or compare system outputs in place of
    human raters, pointwise, pairwise or by rubric. Judges must be validated
    against human ratings and have known biases toward position, length and
    their own outputs.
lln:
  short: LLN
  long: Law of Large Numbers
  kind: acronym
  aliases:
    - law-of-large-numbers
  category: part-1-mathematical-foundations/probability/limit-theorems
  note: law-of-large-numbers
  definition: "The theorem that the sample mean of i.i.d. variables with finite
    mean $\\mu$ converges to $\\mu$ as the sample grows: in probability (weak
    law) and almost surely (strong law)."
llp:
  short: LLP
  long: Learning from Label Proportions
  kind: acronym
  aliases:
    - learning-from-label-proportions
  category: part-5-learning-paradigms/weak-supervision/learning-from-label-proportions
  note: learning-from-label-proportions
  definition: Learning an instance classifier when only the proportion of each
    class in each bag of instances is known.
lms:
  short: LMS
  long: Least Mean Squares Filter
  kind: acronym
  aliases:
    - least-mean-squares-filter
  category: part-2-signals-systems-and-information/signal-processing/adaptive-and-statistical
  note: least-mean-squares-filter
  definition: An adaptive filter that updates its weights by a stochastic gradient
    step on the squared error at each sample, $\wvec \leftarrow \wvec + \mu
    e[n]\xvec[n]$.
lof:
  short: LOF
  long: Local Outlier Factor
  kind: acronym
  aliases:
    - local-outlier-factor
  category: part-5-learning-paradigms/anomaly-detection/density-and-distance-methods
  note: local-outlier-factor
  definition: An anomaly score that compares a point's local density, from its $k$
    nearest neighbours, with the densities of those neighbours. Values well
    above 1 mark points in sparser regions than their neighbours.
log-loss:
  long: Log Loss
  kind: concept
  aliases:
    - logistic-loss
    - nll
    - negative-log-likelihood
  category: part-4-principles-of-learning/evaluation-metrics/probabilistic-metrics
  note: log-loss-and-brier-score
  definition: The loss $-\log q$ for a predicted probability $q$ on the outcome
    that occurred. Averaged over data it is the cross-entropy between the
    empirical labels and the predictions, and it is a proper scoring rule.
log-sum-exp:
  long: Log-Sum-Exp
  kind: concept
  category: part-1-mathematical-foundations/mathematics/calculus/matrix-calculus
  note: softmax-and-log-sum-exp
  definition: The function $\log\sum_i e^{z_i}$, a smooth upper bound on $\max_i
    z_i$ whose gradient is the softmax. It is computed stably as $m + \log\sum_i
    e^{z_i - m}$ with $m = \max_i z_i$.
logistic-regression:
  long: Logistic Regression
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/classification
  note: logistic-regression
  definition: A linear classifier that models the probability of the positive
    class as $\sigma(\wvec^\top\xvec + b)$, with $\sigma$ the logistic sigmoid,
    fitted by maximising the likelihood (minimising log loss).
logq-correction:
  long: LogQ Correction
  kind: concept
  aliases:
    - log-q-correction
    - sampling-bias-correction
  category:
    - part-4-principles-of-learning/loss-functions/classification-losses
    - part-7-application-domains/natural-language-processing
    - part-7-application-domains/recommendation-and-retrieval
  see:
    - sampled-softmax-and-negative-sampling
  definition: Subtracting the log of each sampled item's proposal probability from
    its score in a sampled softmax, so that frequently sampled items are not
    over-penalised and the loss approaches the full softmax as more are sampled.
loo:
  short: LOO
  long: Leave-One-Out Cross-Validation
  kind: acronym
  aliases:
    - leave-one-out-cross-validation
  category: part-4-principles-of-learning/model-selection
  note: cross-validation
  definition: "Cross-validation with one fold per observation: each point is
    predicted by a model trained on all the others."
lora:
  short: LoRA
  long: Low-Rank Adaptation
  kind: acronym
  aliases:
    - low-rank-adaptation
  category: part-5-learning-paradigms/representation-learning
  see:
    - transfer-learning-and-fine-tuning
  definition: Fine-tuning that freezes the pretrained weights and learns a
    low-rank update $\Delta\Wmat = \Bmat\Amat$ for chosen weight matrices, so
    only a small fraction of parameters is trained and stored.
loss-function:
  long: Loss Function
  kind: concept
  category: part-4-principles-of-learning/learning-theory
  see:
    - empirical-risk-minimisation
  definition: A function $\ell(\hat y, y) \ge 0$ that measures the cost of
    predicting $\hat y$ when the truth is $y$. Training minimises its average
    over the data.
lp:
  short: LP
  long: Linear Programming
  kind: acronym
  aliases:
    - linear-programming
  category: part-1-mathematical-foundations/optimisation/constrained-optimisation
  note: linear-programming
  definition: Optimisation of a linear objective subject to linear equality and
    inequality constraints. The optimum, when it exists, is attained at a vertex
    of the feasible polytope.
lqg:
  short: LQG
  long: Linear–Quadratic–Gaussian Control
  kind: acronym
  aliases:
    - linear-quadratic-gaussian-control
  category: part-2-signals-systems-and-information/control-theory/optimal-control
  note: linear-quadratic-gaussian-control
  definition: Optimal control of a linear system with Gaussian noise and a
    quadratic cost, which separates into a Kalman filter for the state and a
    linear–quadratic regulator acting on the estimate.
lqr:
  short: LQR
  long: Linear–Quadratic Regulator
  kind: acronym
  aliases:
    - linear-quadratic-regulator
  category: part-2-signals-systems-and-information/control-theory/optimal-control
  note: linear-quadratic-regulator
  definition: The optimal state-feedback controller for a linear system with a
    quadratic cost on states and inputs. The gain comes from the solution of a
    Riccati equation.
lsa:
  short: LSA
  long: Latent Semantic Analysis
  kind: acronym
  aliases:
    - latent-semantic-indexing
    - lsi
    - latent-semantic-analysis
  category: part-5-learning-paradigms/unsupervised-learning/topic-models/foundations
  note: latent-semantic-analysis
  definition: A truncated singular value decomposition of a term–document matrix,
    which places terms and documents in a low-dimensional space where related
    words lie close.
lsh:
  short: LSH
  long: Locality-Sensitive Hashing
  kind: acronym
  aliases:
    - locality-sensitive-hashing
  category: part-5-learning-paradigms/supervised-learning/nearest-neighbours/approximate-nearest-neighbours
  note: locality-sensitive-hashing
  definition: Random hash functions under which near points collide more often
    than far ones. Concatenating hashes and using several tables finds near
    neighbours in sublinear time.
lstm:
  short: LSTM
  long: Long Short-Term Memory
  kind: acronym
  aliases:
    - long-short-term-memory
  category: part-6-neural-architectures/sequence-models/recurrent-networks
  note: long-short-term-memory
  definition: A recurrent network with a cell state updated additively and gates
    in $(0, 1)$ that decide what to forget, write and read. Gradients flow along
    the cell state scaled only by the forget gates, so they survive long gaps.
lti:
  short: LTI
  long: Linear Time-Invariant System
  kind: acronym
  aliases:
    - linear-time-invariant-system
  category: part-2-signals-systems-and-information/signal-processing/signals-and-systems
  note: linear-time-invariant-systems
  definition: A system that is linear and whose response to a shifted input is the
    shifted response. Its output is the convolution of the input with its
    impulse response.
ltr:
  short: LTR
  long: Learning to Rank
  kind: acronym
  aliases:
    - learning-to-rank
  category: part-7-application-domains/recommendation-and-retrieval/learning-to-rank
  see:
    - ranking-losses
    - unbiased-learning-to-rank
  definition: Training a scoring function to order items by relevance, with
    pointwise, pairwise or listwise losses.
ltsa:
  short: LTSA
  long: Local Tangent Space Alignment
  kind: acronym
  aliases:
    - local-tangent-space-alignment
  category: part-5-learning-paradigms/unsupervised-learning/manifold-learning
  note: local-tangent-space-alignment-and-hessian-eigenmaps
  definition: Manifold learning that fits a tangent space to each neighbourhood by
    local PCA and aligns the local coordinates into one global embedding.
lu:
  short: LU
  long: Lower-Upper Decomposition
  kind: acronym
  aliases:
    - lower-upper-decomposition
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: lower-upper-decomposition
  definition: A factorisation $\Amat = \Lmat\Umat$ of a square matrix into a
    lower-triangular and an upper-triangular matrix, usually with row pivoting.
    It is Gaussian elimination recorded as matrices, and solves linear systems
    by two triangular solves.
lyapunov-stability:
  long: Lyapunov Stability
  kind: concept
  aliases:
    - lyapunov-function
  category: part-2-signals-systems-and-information/control-theory/stability
  note: lyapunov-stability
  definition: An equilibrium is stable when nearby trajectories stay nearby. A
    Lyapunov function, positive and non-increasing along trajectories, proves it
    without solving the dynamics.
ma:
  short: MA
  long: Moving Average Model
  kind: acronym
  aliases:
    - moving-average-model
  category: part-7-application-domains/time-series/arima-models
  note: moving-average-model
  definition: A model that writes a series as a weighted sum of the current and
    $q$ past noise terms, $x_t = \mu + \varepsilon_t + \theta_1\varepsilon_{t-1}
    + \dots + \theta_q\varepsilon_{t-q}$. Its autocorrelation cuts off after lag
    $q$.
machine-translation:
  short: MT
  long: Machine Translation
  kind: acronym
  aliases:
    - mt
  category: part-7-application-domains/natural-language-processing/nlp-tasks
  note: machine-translation
  definition: Translating text from one language to another automatically, now
    mostly with encoder–decoder or decoder-only transformers.
macro-mae:
  short: MAE^M
  long: Macro-Averaged Mean Absolute Error
  kind: acronym
  aliases:
    - macro-averaged-mean-absolute-error
    - macro-averaged-mae
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  see:
    - ordinal-classification-metrics
  definition: The mean absolute error of ordinal predictions computed separately
    for each true class and then averaged over the classes, so that rare classes
    count as much as frequent ones.
mahalanobis-distance:
  long: Mahalanobis Distance
  kind: concept
  category: part-4-principles-of-learning/evaluation-metrics/distances-and-similarities
  note: mahalanobis-distance
  see:
    - mahalanobis-distance-outliers
  definition: The distance $\sqrt{(\xvec - \muvec)^\top\Sigmamat^{-1}(\xvec -
    \muvec)}$ from a point to a distribution's mean, scaled by its covariance.
    For Gaussian data its square is chi-squared distributed.
mala:
  short: MALA
  long: Metropolis-Adjusted Langevin Algorithm
  kind: acronym
  aliases:
    - metropolis-adjusted-langevin-algorithm
  category: part-4-principles-of-learning/probabilistic-inference/monte-carlo
  note: langevin-dynamics
  definition: A Markov chain Monte Carlo method that proposes a discretised
    Langevin step, $x' = x + \epsilon\nabla\log p(x) + \sqrt{2\epsilon}\,\xi$,
    and corrects the discretisation error with a Metropolis–Hastings acceptance
    test.
mamba:
  short: Mamba
  long: Mamba
  kind: proper-name
  aliases:
    - selective-state-space-model
  category: part-6-neural-architectures/sequence-models/efficient-sequence-models
  note: mamba
  definition: A state-space sequence model whose step size and input and output
    matrices depend on the current token, so the layer can keep or discard each
    token by its content. It trains with a parallel scan and generates in
    constant time per token.
maml:
  short: MAML
  long: Model-Agnostic Meta-Learning
  kind: acronym
  aliases:
    - model-agnostic-meta-learning
  category: part-5-learning-paradigms/transfer-and-meta-learning/multi-task-and-meta-learning
  note: meta-learning
  definition: Meta-learning an initialisation from which a few gradient steps on a
    new task's data give good performance, by differentiating through those
    steps.
map-estimate:
  short: MAP
  long: Maximum a Posteriori
  kind: acronym
  sense: estimation
  aliases:
    - maximum-a-posteriori
  category: part-1-mathematical-foundations/statistics/bayesian-statistics
  definition: Estimation of parameters by the mode of the posterior, $\hat\theta =
    \argmax_\theta p(x \mid \theta)\,p(\theta)$. With a Gaussian prior it is
    maximum likelihood with an $\ell_2$ penalty.
mape:
  short: MAPE
  long: Mean Absolute Percentage Error
  kind: acronym
  aliases:
    - mean-absolute-percentage-error
  category: part-4-principles-of-learning/evaluation-metrics/forecasting-metrics
  note: percentage-errors
  definition: The mean of $\abs{y_t - \hat y_t}/\abs{y_t}$, reported as a
    percentage. It is undefined when a target is zero and penalises
    over-forecasts more than under-forecasts.
markov-blanket:
  long: Markov Blanket
  kind: concept
  category:
    - part-4-principles-of-learning/probabilistic-inference/graphical-models
    - part-4-principles-of-learning/probabilistic-inference/monte-carlo
  see:
    - bayesian-network
    - markov-random-field
    - gibbs-sampling
  definition: "The smallest set of variables that makes a variable conditionally
    independent of all the others: its neighbours in a Markov random field, or
    its parents, children and children's other parents in a Bayesian network."
markov-chain:
  long: Markov Chain
  kind: concept
  category: part-1-mathematical-foundations/probability/stochastic-processes
  note: markov-chain
  definition: A sequence of random states in which the next state depends only on
    the current one, with transition probabilities $p(s_{t+1} \mid s_t)$. Under
    mild conditions it converges to a unique stationary distribution.
martingale:
  long: Martingale
  kind: concept
  category: part-1-mathematical-foundations/probability/stochastic-processes
  note: martingale
  definition: "A process whose expected next value, given the past, equals its
    current value: $\\expect[X_{t+1} \\mid X_1, \\dots, X_t] = X_t$. It models a
    fair game."
mase:
  short: MASE
  long: Mean Absolute Scaled Error
  kind: acronym
  aliases:
    - mean-absolute-scaled-error
  category: part-4-principles-of-learning/evaluation-metrics/forecasting-metrics
  note: scaled-errors-and-mean-absolute-scaled-error
  definition: The mean absolute error of a forecast divided by the in-sample mean
    absolute error of the seasonal naive forecast. Values below 1 beat the naive
    benchmark.
masked-autoencoder:
  short: MAE
  long: Masked Autoencoder
  kind: acronym
  sense: vision pretraining
  category: part-5-learning-paradigms/representation-learning
  note: masked-image-modelling
  definition: A vision transformer pretrained by masking most image patches and
    reconstructing their pixels from the visible ones.
mass:
  short: MASS
  long: Mueen's Algorithm for Similarity Search
  kind: acronym
  aliases:
    - mueens-algorithm-for-similarity-search
  category: part-7-application-domains/time-series/similarity-search
  note: distance-profile-and-mass
  definition: An algorithm that computes the z-normalised distance from a query to
    every subsequence of a series in $O(n\log n)$ with one FFT convolution and
    running statistics.
matrix-factorisation:
  short: MF
  long: Matrix Factorisation
  kind: concept
  sense: recommendation
  category: part-7-application-domains/recommendation-and-retrieval/collaborative-filtering
  note: matrix-factorisation-for-recommendation
  definition: Modelling a user–item interaction matrix as the product of
    low-dimensional user and item factor matrices, so a predicted rating is the
    inner product $\uvec_u^\top\vvec_i$.
matrix-multiplication:
  long: Matrix Multiplication
  kind: concept
  aliases:
    - matrix-product
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: matrix-multiplication
  definition: The product $(\Amat\Bmat)_{ij} = \sum_k A_{ik}B_{kj}$ of an $m
    \times n$ and an $n \times p$ matrix, which represents composing the two
    linear maps.
matrix-profile:
  long: Matrix Profile
  kind: concept
  category: part-7-application-domains/time-series/similarity-search
  note: matrix-profile
  definition: For each subsequence of a time series, the z-normalised distance to
    its nearest non-overlapping neighbour. Its minima are motifs and its maxima
    discords.
mcc:
  short: MCC
  long: Matthews Correlation Coefficient
  kind: acronym
  aliases:
    - matthews-correlation-coefficient
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  note: matthews-correlation-coefficient
  definition: The correlation between predicted and true binary labels, computed
    from all four confusion-matrix counts. It lies in $[-1, 1]$ and stays
    informative under class imbalance.
mcmc:
  short: MCMC
  long: Markov Chain Monte Carlo
  kind: acronym
  aliases:
    - markov-chain-monte-carlo
  category: part-4-principles-of-learning/probabilistic-inference/monte-carlo
  note: markov-chain-monte-carlo
  definition: A family of methods that draw dependent samples from a distribution
    known up to a constant by simulating a Markov chain whose stationary
    distribution is that distribution. Averages over the chain estimate
    expectations.
mde:
  short: MDE
  long: Minimum Detectable Effect
  kind: acronym
  aliases:
    - minimum-detectable-effect
  category: part-7-application-domains/online-experimentation/foundations
  note: a-b-test-power
  definition: The smallest true effect an experiment of a given size detects with
    a chosen power at a chosen significance level.
mdp:
  short: MDP
  long: Markov Decision Process
  kind: acronym
  aliases:
    - markov-decision-process
  category: part-5-learning-paradigms/reinforcement-learning/markov-decision-processes
  note: markov-decision-process
  definition: A model of sequential decisions given by states, actions, transition
    probabilities $p(s' \mid s, a)$, rewards and a discount factor $\gamma$.
mds:
  short: MDS
  long: Multidimensional Scaling
  kind: acronym
  aliases:
    - multidimensional-scaling
  category: part-5-learning-paradigms/unsupervised-learning/manifold-learning
  note: multidimensional-scaling
  definition: Placing points in a low-dimensional space so that their distances
    match a given dissimilarity matrix. Classical MDS embeds with the top
    eigenvectors of the double-centred squared distances.
mean-absolute-error:
  short: MAE
  long: Mean Absolute Error
  kind: acronym
  sense: metric
  category: part-4-principles-of-learning/evaluation-metrics/regression-metrics
  note: squared-and-absolute-error-metrics
  definition: The average absolute difference $\frac1n\sum_i \abs{y_i - \hat y_i}$
    between targets and predictions. It is minimised by the conditional median.
mean-average-precision:
  short: MAP
  long: Mean Average Precision
  kind: acronym
  sense: ranking
  category: part-4-principles-of-learning/evaluation-metrics/ranking-metrics
  note: mean-average-precision-and-mean-reciprocal-rank
  definition: The mean over queries, or over classes in object detection, of the
    average precision. It rewards rankings that put relevant items early.
mean-field:
  long: Mean-Field Approximation
  kind: concept
  aliases:
    - mean-field-approximation
  category: part-1-mathematical-foundations/mathematics/calculus-of-variations
  note: mean-field-variational-inference
  definition: A variational family in which the approximate posterior factorises
    over groups of latent variables, $q(z) = \prod_j q_j(z_j)$. It ignores
    posterior correlations between the groups.
mel-scale:
  long: Mel Scale
  kind: concept
  aliases:
    - mel-spectrogram
  category: part-2-signals-systems-and-information/signal-processing/audio
  note: mel-spectrogram
  definition: A perceptual frequency scale, roughly linear below 1 kHz and
    logarithmic above, on which equal distances sound equally far apart in
    pitch.
memm:
  short: MEMM
  long: Maximum-Entropy Markov Model
  kind: acronym
  aliases:
    - maximum-entropy-markov-model
  category: part-5-learning-paradigms/supervised-learning/structured-prediction
  note: maximum-entropy-markov-model
  definition: A discriminative sequence model that predicts each label from the
    previous label and the observations with a locally normalised logistic
    model. Local normalisation causes the label bias problem.
meta-learning:
  long: Meta-Learning
  kind: concept
  aliases:
    - learning-to-learn
  category: part-5-learning-paradigms/transfer-and-meta-learning/multi-task-and-meta-learning
  note: meta-learning
  definition: Learning, across many related tasks, a learner or an initialisation
    that adapts quickly to a new task from few examples.
metropolis-hastings:
  long: Metropolis–Hastings Algorithm
  kind: concept
  aliases:
    - metropolis-hastings-algorithm
  category: part-4-principles-of-learning/probabilistic-inference/monte-carlo
  note: metropolis-hastings
  definition: A Markov chain Monte Carlo method that proposes a move from a
    proposal distribution and accepts it with a probability that makes the
    target distribution stationary. Only ratios of the target density are
    needed.
mfcc:
  short: MFCC
  long: Mel-Frequency Cepstral Coefficients
  longPlural: Mel-Frequency Cepstral Coefficients
  kind: acronym
  aliases:
    - mel-frequency-cepstral-coefficients
  category: part-2-signals-systems-and-information/signal-processing/audio
  note: mel-frequency-cepstral-coefficients
  definition: Audio features computed as the discrete cosine transform of log
    mel-filter-bank energies of each frame.
mgf:
  short: MGF
  long: Moment Generating Function
  kind: acronym
  aliases:
    - moment-generating-function
  category: part-1-mathematical-foundations/probability/theory
  note: moment-generating-function
  definition: The function $M_X(t) = \expect[e^{tX}]$ of a random variable. Its
    $n$-th derivative at $t = 0$ is the $n$-th moment, and the MGF of a sum of
    independent variables is the product of their MGFs.
mha:
  short: MHA
  long: Multi-Head Attention
  kind: acronym
  aliases:
    - multi-head-attention
  category: part-6-neural-architectures/transformers/vanilla-transformer
  note: multi-head-attention
  definition: Several scaled dot-product attentions run in parallel on learned
    projections of width $d/h$, with their outputs concatenated and projected.
    Each position gathers $h$ separate weighted averages at about the cost of
    one full-width head.
mil:
  short: MIL
  long: Multiple-Instance Learning
  kind: acronym
  aliases:
    - multiple-instance-learning
  category: part-5-learning-paradigms/weak-supervision/multiple-instance-learning
  note: multiple-instance-learning
  definition: "Learning from labelled bags of instances: a bag is positive if at
    least one of its instances is positive, and instance labels are not given."
mips:
  short: MIPS
  long: Maximum Inner Product Search
  kind: acronym
  aliases:
    - maximum-inner-product-search
  category: part-5-learning-paradigms/supervised-learning/nearest-neighbours/approximate-nearest-neighbours
  note: maximum-inner-product-search
  definition: Finding the stored vectors with the largest inner product with a
    query. Unlike distance, the inner product is not a metric, so it is often
    reduced to nearest-neighbour search by augmenting the vectors.
mixed-precision:
  long: Mixed-Precision Training
  kind: concept
  aliases:
    - bf16
    - fp16-training
    - mixed-precision-training
  category: part-8-practice/engineering/training-at-scale
  note: mixed-precision-training
  definition: Training with 16-bit floating-point matrix products while keeping a
    32-bit master copy of the weights. Loss scaling stops small fp16 gradients
    rounding to zero.
mla:
  short: MLA
  long: Multi-Head Latent Attention
  kind: acronym
  aliases:
    - multi-head-latent-attention
  category: part-6-neural-architectures/transformers/attention-variants
  note: multi-head-latent-attention
  definition: Attention that caches one compressed vector per token and layer,
    from which every head's keys and values are reconstructed by up-projections.
    Introduced in DeepSeek-V2 to shrink the key-value cache.
mle:
  short: MLE
  long: Maximum Likelihood Estimation
  kind: acronym
  aliases:
    - maximum-likelihood-estimation
    - maximum-likelihood
  category: part-1-mathematical-foundations/statistics/estimation
  definition: Estimation of parameters by the value $\hat\theta = \argmax_\theta
    p(x \mid \theta)$ that makes the observed data most probable. Under
    regularity conditions the estimate is consistent and asymptotically
    efficient.
mlm:
  short: MLM
  long: Masked Language Modelling
  kind: acronym
  aliases:
    - masked-language-modelling
  category: part-5-learning-paradigms/representation-learning
  note: masked-language-modelling
  definition: Pretraining that hides a random 15% of the tokens in a text and
    trains a bidirectional encoder to predict them from the rest, as in BERT.
mlp:
  short: MLP
  long: Multilayer Perceptron
  kind: acronym
  aliases:
    - feedforward-neural-network
    - fully-connected-network
    - multilayer-perceptron
  category: part-6-neural-architectures/feedforward-networks/foundations
  note: multilayer-perceptron
  definition: A neural network that alternates affine maps and elementwise
    nonlinearities, $\hvec_\ell = \phi(\Wmat_\ell\hvec_{\ell-1} + \bvec_\ell)$.
    Without the nonlinearities the whole network collapses to one affine map.
mmd:
  short: MMD
  long: Maximum Mean Discrepancy
  kind: acronym
  aliases:
    - maximum-mean-discrepancy
  category: part-4-principles-of-learning/evaluation-metrics/distances-and-similarities
  see:
    - kernel-inception-distance
  definition: The distance between two distributions given by the distance between
    their mean embeddings in a reproducing kernel Hilbert space, estimated from
    samples with kernel evaluations.
mmlu:
  short: MMLU
  long: Massive Multitask Language Understanding
  kind: proper-name
  aliases:
    - massive-multitask-language-understanding
  category: part-6-neural-architectures/large-language-models
  see:
    - language-model-evaluation
  definition: A benchmark of multiple-choice questions across 57 subjects, from
    elementary mathematics to law, used to measure the knowledge of language
    models.
mnist:
  short: MNIST
  long: Modified National Institute of Standards and Technology Database
  kind: proper-name
  aliases:
    - modified-national-institute-of-standards-and-technology-database
  category: part-7-application-domains/computer-vision/recognition
  definition: A dataset of 70,000 grey-scale $28 \times 28$ images of handwritten
    digits, 60,000 for training and 10,000 for testing.
moco:
  short: MoCo
  long: Momentum Contrast
  kind: proper-name
  aliases:
    - momentum-contrast
  category: part-5-learning-paradigms/representation-learning
  note: contrastive-learning
  definition: Contrastive pretraining that draws negatives from a queue of past
    batches encoded by a slowly updated momentum copy of the encoder.
model-monitoring:
  long: Model Monitoring
  kind: concept
  category: part-8-practice/engineering/deployment
  note: model-monitoring
  definition: Tracking a deployed model's inputs, outputs and, when labels arrive,
    its performance, to detect drift and failures.
model-parallelism:
  long: Model Parallelism
  kind: concept
  aliases:
    - tensor-parallelism
    - pipeline-parallelism
  category: part-8-practice/engineering/training-at-scale
  note: model-parallelism
  definition: Splitting one model across devices, by layers (pipeline parallelism)
    or within layers (tensor parallelism), when it does not fit on one.
modern-hopfield-network:
  long: Modern Hopfield Network
  kind: concept
  aliases:
    - hopfield-layer
  category: part-6-neural-architectures/feedforward-networks/energy-based-networks
  note: modern-hopfield-network
  definition: A Hopfield network with a sharply separating energy such as a
    log-sum-exp of overlaps, which stores exponentially many patterns; its
    continuous update $\xivec \leftarrow
    \Xmat\operatorname{softmax}(\beta\Xmat^\top\xivec)$ is attention.
moe:
  short: MoE
  long: Mixture of Experts
  longPlural: Mixtures of Experts
  kind: acronym
  aliases:
    - mixture-of-experts
  category: part-8-practice/engineering/training-at-scale
  note: mixture-of-experts
  definition: A layer with $N$ expert networks and a router that sends each token
    to its top $k$ experts, so parameters grow with $N$ while computation per
    token grows with $k$.
moment-matching:
  long: Moment Matching
  kind: concept
  category: part-4-principles-of-learning/probabilistic-inference/approximate-inference
  note: expectation-propagation
  definition: Approximating a distribution by the member of an exponential family
    with the same expected sufficient statistics, such as the Gaussian with the
    same mean and variance. It minimises the forward divergence $\KL(p \,\|\,
    q)$ within the family.
momentum:
  long: Momentum
  kind: concept
  aliases:
    - nesterov-momentum
    - heavy-ball-method
  category: part-6-neural-architectures/feedforward-networks/training
  note: momentum-and-nesterov
  definition: An optimiser that keeps a velocity $\vvec \leftarrow \beta\vvec -
    \eta\nabla L(\thetavec)$ and steps $\thetavec \leftarrow \thetavec + \vvec$,
    so consistent gradient directions accumulate and oscillating ones cancel.
mpc:
  short: MPC
  long: Model Predictive Control
  kind: acronym
  aliases:
    - model-predictive-control
  category: part-2-signals-systems-and-information/control-theory/model-predictive-control
  note: model-predictive-control
  definition: Control that solves a finite-horizon optimal control problem from
    the current state at every step, applies the first input and repeats.
    Constraints on states and inputs enter directly.
mq-rnn:
  short: MQ-RNN
  long: Multi-Horizon Quantile Recurrent Neural Network
  kind: acronym
  aliases:
    - multi-horizon-quantile-recurrent-neural-network
  category: part-7-application-domains/time-series/neural-forecasting
  note: multi-horizon-quantile-recurrent-network
  definition: A forecaster whose recurrent encoder feeds decoders that output
    quantiles for every horizon at once, trained with the quantile loss.
mqa:
  short: MQA
  long: Multi-Query Attention
  kind: acronym
  aliases:
    - multi-query-attention
  category: part-6-neural-architectures/transformers/attention-variants
  note: multi-query-and-grouped-query-attention
  definition: Multi-head attention in which all query heads share a single key
    head and a single value head, shrinking the key-value cache by the number of
    heads.
mrf:
  short: MRF
  long: Markov Random Field
  kind: acronym
  aliases:
    - markov-random-field
    - undirected-graphical-model
  category: part-4-principles-of-learning/probabilistic-inference/graphical-models
  note: markov-random-field
  definition: An undirected graphical model whose joint distribution is a
    normalised product of potential functions over the cliques of the graph.
    Each variable is independent of the rest given its neighbours.
mrr:
  short: MRR
  long: Mean Reciprocal Rank
  kind: acronym
  aliases:
    - mean-reciprocal-rank
  category: part-4-principles-of-learning/evaluation-metrics/ranking-metrics
  note: mean-average-precision-and-mean-reciprocal-rank
  definition: The mean over queries of $1/\text{rank}$ of the first relevant item.
mse:
  short: MSE
  long: Mean Squared Error
  kind: acronym
  aliases:
    - mean-squared-error
  category: part-4-principles-of-learning/evaluation-metrics/regression-metrics
  note: squared-and-absolute-error-metrics
  definition: The average squared difference $\frac1n\sum_i (y_i - \hat y_i)^2$
    between targets and predictions. It is minimised by the conditional mean.
msprt:
  short: mSPRT
  long: Mixture Sequential Probability Ratio Test
  kind: acronym
  aliases:
    - mixture-sequential-probability-ratio-test
  category: part-7-application-domains/online-experimentation/sequential-testing
  note: mixture-sequential-probability-ratio-test
  definition: A sequential test that compares a likelihood ratio averaged over a
    mixing distribution of effects with a threshold, so results can be checked
    at any time without inflating the error rate.
multi-armed-bandit:
  short: MAB
  long: Multi-Armed Bandit
  kind: acronym
  aliases:
    - mab
  category: part-7-application-domains/online-experimentation/multi-armed-bandits
  note: multi-armed-bandit
  definition: A sequential problem in which an agent repeatedly chooses one of $K$
    actions with unknown reward distributions and aims to maximise total reward,
    or equivalently to minimise regret.
multi-task-learning:
  short: MTL
  long: Multi-Task Learning
  kind: acronym
  aliases:
    - mtl
  category: part-5-learning-paradigms/transfer-and-meta-learning/multi-task-and-meta-learning
  note: multi-task-learning
  definition: Training one model on several related tasks at once, usually with
    shared layers, so each task benefits from the others' data.
multiclass-hinge-loss:
  long: Multiclass Hinge Loss
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/classification/multiclass
  see:
    - multiclass-support-vector-machines
  definition: A margin loss for K classes, such as Crammer and Singer's $\max(0, 1
    + \max_{j \ne y} s_j - s_y)$ or Weston and Watkins's sum of such terms over
    the wrong classes.
multivariate-gaussian:
  long: Multivariate Gaussian Distribution
  kind: concept
  aliases:
    - multivariate-gaussian-distribution
    - multivariate-normal
  category: part-1-mathematical-foundations/probability/named-distributions/multivariate
  note: multivariate-normal-distribution
  definition: The distribution $\Gauss(\muvec, \Sigmamat)$ of a random vector with
    density proportional to $\exp(-\frac12(\xvec -
    \muvec)^\top\Sigmamat^{-1}(\xvec - \muvec))$. Its marginals and conditionals
    are Gaussian.
mup:
  short: µP
  long: Maximal Update Parameterisation
  kind: acronym
  aliases:
    - mu-p
    - mutransfer
    - maximal-update-parameterisation
    - p
  category: part-6-neural-architectures/transformers/training-and-analysis
  note: maximal-update-parameterisation
  definition: A scaling of each layer's initialisation and learning rate with
    width so that every layer's features change by a width-independent amount
    per step. Hyperparameters tuned on a small model then transfer to a wide
    one.
mutual-information:
  long: Mutual Information
  kind: concept
  category: part-2-signals-systems-and-information/information-theory
  note: mutual-information
  definition: The reduction in uncertainty about one random variable from
    observing another, $I(X; Y) = \KL(p(x, y) \,\|\, p(x)\,p(y))$. It is zero
    exactly when $X$ and $Y$ are independent.
n-beats:
  short: N-BEATS
  long: Neural Basis Expansion Analysis for Time Series
  kind: proper-name
  aliases:
    - neural-basis-expansion-analysis-for-time-series
  category: part-7-application-domains/time-series/neural-forecasting
  note: n-beats
  definition: A deep forecaster built from stacks of fully connected blocks, each
    emitting basis coefficients for a backcast subtracted from its input and a
    partial forecast added to the output.
n-gram:
  long: n-Gram
  kind: concept
  aliases:
    - word-n-gram
  category: part-7-application-domains/natural-language-processing/text-representation
  note: word-n-grams
  definition: A run of $n$ consecutive tokens. $n$-gram features restore local
    word order to a bag of words; $n$-gram language models condition on the
    previous $n - 1$ tokens.
n-hits:
  short: N-HiTS
  long: Neural Hierarchical Interpolation for Time Series
  kind: proper-name
  aliases:
    - neural-hierarchical-interpolation-for-time-series
  category: part-7-application-domains/time-series/neural-forecasting
  note: n-hits
  definition: A deep forecaster in the style of N-BEATS whose blocks pool the
    input at different rates and interpolate coarse forecasts, so each block
    covers one band of frequencies.
naive-bayes:
  long: Naive Bayes
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/generative-classifiers
  note: naive-bayes
  definition: A generative classifier that assumes the features are conditionally
    independent given the class, so $p(\xvec \mid y) = \prod_j p(x_j \mid y)$,
    and classifies by Bayes' theorem.
nce:
  short: NCE
  long: Noise-Contrastive Estimation
  kind: acronym
  category:
    - part-4-principles-of-learning/loss-functions/classification-losses
    - part-7-application-domains/natural-language-processing
    - part-7-application-domains/recommendation-and-retrieval
  see:
    - sampled-softmax-and-negative-sampling
  definition: A method that fits an unnormalised model by logistic regression
    between data and samples from a known noise distribution; its optimum is the
    true log-density, so the normalising constant is learned, not computed.
ndcg:
  short: NDCG
  long: Normalised Discounted Cumulative Gain
  kind: acronym
  aliases:
    - normalised-discounted-cumulative-gain
  category: part-4-principles-of-learning/evaluation-metrics/ranking-metrics
  note: normalised-discounted-cumulative-gain
  definition: A ranking metric that sums each item's graded relevance divided by
    $\log_2(\text{rank} + 1)$ and divides by the same sum for the ideal
    ordering, giving a value in $[0, 1]$.
nearest-neighbour-search:
  long: Nearest-Neighbour Search
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/nearest-neighbours
  note: nearest-neighbour-search
  definition: Finding the stored points closest to a query under a distance or
    similarity. Exact search is linear in the collection size; approximate
    methods trade recall for speed.
ner:
  short: NER
  long: Named-Entity Recognition
  kind: acronym
  aliases:
    - named-entity-recognition
  category: part-7-application-domains/natural-language-processing/sequence-labelling
  note: named-entity-recognition
  definition: Finding the spans of text that name entities, such as people,
    organisations and places, and labelling their type.
nested-dichotomy:
  long: Nested Dichotomy
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/classification/multiclass
  note: nested-dichotomies-and-tree-reductions
  definition: A binary tree over the classes in which each internal node splits
    its classes in two and holds a classifier for that split; a class's
    probability is the product of the branch probabilities on its path.
neuralndcg:
  short: NeuralNDCG
  long: NeuralNDCG
  kind: proper-name
  category: part-7-application-domains/recommendation-and-retrieval/loss-families
  see:
    - listwise-ranking-losses
  definition: A listwise loss that computes NDCG through NeuralSort, a
    differentiable relaxation of sorting whose row-stochastic matrix approaches
    the sorting permutation as its temperature falls.
newtons-method:
  long: Newton's Method
  kind: concept
  category: part-1-mathematical-foundations/optimisation/second-order-methods
  note: newtons-method
  definition: An iterative method that minimises the local quadratic model of a
    function, stepping $\xvec_{k+1} = \xvec_k - \Hmat^{-1}\nabla f(\xvec_k)$
    with the Hessian $\Hmat$. Near a non-degenerate minimum it converges
    quadratically.
nli:
  short: NLI
  long: Natural Language Inference
  kind: acronym
  aliases:
    - textual-entailment
    - natural-language-inference
  category: part-7-application-domains/natural-language-processing/nlp-tasks
  note: natural-language-inference
  definition: Deciding whether a hypothesis sentence follows from, contradicts or
    is neutral to a premise sentence.
nlp:
  short: NLP
  long: Natural Language Processing
  kind: acronym
  aliases:
    - natural-language-processing
  category: part-7-application-domains/natural-language-processing
  definition: "The field concerned with computing on human language: representing,
    analysing, generating and translating text and speech."
nltk:
  short: NLTK
  long: Natural Language Toolkit
  kind: proper-name
  aliases:
    - natural-language-toolkit
  category: part-7-application-domains/natural-language-processing
  definition: "A Python library for classical natural language processing:
    tokenisers, stemmers, taggers, parsers and corpora."
nmf:
  short: NMF
  long: Non-Negative Matrix Factorisation
  kind: acronym
  aliases:
    - non-negative-matrix-factorisation
  category: part-5-learning-paradigms/unsupervised-learning/dimensionality-reduction
  note: non-negative-matrix-factorisation
  definition: Approximating a non-negative matrix as a product $\Wmat\Hmat$ of
    non-negative factors of low inner dimension, so each column is an additive
    combination of parts.
nms:
  short: NMS
  long: Non-Maximum Suppression
  kind: acronym
  aliases:
    - non-maximum-suppression
  category: part-7-application-domains/computer-vision/recognition
  note: object-detection
  definition: Removing duplicate detections by keeping the highest-scoring box and
    discarding boxes that overlap it above an IoU threshold, repeatedly.
nope:
  short: NoPE
  long: No Positional Encoding
  kind: acronym
  aliases:
    - no-positional-encoding
  category: part-6-neural-architectures/transformers/positional-encodings
  note: nope-and-implicit-position
  definition: A causally masked transformer with no positional encoding at all.
    The causal mask alone lets it infer positions.
norm:
  long: Vector Norm
  kind: concept
  aliases:
    - vector-norm
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: vector-norms
  definition: "A function $\\norm{\\xvec}$ that assigns a length to a vector: it
    is zero only at $\\zeros$, scales with $\\abs{\\alpha}$ and satisfies the
    triangle inequality. The $\\ell_2$ norm is the Euclidean length; the
    $\\ell_1$ norm sums absolute values."
normalising-flow:
  long: Normalising Flow
  kind: concept
  category: part-6-neural-architectures/generative-models/other-generative-models
  note: normalising-flow
  definition: A generative model that maps a simple base density through a
    sequence of invertible transformations with tractable Jacobian determinants,
    so the density of any point follows from the change-of-variables formula.
nucleus-sampling:
  long: Nucleus Sampling
  kind: concept
  aliases:
    - top-p-sampling
  category: part-6-neural-architectures/large-language-models/models-and-decoding
  see:
    - decoding-strategies
  definition: Sampling the next token from the smallest set of most probable
    tokens whose total probability reaches $p$, renormalised.
null-hypothesis:
  long: Null Hypothesis
  kind: concept
  category: part-1-mathematical-foundations/statistics/hypothesis-testing
  note: null-and-alternative-hypotheses
  definition: The default hypothesis $H_0$ that a statistical test tries to
    reject, usually of no effect or no difference. The alternative $H_1$ is what
    the test is designed to detect.
null-space:
  long: Null Space
  kind: concept
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: rank-and-null-space
  definition: The set of vectors $\xvec$ with $\Amat\xvec = \zeros$. Its dimension
    plus the rank of $\Amat$ equals the number of columns (the rank–nullity
    theorem).
nurbs:
  short: NURBS
  long: Non-Uniform Rational B-Spline
  kind: acronym
  aliases:
    - non-uniform-rational-b-spline
  category: part-1-mathematical-foundations/mathematics/splines-and-interpolation
  note: non-uniform-rational-b-splines
  definition: A curve or surface defined as a ratio of weighted B-spline sums. The
    weights let it represent conic sections such as circles exactly, which
    ordinary polynomial splines cannot.
nuts:
  short: NUTS
  long: No-U-Turn Sampler
  kind: acronym
  aliases:
    - no-u-turn-sampler
  category: part-4-principles-of-learning/probabilistic-inference/monte-carlo
  note: hamiltonian-monte-carlo
  definition: A variant of Hamiltonian Monte Carlo that sets the trajectory length
    adaptively, extending it until the path starts to turn back on itself.
nyquist-frequency:
  long: Nyquist Frequency
  kind: concept
  aliases:
    - nyquist-rate
    - sampling-theorem
  category: part-2-signals-systems-and-information/signal-processing/signals-and-systems
  note: sampling-theorem
  definition: Half the sampling rate. A signal band-limited below it is determined
    exactly by its samples; content above it aliases.
object-detection:
  long: Object Detection
  kind: concept
  category: part-7-application-domains/computer-vision/recognition
  note: object-detection
  definition: Finding every object of interest in an image and returning a box,
    class and score for each. Duplicates are removed by non-maximum suppression.
ocsvm:
  short: OC-SVM
  long: One-Class Support Vector Machine
  kind: acronym
  aliases:
    - one-class-support-vector-machine
    - oc-svm
  category: part-5-learning-paradigms/anomaly-detection/one-class-methods
  note: one-class-support-vector-machine
  definition: A support vector machine that separates the data from the origin in
    a kernel feature space with maximum margin, so points on the origin's side
    are anomalies. The parameter $\nu$ bounds the fraction of outliers.
ode:
  short: ODE
  long: Ordinary Differential Equation
  kind: acronym
  aliases:
    - ordinary-differential-equation
  category: part-1-mathematical-foundations/mathematics/differential-equations
  note: ordinary-differential-equations
  definition: An equation $\dot{\xvec} = \fvec(t, \xvec)$ that gives the rate of
    change of a state as a function of the state and time. With an initial value
    it defines a trajectory, which exists and is unique when $\fvec$ is
    Lipschitz in $\xvec$.
oec:
  short: OEC
  long: Overall Evaluation Criterion
  kind: acronym
  aliases:
    - overall-evaluation-criterion
  category: part-7-application-domains/online-experimentation/foundations
  note: overall-evaluation-criterion
  definition: The single metric, or weighted combination of metrics, that an
    organisation agrees to use to decide whether an experiment's treatment is
    better.
offline-rl:
  long: Offline Reinforcement Learning
  kind: concept
  aliases:
    - batch-reinforcement-learning
    - offline-reinforcement-learning
  category: part-5-learning-paradigms/reinforcement-learning/model-based-and-offline
  note: offline-reinforcement-learning
  definition: Learning a policy from a fixed dataset of logged transitions without
    further interaction, which must guard against actions the data do not cover.
ogd:
  short: OGD
  long: Online Gradient Descent
  kind: acronym
  aliases:
    - online-gradient-descent
  category: part-5-learning-paradigms/online-learning/online-convex-optimisation
  note: online-gradient-descent
  definition: Online convex optimisation that takes a projected gradient step on
    each round's loss. With step size $\propto 1/\sqrt t$ its regret is $O(\sqrt
    T)$.
ols:
  short: OLS
  long: Ordinary Least Squares
  kind: acronym
  aliases:
    - ordinary-least-squares
  category: part-5-learning-paradigms/supervised-learning/regression/linear
  note: linear-regression
  definition: Estimation of linear-regression coefficients by minimising the sum
    of squared residuals, $\hat\betavec =
    (\Xmat^\top\Xmat)^{-1}\Xmat^\top\yvec$.
online-learning:
  long: Online Learning
  kind: concept
  category: part-5-learning-paradigms/online-learning
  note: online-learning
  definition: Learning from a stream of examples, updating after each one and
    being judged by cumulative loss or regret.
ope:
  short: OPE
  long: Off-Policy Evaluation
  kind: acronym
  aliases:
    - off-policy-evaluation
  category: part-7-application-domains/online-experimentation/contextual-bandits
  note: off-policy-evaluation
  definition: Estimating the value of a target policy from data logged by a
    different policy, by reweighting, modelling rewards or both.
opq:
  short: OPQ
  long: Optimised Product Quantisation
  kind: acronym
  aliases:
    - optimised-product-quantisation
  category: part-5-learning-paradigms/supervised-learning/nearest-neighbours/approximate-nearest-neighbours
  note: optimised-product-quantisation
  definition: Product quantisation preceded by a learned orthogonal rotation that
    decorrelates the sub-vectors and balances their variance.
optimal-transport:
  long: Optimal Transport
  kind: concept
  category: part-1-mathematical-foundations/mathematics/optimal-transport
  note: optimal-transport
  definition: The problem of moving one probability distribution onto another at
    least total cost, given a cost of moving mass from each point to each other
    point. Its optimal cost defines the Wasserstein distances.
ordinal-regression:
  long: Ordinal Regression
  kind: concept
  aliases:
    - ordinal-classification
    - ordered-classification
  category: part-5-learning-paradigms/supervised-learning/ordinal-regression
  note: ordinal-regression
  definition: Supervised learning of a label from ordered categories $1 < \dots <
    K$ whose spacing is unknown, such as ratings or disease grades. Most methods
    learn a real score and $K - 1$ ordered cut points.
orthogonal-projection:
  long: Orthogonal Projection
  kind: concept
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: orthogonal-projection
  definition: The map sending a vector to the closest point of a subspace, $\Pmat
    = \Amat(\Amat^\top\Amat)^{-1}\Amat^\top$ for the column space of $\Amat$.
    The residual is orthogonal to the subspace; least squares is an orthogonal
    projection of the targets.
overfitting:
  long: Overfitting
  kind: concept
  category: part-4-principles-of-learning/learning-theory
  note: bias-variance-decomposition
  definition: Fitting the noise of the training data so closely that error on new
    data rises while training error keeps falling. It is the high-variance end
    of the bias–variance trade-off.
ovo:
  short: OvO
  long: One-Versus-One
  kind: acronym
  aliases:
    - one-vs-one
    - all-pairs
    - pairwise-classification
  category: part-5-learning-paradigms/supervised-learning/classification/multiclass
  note: one-versus-one
  definition: A reduction of a K-class problem to $K(K-1)/2$ binary problems, one
    per pair of classes, each trained on those two classes only, with the
    prediction chosen by voting or pairwise coupling.
ovr:
  short: OvR
  long: One-Versus-Rest
  kind: acronym
  aliases:
    - one-vs-rest
    - one-vs-all
    - one-versus-all
    - ova
  category: part-5-learning-paradigms/supervised-learning/classification/multiclass
  note: one-versus-rest
  definition: A reduction of a K-class problem to K binary problems, each
    separating one class from all the others, with the prediction taken as the
    class whose classifier scores highest.
p-value:
  long: p-Value
  kind: concept
  category: part-1-mathematical-foundations/statistics/hypothesis-testing
  note: p-value
  definition: The probability, under the null hypothesis, of a test statistic at
    least as extreme as the one observed. A small p-value is evidence against
    the null; it is not the probability that the null is true.
pac:
  short: PAC
  long: Probably Approximately Correct
  kind: acronym
  aliases:
    - probably-approximately-correct
  category: part-4-principles-of-learning/learning-theory
  note: probably-approximately-correct-learning
  definition: A framework in which a class is learnable if, for every accuracy
    $\epsilon$ and confidence $\delta$, some number of samples guarantees risk
    within $\epsilon$ of the best with probability at least $1 - \delta$.
pacf:
  short: PACF
  long: Partial Autocorrelation Function
  kind: acronym
  aliases:
    - partial-autocorrelation-function
  category: part-7-application-domains/time-series/foundations
  note: autocorrelation-and-partial-autocorrelation
  definition: The correlation between $x_t$ and $x_{t+h}$ after removing the
    linear effect of the values in between. It cuts off after lag $p$ for an
    autoregressive model of order $p$.
palm:
  short: PaLM
  long: Pathways Language Model
  kind: proper-name
  aliases:
    - pathways-language-model
  category: part-8-practice/case-studies/language-models
  see:
    - autoregressive-transformer-language-model
  definition: Google's 2022 decoder-only transformer language model with 540
    billion parameters, trained with the Pathways system.
panoptic-quality:
  short: PQ
  long: Panoptic Quality
  kind: acronym
  sense: segmentation metric
  category: part-4-principles-of-learning/evaluation-metrics/detection-and-segmentation-metrics
  note: panoptic-quality
  definition: "A panoptic segmentation metric: the mean IoU of matched segments
    times an F1-style recognition quality, where segments match when their IoU
    exceeds 0.5."
partial-derivative:
  long: Partial Derivative
  kind: concept
  category: part-1-mathematical-foundations/mathematics/calculus/multivariate
  note: partial-derivatives
  definition: The derivative of a function of several variables with respect to
    one of them, the others held fixed, written $\partial f/\partial x_i$.
particle-filter:
  long: Particle Filter
  kind: concept
  aliases:
    - sequential-monte-carlo
  category: part-7-application-domains/time-series/state-space-models
  note: particle-filter
  definition: Filtering in a nonlinear or non-Gaussian state-space model with a
    set of weighted samples of the state, propagated through the dynamics,
    reweighted by each observation and resampled.
patchtst:
  short: PatchTST
  long: Patch Time-Series Transformer
  kind: proper-name
  aliases:
    - patch-time-series-transformer
  category: part-7-application-domains/time-series/neural-forecasting
  note: transformer-forecasters
  definition: A transformer forecaster that splits each series into patches,
    embeds each patch as a token and processes each variable independently.
pca:
  short: PCA
  long: Principal Component Analysis
  kind: acronym
  aliases:
    - principal-components
    - principal-component-analysis
  category: part-5-learning-paradigms/unsupervised-learning/dimensionality-reduction
  note: principal-component-analysis
  definition: "Finding orthonormal directions of decreasing variance in centred
    data: the eigenvectors of the sample covariance. Projecting onto the first
    $k$ maximises retained variance and minimises squared reconstruction error."
pchip:
  short: PCHIP
  long: Piecewise Cubic Hermite Interpolating Polynomial
  kind: acronym
  aliases:
    - piecewise-cubic-hermite-interpolating-polynomial
  category: part-1-mathematical-foundations/mathematics/splines-and-interpolation
  note: monotone-and-shape-preserving-interpolation
  definition: A piecewise cubic interpolant whose slopes at the data points are
    chosen by weighted harmonic means so that it preserves monotonicity and does
    not overshoot step-like data.
pde:
  short: PDE
  long: Partial Differential Equation
  kind: acronym
  aliases:
    - partial-differential-equation
  category: part-1-mathematical-foundations/mathematics/differential-equations
  note: partial-differential-equations
  definition: An equation relating the partial derivatives of an unknown function
    of several variables, such as $u(x, t)$. The heat, wave and Laplace
    equations are the classical examples.
pdf:
  short: PDF
  long: Probability Density Function
  kind: acronym
  aliases:
    - probability-density-function
  category: part-1-mathematical-foundations/probability/theory
  note: random-variable
  definition: A function $p(x) \ge 0$ whose integral over a set gives the
    probability that a continuous random variable falls in the set. It is the
    derivative of the cumulative distribution function where that exists.
peeking:
  long: Peeking
  kind: concept
  aliases:
    - optional-stopping
  category: part-7-application-domains/online-experimentation/examples
  note: peeking-and-optional-stopping
  definition: Checking a fixed-horizon test repeatedly and stopping at the first
    significant result, which inflates the false-positive rate far above the
    nominal level.
perceptron:
  long: Perceptron
  kind: concept
  category: part-6-neural-architectures/feedforward-networks/foundations
  note: perceptron
  definition: A linear classifier $\hat y = \sgn(\wvec^\top\xvec)$ trained by
    adding $y_i\xvec_i$ to $\wvec$ after each mistake. On data separable with
    margin $\gamma$ inside a ball of radius $R$ it makes at most $(R/\gamma)^2$
    mistakes.
periodogram:
  long: Periodogram
  kind: concept
  category: part-2-signals-systems-and-information/signal-processing/spectral-estimation
  note: periodogram
  definition: The squared magnitude of a signal's discrete Fourier transform,
    scaled, as an estimate of its power spectral density. It is unbiased
    asymptotically but its variance does not shrink with length.
permutation-invariant-training:
  short: PIT
  long: Permutation-Invariant Training
  kind: acronym
  sense: source separation
  category: part-4-principles-of-learning/evaluation-metrics/audio-metrics
  note: permutation-invariant-training
  definition: Training a source-separation model with the loss minimised over all
    assignments of its outputs to the reference sources, since their order is
    arbitrary.
perplexity:
  long: Perplexity
  kind: concept
  category: part-2-signals-systems-and-information/information-theory
  note: cross-entropy-and-perplexity
  definition: The exponential of the average negative log-likelihood per token,
    $\exp(-\frac1N\sum_t \log q(x_t \mid x_{<t}))$. It is the effective number
    of equally likely choices a language model faces at each step.
persistent-contrastive-divergence:
  short: PCD
  long: Persistent Contrastive Divergence
  kind: acronym
  category: part-6-neural-architectures/feedforward-networks/energy-based-networks
  see:
    - restricted-boltzmann-machine
    - energy-based-models
  definition: Contrastive divergence whose negative Markov chains continue from
    one parameter update to the next instead of restarting at the data, so they
    explore far from the data.
pesq:
  short: PESQ
  long: Perceptual Evaluation of Speech Quality
  kind: acronym
  aliases:
    - perceptual-evaluation-of-speech-quality
  category: part-4-principles-of-learning/evaluation-metrics/audio-metrics
  note: perceptual-speech-quality-and-intelligibility
  definition: A standard metric that predicts the mean opinion score listeners
    would give a degraded speech signal, by comparing it with a clean reference
    through a perceptual model.
pid:
  short: PID
  long: Proportional–Integral–Derivative Control
  kind: acronym
  aliases:
    - proportional-integral-derivative-control
  category: part-2-signals-systems-and-information/control-theory/classical-control
  note: proportional-integral-derivative-control
  definition: Feedback control that sets the input to a weighted sum of the error,
    its integral and its derivative. The integral term removes steady-state
    error.
pinsage:
  short: PinSage
  long: PinSage
  kind: proper-name
  category: part-7-application-domains/recommendation-and-retrieval/pinsage-family
  note: pinsage
  definition: Pinterest's graph convolutional recommender, which aggregates over
    neighbourhoods sampled by random walks to embed billions of items.
pixelcnn:
  short: PixelCNN
  long: PixelCNN
  kind: proper-name
  category: part-6-neural-architectures/generative-models/other-generative-models
  note: autoregressive-generative-models
  definition: An autoregressive image model that predicts each pixel from the
    pixels above and to its left with masked convolutions.
plsa:
  short: pLSA
  long: Probabilistic Latent Semantic Analysis
  kind: acronym
  aliases:
    - probabilistic-latent-semantic-analysis
  category: part-5-learning-paradigms/unsupervised-learning/topic-models/foundations
  note: probabilistic-latent-semantic-analysis
  definition: A topic model in which each word of a document is drawn from a
    mixture of topics with document-specific weights, fitted by
    expectation–maximisation. It has no prior on the weights.
pmf:
  short: PMF
  long: Probability Mass Function
  kind: acronym
  aliases:
    - probability-mass-function
  category: part-1-mathematical-foundations/probability/theory
  note: random-variable
  definition: The function $p(x) = \pr(X = x)$ giving the probability of each
    value of a discrete random variable. Its values sum to 1.
pmi:
  short: PMI
  long: Pointwise Mutual Information
  kind: acronym
  aliases:
    - ppmi
    - pointwise-mutual-information
  category: part-7-application-domains/natural-language-processing/text-representation
  note: co-occurrence-matrices-and-pointwise-mutual-information
  definition: The log ratio $\log p(w, c)/(p(w)\,p(c))$ of how often two words
    co-occur to how often they would if independent. Positive PMI clips it at
    zero.
poisson-distribution:
  long: Poisson Distribution
  kind: concept
  category: part-1-mathematical-foundations/probability/named-distributions/discrete
  note: poisson-distribution
  definition: The distribution of a count of events occurring independently at a
    constant rate $\lambda$, with $\pr(K = k) = \lambda^k e^{-\lambda}/k!$. Its
    mean and variance both equal $\lambda$.
poisson-regression:
  long: Poisson Regression
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/generalised-linear-models
  note: poisson-regression
  definition: A generalised linear model for counts with a Poisson response and a
    log link, $\log\expect[y \mid \xvec] = \xvec^\top\betavec$.
poles-and-zeros:
  long: Poles and Zeros
  kind: concept
  category: part-2-signals-systems-and-information/signal-processing/signals-and-systems
  note: poles-and-zeros
  definition: The roots of the denominator (poles) and numerator (zeros) of a
    rational transfer function. A causal discrete-time system is stable when
    every pole lies inside the unit circle.
policy:
  long: Policy
  kind: concept
  category: part-5-learning-paradigms/reinforcement-learning/markov-decision-processes
  see:
    - markov-decision-process
  definition: A rule $\pi(a \mid s)$ that gives the probability of taking each
    action in each state.
policy-gradient:
  long: Policy Gradient
  kind: concept
  aliases:
    - policy-gradient-theorem
  category: part-5-learning-paradigms/reinforcement-learning/policy-methods
  note: policy-gradient-theorem
  definition: Improving a parameterised policy by ascending the gradient of
    expected return, $\nabla J = \expect[\sum_t \gamma^t q_\pi(S_t,
    A_t)\nabla\log\pi(A_t \mid S_t)]$.
policy-iteration:
  long: Policy Iteration
  kind: concept
  category: part-5-learning-paradigms/reinforcement-learning/markov-decision-processes
  note: policy-iteration
  definition: Dynamic programming that alternates evaluating the current policy
    exactly and improving it greedily, converging in finitely many steps for a
    finite MDP.
pom:
  short: POM
  long: Proportional Odds Model
  kind: acronym
  aliases:
    - proportional-odds-model
    - ordered-logit
    - cumulative-logit-model
    - ordered-logistic-regression
  category: part-5-learning-paradigms/supervised-learning/ordinal-regression
  note: cumulative-link-model
  see:
    - proportional-odds-assumption
  definition: The cumulative link model with the logistic link,
    $\operatorname{logit} P(y \le k \mid \xvec) = \theta_k - \wvec^\top\xvec$.
    The cumulative log-odds at two inputs differ by the same amount at every cut
    point $k$.
pooling:
  long: Pooling
  kind: concept
  aliases:
    - max-pooling
    - average-pooling
  category: part-6-neural-architectures/convolutional-networks
  note: pooling-and-strides
  definition: Replacing each window of a feature map by its maximum or mean.
    Pooling and strides shrink the feature map and make the receptive field grow
    geometrically with depth.
popularity-bias:
  long: Popularity Bias
  kind: concept
  category: part-7-application-domains/recommendation-and-retrieval/debiasing
  note: popularity-bias
  definition: The tendency of recommenders and their training data to
    over-represent popular items, which feedback loops then amplify.
pos-tagging:
  short: POS
  long: Part-of-Speech Tagging
  kind: acronym
  aliases:
    - part-of-speech-tagging
    - pos
  category: part-7-application-domains/natural-language-processing/sequence-labelling
  see:
    - sequence-labelling
  definition: Labelling each word with its grammatical category, such as noun,
    verb or adjective.
position-bias:
  long: Position Bias
  kind: concept
  category: part-7-application-domains/recommendation-and-retrieval/debiasing
  see:
    - click-models
    - unbiased-learning-to-rank
  definition: The tendency of users to examine and click higher-ranked results
    regardless of relevance, which makes raw clicks a biased measure of
    relevance.
positional-encoding:
  long: Positional Encoding
  kind: concept
  aliases:
    - position-embedding
  category: part-6-neural-architectures/transformers/positional-encodings
  note: positional-encoding
  definition: "Information about token position given to a transformer, whose
    attention is otherwise permutation-equivariant: a vector added per position,
    or a score that depends on the offset between positions."
positive-definite:
  long: Positive Definite Matrix
  longPlural: Positive Definite Matrices
  kind: concept
  aliases:
    - positive-definite-matrix
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: positive-definite-matrices
  definition: A symmetric matrix $\Amat$ with $\xvec^\top\Amat\xvec > 0$ for every
    non-zero vector $\xvec$, equivalently with all eigenvalues positive. It has
    a Cholesky factorisation and defines an inner product.
positive-semi-definite:
  short: PSD
  long: Positive Semi-Definite
  kind: acronym
  sense: matrix
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: positive-definite-matrices
  definition: A symmetric matrix $\Amat$ is positive semi-definite when
    $\xvec^\top\Amat\xvec \ge 0$ for every vector $\xvec$, equivalently when all
    its eigenvalues are non-negative. Covariance matrices and Gram matrices are
    positive semi-definite.
posterior:
  long: Posterior Distribution
  kind: concept
  aliases:
    - posterior-distribution
  category: part-1-mathematical-foundations/probability/theory
  note: bayes-theorem
  definition: The distribution $p(\theta \mid x) \propto p(x \mid
    \theta)\,p(\theta)$ of unknown parameters after conditioning on the data, in
    Bayesian inference.
power:
  long: Statistical Power
  kind: concept
  aliases:
    - statistical-power
  category: part-1-mathematical-foundations/statistics/hypothesis-testing
  note: type-i-and-type-ii-errors
  definition: The probability $1 - \beta$ that a test rejects the null hypothesis
    when a specified alternative is true. It grows with the effect size, the
    sample size and the significance level.
power-spectral-density:
  short: PSD
  long: Power Spectral Density
  kind: acronym
  sense: spectrum
  aliases:
    - psd-spectral
  category: part-2-signals-systems-and-information/signal-processing/spectral-estimation
  note: autocorrelation-and-wiener-khinchin
  definition: The distribution of a stationary process's power over frequency. By
    the Wiener–Khinchin theorem it is the Fourier transform of the
    autocovariance, $S(\omega) = \sum_m r[m]e^{-i\omega m}$.
ppca:
  short: PPCA
  long: Probabilistic Principal Component Analysis
  kind: acronym
  aliases:
    - probabilistic-principal-component-analysis
  category: part-5-learning-paradigms/unsupervised-learning/dimensionality-reduction
  note: probabilistic-principal-component-analysis
  definition: A linear-Gaussian latent variable model $\xvec = \Wmat\zvec + \muvec
    + \epsilonvec$ with isotropic noise, whose maximum-likelihood $\Wmat$ spans
    the principal subspace.
ppo:
  short: PPO
  long: Proximal Policy Optimisation
  kind: acronym
  aliases:
    - proximal-policy-optimisation
  category: part-5-learning-paradigms/reinforcement-learning/policy-methods
  note: trust-region-and-proximal-policy-optimisation
  definition: A policy-gradient method that maximises an importance-weighted
    advantage with the probability ratio clipped to $[1 - \epsilon, 1 +
    \epsilon]$, which keeps each update close to the old policy.
pr:
  short: PR
  long: Precision–Recall Curve
  kind: acronym
  aliases:
    - precision-recall-curve
    - pr-curve
  category: part-4-principles-of-learning/evaluation-metrics/classification-curves
  note: precision-recall-curve-and-average-precision
  definition: The curve of precision against recall traced as a classifier's
    decision threshold varies. Unlike the receiver operating characteristic
    curve it depends on the class prevalence, which makes it informative when
    positives are rare.
prank:
  short: PRank
  long: Perceptron Ranking
  kind: acronym
  category: part-5-learning-paradigms/supervised-learning/ordinal-regression
  see:
    - threshold-losses-for-ordinal-regression
  definition: An online perceptron for ordinal regression that moves the weight
    vector by the number of violated thresholds and moves each violated
    threshold one unit, keeping the thresholds ordered.
precision:
  long: Precision
  kind: concept
  aliases:
    - positive-predictive-value
    - ppv
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  note: precision-recall-and-f-score
  definition: The fraction of positive predictions that are correct,
    $\mathrm{TP}/(\mathrm{TP} + \mathrm{FP})$.
precision-matrix:
  long: Precision Matrix
  kind: concept
  aliases:
    - concentration-matrix
    - inverse-covariance-matrix
  category:
    - part-1-mathematical-foundations/probability/named-distributions
    - part-4-principles-of-learning/probabilistic-inference/graphical-models
  see:
    - multivariate-normal-distribution
    - graphical-lasso
    - gibbs-sampling
  definition: The inverse $\Lambdamat = \Sigmamat^{-1}$ of a covariance matrix.
    For a Gaussian, $\Lambda_{jk} = 0$ exactly when $x_j$ and $x_k$ are
    independent given all the other variables.
prediction-interval:
  long: Prediction Interval
  kind: concept
  category: part-7-application-domains/time-series/forecasting
  note: prediction-intervals
  definition: An interval that contains a future observation with a stated
    probability. It is wider than a confidence interval for the mean because it
    includes the observation's own noise.
prior:
  long: Prior Distribution
  kind: concept
  aliases:
    - prior-distribution
  category: part-1-mathematical-foundations/probability/theory
  see:
    - bayes-theorem
    - prior-choice
  definition: The distribution $p(\theta)$ placed on unknown parameters before the
    data are seen, in Bayesian inference.
probabilistic-programming:
  long: Probabilistic Programming
  kind: concept
  category: part-4-principles-of-learning/probabilistic-inference/probabilistic-programming
  note: probabilistic-programming
  definition: Writing a probabilistic model as a program whose random choices
    define the prior and whose conditioning statements define the data, and
    leaving inference to a general-purpose engine.
probability-flow-ode:
  long: Probability Flow Ordinary Differential Equation
  kind: concept
  aliases:
    - probability-flow-ordinary-differential-equation
  category: part-1-mathematical-foundations/probability/stochastic-calculus
  note: probability-flow-ode
  definition: The deterministic differential equation whose trajectories have the
    same marginal distributions as a diffusion SDE, obtained by subtracting half
    the squared diffusion times the score from the drift.
probability-integral-transform:
  short: PIT
  long: Probability Integral Transform
  kind: acronym
  sense: calibration
  category: part-4-principles-of-learning/decision-theory-and-calibration/regression-calibration
  see:
    - quantile-calibration
    - distribution-calibration
  definition: The value $F(y)$ of a predictive CDF at the observed outcome. For a
    calibrated continuous forecast it is uniform on $[0, 1]$, so a histogram of
    PIT values checks calibration.
prodlda:
  short: ProdLDA
  long: Product-of-Experts Latent Dirichlet Allocation
  kind: proper-name
  aliases:
    - product-of-experts-latent-dirichlet-allocation
  category: part-5-learning-paradigms/unsupervised-learning/topic-models/neural-topic-models
  note: prodlda
  definition: A neural topic model fitted by amortised variational inference that
    replaces the mixture of topics with a product of experts,
    $\operatorname{softmax}(\thetavec^\top\Bmat)$, which gives sharper topics.
product-quantisation:
  short: PQ
  long: Product Quantisation
  kind: acronym
  sense: vector compression
  category: part-5-learning-paradigms/supervised-learning/nearest-neighbours/approximate-nearest-neighbours
  note: product-quantisation
  definition: Compressing a vector by splitting it into sub-vectors and replacing
    each with the index of its nearest centroid in a small per-subspace
    codebook. Distances to a query are then sums of table lookups.
prompt:
  long: Prompt
  kind: concept
  aliases:
    - prompt-engineering
  category: part-6-neural-architectures/large-language-models/working-with-llms
  note: prompting
  definition: "The input text that specifies a task to a language model: an
    instruction, optional demonstrations and the query, laid out by a template."
propensity:
  long: Propensity
  kind: concept
  aliases:
    - propensity-score
  category: part-7-application-domains/online-experimentation/contextual-bandits
  note: logging-policies-and-propensities
  definition: The probability that a unit receives a treatment, or that a logging
    policy takes an action, given the observed context.
proper-scoring-rule:
  long: Proper Scoring Rule
  kind: concept
  category: part-4-principles-of-learning/decision-theory-and-calibration/proper-scoring-rules
  note: proper-scoring-rule
  definition: A score for probabilistic forecasts whose expected value is
    optimised by reporting the true distribution. Log loss and the Brier score
    are proper; accuracy of the most probable class is not.
pruning:
  long: Pruning
  kind: concept
  aliases:
    - sparsity
  category: part-8-practice/engineering/inference
  note: pruning-and-sparsity
  definition: Removing weights, neurons or heads from a trained network, usually
    those of smallest magnitude, to make it smaller or faster with little loss
    of accuracy.
pseudoinverse:
  long: Moore–Penrose Pseudoinverse
  kind: concept
  aliases:
    - moore-penrose-pseudoinverse
    - pseudo-inverse
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: pseudoinverse
  definition: The matrix $\Amat^+ = \Vmat\Sigmamat^+\Umat^\top$ built from the
    singular value decomposition by inverting the non-zero singular values.
    $\Amat^+\bvec$ is the minimum-norm least-squares solution of $\Amat\xvec =
    \bvec$.
psnr:
  short: PSNR
  long: Peak Signal-To-Noise Ratio
  kind: acronym
  aliases:
    - peak-signal-to-noise-ratio
  category: part-4-principles-of-learning/evaluation-metrics/image-quality-metrics
  note: peak-signal-to-noise-ratio
  definition: "The ratio of the squared maximum pixel value to the mean squared
    error between two images, in decibels:
    $10\\log_{10}(\\text{MAX}^2/\\text{MSE})$."
pu-learning:
  short: PU learning
  long: Positive–Unlabelled Learning
  kind: acronym
  aliases:
    - positive-unlabelled-learning
  category: part-5-learning-paradigms/weak-supervision/positive-unlabelled-and-partial-labels
  note: positive-unlabelled-learning
  definition: Learning a binary classifier from positive examples and unlabelled
    examples, some of which are positive.
pymc:
  short: PyMC
  long: PyMC
  kind: proper-name
  category: part-4-principles-of-learning/probabilistic-inference/probabilistic-programming
  note: probabilistic-programming
  definition: A Python probabilistic programming library that fits Bayesian models
    written in Python, mainly with the No-U-Turn Sampler and variational
    inference.
q-learning:
  long: Q-Learning
  kind: concept
  category: part-5-learning-paradigms/reinforcement-learning/value-based-methods
  note: q-learning
  definition: Off-policy temporal-difference control that moves $Q(S, A)$ toward
    $R + \gamma\max_a Q(S', a)$, learning the optimal action values while
    following an exploratory policy.
qa:
  short: QA
  long: Question Answering
  kind: acronym
  aliases:
    - question-answering
  category: part-7-application-domains/natural-language-processing/nlp-tasks
  note: question-answering
  definition: Returning an answer to a natural-language question, extracted as a
    span of a given passage or generated, possibly after retrieving evidence.
qda:
  short: QDA
  long: Quadratic Discriminant Analysis
  kind: acronym
  aliases:
    - quadratic-discriminant-analysis
  category: part-5-learning-paradigms/supervised-learning/generative-classifiers
  note: quadratic-discriminant-analysis
  definition: A generative classifier that models each class as a Gaussian with
    its own covariance, which makes the decision boundaries quadratic.
qp:
  short: QP
  long: Quadratic Programming
  kind: acronym
  aliases:
    - quadratic-programming
  category: part-1-mathematical-foundations/optimisation/constrained-optimisation
  note: quadratic-programming
  definition: Optimisation of a quadratic objective $\frac12\xvec^\top\Qmat\xvec +
    \cvec^\top\xvec$ subject to linear constraints. With $\Qmat$ positive
    semi-definite the problem is convex; the support vector machine dual is one.
qr:
  short: QR
  long: QR Decomposition
  kind: acronym
  aliases:
    - qr-decomposition
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: qr-decomposition
  definition: A factorisation $\Amat = \Qmat\Rmat$ of a matrix into a matrix
    $\Qmat$ with orthonormal columns and an upper-triangular matrix $\Rmat$. It
    is the standard numerically stable way to solve least-squares problems.
quantisation:
  long: Quantisation
  kind: concept
  sense: signal processing
  category: part-2-signals-systems-and-information/signal-processing/signals-and-systems
  note: quantisation
  definition: Mapping a continuous-valued signal to a finite set of levels. For a
    step $\Delta$ the rounding error is roughly uniform with variance
    $\Delta^2/12$, so each extra bit adds about 6 dB of signal-to-noise ratio.
quantisation-nn:
  long: Neural Network Quantisation
  kind: concept
  aliases:
    - model-quantisation
    - weight-quantisation
    - neural-network-quantisation
  category: part-8-practice/engineering/inference
  note: model-quantisation
  definition: Storing weights and activations as low-bit integers $q$ with a scale
    $s$ and zero-point $z$, so $x \approx s(q - z)$. It shrinks memory and
    speeds up inference at a small cost in accuracy.
qwk:
  short: QWK
  long: Quadratic Weighted Kappa
  kind: acronym
  aliases:
    - quadratic-weighted-kappa
    - weighted-kappa
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  note: cohens-kappa
  see:
    - ordinal-classification-metrics
  definition: "Cohen's kappa with disagreement weights $(j - k)^2$: one minus the
    ratio of the squared error of the predictions on the class index to that of
    predictions drawn independently with the same marginals."
r-cnn:
  short: R-CNN
  long: Region-Based Convolutional Neural Network
  kind: proper-name
  aliases:
    - faster-r-cnn
    - region-based-convolutional-neural-network
  category: part-7-application-domains/computer-vision/recognition
  note: object-detection
  definition: A family of two-stage object detectors that propose candidate
    regions and classify and refine each; Faster R-CNN learns the proposals with
    a region proposal network.
r-squared:
  short: $R^2$
  long: Coefficient of Determination
  kind: concept
  aliases:
    - coefficient-of-determination
    - r-2
  category: part-4-principles-of-learning/evaluation-metrics/regression-metrics
  note: r-squared-and-explained-variance
  definition: The fraction of the variance of the target explained by a
    regression, $1 - \sum_i (y_i - \hat y_i)^2/\sum_i (y_i - \bar y)^2$.
rag:
  short: RAG
  long: Retrieval-Augmented Generation
  kind: acronym
  aliases:
    - retrieval-augmented-generation
  category: part-6-neural-architectures/large-language-models/working-with-llms
  note: retrieval-augmented-generation
  definition: Generating text conditioned on passages retrieved for the input, so
    a model can use knowledge outside its weights and cite sources.
random-forest:
  long: Random Forest
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/trees-and-ensembles
  note: random-forest
  definition: An ensemble of decision trees, each grown on a bootstrap sample with
    a random subset of features considered at every split, whose predictions are
    averaged or voted.
random-variable:
  long: Random Variable
  kind: concept
  category: part-1-mathematical-foundations/probability/theory
  note: random-variable
  definition: A function that assigns a number to each outcome of a random
    experiment. Its distribution is induced by the probabilities of the outcomes
    that map to each set of values.
random-walk:
  long: Random Walk
  kind: concept
  category: part-1-mathematical-foundations/probability/stochastic-processes
  note: random-walk
  definition: "A process whose value is the previous value plus an independent
    increment, $x_t = x_{t-1} + \\varepsilon_t$. It is not stationary: its
    variance grows linearly with time."
rank:
  long: Rank of a Matrix
  kind: concept
  aliases:
    - rank-of-a-matrix
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: rank-and-null-space
  definition: The dimension of the column space of a matrix, equal to the
    dimension of its row space and to the number of non-zero singular values.
ranknet:
  short: RankNet
  long: RankNet
  kind: proper-name
  category: part-7-application-domains/recommendation-and-retrieval/loss-families
  see:
    - pairwise-ranking-losses
    - lambda-gradients
  definition: A pairwise learning-to-rank model that turns the score difference of
    two items into the probability that the first ranks higher, $\sigma(s_i -
    s_j)$, and trains on the cross-entropy of that probability.
ranksvm:
  short: RankSVM
  long: Ranking Support Vector Machine
  kind: acronym
  aliases:
    - ranking-svm
  category: part-7-application-domains/recommendation-and-retrieval/loss-families
  see:
    - pairwise-ranking-losses
  definition: "A linear ranking model trained as a support vector machine on
    pairs: a hinge loss on the score difference between each preferred and each
    less-preferred item."
ransac:
  short: RANSAC
  long: Random Sample Consensus
  kind: acronym
  aliases:
    - random-sample-consensus
  category: part-7-application-domains/computer-vision/geometry
  note: homography
  definition: Robust model fitting that repeatedly fits a model to a minimal
    random subset of the data and keeps the model with the most inliers.
rbf-kernel:
  short: RBF kernel
  long: Radial Basis Function Kernel
  kind: acronym
  aliases:
    - rbf
    - gaussian-kernel
    - squared-exponential-kernel
    - radial-basis-function-kernel
  category: part-5-learning-paradigms/supervised-learning/gaussian-processes
  see:
    - covariance-functions
    - kernel-trick
  definition: The kernel $k(\xvec, \xvec') = \exp(-\norm{\xvec -
    \xvec'}^2/2\ell^2)$ with length scale $\ell$. Its feature space is
    infinite-dimensional, and its functions are infinitely differentiable.
rct:
  short: RCT
  long: Randomised Controlled Trial
  kind: acronym
  aliases:
    - randomised-controlled-experiment
    - randomised-controlled-trial
  category: part-1-mathematical-foundations/statistics/experimental-design
  note: randomised-controlled-experiments
  definition: An experiment that assigns units to treatment or control at random,
    so differences in outcome estimate the causal effect of the treatment.
recall:
  long: Recall
  kind: concept
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  note: precision-recall-and-f-score
  definition: The fraction of actual positives that are predicted positive,
    $\mathrm{TP}/(\mathrm{TP} + \mathrm{FN})$; the true positive rate.
recommender-system:
  long: Recommender System
  kind: concept
  category: part-7-application-domains/recommendation-and-retrieval/foundations
  note: recommender-systems
  definition: A system that ranks items, such as products, films or posts, for
    each user from past interactions, item content and context.
region-of-convergence:
  long: Region of Convergence
  kind: concept
  category: part-2-signals-systems-and-information/signal-processing/signals-and-systems
  note: z-transform
  definition: The set of $z$ for which the sum defining a z-transform converges.
    The same formula with different regions describes different sequences, and a
    causal stable system's region includes the unit circle.
regret:
  long: Regret
  kind: concept
  category: part-7-application-domains/online-experimentation/multi-armed-bandits
  see:
    - multi-armed-bandit
    - online-convex-optimisation
  definition: The difference between the total reward (or loss) of the best fixed
    action in hindsight and that of the learner over $T$ rounds.
regularisation:
  long: Regularisation
  kind: concept
  category: part-4-principles-of-learning/model-selection/regularisation
  note: regularisation
  definition: Restricting a model to reduce its variance at the cost of some bias,
    most often by adding a penalty $\lambda\Omega(\wvec)$ to the training loss.
reinforce:
  short: REINFORCE
  long: REINFORCE
  kind: proper-name
  aliases:
    - score-function-estimator
    - likelihood-ratio-gradient
  category: part-1-mathematical-foundations/probability/sampling
  note: score-function-estimator
  definition: The Monte Carlo policy-gradient algorithm that weights each
    log-probability gradient by the return that followed it; in general, the
    score-function gradient estimator.
rejection-sampling:
  long: Rejection Sampling
  kind: concept
  category: part-1-mathematical-foundations/probability/sampling
  note: rejection-sampling
  definition: Exact sampling from a density $p$ by drawing from a proposal $q$
    with $p \le Mq$ and accepting each draw with probability $p(x)/(Mq(x))$. The
    acceptance rate is $1/M$.
relu:
  short: ReLU
  long: Rectified Linear Unit
  kind: acronym
  aliases:
    - rectified-linear-unit
  category: part-6-neural-architectures/feedforward-networks/foundations
  see:
    - activation-functions
  definition: The activation $\phi(x) = \max(0, x)$. Its gradient is 1 for
    positive inputs, so it does not saturate there; a unit whose input stays
    negative stops learning (a dead ReLU).
reml:
  short: REML
  long: Restricted Maximum Likelihood
  kind: acronym
  aliases:
    - restricted-maximum-likelihood
  category: part-5-learning-paradigms/supervised-learning/generalised-additive-models
  note: additive-model-smoothing-parameter-selection
  definition: Estimation of variance components by maximising the likelihood of
    residual contrasts that do not depend on the fixed effects. It removes the
    downward bias of maximum-likelihood variance estimates and chooses smoothing
    parameters in penalised regression.
reparameterisation-trick:
  long: Reparameterisation Trick
  kind: concept
  category: part-1-mathematical-foundations/probability/sampling
  note: reparameterisation-trick
  definition: A way to differentiate an expectation over $z \sim q_\phi$ by
    writing $z = g_\phi(\epsilon)$ with parameter-free noise $\epsilon$, such as
    $z = \mu + \sigma\epsilon$ for a Gaussian. Gradients then pass through the
    sample.
representer-theorem:
  long: Representer Theorem
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/kernel-methods
  note: representer-theorem
  definition: The result that the minimiser of a regularised loss over a
    reproducing kernel Hilbert space is a weighted sum of kernels centred on the
    training points, $f(\xvec) = \sum_i \alpha_i k(\xvec_i, \xvec)$.
residual-connection:
  long: Residual Connection
  kind: concept
  aliases:
    - skip-connection
    - shortcut-connection
  category: part-6-neural-architectures/feedforward-networks/training
  note: residual-connections
  definition: A connection that adds a layer's input to its output, $\hvec_\ell =
    \hvec_{\ell-1} + F_\ell(\hvec_{\ell-1})$, so the gradient reaches every
    layer through the identity path.
resnet:
  short: ResNet
  long: Residual Network
  kind: acronym
  aliases:
    - residual-network
  category: part-6-neural-architectures/convolutional-networks
  note: residual-network
  definition: A convolutional network built from residual blocks $\yvec = \xvec +
    F(\xvec)$, each learning a correction to the identity. The identity paths
    let networks with hundreds of layers train.
restricted-boltzmann-machine:
  short: RBM
  long: Restricted Boltzmann Machine
  kind: acronym
  aliases:
    - harmonium
  category: part-6-neural-architectures/feedforward-networks/energy-based-networks
  note: restricted-boltzmann-machine
  definition: A Boltzmann machine with connections only between a visible and a
    hidden layer, so each layer is conditionally independent given the other and
    block Gibbs sampling is cheap.
ridge-regression:
  long: Ridge Regression
  kind: concept
  aliases:
    - tikhonov-regularisation
  category: part-5-learning-paradigms/supervised-learning/regression/linear
  note: ridge-regression
  definition: Least squares with an L2 penalty $\lambda\norm{\wvec}^2$ on the
    coefficients, with solution $(\Xmat^\top\Xmat +
    \lambda\I)^{-1}\Xmat^\top\yvec$. It shrinks coefficients and stabilises
    ill-conditioned problems.
rkhs:
  short: RKHS
  long: Reproducing Kernel Hilbert Space
  kind: acronym
  aliases:
    - reproducing-kernel-hilbert-space
  category: part-5-learning-paradigms/supervised-learning/kernel-methods
  note: reproducing-kernel-hilbert-space
  definition: "The Hilbert space of functions defined by a positive semi-definite
    kernel $k$, in which evaluation is an inner product: $f(\\xvec) =
    \\inner{f}{k(\\xvec, \\cdot)}$. Kernel methods find their solutions in it."
rl:
  short: RL
  long: Reinforcement Learning
  kind: acronym
  aliases:
    - reinforcement-learning
  category: part-5-learning-paradigms/reinforcement-learning
  note: reinforcement-learning
  definition: Learning a policy that maximises expected discounted reward in a
    Markov decision process from sampled interaction rather than a known model.
rlhf:
  short: RLHF
  long: Reinforcement Learning from Human Feedback
  kind: acronym
  aliases:
    - reinforcement-learning-from-human-feedback
  category: part-5-learning-paradigms/reinforcement-learning/policy-methods
  note: reinforcement-learning-from-human-feedback
  see:
    - instruction-tuning-and-alignment
  definition: Tuning a language model with reinforcement learning against a reward
    model fitted to human preference comparisons, with a KL penalty that keeps
    the policy close to the supervised model.
rls:
  short: RLS
  long: Recursive Least Squares Filter
  kind: acronym
  aliases:
    - recursive-least-squares-filter
  category: part-2-signals-systems-and-information/signal-processing/adaptive-and-statistical
  note: recursive-least-squares-filter
  definition: An adaptive filter that minimises the exponentially weighted squared
    error exactly at every step, updating the inverse correlation matrix in
    $O(M^2)$ per sample.
rmse:
  short: RMSE
  long: Root Mean Squared Error
  kind: acronym
  aliases:
    - root-mean-squared-error
  category: part-4-principles-of-learning/evaluation-metrics/regression-metrics
  note: squared-and-absolute-error-metrics
  definition: The square root of the mean squared error, in the units of the
    target. It is always at least the mean absolute error.
rmsnorm:
  short: RMSNorm
  long: Root Mean Square Normalisation
  kind: acronym
  aliases:
    - root-mean-square-normalisation
  category: part-6-neural-architectures/transformers/block-design
  note: rmsnorm-in-transformers
  definition: "Layer normalisation without the centring: $\\gammavec \\odot
    \\xvec/\\sqrt{\\frac1d\\norm{\\xvec}^2 + \\epsilon}$. Most decoder language
    models normalise every sublayer input with it."
rmsprop:
  short: RMSProp
  long: Root Mean Square Propagation
  kind: acronym
  aliases:
    - root-mean-square-propagation
  category: part-6-neural-architectures/feedforward-networks/training
  note: adagrad-and-rmsprop
  definition: An optimiser that divides each gradient coordinate by the root of an
    exponential moving average of its squared values, so step sizes adapt per
    coordinate without shrinking for ever as in AdaGrad.
rnn:
  short: RNN
  long: Recurrent Neural Network
  kind: acronym
  aliases:
    - recurrent-neural-network
  category: part-6-neural-architectures/sequence-models/recurrent-networks
  note: recurrent-neural-network
  definition: A network that reads a sequence one element at a time and updates a
    hidden state $\hvec_t = \phi(\Wmat\hvec_{t-1} + \Umat\xvec_t + \bvec)$ with
    the same weights at every step, so one network handles sequences of any
    length.
roberta:
  short: RoBERTa
  long: Robustly Optimised BERT Pretraining Approach
  kind: proper-name
  aliases:
    - robustly-optimised-bert-pretraining-approach
  category: part-6-neural-architectures/transformers/architecture-families
  see:
    - masked-language-modelling
    - encoder-only-transformers
  definition: BERT retrained with more data, larger batches, dynamic masking and
    no next-sentence objective, which improved its downstream results.
roc:
  short: ROC
  long: Receiver Operating Characteristic
  kind: acronym
  aliases:
    - receiver-operating-characteristic
  category: part-4-principles-of-learning/evaluation-metrics/classification-curves
  note: receiver-operating-characteristic-curve-and-area
  definition: The curve of true positive rate against false positive rate traced
    by a classifier's score as its decision threshold varies.
rope:
  short: RoPE
  long: Rotary Position Embedding
  kind: acronym
  aliases:
    - rotary-position-embedding
  category: part-6-neural-architectures/transformers/positional-encodings
  note: rotary-position-embedding
  definition: A positional encoding that rotates each pair of query and key
    coordinates by an angle proportional to the token's position, so the
    attention score depends only on the offset between positions.
rouge:
  short: ROUGE
  long: Recall-Oriented Understudy for Gisting Evaluation
  kind: proper-name
  aliases:
    - recall-oriented-understudy-for-gisting-evaluation
  category: part-4-principles-of-learning/evaluation-metrics/text-metrics
  note: rouge
  definition: A family of summarisation metrics that measure how much of a
    reference text a candidate recovers. ROUGE-N counts shared $n$-grams and
    ROUGE-L uses the longest common subsequence.
rq-vae:
  short: RQ-VAE
  long: Residual-Quantised Variational Autoencoder
  kind: acronym
  category: part-7-application-domains/recommendation-and-retrieval/generative-recommendation
  see:
    - generative-recommendation-losses
  definition: An autoencoder that quantises its latent vector in stages, each
    codebook encoding the residual left by the ones before it, so that an item
    becomes a short tuple of discrete codes.
rvm:
  short: RVM
  long: Relevance Vector Machine
  kind: acronym
  aliases:
    - relevance-vector-machine
  category: part-5-learning-paradigms/supervised-learning/gaussian-processes
  note: relevance-vector-machine
  definition: A sparse Bayesian model with the functional form of a support vector
    machine, in which automatic relevance determination prunes most basis
    functions and leaves a few relevance vectors.
rwkv:
  short: RWKV
  long: Receptance Weighted Key Value
  kind: acronym
  aliases:
    - receptance-weighted-key-value
  category: part-6-neural-architectures/sequence-models/efficient-sequence-models
  note: rwkv-and-retentive-networks
  definition: A recurrent language model whose time-mixing layer is a linear
    attention with exponential decay, trainable in parallel like a transformer
    and run as a recurrent network at inference.
s-dpo:
  short: S-DPO
  long: Softmax Direct Preference Optimisation
  kind: acronym
  category: part-7-application-domains/recommendation-and-retrieval/generative-recommendation
  see:
    - generative-recommendation-losses
  definition: "Direct preference optimisation with several rejected items at once:
    a softmax cross-entropy over the implicit rewards of one preferred and
    several dispreferred items."
s4:
  short: S4
  long: Structured State Space Sequence Model
  kind: proper-name
  aliases:
    - structured-state-space-sequence-model
  category: part-6-neural-architectures/sequence-models/efficient-sequence-models
  note: structured-state-space-models
  definition: A state-space sequence layer whose state matrix has a structure,
    from the HiPPO theory of online function approximation, that lets its
    convolution kernel be computed fast and remembers long histories.
sarima:
  short: SARIMA
  long: Seasonal Autoregressive Integrated Moving Average Model
  kind: acronym
  aliases:
    - seasonal-autoregressive-integrated-moving-average-model
  category: part-7-application-domains/time-series/arima-models
  note: seasonal-autoregressive-integrated-moving-average
  definition: An autoregressive integrated moving-average model with extra
    autoregressive, differencing and moving-average terms at the seasonal lag
    $m$.
sarsa:
  short: SARSA
  long: State–Action–Reward–State–Action
  kind: acronym
  aliases:
    - state-action-reward-state-action
  category: part-5-learning-paradigms/reinforcement-learning/value-based-methods
  note: sarsa
  definition: On-policy temporal-difference control that moves $Q(S, A)$ toward $R
    + \gamma Q(S', A')$, where $A'$ is the action actually taken next.
sasrec:
  short: SASRec
  long: Self-Attentive Sequential Recommendation
  kind: acronym
  aliases:
    - self-attentive-sequential-recommendation
  category: part-7-application-domains/recommendation-and-retrieval/sequential-recommendation
  note: sasrec
  definition: A sequential recommender that runs a causally masked transformer
    over a user's item sequence and scores the next item by the inner product
    with its embedding.
sax:
  short: SAX
  long: Symbolic Aggregate Approximation
  kind: acronym
  aliases:
    - symbolic-aggregate-approximation
  category: part-7-application-domains/time-series/time-series-classification
  note: symbolic-aggregate-approximation
  definition: A symbolic representation of a time series that averages it over
    segments and maps each average to a letter by Gaussian quantiles.
scann:
  short: ScaNN
  long: Scalable Nearest Neighbours
  kind: proper-name
  aliases:
    - scalable-nearest-neighbours
  category: part-5-learning-paradigms/supervised-learning/nearest-neighbours/approximate-nearest-neighbours
  note: scann-and-anisotropic-quantisation
  definition: Google's vector search library, which trains quantisation codebooks
    with an anisotropic loss that penalises error parallel to each vector more
    than orthogonal error.
score-matching:
  long: Score-Based Generative Model
  kind: concept
  aliases:
    - score-based-model
    - score-based-generative-model
  category: part-6-neural-architectures/generative-models/diffusion-models
  note: score-based-generative-models
  definition: A generative model that learns the score $\nabla_\xvec\log p(\xvec)$
    of noised data at many noise levels and samples by following it, with
    Langevin dynamics or a reverse-time SDE.
sde:
  short: SDE
  long: Stochastic Differential Equation
  kind: acronym
  aliases:
    - stochastic-differential-equation
  category: part-1-mathematical-foundations/probability/stochastic-calculus
  note: stochastic-differential-equations
  definition: An equation $dX_t = f(X_t, t)\,dt + g(X_t, t)\,dW_t$ that moves a
    state by a deterministic drift $f$ plus Brownian noise scaled by a diffusion
    coefficient $g$. It means the corresponding integral equation, with an Itô
    integral for the noise.
seam-carving:
  long: Seam Carving
  kind: concept
  aliases:
    - content-aware-resizing
    - liquid-rescaling
  category: part-7-application-domains/computer-vision/image-processing
  note: seam-carving
  definition: Content-aware image resizing that removes or inserts seams,
    connected paths of one pixel per row or column, chosen by dynamic
    programming to cross pixels of least gradient energy, so objects keep their
    shape.
self-supervised-learning:
  short: SSL
  long: Self-Supervised Learning
  kind: concept
  sense: representation learning
  category: part-5-learning-paradigms/representation-learning
  note: self-supervised-learning
  definition: Learning representations from unlabelled data by solving tasks whose
    targets come from the data itself, such as predicting masked tokens or
    matching augmented views.
self-training:
  long: Self-Training
  kind: concept
  aliases:
    - pseudo-labelling
  category: part-5-learning-paradigms/semi-supervised-learning
  note: self-training
  definition: Semi-supervised learning that trains a model on labelled data,
    labels unlabelled data with its confident predictions, and retrains on both.
semantic-identifier:
  long: Semantic Identifier
  kind: concept
  aliases:
    - semantic-id
    - semantic-ids
  category: part-7-application-domains/recommendation-and-retrieval/generative-recommendation
  see:
    - generative-recommendation-losses
    - generative-retrieval-for-recommendation
  definition: An item identifier made of a short sequence of discrete codes
    learned from the item's content, so that similar items share code prefixes.
semantic-segmentation:
  long: Semantic Segmentation
  kind: concept
  category: part-7-application-domains/computer-vision/recognition
  note: semantic-segmentation
  definition: Labelling every pixel of an image with a class, without separating
    instances of the same class.
sentence-embedding:
  long: Sentence Embedding
  kind: concept
  aliases:
    - sbert
  category: part-7-application-domains/natural-language-processing/text-representation
  note: sentence-embeddings
  definition: A single vector for a sentence, trained so that semantically similar
    sentences have high cosine similarity.
seq2seq:
  short: seq2seq
  long: Sequence-to-Sequence Model
  kind: acronym
  aliases:
    - encoder-decoder
    - sequence-to-sequence-model
  category: part-6-neural-architectures/sequence-models/recurrent-networks
  note: sequence-to-sequence
  definition: "A model that maps an input sequence to an output sequence of a
    different length: an encoder reads the input and a decoder generates the
    output one token at a time, $p(\\yvec \\mid \\xvec) = \\prod_t p(y_t \\mid
    y_{<t}, \\xvec)$."
ses:
  short: SES
  long: Simple Exponential Smoothing
  kind: acronym
  aliases:
    - simple-exponential-smoothing
  category: part-7-application-domains/time-series/exponential-smoothing
  note: simple-exponential-smoothing
  definition: Forecasting with an exponentially weighted average of past
    observations, updated as $\ell_t = \alpha y_t + (1 - \alpha)\ell_{t-1}$. The
    forecast is flat at the last level.
sft:
  short: SFT
  long: Supervised Fine-Tuning
  kind: acronym
  aliases:
    - instruction-tuning
    - supervised-fine-tuning
  category: part-6-neural-architectures/large-language-models/models-and-decoding
  note: instruction-tuning-and-alignment
  definition: Fine-tuning a pretrained language model by maximising the likelihood
    of demonstration responses given prompts, which turns a text continuer into
    an instruction follower.
sgd:
  short: SGD
  long: Stochastic Gradient Descent
  kind: acronym
  aliases:
    - stochastic-gradient-descent
  category: part-1-mathematical-foundations/optimisation/stochastic-optimisation
  see:
    - minibatching-and-batch-size
    - stochastic-gradient-descent-theory
  definition: Gradient descent that steps along the gradient of the loss on one
    example or a small random mini-batch, an unbiased but noisy estimate of the
    full gradient. It is the basic optimiser for training neural networks.
sgld:
  short: SGLD
  long: Stochastic Gradient Langevin Dynamics
  kind: acronym
  aliases:
    - stochastic-gradient-langevin-dynamics
  category: part-4-principles-of-learning/probabilistic-inference/monte-carlo
  note: stochastic-gradient-langevin-dynamics
  definition: Posterior sampling by stochastic gradient steps on the log posterior
    plus Gaussian noise with variance equal to twice the step size. As the step
    size decays, the iterates approach samples from the posterior.
shap:
  short: SHAP
  long: Shapley Additive Explanations
  kind: acronym
  aliases:
    - shap-values
    - treeshap
    - shapley-additive-explanations
  category: part-5-learning-paradigms/supervised-learning/trees-and-ensembles
  note: shapley-additive-explanations-for-trees
  definition: Feature attributions that split a prediction minus the average
    prediction among the features as the Shapley values of a game whose payoff
    for a feature set is the expected prediction given those features.
shapelet:
  long: Shapelet
  kind: concept
  category: part-7-application-domains/time-series/time-series-classification
  note: shapelets
  definition: A subsequence whose minimum distance to a time series separates the
    classes well, used as an interpretable feature for time-series
    classification.
sherrington-kirkpatrick-model:
  short: SK model
  long: Sherrington–Kirkpatrick Model
  kind: proper-name
  aliases:
    - sk-model
  category: part-6-neural-architectures/feedforward-networks/energy-based-networks
  see:
    - spin-glass
  definition: "The mean-field spin glass: $N$ Ising spins with independent
    Gaussian couplings $J_{ij} \\sim \\Gauss(0, J^2/N)$ between every pair."
si-sdr:
  short: SI-SDR
  long: Scale-Invariant Signal-to-Distortion Ratio
  kind: acronym
  aliases:
    - scale-invariant-signal-to-distortion-ratio
  category: part-4-principles-of-learning/evaluation-metrics/audio-metrics
  note: signal-to-noise-and-signal-to-distortion-ratios
  definition: A signal-to-noise ratio measured after rescaling the reference to
    best match the estimate, so a wrong gain is not counted as error. It is the
    standard source-separation metric.
sift:
  short: SIFT
  long: Scale-Invariant Feature Transform
  kind: acronym
  aliases:
    - scale-invariant-feature-transform
  category: part-7-application-domains/computer-vision/image-processing
  note: feature-detection-and-descriptors
  definition: "A local image feature: keypoints detected at extrema of a
    difference-of-Gaussians scale space, each described by histograms of
    gradient orientations in its neighbourhood."
significance-level:
  long: Significance Level
  kind: concept
  category: part-1-mathematical-foundations/statistics/hypothesis-testing
  note: significance-level
  definition: The probability $\alpha$ of rejecting a true null hypothesis that a
    test is designed to allow, fixed before the test, often at 0.05. The test
    rejects when the p-value falls below $\alpha$.
silu:
  short: SiLU
  long: Sigmoid Linear Unit
  kind: acronym
  aliases:
    - swish
    - sigmoid-linear-unit
  category: part-6-neural-architectures/feedforward-networks/foundations
  see:
    - activation-functions
    - gated-feed-forward-layers
  definition: The activation $\phi(x) = x\,\sigma(x)$, with $\sigma$ the logistic
    sigmoid; Swish with $\beta = 1$. Gated with a second projection it forms the
    SwiGLU feed-forward layer.
simclr:
  short: SimCLR
  long: Simple Framework for Contrastive Learning of Representations
  kind: proper-name
  aliases:
    - simple-framework-for-contrastive-learning-of-representations
  category: part-5-learning-paradigms/representation-learning
  note: contrastive-learning
  definition: Contrastive image pretraining that pulls together two augmented
    views of each image and pushes apart the other images in the batch, with a
    projection head before the loss.
single-shot-detector:
  short: SSD
  long: Single Shot MultiBox Detector
  kind: acronym
  sense: object detector
  aliases:
    - single-shot-multibox-detector
  category: part-7-application-domains/computer-vision/recognition
  note: object-detection
  definition: A one-stage object detector that predicts class scores and box
    offsets for default boxes of several shapes on feature maps at several
    scales.
smo:
  short: SMO
  long: Sequential Minimal Optimisation
  kind: acronym
  note: sequential-minimal-optimisation
  aliases:
    - sequential-minimal-optimisation
  category: part-5-learning-paradigms/supervised-learning/kernel-methods
  see:
    - support-vector-machine
    - kernel-support-vector-machine
  definition: An algorithm that trains a support vector machine by repeatedly
    optimising the dual over two multipliers at a time, which has a closed-form
    solution, until the KKT conditions hold.
smoothing-spline:
  long: Smoothing Spline
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/regression/nonlinear-regression
  note: smoothing-splines
  definition: The function minimising squared error plus $\lambda\int
    f''(x)^2\,dx$, a natural cubic spline with a knot at every data point whose
    roughness is set by $\lambda$.
smote:
  short: SMOTE
  long: Synthetic Minority Oversampling Technique
  kind: acronym
  aliases:
    - synthetic-minority-oversampling-technique
  category: part-5-learning-paradigms/supervised-learning/classification/imbalanced-classes
  note: smote-and-variants
  definition: Oversampling that creates synthetic minority examples at random
    points on the segments joining a minority example to one of its $k$ nearest
    minority neighbours.
snips:
  short: SNIPS
  long: Self-Normalised Inverse Propensity Scoring
  kind: acronym
  aliases:
    - self-normalised-inverse-propensity-scoring
  category: part-7-application-domains/online-experimentation/contextual-bandits
  note: off-policy-evaluation
  definition: Inverse propensity scoring divided by the sum of the weights, which
    trades a small bias for much lower variance.
snorkel:
  short: Snorkel
  long: Snorkel
  kind: proper-name
  category: part-5-learning-paradigms/weak-supervision/programmatic-weak-supervision
  note: snorkel
  definition: A system for building training sets by writing labelling functions
    and combining them with a learned label model.
snr:
  short: SNR
  long: Signal-To-Noise Ratio
  kind: acronym
  aliases:
    - signal-to-noise-ratio
  category: part-4-principles-of-learning/evaluation-metrics/audio-metrics
  note: signal-to-noise-and-signal-to-distortion-ratios
  definition: The ratio of signal power to noise power, usually in decibels,
    $10\log_{10}(P_\text{signal}/P_\text{noise})$.
softmax:
  long: Softmax
  kind: concept
  category: part-1-mathematical-foundations/mathematics/calculus/matrix-calculus
  note: softmax-and-log-sum-exp
  definition: The map $\operatorname{softmax}(\zvec)_i = e^{z_i}/\sum_j e^{z_j}$
    from a vector of real scores to a probability vector. Subtracting $\max_j
    z_j$ first keeps it numerically stable.
softmax-regression:
  long: Multinomial Logistic Regression
  kind: concept
  aliases:
    - multinomial-logistic-regression
  category: part-5-learning-paradigms/supervised-learning/generalised-linear-models
  note: multinomial-logistic-regression
  definition: "Logistic regression for $K$ classes: class probabilities are the
    softmax of $K$ linear scores, fitted by minimising cross-entropy."
sord:
  short: SORD
  long: Soft Ordinal Labels
  kind: acronym
  category: part-5-learning-paradigms/supervised-learning/ordinal-regression
  see:
    - deep-ordinal-regression
  definition: Soft targets for a softmax classifier on ordered classes, $t_k
    \propto \exp(-\alpha\,\phi(k, y))$, which put mass on classes near the true
    class $y$ in proportion to a distance $\phi$.
specificity:
  long: Specificity
  kind: concept
  aliases:
    - tnr
    - true-negative-rate
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  note: sensitivity-specificity-and-predictive-values
  definition: The fraction of negatives predicted negative,
    $\mathrm{TN}/(\mathrm{TN} + \mathrm{FP})$.
spectral-clustering:
  long: Spectral Clustering
  kind: concept
  category: part-5-learning-paradigms/unsupervised-learning/clustering
  note: spectral-clustering
  definition: Clustering that embeds points with the bottom eigenvectors of a
    similarity graph's Laplacian and runs k-means in that embedding.
spectrogram:
  long: Spectrogram
  kind: concept
  category: part-2-signals-systems-and-information/signal-processing/time-frequency
  note: short-time-fourier-transform
  definition: The squared magnitude of the short-time Fourier transform, showing
    how the power of a signal is spread over time and frequency.
speculative-decoding:
  long: Speculative Decoding
  kind: concept
  category: part-6-neural-architectures/large-language-models/models-and-decoding
  note: speculative-decoding
  definition: Generating several tokens with a small draft model and verifying
    them with one parallel pass of the large model, accepting or resampling so
    that the output is distributed exactly as the large model's.
spin-glass:
  long: Spin Glass
  kind: concept
  category: part-6-neural-architectures/feedforward-networks/energy-based-networks
  note: spin-glass
  definition: An Ising model with random couplings of both signs. Frustrated bonds
    give it a rugged energy landscape with many local minima.
spline:
  long: Spline
  kind: concept
  category: part-1-mathematical-foundations/mathematics/splines-and-interpolation
  note: splines-and-interpolation
  definition: A piecewise polynomial joined smoothly at points called knots. A
    cubic spline has continuous first and second derivatives at every knot.
squad:
  short: SQuAD
  long: Stanford Question Answering Dataset
  kind: proper-name
  aliases:
    - stanford-question-answering-dataset
  category: part-7-application-domains/natural-language-processing/nlp-tasks
  see:
    - question-answering
    - squad-exact-match-and-f1
  definition: An extractive reading-comprehension dataset of questions on
    Wikipedia paragraphs whose answers are spans of the paragraph, scored by
    exact match and token F1.
srm:
  short: SRM
  long: Sample Ratio Mismatch
  kind: acronym
  aliases:
    - sample-ratio-mismatch
  category: part-7-application-domains/online-experimentation/examples
  note: sample-ratio-mismatch
  definition: A significant difference between the observed and designed split of
    units among experiment groups, which signals a bug in assignment or logging.
ssim:
  short: SSIM
  long: Structural Similarity Index
  kind: acronym
  aliases:
    - structural-similarity-index
  category: part-4-principles-of-learning/evaluation-metrics/image-quality-metrics
  note: structural-similarity-index
  definition: An image-similarity score that compares local means, variances and
    covariance of two images, combining luminance, contrast and structure terms
    into a value of at most 1.
ssm:
  short: SSM
  long: State-Space Model
  kind: acronym
  sense: sequence layer
  aliases:
    - state-space-model
  category: part-6-neural-architectures/sequence-models/efficient-sequence-models
  note: structured-state-space-models
  definition: A sequence layer that runs a discretised linear system $\hvec_k =
    \bar\Amat\hvec_{k-1} + \bar\Bmat u_k$, $y_k = \Cmat\hvec_k$ over its input.
    Unrolled it is a long convolution, so it trains in parallel and generates in
    constant time per step.
ssvm:
  short: SSVM
  long: Structural Support Vector Machine
  kind: acronym
  aliases:
    - structured-svm
    - structural-support-vector-machine
  category: part-5-learning-paradigms/supervised-learning/structured-prediction
  note: structural-support-vector-machine
  definition: A support vector machine for structured outputs that requires the
    true output to outscore every other output by a margin that grows with its
    loss.
stacking:
  long: Stacking
  kind: concept
  aliases:
    - stacked-generalisation
  category: part-5-learning-paradigms/supervised-learning/trees-and-ensembles
  note: stacking
  definition: An ensemble that trains a meta-model to combine the predictions of
    several base models, using out-of-fold predictions so the meta-model does
    not learn from overfitted outputs.
stamp:
  short: STAMP
  long: Scalable Time Series Anytime Matrix Profile
  kind: acronym
  aliases:
    - stomp
    - scrimp
    - scamp
    - scalable-time-series-anytime-matrix-profile
  category: part-7-application-domains/time-series/similarity-search
  note: matrix-profile-algorithms
  definition: An anytime algorithm that computes the matrix profile by running a
    fast distance-profile computation for each subsequence in random order.
    STOMP, SCRIMP and SCAMP compute the same profile faster or more stably.
standard-error:
  short: SE
  long: Standard Error
  kind: concept
  aliases:
    - se
  category: part-1-mathematical-foundations/statistics/estimation
  note: standard-error
  definition: The standard deviation of an estimator's sampling distribution. For
    the mean of $n$ i.i.d. values with standard deviation $\sigma$ it is
    $\sigma/\sqrt{n}$.
state-space-representation:
  long: State-Space Representation
  kind: concept
  category: part-2-signals-systems-and-information/control-theory/system-modelling
  note: state-space-representation
  definition: Describing a dynamical system by first-order equations for a state
    vector, $\dot\xvec = \Amat\xvec + \Bmat\uvec$, $\yvec = \Cmat\xvec +
    \Dmat\uvec$ for a linear system.
stationarity:
  long: Stationarity
  kind: concept
  aliases:
    - stationary-process
  category: part-7-application-domains/time-series/foundations
  note: stationarity
  definition: A time series is (weakly) stationary when its mean and variance are
    constant and its autocovariance depends only on the lag. Most classical
    forecasting models assume it after differencing or detrending.
stemming:
  long: Stemming
  kind: concept
  category: part-7-application-domains/natural-language-processing/text-representation
  note: stemming
  definition: Reducing words to a common stem by stripping affixes with rules,
    such as "connected" and "connection" to "connect", without checking that the
    result is a word.
stft:
  short: STFT
  long: Short-Time Fourier Transform
  kind: acronym
  aliases:
    - short-time-fourier-transform
  category: part-2-signals-systems-and-information/signal-processing/time-frequency
  note: short-time-fourier-transform
  definition: The discrete Fourier transforms of successive windowed frames of a
    signal. Its squared magnitude is the spectrogram; the window length fixes
    the time and frequency resolution.
stl:
  short: STL
  long: Seasonal–Trend Decomposition Using Loess
  kind: acronym
  aliases:
    - seasonal-trend-decomposition-using-loess
  category: part-7-application-domains/time-series/foundations
  note: time-series-decomposition
  definition: Decomposing a series into trend, seasonal and remainder components
    by alternating loess smoothers.
stoi:
  short: STOI
  long: Short-Time Objective Intelligibility
  kind: acronym
  aliases:
    - short-time-objective-intelligibility
  category: part-4-principles-of-learning/evaluation-metrics/audio-metrics
  note: perceptual-speech-quality-and-intelligibility
  definition: A speech intelligibility metric that correlates short-time envelopes
    of clean and degraded speech in third-octave bands.
storm:
  short: StORM
  long: Structured Ordinal Regression Modelling
  kind: acronym
  aliases:
    - structured-ordinal-regression-modeling
  category: part-5-learning-paradigms/supervised-learning/ordinal-regression
  note: structured-ordinal-regression-modelling
  definition: An ordinal model that encodes the label as $K - 1$ up-to-$k$ bits
    and fits a chain conditional random field over them, with separate weights
    at every node and edge, learnt jointly by maximum likelihood.
structured-prediction:
  long: Structured Prediction
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/structured-prediction
  note: structured-prediction
  definition: Predicting an output with internal structure, such as a label
    sequence, tree or segmentation, whose parts depend on one another, usually
    by scoring whole outputs and searching for the best.
structured-state-space-duality:
  short: SSD
  long: Structured State-Space Duality
  kind: acronym
  sense: state-space models
  category: part-6-neural-architectures/sequence-models
  see:
    - mamba
  definition: The equivalence between a selective state-space model with
    scalar-times-identity state matrices and a form of masked linear attention,
    used by Mamba-2 to compute the model with matrix multiplications.
student-t-distribution:
  long: Student's t-Distribution
  kind: concept
  aliases:
    - students-t-distribution
    - t-distribution
  category: part-1-mathematical-foundations/probability/named-distributions/continuous
  note: student-t-distribution
  definition: The distribution of a standardised mean when the variance is
    estimated from the sample, with $\nu$ degrees of freedom. It has heavier
    tails than the Gaussian and approaches it as $\nu \to \infty$.
subgradient:
  long: Subgradient
  kind: concept
  category: part-1-mathematical-foundations/optimisation/convex-analysis
  note: subgradients
  definition: A vector $\gvec$ with $f(\yvec) \ge f(\xvec) + \gvec^\top(\yvec -
    \xvec)$ for all $\yvec$, for a convex function $f$. It generalises the
    gradient to points where $f$ is not differentiable, such as the kink of
    $\abs{x}$ at zero.
sufficient-statistic:
  long: Sufficient Statistic
  kind: concept
  category: part-1-mathematical-foundations/statistics/estimation
  note: sufficient-statistic
  definition: "A function $T(x)$ of the data that carries all the information the
    data hold about a parameter: the conditional distribution of the data given
    $T(x)$ does not depend on the parameter."
support-vectors:
  long: Support Vectors
  longPlural: Support Vectors
  kind: concept
  category: part-5-learning-paradigms/supervised-learning/kernel-methods
  note: support-vector-machine
  definition: "The training points with non-zero dual multipliers in a support
    vector machine: those on or inside the margin. The decision function is a
    weighted sum over them alone."
surrogate-loss:
  long: Surrogate Loss
  kind: concept
  category: part-4-principles-of-learning/loss-functions/classification-losses
  note: surrogate-losses
  definition: A convex, differentiable loss minimised in place of an intractable
    target loss, such as the logistic or hinge loss in place of the 0–1 loss. A
    calibrated surrogate leads to the same Bayes-optimal classifier.
sutva:
  short: SUTVA
  long: Stable Unit Treatment Value Assumption
  kind: acronym
  aliases:
    - stable-unit-treatment-value-assumption
  category: part-7-application-domains/online-experimentation/validity-threats
  note: interference-and-cluster-randomisation
  definition: The assumption that a unit's outcome depends only on its own
    treatment, with no interference between units and one version of each
    treatment.
svd:
  short: SVD
  long: Singular Value Decomposition
  kind: acronym
  aliases:
    - singular-value-decomposition
  category: part-1-mathematical-foundations/mathematics/linear-algebra
  note: singular-value-decomposition
  definition: "A factorisation of any matrix as $\\Amat =
    \\Umat\\Sigmamat\\Vmat^\\top$: a rotation, an axis-aligned scaling by the
    non-negative singular values, and another rotation. Keeping only the largest
    singular values gives the best low-rank approximation of the matrix."
svdd:
  short: SVDD
  long: Support Vector Data Description
  kind: acronym
  aliases:
    - support-vector-data-description
  category: part-5-learning-paradigms/anomaly-detection/one-class-methods
  note: support-vector-data-description
  definition: An anomaly detector that encloses the data in the smallest
    hypersphere of a kernel feature space, allowing points outside at a cost.
    Points outside are anomalies.
svm:
  short: SVM
  long: Support Vector Machine
  kind: acronym
  aliases:
    - support-vector-classifier
    - maximum-margin-classifier
    - support-vector-machine
  category: part-5-learning-paradigms/supervised-learning/kernel-methods
  note: support-vector-machine
  definition: A linear classifier $\sgn(\wvec^\top\xvec + b)$ that maximises the
    margin to the nearest training points, allowing violations at cost $C$. Its
    dual depends on the data only through inner products, so kernels make it
    nonlinear.
svor:
  short: SVOR
  long: Support Vector Ordinal Regression
  kind: acronym
  aliases:
    - support-vector-ordinal-regression
  category: part-5-learning-paradigms/supervised-learning/ordinal-regression
  see:
    - threshold-losses-for-ordinal-regression
  definition: A support vector machine for ordinal labels that learns one score
    and $K - 1$ thresholds with hinge losses at the thresholds, either the two
    around the true class (explicit constraints) or all of them (implicit
    constraints).
swiglu:
  short: SwiGLU
  long: Swish-Gated Linear Unit
  kind: acronym
  aliases:
    - swish-gated-linear-unit
  category: part-6-neural-architectures/transformers/block-design
  see:
    - gated-feed-forward-layers
  definition: A gated feed-forward layer $(\operatorname{SiLU}(\xvec\Wmat) \odot
    \xvec\Vmat)\Wmat_2$. With three matrices instead of two, a hidden width of
    $8d/3$ keeps the parameter count of a standard $4d$ layer.
t-sne:
  short: t-SNE
  long: t-Distributed Stochastic Neighbour Embedding
  kind: acronym
  aliases:
    - t-distributed-stochastic-neighbour-embedding
  category: part-5-learning-paradigms/unsupervised-learning/manifold-learning
  note: t-distributed-stochastic-neighbour-embedding
  definition: A visualisation method that embeds points in two or three dimensions
    by matching Gaussian neighbour probabilities in the data with heavy-tailed
    Student-t probabilities in the embedding, minimising their KL divergence.
t5:
  short: T5
  long: Text-to-Text Transfer Transformer
  kind: proper-name
  aliases:
    - text-to-text-transfer-transformer
  category: part-6-neural-architectures/transformers/architecture-families
  see:
    - encoder-decoder-transformers
    - t5-relative-position-bias
  definition: Google's encoder–decoder transformer that casts every text task as
    generating output text from input text, pretrained by span corruption
    (Raffel et al., 2020).
taylor-series:
  long: Taylor Series
  kind: concept
  category: part-1-mathematical-foundations/mathematics/calculus/univariate
  note: taylor-series
  definition: The expansion of a smooth function around a point $a$ as $f(x) =
    \sum_{n \ge 0} f^{(n)}(a)(x - a)^n/n!$. Truncating it after a few terms
    gives a local polynomial approximation.
td-learning:
  short: TD
  long: Temporal-Difference Learning
  kind: acronym
  aliases:
    - temporal-difference-learning
    - td
  category: part-5-learning-paradigms/reinforcement-learning/value-based-methods
  note: temporal-difference-learning
  definition: Learning value estimates from sampled transitions by moving each
    estimate toward the reward plus the discounted estimate of the next state,
    $V(S) \leftarrow V(S) + \alpha[R + \gamma V(S') - V(S)]$.
teacher-forcing:
  long: Teacher Forcing
  kind: concept
  category: part-6-neural-architectures/sequence-models
  see:
    - sequence-to-sequence
  definition: Training a sequence generator by feeding it the true previous token
    at each step, rather than its own prediction. It allows parallel training
    but creates a mismatch with generation, where the model sees its own
    outputs.
temperature:
  long: Sampling Temperature
  kind: concept
  aliases:
    - sampling-temperature
  category: part-6-neural-architectures/large-language-models/models-and-decoding
  see:
    - decoding-strategies
    - softmax-and-log-sum-exp
  definition: The divisor $T$ of the logits in $\operatorname{softmax}(\zvec/T)$.
    Low temperatures sharpen the distribution toward the most probable token;
    high ones flatten it.
temperature-scaling:
  long: Temperature Scaling
  kind: concept
  category: part-4-principles-of-learning/decision-theory-and-calibration/classifier-calibration
  note: temperature-scaling
  definition: Post-hoc calibration that divides a network's logits by a single
    temperature $T > 0$, fitted on held-out data by minimising log loss. It does
    not change the predicted class.
test-statistic:
  long: Test Statistic
  kind: concept
  category: part-1-mathematical-foundations/statistics/hypothesis-testing
  note: null-and-alternative-hypotheses
  definition: A function of the data whose distribution under the null hypothesis
    is known, so that an observed value can be converted into a p-value.
tf-idf:
  short: TF-IDF
  long: Term Frequency–Inverse Document Frequency
  kind: acronym
  aliases:
    - term-frequency-inverse-document-frequency
  category: part-7-application-domains/natural-language-processing/text-representation
  note: term-frequency-inverse-document-frequency
  definition: A term weight that multiplies the count of a term in a document by
    $\log(N/\mathrm{df}_t)$, so terms count more when frequent in the document
    and rare in the collection.
tft:
  short: TFT
  long: Temporal Fusion Transformer
  kind: acronym
  aliases:
    - temporal-fusion-transformer
  category: part-7-application-domains/time-series/neural-forecasting
  note: temporal-fusion-transformer
  definition: An attention-based forecaster that combines variable selection, a
    recurrent encoder and interpretable multi-head attention to produce quantile
    forecasts over several horizons.
thompson-sampling:
  short: TS
  long: Thompson Sampling
  kind: acronym
  aliases:
    - ts
  category: part-7-application-domains/online-experimentation/multi-armed-bandits
  note: thompson-sampling
  definition: A bandit policy that samples each arm's mean from its posterior and
    plays the arm with the largest sample, so each arm is played with the
    probability that it is best.
tiger:
  short: TIGER
  long: Transformer Index for Generative Recommenders
  kind: acronym
  category: part-7-application-domains/recommendation-and-retrieval/generative-recommendation
  see:
    - generative-recommendation-losses
    - generative-retrieval-for-recommendation
  definition: A generative retrieval recommender that gives each item a semantic
    identifier from an RQ-VAE and trains a sequence-to-sequence transformer to
    generate the next item's identifier tokens.
tn:
  short: TN
  long: True Negative
  kind: acronym
  aliases:
    - true-negative
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  see:
    - confusion-matrix
  definition: A negative example that a classifier predicts as negative.
tokenisation:
  long: Tokenisation
  kind: concept
  aliases:
    - tokeniser
    - tokenization
  category: part-7-application-domains/natural-language-processing/text-representation
  note: tokenisation
  definition: "Splitting text into a sequence of units from a fixed vocabulary,
    the symbols a language model reads and predicts: words, subwords, characters
    or bytes."
topic-model:
  long: Topic Model
  kind: concept
  category: part-5-learning-paradigms/unsupervised-learning/topic-models/extensions
  note: topic-model-family
  definition: A model of documents as mixtures of topics, each topic a
    distribution over words, inferred from word co-occurrence.
tp:
  short: TP
  long: True Positive
  kind: acronym
  aliases:
    - true-positive
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  see:
    - confusion-matrix
  definition: A positive example that a classifier predicts as positive.
tpr:
  short: TPR
  long: True Positive Rate
  kind: acronym
  aliases:
    - true-positive-rate
    - sensitivity
  category: part-4-principles-of-learning/evaluation-metrics/classification-metrics
  note: sensitivity-specificity-and-predictive-values
  definition: The fraction of positives predicted positive,
    $\mathrm{TP}/(\mathrm{TP} + \mathrm{FN})$. It is also called sensitivity or
    recall.
tpu:
  short: TPU
  long: Tensor Processing Unit
  kind: acronym
  aliases:
    - tensor-processing-unit
  category: part-8-practice/engineering
  definition: A processor designed by Google for neural-network arithmetic, built
    around large systolic arrays for matrix multiplication.
transfer-function:
  long: Transfer Function
  kind: concept
  category: part-2-signals-systems-and-information/control-theory/system-modelling
  note: transfer-function-and-block-diagrams
  definition: The ratio $H(s) = Y(s)/U(s)$ of the Laplace (or z-) transforms of a
    linear time-invariant system's output and input. Its poles and zeros
    determine stability and frequency response.
transfer-learning:
  long: Transfer Learning
  kind: concept
  category: part-5-learning-paradigms/transfer-and-meta-learning
  note: transfer-learning
  definition: Reusing knowledge learned on a source task or domain to learn a
    target task or domain with less data.
transformer:
  long: Transformer
  kind: concept
  category: part-6-neural-architectures/transformers/vanilla-transformer
  note: transformer
  definition: A neural network architecture built from attention and position-wise
    feed-forward layers with residual connections and normalisation. The
    original is an encoder–decoder for translation; most language models are its
    decoder alone.
trpo:
  short: TRPO
  long: Trust Region Policy Optimisation
  kind: acronym
  aliases:
    - trust-region-policy-optimisation
  category: part-5-learning-paradigms/reinforcement-learning/policy-methods
  note: trust-region-and-proximal-policy-optimisation
  definition: A policy-gradient method that maximises an importance-weighted
    advantage subject to a bound on the KL divergence between the new and old
    policies.
trueskill:
  short: TrueSkill
  long: TrueSkill
  kind: proper-name
  category: part-4-principles-of-learning/probabilistic-inference/skill-rating
  note: trueskill
  definition: Microsoft's Bayesian skill rating system, which models each player's
    skill as a Gaussian and updates it from game outcomes by expectation
    propagation on a factor graph.
trust-region:
  long: Trust Region
  kind: concept
  category: part-1-mathematical-foundations/optimisation/second-order-methods
  note: trust-region-methods
  definition: A ball around the current iterate within which a local model of the
    objective is trusted. Trust-region methods minimise the model inside the
    ball and grow or shrink the radius according to how well the model predicted
    the actual decrease.
two-tower:
  long: Two-Tower Model
  kind: concept
  aliases:
    - dual-encoder
    - two-tower-model
  category: part-7-application-domains/recommendation-and-retrieval/deep-recommenders
  note: two-tower-model
  definition: A retrieval model with separate networks for queries (or users) and
    items, whose relevance score is the inner product of their embeddings, so
    items can be indexed for nearest-neighbour search.
type-i-error:
  long: Type I Error
  kind: concept
  aliases:
    - false-positive-error
  category: part-1-mathematical-foundations/statistics/hypothesis-testing
  note: type-i-and-type-ii-errors
  definition: Rejecting a null hypothesis that is true. Its probability is the
    significance level $\alpha$.
type-ii-error:
  long: Type II Error
  kind: concept
  category: part-1-mathematical-foundations/statistics/hypothesis-testing
  note: type-i-and-type-ii-errors
  definition: Failing to reject a null hypothesis that is false. Its probability
    is $\beta$, and $1 - \beta$ is the power of the test.
u-net:
  short: U-Net
  long: U-Net
  kind: proper-name
  category: part-7-application-domains/computer-vision/recognition
  note: semantic-segmentation
  definition: An encoder–decoder convolutional network with skip connections from
    each encoder level to the matching decoder level, used for segmentation and
    as the denoiser in many diffusion models.
ubre:
  short: UBRE
  long: Un-Biased Risk Estimator
  kind: acronym
  aliases:
    - un-biased-risk-estimator
  category: part-5-learning-paradigms/supervised-learning/generalised-additive-models
  note: additive-model-smoothing-parameter-selection
  definition: A criterion for choosing smoothing parameters when the scale
    parameter is known, such as for Poisson and binomial models; it is Mallows'
    $C_p$ generalised to penalised models.
ucb:
  short: UCB
  long: Upper Confidence Bound
  kind: acronym
  aliases:
    - ucb1
    - upper-confidence-bound
  category: part-7-application-domains/online-experimentation/multi-armed-bandits
  note: upper-confidence-bound-algorithm
  definition: "A bandit policy that plays the arm with the highest upper
    confidence bound on its mean, such as $\\hat\\mu_i + \\sqrt{2\\log t/N_i}$
    in UCB1: optimism in the face of uncertainty."
ucr-archive:
  short: UCR
  long: UCR Time Series Classification Archive
  kind: proper-name
  aliases:
    - ucr-time-series-classification-archive
    - ucr
  category: part-7-application-domains/time-series/time-series-classification
  note: time-series-classification-benchmarks
  definition: A public collection of 128 univariate time-series classification
    datasets with fixed train and test splits, maintained by the University of
    California, Riverside.
ukf:
  short: UKF
  long: Unscented Kalman Filter
  kind: acronym
  aliases:
    - unscented-kalman-filter
  category: part-7-application-domains/time-series/state-space-models
  note: extended-and-unscented-kalman-filters
  definition: A Kalman filter for nonlinear models that propagates a small set of
    deterministically chosen sigma points through the nonlinear functions and
    refits a Gaussian to them.
umap:
  short: UMAP
  long: Uniform Manifold Approximation and Projection
  kind: acronym
  aliases:
    - uniform-manifold-approximation-and-projection
  category: part-5-learning-paradigms/unsupervised-learning/manifold-learning
  note: uniform-manifold-approximation-and-projection
  definition: An embedding method that builds a fuzzy k-nearest-neighbour graph
    and lays out a low-dimensional graph that minimises the cross-entropy
    between the two edge weightings.
unit-root:
  long: Unit Root
  kind: concept
  category: part-7-application-domains/time-series/foundations
  note: differencing-and-unit-roots
  definition: A root of an autoregressive polynomial on the unit circle, which
    makes a series non-stationary with shocks that never die out. Differencing
    removes it.
universal-approximation-theorem:
  long: Universal Approximation Theorem
  kind: concept
  category: part-6-neural-architectures/feedforward-networks/foundations
  note: universal-approximation-theorem
  definition: The result that a network with one hidden layer of enough units
    approximates any continuous function on a compact set to any accuracy,
    provided its activation is not a polynomial. It says nothing about how many
    units are needed or how to find the weights.
vae:
  short: VAE
  long: Variational Autoencoder
  kind: acronym
  aliases:
    - variational-autoencoder
  category: part-6-neural-architectures/generative-models/autoencoders
  note: variational-autoencoder
  definition: A latent-variable model trained with an encoder $q(\zvec \mid
    \xvec)$ by maximising the evidence lower bound, a reconstruction term minus
    a KL divergence to the prior, with gradients from the reparameterisation
    trick.
value-function:
  long: Value Function
  kind: concept
  aliases:
    - q-function
    - action-value-function
  category: part-5-learning-paradigms/reinforcement-learning/markov-decision-processes
  see:
    - bellman-equations
    - markov-decision-process
  definition: The expected discounted return from a state, $v_\pi(s)$, or from a
    state and action, $q_\pi(s, a)$, when following policy $\pi$ afterwards.
value-iteration:
  long: Value Iteration
  kind: concept
  category: part-5-learning-paradigms/reinforcement-learning/markov-decision-processes
  note: value-iteration
  definition: Dynamic programming that applies the Bellman optimality update to
    every state repeatedly until the value function converges, then acts
    greedily.
vanishing-gradients:
  long: Vanishing and Exploding Gradients
  kind: concept
  aliases:
    - exploding-gradients
    - vanishing-gradient-problem
    - vanishing-and-exploding-gradients
  category: part-6-neural-architectures/feedforward-networks/training
  note: vanishing-and-exploding-gradients
  definition: The exponential shrinking or growth of a gradient passed back
    through many layers or time steps, because it is a product of one Jacobian
    per layer. Initialisation, normalisation, gating and residual connections
    keep the product near scale 1.
var-model:
  short: VAR
  long: Vector Autoregression
  kind: acronym
  aliases:
    - vector-autoregression
    - var
  category: part-7-application-domains/time-series/multivariate-time-series
  note: vector-autoregression
  definition: An autoregressive model for several series at once, in which each
    series is regressed on the past values of all of them.
variance:
  long: Variance
  kind: concept
  category: part-1-mathematical-foundations/probability/theory
  note: variance-and-covariance
  definition: The expected squared deviation from the mean, $\var(X) = \expect[(X
    - \expect X)^2]$. Its square root is the standard deviation, in the units of
    $X$.
vc-dimension:
  short: VC dimension
  long: Vapnik–Chervonenkis Dimension
  kind: concept
  aliases:
    - vapnik-chervonenkis-dimension
  category: part-4-principles-of-learning/learning-theory
  note: vapnik-chervonenkis-dimension
  definition: The largest number of points that a hypothesis class can label in
    every possible way. It measures the capacity of the class and enters bounds
    on its generalisation error.
vgg:
  short: VGG
  long: Visual Geometry Group Network
  kind: proper-name
  aliases:
    - visual-geometry-group-network
  category: part-6-neural-architectures/convolutional-networks
  note: classic-convolutional-network-architectures
  definition: A family of convolutional networks (2014) built only from stacked $3
    \times 3$ convolutions and max pooling, 16 or 19 layers deep.
vi:
  short: VI
  long: Variational Inference
  kind: acronym
  aliases:
    - variational-inference
  category: part-4-principles-of-learning/probabilistic-inference/variational-inference
  note: variational-inference
  definition: Approximate Bayesian inference that picks, from a tractable family,
    the distribution $q$ closest to the posterior in $\KL(q \,\|\, p)$, by
    maximising the evidence lower bound.
vit:
  short: ViT
  long: Vision Transformer
  kind: acronym
  aliases:
    - vision-transformer
  category: part-7-application-domains/computer-vision/recognition
  note: vision-transformer
  definition: A transformer encoder applied to an image cut into fixed-size
    patches, each linearly embedded as a token, with a class token or pooling
    for the output.
viterbi:
  long: Viterbi Algorithm
  kind: concept
  aliases:
    - viterbi-algorithm
  category: part-5-learning-paradigms/supervised-learning/structured-prediction
  see:
    - hidden-markov-model
    - conditional-random-field
  definition: Dynamic programming that finds the most probable label sequence of a
    chain model in $O(NK^2)$ for length $N$ and $K$ states, by keeping the best
    path into each state at each step.
vjp:
  short: VJP
  long: Vector-Jacobian Product
  kind: acronym
  aliases:
    - vector-jacobian-product
  category: part-1-mathematical-foundations/mathematics/calculus/automatic-differentiation
  note: jacobian-vector-products-and-higher-order-derivatives
  definition: The product $\uvec^\top\Jmat$ of a vector with a function's
    Jacobian, computed by one reverse-mode pass without forming $\Jmat$. A
    gradient is the VJP of a scalar output with $\uvec = 1$.
vq-vae:
  short: VQ-VAE
  long: Vector-Quantised Variational Autoencoder
  kind: acronym
  aliases:
    - vector-quantised-variational-autoencoder
  category: part-6-neural-architectures/generative-models/autoencoders
  note: vector-quantised-variational-autoencoder
  definition: An autoencoder whose continuous code is replaced by the nearest
    vector of a learned codebook, with a separate prior over code indices fitted
    afterwards.
warp:
  short: WARP
  long: Weighted Approximate-Rank Pairwise Loss
  kind: acronym
  category: part-7-application-domains/recommendation-and-retrieval/loss-families
  see:
    - pairwise-ranking-losses
  definition: A pairwise loss that samples negatives until one violates the
    margin, estimates the positive's rank from the number of draws, and weights
    the update by that rank so errors near the top cost most.
wasserstein-distance:
  long: Wasserstein Distance
  kind: concept
  category: part-1-mathematical-foundations/mathematics/optimal-transport
  note: wasserstein-distances
  see:
    - earth-movers-distance
  definition: The distance $W_p(\mu, \nu) = \paren{\inf_\pi \expect_\pi\norm{X -
    Y}^p}^{1/p}$ between two probability distributions, the least cost of
    transporting one onto the other when moving mass costs distance to the power
    $p$. It stays finite and informative when the distributions do not overlap.
wavelet-transform:
  long: Wavelet Transform
  kind: concept
  aliases:
    - discrete-wavelet-transform
    - dwt
  category: part-2-signals-systems-and-information/signal-processing/wavelets
  note: discrete-wavelet-transform
  definition: Decomposing a signal into scaled and shifted copies of a short wave,
    which gives fine time resolution at high frequencies and fine frequency
    resolution at low ones.
weak-supervision:
  long: Weak Supervision
  kind: concept
  category: part-5-learning-paradigms/weak-supervision
  note: weak-supervision
  definition: Training from labels that are noisy, incomplete, coarse or inexact,
    such as heuristic rules, crowd votes, bag-level labels or label proportions.
weight-decay:
  long: Weight Decay
  kind: concept
  category: part-6-neural-architectures/feedforward-networks/training
  see:
    - decoupled-weight-decay
    - ridge-regression
  definition: Shrinking every weight by a fixed fraction each step. For plain
    gradient descent it equals an L2 penalty on the weights; for adaptive
    optimisers it does not.
weight-initialisation:
  long: Weight Initialisation
  kind: concept
  aliases:
    - xavier-initialisation
    - he-initialisation
    - glorot-initialisation
  category: part-6-neural-architectures/feedforward-networks/training
  note: weight-initialisation
  definition: "The choice of the distribution of a network's initial weights, with
    a variance that keeps signals at a constant scale through depth:
    $2/(n_{\\text{in}} + n_{\\text{out}})$ for Xavier, $2/n_{\\text{in}}$ for He
    with ReLU."
wer:
  short: WER
  long: Word Error Rate
  kind: acronym
  aliases:
    - word-error-rate
  category: part-4-principles-of-learning/evaluation-metrics/text-metrics
  note: word-and-character-error-rates
  definition: The number of word substitutions, deletions and insertions needed to
    turn a transcript into the reference, divided by the number of reference
    words. It can exceed 1.
wgan:
  short: WGAN
  long: Wasserstein Generative Adversarial Network
  kind: acronym
  aliases:
    - wasserstein-generative-adversarial-network
  category: part-1-mathematical-foundations/mathematics/optimal-transport
  note: wasserstein-gan
  definition: A generative adversarial network whose critic estimates the
    Wasserstein-1 distance between real and generated data through its
    Kantorovich–Rubinstein dual, with the critic kept 1-Lipschitz.
white-noise:
  long: White Noise
  kind: concept
  category: part-7-application-domains/time-series/foundations
  note: white-noise-and-random-walk
  definition: A sequence of uncorrelated random variables with zero mean and
    constant variance. Its autocorrelation is zero at every non-zero lag and its
    spectrum is flat.
wiener-filter:
  long: Wiener Filter
  kind: concept
  category: part-2-signals-systems-and-information/signal-processing/adaptive-and-statistical
  note: wiener-filter
  definition: The linear filter that minimises the mean squared error between its
    output and a desired signal, given the second-order statistics of signal and
    noise.
window-function:
  long: Window Function
  kind: concept
  aliases:
    - spectral-leakage
  category: part-2-signals-systems-and-information/signal-processing/fourier-analysis
  note: spectral-leakage-and-windows
  definition: A taper applied to a finite frame before a Fourier transform. It
    trades main-lobe width, and so frequency resolution, against side-lobe
    leakage.
wmf:
  short: WMF
  long: Weighted Matrix Factorisation
  kind: acronym
  category: part-7-application-domains/recommendation-and-retrieval/collaborative-filtering
  note: weighted-matrix-factorisation
  definition: Matrix factorisation for implicit feedback that fits a binary
    preference for every user–item pair, with a confidence weight that grows
    with the observed interaction count.
word-embedding:
  long: Word Embedding
  kind: concept
  aliases:
    - word-vectors
    - word2vec
  category: part-5-learning-paradigms/representation-learning
  note: word-embeddings
  definition: A dense vector per word, learned so that words used in similar
    contexts get similar vectors, as by word2vec or GloVe.
wordpiece:
  short: WordPiece
  long: WordPiece
  kind: proper-name
  category: part-7-application-domains/natural-language-processing/text-representation
  note: wordpiece-and-unigram-tokenisation
  definition: A subword tokeniser that merges the pair of symbols that most raises
    a unigram model's likelihood. BERT uses it.
xgboost:
  short: XGBoost
  long: XGBoost
  kind: proper-name
  category: part-5-learning-paradigms/supervised-learning/trees-and-ensembles
  note: xgboost-lightgbm-catboost
  definition: A gradient-boosted tree library that uses second-order gradients,
    regularised leaf weights and fast split finding. LightGBM and CatBoost are
    its main alternatives.
yarn:
  short: YaRN
  long: Yet Another Rotary Position Embedding Extension
  kind: proper-name
  aliases:
    - yet-another-rotary-position-embedding-extension
  category: part-6-neural-architectures/sequence-models/efficient-sequence-models
  note: long-context-methods
  definition: A method for extending a rotary-position model to longer contexts
    that rescales the rotary frequencies unevenly by band and adjusts the
    attention temperature.
yolo:
  short: YOLO
  long: You Only Look Once
  kind: proper-name
  aliases:
    - you-only-look-once
  category: part-7-application-domains/computer-vision/recognition
  note: object-detection
  definition: A family of one-stage object detectors that predict boxes and
    classes densely from a single pass over the image.
z-transform:
  long: z-Transform
  kind: concept
  category: part-2-signals-systems-and-information/signal-processing/signals-and-systems
  note: z-transform
  definition: The transform $X(z) = \sum_n x[n]z^{-n}$ of a sequence, which turns
    convolution into multiplication and difference equations into rational
    functions. On the unit circle it is the discrete-time Fourier transform.
zero:
  short: ZeRO
  long: Zero Redundancy Optimiser
  kind: acronym
  aliases:
    - zero-redundancy-optimiser
  category: part-8-practice/engineering/training-at-scale
  note: zero-and-sharded-optimisers
  definition: Data-parallel training that shards optimiser states, gradients and
    weights across devices instead of replicating them, so per-device memory
    falls with the number of devices.
